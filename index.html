<div id="steps-summary" class="widget"></div><p>The steps below explain why each goal matters.</p>
<article class="step" data-step="1"><div class="step-head"><h3 id="s5-3">Step 1 — Daily missions and the season pass</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="1"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p class="callout key"><span class="co-tag">Key point</span>Dailies are short and quick. The reward you <strong>really don't want to miss</strong> is the season pass daily mission "Battle in the Hunting Ground": it gives a <strong>Pass Material Chest</strong> full of crafting materials. Do it from day one.</p>
<figure class="shot"><button aria-label="Enlarge: Season pass daily missions" class="shot-btn" data-full="img/bd2-1000095411.jpg" type="button"><img alt="Season pass daily missions" loading="lazy" src="img/bd2-1000095411.jpg"/></button><figcaption>Season pass daily missions</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Pass Material Chest contents: ores and leather" class="shot-btn" data-full="img/bd2-1000095412.jpg" type="button"><img alt="Pass Material Chest contents: ores and leather" loading="lazy" src="img/bd2-1000095412.jpg"/></button><figcaption>Pass Material Chest contents: ores and leather</figcaption></figure>
<p><strong>Where are the Hunting Grounds?</strong> Inside Story Packs 1 to 10. Each pack unlocks its own once cleared on Normal, and higher difficulty gives more rewards. On the map it's the circled skull icon below; there's also a shortcut next to the minimap.</p>
<figure class="shot"><button aria-label="Enlarge: Hunting Ground icon on the map" class="shot-btn" data-full="img/bd2-1000095413.jpg" type="button"><img alt="Hunting Ground icon on the map" loading="lazy" src="img/bd2-1000095413.jpg"/></button><figcaption>Hunting Ground icon on the map</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong> If a quest asks for a Hunting Ground fight but there are no enemies, abandon the active quest: they come back. The <strong>Quick Hunt</strong> button on the home screen groups Hunting Grounds and Path of Adventure and runs the fights without loading the map.</p>
</div></article><article class="step" data-step="2"><div class="step-head"><h3 id="s5-4">Step 2 — The main Story Packs</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="2"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">

<p class="callout key"><span class="co-tag">Key point</span><strong>Why Pack 9 on Very Hard matters so much.</strong> You need tons of Hardwood to craft, and it has only one reliable source: this Hunting Ground. Ores also come from chapters 7, 8 and 13. The Discord says it's no exaggeration: clear it ASAP for the Hardwood alone.</p>
<figure class="shot"><button aria-label="Enlarge: Chapter 9 Hunting Ground on Very Hard" class="shot-btn" data-full="img/bd2-1000095415.jpg" type="button"><img alt="Chapter 9 Hunting Ground on Very Hard" loading="lazy" src="img/bd2-1000095415.jpg"/></button><figcaption>Chapter 9 Hunting Ground on Very Hard</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Lathel's skill (Pack 7 costume) at +2" class="shot-btn" data-full="img/bd2-1000095416.jpg" type="button"><img alt="Lathel's skill (Pack 7 costume) at +2" loading="lazy" src="img/bd2-1000095416.jpg"/></button><figcaption>Lathel's skill (Pack 7 costume) at +2</figcaption></figure>
<p><strong>The Newbie Pass "Today's Quest".</strong> You take it at the quest boards, in the safe zones of story and character packs. You can do it 3 times a day at most. The author recommends the <strong>Beauty Impossible</strong> Character Pack: it's the easiest and quickest, and handy for achievements. Some Story Pack Today's Quests send you to a Hunting Ground, which costs rice. Otherwise, cherry-pick quests across any pack.</p>
<figure class="shot"><button aria-label="Enlarge: Quest Bulletin and Today's Quest" class="shot-btn" data-full="img/bd2-1000095417.jpg" type="button"><img alt="Quest Bulletin and Today's Quest" loading="lazy" src="img/bd2-1000095417.jpg"/></button><figcaption>Quest Bulletin and Today's Quest</figcaption></figure>
</div></article><article class="step" data-step="3"><div class="step-head"><h3 id="s5-5">Step 3 — Gear Craft and Alchemy to Legendary</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="3"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>Getting <strong>Gear Craft to Legendary within 7 days</strong> is possible as long as you don't miss any season pass daily reward. You need Legendary rank to craft UR gear.</p>
<p><strong>How to rank up.</strong> You earn XP by crafting, then rank up with an Ability Book once the bar is full. The compendium recommends crafting <strong>N or R</strong> gear for XP and skipping SR, too expensive for what it gives. Don't over-craft: do 30, 50 or 100 crafts at most, see how much XP you get, then adjust.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Book</th>
<th>Where to get it</th>
</tr>
</thead>
<tbody>
<tr>
<td>★1 and ★2 Ability Book</td>
<td>Story Pack 3 (Mist Man) shop</td>
</tr>
<tr>
<td>★3 Ability Book</td>
<td>Story Pack 10 shop (for gold) or the Evil Castle shop</td>
</tr>
<tr>
<td>★4 Ability Book</td>
<td>Evil Castle shop only (512 Devil Coins each)</td>
</tr>
</tbody>
</table></div>
<p class="callout key"><span class="co-tag">Key point</span><strong>The <button class="term" data-tip="Earned in the Evil Castle" type="button">Devil Coin</button> trick.</strong> Buy ★3 books with gold at Story Pack 10 and save your Devil Coins for ★4 books. The season pass daily mission gives 125 a day: you can hit Legendary by day 5 at the latest, faster if you clear Tower of Pride floor 1 early.</p>
<figure class="shot"><button aria-label="Enlarge: Evil Castle shop and pass missions that give Devil Coins" class="shot-btn" data-full="img/bd2-1000095418.jpg" type="button"><img alt="Evil Castle shop and pass missions that give Devil Coins" loading="lazy" src="img/bd2-1000095418.jpg"/></button><figcaption>Evil Castle shop and pass missions that give Devil Coins</figcaption></figure>
<p><strong>What to craft meanwhile: Rare IV.</strong> Aim for <strong>Rare IV</strong> gear (shown as "IV R" with 3 stars). It's the strongest cheap option for a beginner, along with Fiend gear from the event shop. When crafting, tier IV only drops 5% of the time (I: 50%, II: 30%, III: 15%), so craft in bulk.</p>
<p>Don't be scared to "waste" resources upgrading and refining Rare gear: it's very cheap, and it uses different materials to change its options (substats).</p>
<figure class="shot"><button aria-label="Enlarge: Option refinement: 4 stones on a Rare piece vs 45 crystals on a UR piece" class="shot-btn" data-full="img/bd2-1000095419.jpg" type="button"><img alt="Option refinement: 4 stones on a Rare piece vs 45 crystals on a UR piece" loading="lazy" src="img/bd2-1000095419.jpg"/></button><figcaption>Option refinement: 4 stones on a Rare piece vs 45 crystals on a UR piece</figcaption></figure>
<p>Refining a weapon raises its <strong>refinement score</strong>, which raises its main stat. Generally, a score of <strong>18</strong> is enough ("BBS" on old screenshots, which showed letters).</p>
<figure class="shot"><button aria-label="Enlarge: Knight's Sword IV R +9 at score 18 (BBS in the old letter display)" class="shot-btn" data-full="img/bd2-1000095420.jpg" type="button"><img alt="Knight's Sword IV R +9 at score 18 (BBS in the old letter display)" loading="lazy" src="img/bd2-1000095420.jpg"/></button><figcaption>Knight's Sword IV R +9 at score 18 (BBS in the old letter display)</figcaption></figure>
<p><strong>After Legendary.</strong> First craft a UR III weapon and gloves for your main DPS (Evil Dragon's Blade for physical, Travel God's Friend for magic), with a <strong>Venomous Touch</strong> accessory, the top-priority piece. The full order, up to armor and helmets, is in section 10 ("Full crafting order").</p>
<p>The compendium mentions the code <strong>WAITING4LEGEND</strong>, which gave a UR III Venomous Touch. It's still active (confirmed on the official Discord, November 2026).</p>
<p><strong>Alchemy.</strong> It's Scheherazade's ability, which turns common materials into advanced ones. It levels like crafting. For XP, convert the cheapest first: Plain Leather into Fine Leather, Plain Fabric into Fine Fabric, Peat into Coal.</p>
</div></article><article class="step" data-step="4"><div class="step-head"><h3 id="s5-6">Step 4 — Recruit Diana, unlock a Potential, change Bonding</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="4"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>Once Story Pack 10 is cleared, you meet <strong>Adventurer of the Unknown Diana</strong> at the pub. She's recruited for <strong>1 ★5 Recruit Contract</strong> (the rainbow scroll).</p>
<figure class="shot"><button aria-label="Enlarge: Diana at the Story Pack 10 pub" class="shot-btn" data-full="img/bd2-1000095421.jpg" type="button"><img alt="Diana at the Story Pack 10 pub" loading="lazy" src="img/bd2-1000095421.jpg"/></button><figcaption>Diana at the Story Pack 10 pub</figcaption></figure>
<p class="callout key"><span class="co-tag">Key point</span><strong>Get 3 ★5 contracts by day 7:</strong> 1 in your mailbox on first login, 1 from the Newbie Pass step 1 day 7 reward, and 1 by trading lower-tier scrolls up in the shop.</p>
<p class="callout key"><span class="co-tag">Key point</span><strong>Why she's essential.</strong> Diana is a support whose aura raises <strong>property damage</strong> (Property DMG) and <strong>crit rate</strong>. Property damage is a separate multiplier from ATK/MATK buffs. It only works when the enemy's element is weak to yours. So it does nothing against enemies with no element, like in the Towers of Wrath and Jealousy. She's also key in Fiend Hunter.</p>
<figure class="shot"><button aria-label="Enlarge: Tower of Wrath enemy: no element, so no Diana bonus" class="shot-btn" data-full="img/bd2-1000095422.jpg" type="button"><img alt="Tower of Wrath enemy: no element, so no Diana bonus" loading="lazy" src="img/bd2-1000095422.jpg"/></button><figcaption>Tower of Wrath enemy: no element, so no Diana bonus</figcaption></figure>
<p><strong>Her Dispatch ability</strong> brings items every day. Once Gear Craft and Alchemy are Legendary, it's the next ability to max out.</p>
<figure class="shot"><button aria-label="Enlarge: Diana's Dispatch Advanced" class="shot-btn" data-full="img/bd2-1000095423.jpg" type="button"><img alt="Diana's Dispatch Advanced" loading="lazy" src="img/bd2-1000095423.jpg"/></button><figcaption>Diana's Dispatch Advanced</figcaption></figure>
<p><strong>More from the official Discord (November 2026).</strong> Send the Dispatch once by hand; after that, it restarts by itself every day if the box is ticked. The daily rewards wait for you on the map: look for the "!" bubbles above the small creatures. The odds are on the <a href="https://browndust2.gitbook.io/probabilitydetails_en#dispatch-reward-probability" target="_blank" rel="noopener">official Gitbook</a>.</p>
<figure class="shot dc"><button aria-label='Enlarge: The "!" bubbles of the Dispatch rewards on the map' class="shot-btn" data-full="img/dc-dispatch.jpg" type="button"><img alt='The "!" bubbles of the Dispatch rewards on the map' loading="lazy" src="img/dc-dispatch.jpg"/></button><figcaption>The "!" bubbles of the Dispatch rewards on the map<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h4>Skill Potential (Potential Liberation)</h4>
<p>Potential makes a costume stronger or gives it real quality of life: less cooldown, wider range, lower SP cost. The tree has three node types:</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Node</th>
<th>Effect</th>
<th>Cost</th>
</tr>
</thead>
<tbody>
<tr>
<td>Small</td>
<td>Character base stats, always active</td>
<td>30,000 gold + 50 elemental crystals</td>
</tr>
<tr>
<td>Medium</td>
<td>Big stat boost, active only while this costume is bonded</td>
<td>20,000 to 40,000 gold + 0 to 350 crystals</td>
</tr>
<tr>
<td>Large</td>
<td>Upgrades the skill (−1 SP, range, damage)</td>
<td>500 crystals + 1 <strong>Tear of the Goddess</strong></td>
</tr>
</tbody>
</table></div>
<p>Tears of the Goddess are very rare: think before using one, and ask for advice if unsure. A Potential <strong>cannot</strong> be undone: nothing is refunded (you can only disable a big node, see section 9). Compendium priority: <strong>supports first</strong> (SP and cooldown reduction, then duration and area), DPS damage nodes last.</p>
<figure class="shot"><button aria-label="Enlarge: Diana's Potential Liberation tree" class="shot-btn" data-full="img/bd2-1000095424.jpg" type="button"><img alt="Diana's Potential Liberation tree" loading="lazy" src="img/bd2-1000095424.jpg"/></button><figcaption>Diana's Potential Liberation tree</figcaption></figure>
<p><strong>More from the official Discord (November 2026).</strong> Don't put crystals or Tears on 3★ and 4★ characters, except Arines, Elpis and Kind Student Samay (and not as a beginner). You need about <strong>3,000 element crystals and 3 Tears</strong> to finish a 5★ costume's Potential.</p>
<figure class="shot dc"><button aria-label="Enlarge: An annotated Potential tree: permanent nodes, Bonding nodes and large nodes" class="shot-btn" data-full="img/dc-pots.jpg" type="button"><img alt="An annotated Potential tree: permanent nodes, Bonding nodes and large nodes" loading="lazy" src="img/dc-pots.jpg"/></button><figcaption>An annotated Potential tree: permanent nodes, Bonding nodes and large nodes<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h4>Bonding</h4>
<p>A character can have several costumes, and you pick <strong>one</strong> to bond with. It's like "equipping" that costume's upgrade bonuses on the character. You can change the bond anytime for free: on the character screen, tap the costume portrait on the right. As a beginner, bond the costume with the most Potential unlocked.</p>
<figure class="shot"><button aria-label="Enlarge: A character's Bonding Stat" class="shot-btn" data-full="img/bd2-1000095425.jpg" type="button"><img alt="A character's Bonding Stat" loading="lazy" src="img/bd2-1000095425.jpg"/></button><figcaption>A character's Bonding Stat</figcaption></figure>
</div></article><article class="step" data-step="5"><div class="step-head"><h3 id="s5-7">Step 5 — Resource stages and Mirror Wars (PvP)</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="5"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>Clearing Story Pack 3 unlocks <strong>Path of Adventure</strong>, where you farm Slimes (XP), gold and magic crystals. Higher difficulty means bigger rewards.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Dungeon</th>

<td>Slimes to level up</td>
<td>Cooked Rice</td>
</tr>
<tr>
<td>Magic Crystal Cave</td>
<td>Magic crystals, the only source for Potentials</td>
<td>Torches</td>
</tr>
</tbody>
</table></div>
<h4>The three energies</h4>
<p>The game has three energies that only refill <strong>at the daily reset</strong>, not per minute: <strong>rice</strong>, <strong>torches</strong> and <strong>Blood Cocktails</strong>. The white number is your daily ration: spend it all every day, because it doesn't stack. The yellow "+" is a stock that piles up with no limit and never expires.</p>
<figure class="shot"><button aria-label="Enlarge: Rice and torch gauges: daily ration in white, stock in yellow" class="shot-btn" data-full="img/bd2-1000095426.jpg" type="button"><img alt="Rice and torch gauges: daily ration in white, stock in yellow" loading="lazy" src="img/bd2-1000095426.jpg"/></button><figcaption>Rice and torch gauges: daily ration in white, stock in yellow</figcaption></figure>
<p class="callout warn"><span class="co-tag">Heads up</span><strong>How much per day?</strong> <strong>90 rice</strong> a day (confirmed on the official Discord, November 2026). The old Discord screenshot still shows 60 rice and 60 torches.</p>
<p><strong>How to spend them (compendium).</strong> Put all your rice on Goblin Ruins (gold) or Slime Empire (Slimes) depending on the bonus day. Put torches on whatever element you need crystals for. 60 torches on Very Hard give 220 to 260 crystals. "Paid" rice from events doesn't reset: to use it, untick "Use Free <button class="term" data-tip="Energy for Path of Adventure" type="button">Cooked Rice</button> Only" in Quick Hunt.</p>
<p><strong>Going up in difficulty.</strong> Very Hard on these dungeons is easy enough, especially with Diana's aura. You can try Hard on day one after crafting a few Rare pieces. Once Very Hard is cleared, just Quick Hunt every day.</p>
<p><strong>More from the official Discord (November 2026).</strong></p>
<ul>
<li><strong>Hunting Grounds</strong>: chapter 7 for ores, chapter 9 for wood. Don't spend more than <strong>6 rice a day</strong> there; the rest goes to Slimes (while your characters aren't maxed) or gold, depending on the bonus day. The bot text still says 60 rice a day: it's probably out of date.</li>
<li>The <strong>bonus day</strong> only applies to Goblin Ruins and Slime Empire, not to the Hunting Grounds or the Magic Crystal Cave.</li>
<li><strong>Quick Hunt</strong> doesn't work while you are in the Path of Adventure or Glupy Diner pack.</li>
<li><strong>More rice</strong>: Dia shop (not for beginners), Season Pass and Character Pass, events (login, Bingo) and Dispatch.</li>
</ul>
<figure class="shot dc"><button aria-label="Enlarge: Quick Hunt in 6 steps: Goblin Ruins on Very Hard, free rice only, slider to the max" class="shot-btn" data-full="img/dc-rice-quickhunt.jpg" type="button"><img alt="Quick Hunt in 6 steps: Goblin Ruins on Very Hard, free rice only, slider to the max" loading="lazy" src="img/dc-rice-quickhunt.jpg"/></button><figcaption>Quick Hunt in 6 steps: Goblin Ruins on Very Hard, free rice only, slider to the max<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<p>The Newbie Pass (step 1, day 7) asks you to activate <strong>Auto Hunt</strong>: do it once, and it clears even on day 1.</p>
<figure class="shot"><button aria-label="Enlarge: Auto Hunt button" class="shot-btn" data-full="img/bd2-1000095427.jpg" type="button"><img alt="Auto Hunt button" loading="lazy" src="img/bd2-1000095427.jpg"/></button><figcaption>Auto Hunt button</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Quick Hunt button" class="shot-btn" data-full="img/bd2-1000095428.jpg" type="button"><img alt="Quick Hunt button" loading="lazy" src="img/bd2-1000095428.jpg"/></button><figcaption>Quick Hunt button</figcaption></figure>
<h4>Mirror Wars (PvP)</h4>
<p><strong>Blood Cocktails</strong> are for Mirror Wars. Even if your team is weak at the start, spend them all every day: you earn medals whether you win or lose. Those medals buy the costume on sale in the Mirror Wars shop (18,000 medals).</p>
<figure class="shot"><button aria-label="Enlarge: Mirror Wars shop: costume for 18,000 medals" class="shot-btn" data-full="img/bd2-1000095429.jpg" type="button"><img alt="Mirror Wars shop: costume for 18,000 medals" loading="lazy" src="img/bd2-1000095429.jpg"/></button><figcaption>Mirror Wars shop: costume for 18,000 medals</figcaption></figure>
<ul>
<li><strong>At the start</strong>, just put in your best PvE team.</li>
<li><strong>Realistic goal</strong>: Gold I or Platinum in your first week. Diamond I (Dia I) is roughly the ceiling for a casual player each week.</li>
<li><strong>Reward</strong>: Gold I gives 500 Dia at every weekly reset.</li>
</ul>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong></p>
<ul>
<li>40 Blood Cocktails a day, reset at midnight. Use <strong>Repeat Battle</strong> set to 40: you fight once but get the rewards of 40 fights. Victory points only count once.</li>
<li>The season lasts one week, Monday to Sunday. On Sunday, from 15:00 (game time), a 9-hour settlement blocks attacks.</li>
<li>On offense you start with <strong>5 SP</strong>, on defense with <strong>6 SP</strong>, then +6 SP per turn. Favor cheap SP costumes: you can't fire everything on turn 1 like in the story.</li>
</ul>
<p><strong>More from the official Discord (November 2026).</strong></p>
<ul>
<li>In Repeat Battle, two useful options: "<strong>Use Free Blood Cocktail Only</strong>" (don't touch your stored cocktails) and "<strong>Battle Auto Skip</strong>". A screenshot from the Discord shows a setting of 1 to 10 repeated battles: the exact number is still to <a class="verify" href="#a-verifier">check in game</a>.</li>
<li>Only buy cocktails with Dia to climb the ranking, or if you lack medals for a meta costume. The shop costume is guaranteed if you play from the start of the season.</li>
<li>Shop: the <strong>costume</strong> before the UR EX gear ticket, and <strong>always take the Sparks first</strong> (their amount is time-limited).</li>
</ul>

</div></article><article class="step" data-step="6"><div class="step-head"><h3 id="s5-8">Step 6 — The Evil Castle and its towers</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="6"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>The Evil Castle unlocks with Story Pack 4 (Normal). It holds five towers, each with its own logic.</p>
<div class="tbl"><table>

<th>Tower</th>
<th>How it works</th>
<th>Beginner goal (Discord)</th>

</tr>

<td>Seasonal roguelike (4 weeks), 10 difficulties</td>

</tr>
<tr>
<td>Tower of Wrath</td>
<td>100 floors, enemies <strong>immune to physical</strong></td>
<td>Level 5</td>
</tr>
<tr>
<td>Tower of Jealousy</td>
<td>100 floors, enemies <strong>immune to magic</strong></td>
<td>Level 5</td>
</tr>

<h4>Tower of Pride</h4>
<p>Clearing at least <strong>floor 1</strong> makes you eligible for the season-end rewards: <strong>3,000 Devil Coins and 30 Ancient Crystals</strong>. It's not that hard if you recruited Liatris or Levia from the pub.</p>
<figure class="shot"><button aria-label="Enlarge: Tower of Pride season-end reward" class="shot-btn" data-full="img/bd2-1000095430.jpg" type="button"><img alt="Tower of Pride season-end reward" loading="lazy" src="img/bd2-1000095430.jpg"/></button><figcaption>Tower of Pride season-end reward</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Evil Castle season goals" class="shot-btn" data-full="img/bd2-1000095431.jpg" type="button"><img alt="Evil Castle season goals" loading="lazy" src="img/bd2-1000095431.jpg"/></button><figcaption>Evil Castle season goals</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong></p>
<ul>
<li>Each floor: 4 normal fights, then 1 boss. Each floor cleared the first time gives 1,000 Devil Coins and 10 Ancient Crystals.</li>
<li>Your best score pays out <strong>every day</strong> without redoing the tower: from 300 Devil Coins + 6 Ancient Crystals (10,000 points) to 900 + 9 (600,000 points). To claim it, go into a pack (except Golden Colosseum, Glupy Diner, Soul Wager, Territory and Fishing) and talk to the little critters following you.</li>
<li>Easy points for beginners: win in 1 turn, keep the whole team at max HP, and deal 1,000,000 damage with a single character in one turn (Dream Bride Eclipse is good at it). Don't chase the element requirements early on.</li>
</ul>
<p><strong>More from the official Discord (November 2026).</strong></p>
<ul>
<li>Aiming for the max score gives more <strong>Ancient Crystals</strong> every day.</li>
<li><strong>Beginners</strong>: don't worry about it, just use your best PvE team. You still lack the costumes, dupes and gear for the max score.</li>
<li><strong>The method</strong>: one character does the 1-million hit, the others clear the monsters. No crit, no million? <strong>Restart the battle.</strong></li>
<li><strong>Go to the inn before each floor</strong>: sometimes your characters aren't at max HP for no reason, and you lose the "max HP" points.</li>
</ul>
<p>With Devil Coins, buy from the Evil Castle shop: the ★4 Ability Book (as needed), <strong>Essences</strong> and <strong>Engraving Scrolls</strong>.</p>
<h4>Tower of Salvation</h4>
<p>It's the best mode to learn how costumes work, team building and mechanics. Clearing at least 1 level makes you eligible for its season rewards. The Discord recommends <strong>level 2</strong> for a beginner, or <strong>level 4</strong> if you can, since it gives a <strong><button class="term" data-tip="Random ★5 of a chosen element" type="button">Property Selective Draw Exchange Ticket</button></strong>.</p>

<p><strong>How it works (compendium).</strong> 10 keys a day. You pick a difficulty, then draft a team: 1 costume out of 4 offered per slot, plus a 5th "joker" you choose freely. Costumes you own keep their dupes, Potentials and Awakening, but <strong>not their gear</strong>. As you climb, you pick your route (fights, elites, artifacts, events, shop on floors 11 and 21) and earn Lost Silver, with 5% interest on each floor. RNG is seeded: replaying the same fight the same way gives the same result. Tip: swapping a character mid-fight costs 2 SP and resets their cooldowns. With Obsidian, buy Refresh Attempts Up and Starting SP Up first.</p>
<h4>Tower of Desire</h4>
<p>Normal fights: you just need to win. Your story team is enough up to around floor 150, and Diana is your best friend there. From floor 151 on, you need to play elements with Diana and the right DPS. Each floor gives at least 1 <button class="term" data-tip="Regular draw ticket" type="button">Draw Ticket</button>.</p>
<h4>Towers of Wrath and Jealousy</h4>
<p>Wrath forces a <strong>magic</strong> team (or at least a magic DPS), Jealousy a <strong>physical</strong> team, with special effects that change every 10 floors from floor 11. Their enemies have <strong>no element</strong>: Diana is useless there. Debuffs and pushback from the other damage type still work. Every 5th and 10th floor gives Draw Tickets, Dia and Refining Crystals. From floor 41, the difficulty spikes noticeably.</p>
<figure class="shot"><button aria-label="Enlarge: Tower of Wrath floor 40 and its special effects" class="shot-btn" data-full="img/bd2-1000095433.jpg" type="button"><img alt="Tower of Wrath floor 40 and its special effects" loading="lazy" src="img/bd2-1000095433.jpg"/></button><figcaption>Tower of Wrath floor 40 and its special effects</figcaption></figure>
</div></article><article class="step" data-step="7"><div class="step-head"><h3 id="s5-9">Step 7 — Collection Buff</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="7"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>The Collection Buff is a stat bonus that applies to <strong>all</strong> your characters. It caps at <strong>80%</strong>: past that, no item, gear or costume raises it. Goal for the week: 50% HP bonus.</p>
<ul>
<li><strong>Always search around you</strong> to pick up collectibles (the little sparkles on the map).</li>
<li>Each "safe" map has its own number of items to search. Open the minimap to see the counter.</li>
<li>Some items can only be searched with Lathel's <strong>Search</strong> ability.</li>
</ul>
<figure class="shot"><button aria-label="Enlarge: Minimap with the found-items counter" class="shot-btn" data-full="img/bd2-1000095434.jpg" type="button"><img alt="Minimap with the found-items counter" loading="lazy" src="img/bd2-1000095434.jpg"/></button><figcaption>Minimap with the found-items counter</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Unique rewards: basic searches and Search-ability searches" class="shot-btn" data-full="img/bd2-1000095435.jpg" type="button"><img alt="Unique rewards: basic searches and Search-ability searches" loading="lazy" src="img/bd2-1000095435.jpg"/></button><figcaption>Unique rewards: basic searches and Search-ability searches</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Collection screen with the Collection Buffs" class="shot-btn" data-full="img/bd2-1000095436.jpg" type="button"><img alt="Collection screen with the Collection Buffs" loading="lazy" src="img/bd2-1000095436.jpg"/></button><figcaption>Collection screen with the Collection Buffs</figcaption></figure>
<p><strong>Tools to find everything</strong>: the <a href="https://browndust2-wiki.souseha.com/en/maps" target="_blank" rel="noopener">Browndust2 wiki interactive map</a> shows where items are, and the <a href="https://docs.google.com/spreadsheets/d/1ePZc0xGtZwoJFbQ2EXJmHdaIlx2Uro_5-suCEohihhU/edit?gid=2007043438#gid=2007043438" target="_blank" rel="noopener">community spreadsheet</a> lists every collectible.</p>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong> In the home screen's <strong>Collection</strong> menu, you track the costumes, weapons and items you've collected, which give these permanent bonuses. At the top left of the field screen, the area summary shows the items, searches and monsters left.</p>
<p><strong>More from the official Discord (November 2026).</strong></p>
<ul>
<li><strong>HP</strong> comes from collection items and recipes (recipes: cooking ability level, achievements, story, character and event packs). <strong>ATK and MATK</strong> come from character and costume dupes, and from gear of different tiers.</li>
<li><strong>Where the items are</strong>: in chapters 1 to 14, inside the buildings of the safe zones; in chapter 15 and in character and event packs, in the safe zone itself.</li>
<li>Tip: copy the community sheet and highlight what you already have. The <a href="https://browndust2-wiki.souseha.com/collections" target="_blank" rel="noopener">Souseha wiki</a> also lists every collection.</li>
</ul>

</div></article><article class="step" data-step="8"><div class="step-head"><h3 id="s5-10">Step 8 — Event battles and Fiend Hunter</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="8"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>A <strong>Season Event</strong> usually lasts two weeks: a story, 15 Normal and 15 Challenge battles, a Fiend Hunter, missions and a shop. You get there through the icon on the right of the home screen.</p>
<h4>Event battles</h4>
<p>Meet the <strong>3 conditions</strong> of each battle for the extra rewards: win, win with no losses (or with fewer than 2 characters knocked out, depending on the battle), and win in 8 turns or less.</p>
<figure class="shot"><button aria-label='Enlarge: Event battle conditions, including "everyone survives"' class="shot-btn" data-full="img/bd2-1000095437.jpg" type="button"><img alt='Event battle conditions, including "everyone survives"' loading="lazy" src="img/bd2-1000095437.jpg"/></button><figcaption>Event battle conditions, including "everyone survives"</figcaption></figure>
<ul>
<li><strong>Don't use Wiggle</strong> in some battles: he self-destructs and makes you fail the "everyone survives" condition.</li>
<li>The <strong>event costume</strong> bonus applies even if you don't use them in battle: you just need to own them. Each one raises the currency earned, up to +100%.</li>
</ul>
<figure class="shot"><button aria-label="Enlarge: Event costume bonus" class="shot-btn" data-full="img/bd2-1000095438.jpg" type="button"><img alt="Event costume bonus" loading="lazy" src="img/bd2-1000095438.jpg"/></button><figcaption>Event costume bonus</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong> You get <strong>5 attempts a day</strong> (reset at midnight), so 70 over the event. A loss or a retreat costs nothing: experiment. Clearing battles 5, 10 or 15 with every condition unlocks <strong>Quick Battle</strong>, and the <strong>Auto-Play</strong> button chains battles on its own. Don't buy attempts with Dia, unless you're short on the priority items on the last day.</p>
<h4>The event shop</h4>
<p>It's a great way to boost your account fast. It stays open <strong>28 days</strong>: scroll the event logo to find the previous shop. Compendium buying order:</p>
<ol>
<li><button class="term" data-tip="Very rare; unlocks skill potentials" type="button">Tear of the Goddess</button> ×1 (1,000, then 2,000, then 3,000 currency)</li>
<li><button class="term" data-tip="Used for Burst" type="button">Spark of Rampage</button> ×30 (600)</li>
<li>Draw Ticket ×15 (6,000)</li>
<li><button class="term" data-tip="Crafts UR gear" type="button">Ancient Crystal</button> ×40 (2,400)</li>
<li>Strength, Life and Perseverance Essences ×50 (1,000 each)</li>
<li>UR event gear (3,000) with its 27 upgrade materials (2,700)</li>
<li><button class="term" data-tip="Reroll options (substats)" type="button">Refining Crystal</button> ×500 (1,500)</li>
<li>Then: gold, Ability Pills, Slimes, then <button class="term" data-tip="Raise the refinement score (powder) and reroll options (stones, crystals)" type="button">Refining Powder</button> and gold as much as you want</li>
</ol>
<p><strong>Fiend gear</strong> (from the event shop) is excellent to start with: it always gets the best refinement score (24, or SSS) and upgrades with no gold and no failure. Don't buy the SR version, only the UR.</p>
<p><strong>More from the official Discord (November 2026).</strong></p>
<ul>
<li><strong>Extra battle attempts</strong>: only if you lack Tears, or for an important event (for example a free +5 costume).</li>
<li><strong>UR event gear</strong>: only if you can also pay for its 27 materials (5,700 currency in total); otherwise, skip it.</li>
<li><strong>Sparks</strong>: always, they are rare.</li>
<li><strong>Engraving Scrolls</strong> are better from the Evil Castle and the guild.</li>
<li><strong>Don't buy</strong>: SR event gear and its 18 materials, ★3, ★2 and ★1 rank-up stars, and Yellow Slimes.</li>
</ul>
<figure class="shot"><button aria-label="Enlarge: UR event gear with an SSS rank" class="shot-btn" data-full="img/bd2-1000095439.jpg" type="button"><img alt="UR event gear with an SSS rank" loading="lazy" src="img/bd2-1000095439.jpg"/></button><figcaption>UR event gear with an SSS rank</figcaption></figure>
<h4>Fiend Hunter (FH)</h4>
<p>It's a boss that changes every season, fought with up to 3 teams of 5. The first week is for training (Practice, no rewards), the second for the real attack (Hunting Period). <strong>Only your best try counts</strong>: you can retry as often as you want, but to get a difficulty's rewards, you have to bring the Fiend's HP to zero in a single try. Your damage then also clears every easier difficulty.</p>
<figure class="shot"><button aria-label="Enlarge: Fiend Hunter (old version: the Quick Battle button is gone)" class="shot-btn" data-full="img/bd2-1000095440.jpg" type="button"><img alt="Fiend Hunter (old version: the Quick Battle button is gone)" loading="lazy" src="img/bd2-1000095440.jpg"/></button><figcaption>Fiend Hunter (old version: the Quick Battle button is gone)</figcaption></figure>
<p class="callout warn"><span class="co-tag">Heads up</span><strong>Watch out for older guides.</strong> Some guides, including the official Discord bot's, still talk about "levels" (Lv.15, 3 Draw Tickets per level) and a daily Quick Battle that carried your damage over from one day to the next. That system was replaced by <strong>5 selectable difficulties</strong>: Easy, Normal, Hard, Very Hard and Challenge (compendium, October 2026). Your damage automatically clears every difficulty with lower HP.</p>

<td>Top 10.1 to 30%</td>
<td>3 Draw Tickets + 150 Refining Crystals</td>
</tr>
<tr>
<td>Top 30.1 to 50%</td>
<td>3 Draw Tickets + 100 Refining Crystals</td>
</tr>
<tr>
<td>Top 50.1 to 100%</td>
<td>3 Draw Tickets + 50 Refining Crystals</td>
</tr>
</tbody>
</table></div>
<p>So clearing Hard gives you 30 Draw Tickets, plus at least 3 from the ranking: at least <strong>33 Draw Tickets</strong> every season.</p>
<p><strong>More from the official Discord (November 2026).</strong> Week 1: practice and prepare; week 2: the hunt, until the last day at 15:00 UTC. For your 3 teams, people often run one damage team and utility teams.</p>
<p>Even with low damage, hit the boss: you get at least the ranking reward. For strategies, the compendium recommends the YouTube videos of <strong>Pod</strong> (accessible) and <strong>Shimonami</strong> (advanced), and the <a href="https://browndust2-db.souseha.com/en/formation/list" target="_blank" rel="noopener">Souseha</a> team database.</p>
</div></article><article class="step" data-step="9"><div class="step-head"><h3 id="s5-11">Step 9 — Last Night</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="9"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>Last Night unlocks with the Story Pack 3 main quests. You hit a single boss with a <strong>20-costume</strong> team, and the game keeps your best score. <strong>No need to go every day</strong> to get the daily reward.</p>
<p>It's one of your main sources of <strong>Ancient Crystals</strong>, needed to craft UR gear.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Damage</th>
<th>Daily reward</th>
</tr>
</thead>
<tbody>
<tr>
<td>10,000</td>
<td>1 Ancient Crystal a day (the Discord's minimum target)</td>
</tr>
<tr>
<td>52 million</td>
<td>5 Ancient Crystals a day, the max</td>
</tr>
<tr>
<td>110 million</td>
<td>5 Awakening Elixirs a day on top, the max</td>

</table></div>
<figure class="shot"><button aria-label="Enlarge: Last Night reward at 10,000 damage" class="shot-btn" data-full="img/bd2-1000095441.jpg" type="button"><img alt="Last Night reward at 10,000 damage" loading="lazy" src="img/bd2-1000095441.jpg"/></button><figcaption>Last Night reward at 10,000 damage</figcaption></figure>
<p class="callout key"><span class="co-tag">Key point</span><strong>Claiming the reward.</strong> <strong>Isaac</strong> brings it to you every day, along with the little Dispatch critters, on your first login after reset. You have to <strong>interact with him</strong> on the map, in any pack except Golden Colosseum, Glupy Diner, Soul Wager, Territory and Fishing Voyage.</p>
<figure class="shot"><button aria-label="Enlarge: Isaac and the Dispatch critters on the map" class="shot-btn" data-full="img/bd2-1000095442.jpg" type="button"><img alt="Isaac and the Dispatch critters on the map" loading="lazy" src="img/bd2-1000095442.jpg"/></button><figcaption>Isaac and the Dispatch critters on the map</figcaption></figure>
<h4>The Support Bonus: nothing goes to waste</h4>
<p>This mode is why no resource is ever "wasted": every costume <strong>you don't use</strong> in the team gives a damage bonus. Each costume adds (its character's combat power ÷ 1,000)%. So gear up characters with lots of costumes first, like Justia and Lathel.</p>
<figure class="shot"><button aria-label="Enlarge: The Support Bonus depends on level, costumes, gear, Potential, Awakening and Engraving" class="shot-btn" data-full="img/bd2-1000095443.jpg" type="button"><img alt="The Support Bonus depends on level, costumes, gear, Potential, Awakening and Engraving" loading="lazy" src="img/bd2-1000095443.jpg"/></button><figcaption>The Support Bonus depends on level, costumes, gear, Potential, Awakening and Engraving</figcaption></figure>
<p><strong>Battle rules (compendium).</strong></p>
<ul>
<li>Your 20 costumes act once each in order, with no SP cost, then the fight ends.</li>
<li>The boss takes a single tile, has no element (Diana is useless) and ignores debuffs. The <button class="term" data-tip="Every hit on the same target in a turn raises the damage of the next hits" type="button">Chain</button> limit is removed.</li>
<li>A "Pressure" effect halves stat buffs. <button class="term" data-tip="Buff that raises allies' damage" type="button">Augmentation</button> buffs and Chains aren't affected.</li>
<li>Last Night gear is saved separately: remember to update it.</li>
<li>Recommended order: buffers, then multi-hit characters (Chain), then big DPS at the end. Lathel's Promise of Vengeance costume (free in Story Pack 7) is a good DPS there, and New Hire Nebris is the best.</li>
</ul>
</div></article><article class="step" data-step="10"><div class="step-head"><h3 id="s5-12">Step 10 — Glupy Diner and Glu Talk</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="10"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>The <strong>Glupy Diner</strong> is a restaurant to manage, open from the start of the game, that gives you passive income: gold, Refining Powder and magic crystals. It also allows animated encounters (Live2D) with some costumes. You start with <strong>3,000 Glupy Stars</strong>, plenty to get it to level 2 right away.</p>
<ul>
<li>Level 1 has 5 upgrades costing 500, 525, 551, 579 and 608 Glupy Stars.</li>
<li>Each level raises what the restaurant earns per minute (level 2: 8 gold/min instead of 7, 4 Glupy Stars/min instead of 3).</li>
<li>Opening hours cap at <strong>24 hours</strong>. Past that, it produces nothing until you cash out (Checkout). Drop by regularly to cash out and level up ASAP.</li>
</ul>
<figure class="shot"><button aria-label="Enlarge: Glupy Diner view" class="shot-btn" data-full="img/bd2-1000095444.jpg" type="button"><img alt="Glupy Diner view" loading="lazy" src="img/bd2-1000095444.jpg"/></button><figcaption>Glupy Diner view</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Diner Sales: cashing out" class="shot-btn" data-full="img/bd2-1000095445.jpg" type="button"><img alt="Diner Sales: cashing out" loading="lazy" src="img/bd2-1000095445.jpg"/></button><figcaption>Diner Sales: cashing out</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Level 2: per-minute earnings go up" class="shot-btn" data-full="img/bd2-1000095446.jpg" type="button"><img alt="Level 2: per-minute earnings go up" loading="lazy" src="img/bd2-1000095446.jpg"/></button><figcaption>Level 2: per-minute earnings go up</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong> The restaurant goes up to level 30 and gives up to 20 Deco Coins a day. The home screen's <strong>Business Management</strong> button collects gold, Powder and Stars without entering the pack. Deco Coins and magic crystals, though, require going into the pack.</p>
<p><strong>More from the official Discord (November 2026).</strong></p>
<ul>
<li><strong>Deco Coins</strong> come from tapping the bubbles above NPCs and objects.</li>
<li><strong>Regular Guests</strong>: every day, 5 costumes from your collection visit the restaurant. Talk to them for rewards (magic crystals).</li>
<li><strong>Regular Note</strong>: <strong>100 Dia per character</strong> once they have visited 3 times in total. Tap "<strong>Obtain all</strong>" when the button lights up.</li>
<li>The "Diner Sales" counter is also at the top left of the home screen.</li>
</ul>
<figure class="shot dc"><button aria-label="Enlarge: Glupy Diner: checking out sales, the regulars and the Regular Note (100 Dia per character)" class="shot-btn" data-full="img/dc-glupy.jpg" type="button"><img alt="Glupy Diner: checking out sales, the regulars and the Regular Note (100 Dia per character)" loading="lazy" src="img/dc-glupy.jpg"/></button><figcaption>Glupy Diner: checking out sales, the regulars and the Regular Note (100 Dia per character)<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h4>Glu Talk</h4>
<p>You can only chat in Glu Talk with characters whose related costume you own. Only a few costumes have these meetings for now, and more are coming.</p>
<ul>
<li>You only meet <strong>one Fated Guest a day</strong>. The others will be the next day.</li>
<li>The <strong>first meeting</strong> with a Fated Guest doesn't use your daily meeting point.</li>
<li>Goal for the week: unlock a friend's 4th meeting.</li>
</ul>
<p><strong>Step by step (official Discord, November 2026).</strong> Go to a character pack, then to the Glupy Diner. Today's Fated Guest has a <strong>pink speech bubble</strong>: talk to her. After that, you can contact her in GluTalk, at the top left of the home screen. If you talk to her 3 times a day, the interaction unlocks in about <strong>3 days</strong>. The Discord keeps two video lists: <a href="https://youtube.com/playlist?list=PLSWDlsPYyQpjMJyTryB7UapeDayIyy8Z2" target="_blank" rel="noopener">free interactions</a> and <a href="https://www.youtube.com/playlist?list=PLSWDlsPYyQpjvDzGdYTMSWIxdd_jb8c2b" target="_blank" rel="noopener">paid interactions</a>.</p>
<p><strong>Prestige skins</strong> (paid): your chance to get one goes up with each pull, and it's <strong>guaranteed on the 16th</strong>.</p>

</div></article><article class="step" data-step="11"><div class="step-head"><h3 id="s5-13">Step 11 — Optimizing gear</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="11"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>There are two levers to make a piece better and suited to your character: raising its <strong>refinement score</strong> (also called upgrade rank), and changing its <strong>main stat and options</strong> (substats).</p>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Letters or score?</strong> The Discord screenshots show the old letter display (C, B, A, S). The game now shows a <strong>score from 6 to 24</strong> inside a star: BBS = 18, SSS = 24. See section 10.</p>
<h4>Refinement score and Refining Powder</h4>
<p>Raising the score costs <strong>Refining Powder</strong>. You get it by dismantling gear, or from the event shop if you have currency left.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Dismantling a piece…</th>
<th>Gives</th>
<th>Extra Powder per level (+1)</th>
</tr>
</thead>
<tbody>
<tr>
<td>R</td>
<td>Refining Stones + Powder</td>
<td>+2</td>
</tr>
<tr>
<td>SR</td>
<td>Refining Crystals + Powder</td>
<td>+9</td>
</tr>
<tr>
<td>UR</td>
<td>Refining Crystals + Powder</td>
<td>+72</td>
</tr>
</tbody>
</table></div>
<p>The more upgraded the piece, the more Powder it returns. The number of Stones and Crystals only depends on the tier (I to IV), not the level. Tip: upgrade your pieces to <strong>+6 or +8 before dismantling</strong> if you have spare gold (the compendium aims for +7, the best gold/Powder ratio).</p>
<p>Use <strong>Upgrade All</strong> to upgrade in bulk and <strong>Select Gear</strong> to dismantle in bulk. Locked or equipped pieces are never dismantled.</p>
<figure class="shot"><button aria-label="Enlarge: R gear inventory" class="shot-btn" data-full="img/bd2-1000095448.jpg" type="button"><img alt="R gear inventory" loading="lazy" src="img/bd2-1000095448.jpg"/></button><figcaption>R gear inventory</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Craft Gear, Upgrade All and Select Gear buttons" class="shot-btn" data-full="img/bd2-1000095449.jpg" type="button"><img alt="Craft Gear, Upgrade All and Select Gear buttons" loading="lazy" src="img/bd2-1000095449.jpg"/></button><figcaption>Craft Gear, Upgrade All and Select Gear buttons</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Refining in the old letter display (C, A, B)" class="shot-btn" data-full="img/bd2-1000095450.jpg" type="button"><img alt="Refining in the old letter display (C, A, B)" loading="lazy" src="img/bd2-1000095450.jpg"/></button><figcaption>Refining in the old letter display (C, A, B)</figcaption></figure>
<h4>Options (substats)</h4>
<p>Changing options lets your character deal more damage or survive better.</p>
<ul>
<li>Option <strong>values never</strong> change with the refinement score: a Rare IV at score 12 (BBB) has the same options as a Rare IV at score 24 (SSS). Only the tier (I, II, III, IV) matters: the lower it is, the weaker the options.</li>
<li>To change options: <strong>Refining Stones</strong> for N and R gear. For SR and UR, the game uses your Refining Stones first, then <strong>Refining Crystals</strong> (10 stones = 1 crystal).</li>
<li><strong>Careful with Refining Crystals</strong>: they're rare. Only use them on UR IV or UR EX.</li>
</ul>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong> You can <strong>lock</strong> an option to keep it, but each lock raises the cost (up to ×4 with 3 locks). After a roll, you choose between keeping the old one (Keep Option), taking the new one (Confirm) or rerolling (Retry). With no answer within 12 hours, the game keeps the old one. For a standard DPS, aim for ATK or MATK on the weapon and gloves, then <button class="term" data-tip="Critical chance / critical damage" type="button">Crit DMG</button> or <button class="term" data-tip="Critical chance / critical damage" type="button">Crit Rate</button>.</p>
<h4>The goal: a perfect Knight's Ring IV</h4>
<p>The last goal of the checklist: a <strong>Knight's Ring IV (R)</strong> at score <strong>18</strong> (<strong>BBS</strong> rank in the old display) with all 3 options in <strong>Crit DMG</strong>.</p>
<figure class="shot"><button aria-label="Enlarge: Knight's Ring IV R +9 with 3 Crit DMG options" class="shot-btn" data-full="img/bd2-1000095451.jpg" type="button"><img alt="Knight's Ring IV R +9 with 3 Crit DMG options" loading="lazy" src="img/bd2-1000095451.jpg"/></button><figcaption>Knight's Ring IV R +9 with 3 Crit DMG options</figcaption></figure>
</div></article><article class="step" data-step="12"><div class="step-head"><h3 id="s5-14">Step 12 — Recruit Liberta</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="12"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>Once <strong>Story Pack 15</strong> is cleared, you meet <strong>Dark Saintess Liberta</strong> at the pub. Like Diana, she's recruited for <strong>1 ★5 Recruit Contract</strong>. She's the reason to rush to Pack 15.</p>
<figure class="shot"><button aria-label="Enlarge: Liberta at the Story Pack 15 pub" class="shot-btn" data-full="img/bd2-1000095452.jpg" type="button"><img alt="Liberta at the Story Pack 15 pub" loading="lazy" src="img/bd2-1000095452.jpg"/></button><figcaption>Liberta at the Story Pack 15 pub</figcaption></figure>
<p class="callout warn"><span class="co-tag">Heads up</span><strong>This pack isn't easy for a beginner.</strong> Normal enemies have about 50,000 HP and bosses between 200,000 and 350,000. Gear up well before you tackle it.</p>
<p class="callout key"><span class="co-tag">Key point</span><strong>Why she's essential.</strong> Dark Saintess Liberta is a <strong>must-have</strong> costume: she buffs ATK <strong>and</strong> crit rate, and gives 3 SP back to your allies. She's the core of every <strong>physical</strong> team.</p>
<figure class="shot"><button aria-label="Enlarge: Prayer of Duality skill: +3 SP, +65% ATK and +25% crit rate for 4 turns" class="shot-btn" data-full="img/bd2-1000095453.jpg" type="button"><img alt="Prayer of Duality skill: +3 SP, +65% ATK and +25% crit rate for 4 turns" loading="lazy" src="img/bd2-1000095453.jpg"/></button><figcaption>Prayer of Duality skill: +3 SP, +65% ATK and +25% crit rate for 4 turns</figcaption></figure>
<ul>
<li>She works even at <strong>+0</strong>, as long as all her Potentials are unlocked.</li>
<li>With Liberta (+0, full Potential) and Arines +5, your team gets a total of <strong>+135% ATK and +55% crit rate</strong>.</li>
<li>At +3, her crit rate buff goes up to +50%.</li>
</ul>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong> In the starter "single target" team, Liberta can replace Arines (if she's +2 or higher) or Homunculus Lathel. If you haven't recruited her yet, don't take her past +4 in the 12-Pick banner: recruiting gives you the missing copy.</p>
</div></article></div></section>
<section class="chapter" id="s6" data-title="Full progression checklist"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg><b>06</b></span><h2>Full progression checklist</h2></header><div class="ch-body">

<section class="chapter" id="s7" data-title="Routines"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2"/><path d="M9 3h6"/></svg><b>07</b></span><h2>Routines</h2></header><div class="ch-body">
<h3 id="s7-1">Your 10 to 15 minute daily routine</h3>
<p>Your dailies take 10 to 15 minutes, outside special events. Do them in this order, unless a daily mission asks for something else.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Step</th>
<th>Time</th>
<th>What to do</th>
</tr>
</thead>
<tbody>
<tr>
<td>1. Free pulls and login</td>
<td>under 1 min</td>
<td>1 free pull per featured banner; claim your mailbox. For Dispatch (Olstein, Diana) and Last Night, go talk to Isaac and the little critters on the map.</td>
</tr>
<tr>
<td>2. Cooked Rice and torches</td>
<td>under 1 min</td>
<td>1 Hunting Ground fight (or 1 auto for 6 rice) for the daily quest. The rest of the rice goes to Path of Adventure on gold or Slimes, depending on the day. Torches: Magic Crystal Cave.</td>
</tr>
<tr>
<td>3. Gear</td>
<td>2 min</td>
<td>Craft, dismantle, upgrade or refine, depending on what the pass missions ask.</td>
</tr>
<tr>
<td>4. Finds and Gluttis</td>
<td>1 to 2 min</td>
<td>Pick up at least one find (blue or green glows) and one Glutti (blue critter with bunny ears). Gluttis run away: catch them with the boots dash.</td>
</tr>
<tr>
<td>5. Quest Bulletin (optional)</td>
<td>3 to 5 min</td>
<td>Up to 3 quests a day for gold. Clearing a pack's quest gives 10% off at its merchant for a few days.</td>
</tr>
<tr>
<td>6. Pub</td>
<td>under 1 min</td>
<td>2 random characters, refreshed every 2 hours. Only recruit 5★.</td>
</tr>
<tr>
<td>7. Mirror Wars</td>
<td>1 to 6 min</td>
<td>40 free fights a day. One is enough for the mission; do all 40 on auto if you can, for the medals.</td>
</tr>
<tr>
<td>8. Rewards</td>
<td>under 1 min</td>
<td>Claim the season pass, missions and ongoing events.</td>
</tr>
</tbody>
</table></div>
<h3 id="s7-2">Useful details</h3>
<ul>
<li>
<p><strong>Premium pass</strong>: buy it every season for 1,000 Dia. You get 10+ Draw Tickets, worth about 2,000 Dia on their own.</p>
</li>
<li>
<p><strong>Premium pass, the right time</strong> (<code>?spc</code>, official Discord): the daily pass missions give 230 pass EXP a day, and each level needs more EXP than the one before. Buying the premium gives <strong>+3 levels</strong> right away: if you're short on EXP to finish the pass, buy it around <strong>level 17</strong>, that's where it's worth the most. Buying levels with Dia gets more and more expensive; <a href="https://browndust2-wiki.souseha.com/en/pass-count" target="_blank" rel="noopener">Souseha's pass calculator</a> tells you how much EXP you're missing (its Dia spending tip is only a guide).</p>
</li>
<li><strong>Character Pass</strong>: every month, finishing its 7 days of missions gives a costume (official Discord).</li>
<li><strong>Reset times</strong> (confirmed by the official Discord's <code>?rtime</code> command): daily reset at <strong>00:00 UTC</strong> (01:00 in Belgium in winter, 02:00 in summer); Golden Colosseum on Wednesday at 15:00 UTC; <strong>Mirror Wars on Sunday at 15:00 UTC</strong>; monthly reset (shops) on the 1st of the month at 00:00 UTC.</li>
<li><strong>Newbie Pass</strong>: 7 days of quests with Slimes, recruit tickets, Dia and contracts. Do all its quests.</li>
<li><strong>Weekly missions</strong>: fill the weekly bar too, it gives more Dia than the daily one.</li>
<li><strong>Last Night</strong>: deal at least 10,000 damage there once. Isaac will then deliver gold and Ancient Crystals every day based on your best score, as long as you go talk to him on the map.</li>
<li><strong>Events</strong>: they usually last 2 weeks. Join in for the rewards and event shops.</li>
</ul>
<div class="prio-toggle-slot"></div><h3 id="s7-3">Every routine, daily to monthly (compendium)</h3>
<p>No task is mandatory: pick the ones that fit your schedule. <strong>Priority</strong> tasks give a lot for little time; <strong>secondary</strong> ones take more effort or give less.</p>

<section class="chapter" id="s8" data-title="Combat"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19L15 9"/><path d="M14 5l5 0 0 5"/><path d="M19 19L9 9"/><path d="M10 5H5v5"/></svg><b>08</b></span><h2>Combat</h2></header><div class="ch-body">
<p>Combat is turn-based, you always go first and there's no time limit: take your time to set up your turn. The goal is to kill as many enemies as possible on turn one, so you take fewer hits back.</p>
<h3 id="s8-1">The field</h3>
<ul>
<li>Each side has 3 lanes (columns) of 4 tiles. You don't pick your target: each character attacks the enemy in its own lane. With no enemy in its lane, it targets the nearest one.</li>
<li>Before each turn, you can freely move your characters between lanes to change their targets or dodge enemy attacks.</li>
<li>Drag the portraits in the turn order list: the top one acts first. Getting the order right makes all the difference.</li>
<li>Tap a character to see its target: green line for your allies' actions (supports), red line for enemy attacks aimed at it, a line in the element's color for the main target. The line also shows if the hit will be lethal.</li>
</ul>
<h3 id="s8-2">The three actions</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Action</th>
<th>Effect</th>
<th>Good to know</th>
</tr>
</thead>
<tbody>
<tr>
<td>Normal attack</td>
<td>Hits the target in the lane</td>
<td>Default action if you give no order; generates 1 SP</td>
</tr>
<tr>
<td>Knockback</td>
<td>Pushes the target one tile, 1 damage</td>
<td>Generates 1 SP; used to line enemies up for your AoEs</td>
</tr>
<tr>
<td>Skill</td>
<td>Big damage or effects</td>
<td>Costs SP, has a cooldown</td>
</tr>
</tbody>
</table></div>
<p>SP is shared by the whole team and carried over from one fight to the next. A character can use the skill of each of its costumes, each with its own cooldown. The damage shown on a skill doesn't account for enemy defense.</p>
<h3 id="s8-3">Key mechanics</h3>
<ul>
<li><strong>Area (AoE)</strong>: the tiles drawn next to the attack show what gets hit. The center tile is the main target.</li>
<li><strong>Knockback direction</strong>: most characters push forward, but some push diagonally or sideways. Check the arrow on the skill.</li>
<li><strong><button class="term" data-tip="Every hit on the same target in a turn raises the damage of the next hits" type="button">Chain</button></strong>: each hit on the same target in a turn adds 1 chain, and each chain raises the next hit's damage by 10%. They reset at the end of the turn.</li>
<li><strong>Elements</strong>: <span class="el el-fire">Fire</span> beats <span class="el el-wind">Wind</span>, <span class="el el-wind">Wind</span> beats <span class="el el-water">Water</span>, <span class="el el-water">Water</span> beats <span class="el el-fire">Fire</span>; <span class="el el-light">Light</span> and <span class="el el-dark">Dark</span> are each strong against the other. Element advantage gives +50% base damage, more with Awakening, Bonding or Diana. Element disadvantage lowers your damage (the exact value shows on the stats screen, and you can check enemies' stats mid-battle).</li>
<li><strong><button class="term" data-tip="Fight runs too long: everyone hits harder" type="button">Death Time</button></strong>: after turn 10, every 2 turns, all units gain +100% ATK and MATK, lose 100% defense and magic resistance, and take +50% damage (per the compendium, <a class="verify" href="#a-verifier">check in game</a>).</li>
</ul><figure class="wheel"><svg viewBox="0 0 320 210" role="img" aria-label="Element wheel: Fire beats Wind, Wind beats Water, Water beats Fire; Light and Dark beat each other">
<defs><marker id="ar-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--brass)"/></marker></defs>
