</table></div>
</div></article><article class="step" data-step="6"><div class="step-head"><h3 id="s5-8">Step 6 — The Evil Castle and its towers</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="6"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>The Evil Castle unlocks with Story Pack 4 (Normal). It holds five towers, each with its own logic.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Tower</th>
<th>How it works</th>
<th>Beginner goal (Discord)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Tower of Pride</td>
<td>6 scored floors, <strong>daily</strong> and season-end rewards</td>
<td>Floor 1</td>
</tr>
<tr>
<td>Tower of Desire</td>
<td>250 floors, you just need to win</td>
<td>Level 10</td>
</tr>
<tr>
<td>Tower of Salvation</td>
<td>Seasonal roguelike (4 weeks), 10 difficulties</td>
<td>Level 2, or even 4</td>
</tr>
<tr>
<td>Tower of Wrath</td>
<td>100 floors, enemies <strong>immune to physical</strong></td>
<td>Level 5</td>
</tr>
<tr>
<td>Tower of Jealousy</td>
<td>100 floors, enemies <strong>immune to magic</strong></td>
<td>Level 5</td>
</tr>
</tbody>
</table></div>
<h4>Tower of Pride</h4>
<p>Clearing at least <strong>floor 1</strong> makes you eligible for the season-end rewards: <strong>3,000 Devil Coins and 30 Ancient Crystals</strong>. It's not that hard if you recruited Liatris or Levia from the pub.</p>
<figure class="shot"><button aria-label="Enlarge: Tower of Pride season-end reward" class="shot-btn" data-full="img/bd2-1000095430.jpg" type="button"><img alt="Tower of Pride season-end reward" loading="lazy" src="img/bd2-1000095430.jpg"/></button><figcaption>Tower of Pride season-end reward</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Evil Castle season goals" class="shot-btn" data-full="img/bd2-1000095431.jpg" type="button"><img alt="Evil Castle season goals" loading="lazy" src="img/bd2-1000095431.jpg"/></button><figcaption>Evil Castle season goals</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong></p>
<ul>
<li>Each floor: 4 normal fights, then 1 boss. Each floor cleared the first time gives 1,000 Devil Coins and 10 Ancient Crystals.</li>
<li>Your best score pays out <strong>every day</strong> without redoing the tower: from 300 Devil Coins + 6 Ancient Crystals (10,000 points) to 900 + 9 (600,000 points). To claim it, go into a pack (except Golden Colosseum, Glupy Diner, Soul Wager, Territory and Fishing) and talk to the little critters following you.</li>
<li>Easy points for beginners: win in 1 turn, keep the whole team at max HP, and deal 1,000,000 damage with a single character in one turn (Dream Bride Eclipse is good at it). Don't chase the element requirements early on.</li>
</ul>
<p>With Devil Coins, buy from the Evil Castle shop: the ★4 Ability Book (as needed), <strong>Essences</strong> and <strong>Engraving Scrolls</strong>.</p>
<h4>Tower of Salvation</h4>
<p>It's the best mode to learn how costumes work, team building and mechanics. Clearing at least 1 level makes you eligible for its season rewards. The Discord recommends <strong>level 2</strong> for a beginner, or <strong>level 4</strong> if you can, since it gives a <strong><button class="term" data-tip="Random ★5 of a chosen element" type="button">Property Selective Draw Exchange Ticket</button></strong>.</p>
<figure class="shot"><button aria-label="Enlarge: Tower of Salvation, difficulty level 4" class="shot-btn" data-full="img/bd2-1000095432.jpg" type="button"><img alt="Tower of Salvation, difficulty level 4" loading="lazy" src="img/bd2-1000095432.jpg"/></button><figcaption>Tower of Salvation, difficulty level 4</figcaption></figure>
<div class="tbl"><table>
<thead>
<tr>
<th>Level</th>
<th>First-clear reward</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>20 Ancient Crystals</td>
</tr>
<tr>
<td>2</td>
<td>1 Tear of the Goddess</td>
</tr>
<tr>
<td>3</td>
<td>5 Draw Tickets</td>
</tr>
<tr>
<td>4</td>
<td>1 Property Selective Draw Exchange Ticket</td>
</tr>
<tr>
<td>5</td>
<td>5 Draw Tickets</td>
</tr>
<tr>
<td>6 and 7</td>
<td>20 Ancient Crystals each</td>
</tr>
<tr>
<td>8 and 9</td>
<td>300 Refining Crystals each</td>
</tr>
<tr>
<td>10</td>
<td>500 Refining Crystals</td>
</tr>
</tbody>
</table></div>
<p><strong>How it works (compendium).</strong> 10 keys a day. You pick a difficulty, then draft a team: 1 costume out of 4 offered per slot, plus a 5th "joker" you choose freely. Costumes you own keep their dupes, Potentials and Awakening, but <strong>not their gear</strong>. As you climb, you pick your route (fights, elites, artifacts, events, shop on floors 11 and 21) and earn Lost Silver, with 5% interest on each floor. RNG is seeded: replaying the same fight the same way gives the same result. Tip: swapping a character mid-fight costs 2 SP and resets their cooldowns. With Obsidian, buy Refresh Attempts Up and Starting SP Up first.</p>
<h4>Tower of Desire</h4>
<p>Normal fights: you just need to win. Your story team is enough up to around floor 150, and Diana is your best friend there. From floor 151 on, you need to play elements with Diana and the right DPS. Each floor gives at least 1 <button class="term" data-tip="Regular draw ticket" type="button">Draw Ticket</button>.</p>
<h4>Towers of Wrath and Jealousy</h4>
<p>Wrath forces a <strong>magic</strong> team (or at least a magic DPS), Jealousy a <strong>physical</strong> team, with special effects that change every 10 floors from floor 11. Their enemies have <strong>no element</strong>: Diana is useless there. Debuffs and pushback from the other damage type still work. Every 5th and 10th floor gives Draw Tickets, Dia and Refining Crystals. From floor 41, the difficulty spikes noticeably.</p>
<figure class="shot"><button aria-label="Enlarge: Tower of Wrath floor 40 and its special effects" class="shot-btn" data-full="img/bd2-1000095433.jpg" type="button"><img alt="Tower of Wrath floor 40 and its special effects" loading="lazy" src="img/bd2-1000095433.jpg"/></button><figcaption>Tower of Wrath floor 40 and its special effects</figcaption></figure>
</div></article><article class="step" data-step="7"><div class="step-head"><h3 id="s5-9">Step 7 — Collection Buff</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="7"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>The Collection Buff is a stat bonus that applies to <strong>all</strong> your characters. It caps at <strong>80%</strong>: past that, no item, gear or costume raises it. Goal for the week: 50% HP bonus.</p>
<ul>
<li><strong>Always search around you</strong> to pick up collectibles (the little sparkles on the map).</li>
<li>Each "safe" map has its own number of items to search. Open the minimap to see the counter.</li>
<li>Some items can only be searched with Lathel's <strong>Search</strong> ability.</li>
</ul>
<figure class="shot"><button aria-label="Enlarge: Minimap with the found-items counter" class="shot-btn" data-full="img/bd2-1000095434.jpg" type="button"><img alt="Minimap with the found-items counter" loading="lazy" src="img/bd2-1000095434.jpg"/></button><figcaption>Minimap with the found-items counter</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Unique rewards: basic searches and Search-ability searches" class="shot-btn" data-full="img/bd2-1000095435.jpg" type="button"><img alt="Unique rewards: basic searches and Search-ability searches" loading="lazy" src="img/bd2-1000095435.jpg"/></button><figcaption>Unique rewards: basic searches and Search-ability searches</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Collection screen with the Collection Buffs" class="shot-btn" data-full="img/bd2-1000095436.jpg" type="button"><img alt="Collection screen with the Collection Buffs" loading="lazy" src="img/bd2-1000095436.jpg"/></button><figcaption>Collection screen with the Collection Buffs</figcaption></figure>
<p><strong>Tools to find everything</strong>: the <a href="https://browndust2-wiki.souseha.com/en/maps" target="_blank" rel="noopener">Browndust2 wiki interactive map</a> shows where items are, and the <a href="https://docs.google.com/spreadsheets/d/1ePZc0xGtZwoJFbQ2EXJmHdaIlx2Uro_5-suCEohihhU/edit?gid=2007043438#gid=2007043438" target="_blank" rel="noopener">community spreadsheet</a> lists every collectible.</p>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong> In the home screen's <strong>Collection</strong> menu, you track the costumes, weapons and items you've collected, which give these permanent bonuses. At the top left of the field screen, the area summary shows the items, searches and monsters left.</p>
</div></article><article class="step" data-step="8"><div class="step-head"><h3 id="s5-10">Step 8 — Event battles and Fiend Hunter</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="8"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>A <strong>Season Event</strong> usually lasts two weeks: a story, 15 Normal and 15 Challenge battles, a Fiend Hunter, missions and a shop. You get there through the icon on the right of the home screen.</p>
<h4>Event battles</h4>
<p>Meet the <strong>3 conditions</strong> of each battle for the extra rewards: win, win with no losses (or with fewer than 2 characters knocked out, depending on the battle), and win in 8 turns or less.</p>
<figure class="shot"><button aria-label='Enlarge: Event battle conditions, including "everyone survives"' class="shot-btn" data-full="img/bd2-1000095437.jpg" type="button"><img alt='Event battle conditions, including "everyone survives"' loading="lazy" src="img/bd2-1000095437.jpg"/></button><figcaption>Event battle conditions, including "everyone survives"</figcaption></figure>
<ul>
<li><strong>Don't use Wiggle</strong> in some battles: he self-destructs and makes you fail the "everyone survives" condition.</li>
<li>The <strong>event costume</strong> bonus applies even if you don't use them in battle: you just need to own them. Each one raises the currency earned, up to +100%.</li>
</ul>
<figure class="shot"><button aria-label="Enlarge: Event costume bonus" class="shot-btn" data-full="img/bd2-1000095438.jpg" type="button"><img alt="Event costume bonus" loading="lazy" src="img/bd2-1000095438.jpg"/></button><figcaption>Event costume bonus</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong> You get <strong>5 attempts a day</strong> (reset at midnight), so 70 over the event. A loss or a retreat costs nothing: experiment. Clearing battles 5, 10 or 15 with every condition unlocks <strong>Quick Battle</strong>, and the <strong>Auto-Play</strong> button chains battles on its own. Don't buy attempts with Dia, unless you're short on the priority items on the last day.</p>
<h4>The event shop</h4>
<p>It's a great way to boost your account fast. It stays open <strong>28 days</strong>: scroll the event logo to find the previous shop. Compendium buying order:</p>
<ol>
<li><button class="term" data-tip="Very rare; unlocks skill potentials" type="button">Tear of the Goddess</button> ×1 (1,000, then 2,000, then 3,000 currency)</li>
<li><button class="term" data-tip="Used for Burst" type="button">Spark of Rampage</button> ×30 (600)</li>
<li>Draw Ticket ×15 (6,000)</li>
<li><button class="term" data-tip="Crafts UR gear" type="button">Ancient Crystal</button> ×40 (2,400)</li>
<li>Strength, Life and Perseverance Essences ×50 (1,000 each)</li>
<li>UR event gear (3,000) with its 27 upgrade materials (2,700)</li>
<li><button class="term" data-tip="Reroll options (substats)" type="button">Refining Crystal</button> ×500 (1,500)</li>
<li>Then: gold, Ability Pills, Slimes, then <button class="term" data-tip="Reroll gear letters and options" type="button">Refining Powder</button> and gold as much as you want</li>
</ol>
<p><strong>Fiend gear</strong> (from the event shop) is excellent to start with: it always rolls the best upgrade rank (SSS, score 24) and upgrades with no gold and no failure. Don't buy the SR version, only the UR.</p>
<figure class="shot"><button aria-label="Enlarge: UR event gear with an SSS rank" class="shot-btn" data-full="img/bd2-1000095439.jpg" type="button"><img alt="UR event gear with an SSS rank" loading="lazy" src="img/bd2-1000095439.jpg"/></button><figcaption>UR event gear with an SSS rank</figcaption></figure>
<h4>Fiend Hunter (FH)</h4>
<p>It's a boss that changes every season, fought with up to 3 teams of 5. The first week is for training (Practice), the second for the real attack (Hunting Period). <strong>Only one attempt counts</strong>: to get a difficulty's rewards, you have to bring the Fiend's HP to zero in a single try. Your damage then also clears every easier difficulty.</p>
<figure class="shot"><button aria-label="Enlarge: Fiend Hunter (old version: the Quick Battle button is gone)" class="shot-btn" data-full="img/bd2-1000095440.jpg" type="button"><img alt="Fiend Hunter (old version: the Quick Battle button is gone)" loading="lazy" src="img/bd2-1000095440.jpg"/></button><figcaption>Fiend Hunter (old version: the Quick Battle button is gone)</figcaption></figure>
<p class="callout warn"><span class="co-tag">Heads up</span><strong>Heads up, the system changed.</strong> The Discord talks about "levels" (3 Draw Tickets per level up to level 10) and says to do it every day for event currency: that daily Quick Battle has been removed (confirmed on the official Discord, November 2026). The compendium (2026) describes 5 selectable difficulties: Easy, Normal, Hard, Very Hard and Challenge. Your damage automatically clears every difficulty with lower HP.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Difficulty</th>
<th>Reward</th>
</tr>
</thead>
<tbody>
<tr>
<td>Easy</td>
<td>10 Draw Tickets + 5,000 event currency</td>
</tr>
<tr>
<td>Normal</td>
<td>10 Draw Tickets + 15,000 currency</td>
</tr>
<tr>
<td>Hard</td>
<td>10 Draw Tickets + 1 Tear of the Goddess + 30,000 currency</td>
</tr>
<tr>
<td>Very Hard</td>
<td>225,000 Refining Powder + 1.5 million gold + 50,000 currency</td>
</tr>
<tr>
<td>Challenge</td>
<td>Damage ranking: 3 to 5 Draw Tickets and 50 to 300 Refining Crystals</td>
</tr>
</tbody>
</table></div>
<p>Even with low damage, hit the boss: you get at least the ranking reward. For strategies, the compendium recommends the YouTube videos of <strong>Pod</strong> (accessible) and <strong>Shimonami</strong> (advanced), and the <a href="https://browndust2-db.souseha.com/en/formation/list" target="_blank" rel="noopener">Souseha</a> team database.</p>
</div></article><article class="step" data-step="9"><div class="step-head"><h3 id="s5-11">Step 9 — Last Night</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="9"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>Last Night unlocks with the Story Pack 3 main quests. You hit a single boss with a <strong>20-costume</strong> team, and the game keeps your best score. <strong>No need to go every day</strong> to get the daily reward.</p>
<p>It's one of your main sources of <strong>Ancient Crystals</strong>, needed to craft UR gear.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Damage</th>
<th>Daily reward</th>
</tr>
</thead>
<tbody>
<tr>
<td>10,000</td>
<td>1 Ancient Crystal a day (the Discord's minimum target)</td>
</tr>
<tr>
<td>52 million</td>
<td>5 Ancient Crystals a day, the max</td>
</tr>
<tr>
<td>110 million</td>
<td>5 Awakening Elixirs a day on top, the max</td>
</tr>
</tbody>
</table></div>
<figure class="shot"><button aria-label="Enlarge: Last Night reward at 10,000 damage" class="shot-btn" data-full="img/bd2-1000095441.jpg" type="button"><img alt="Last Night reward at 10,000 damage" loading="lazy" src="img/bd2-1000095441.jpg"/></button><figcaption>Last Night reward at 10,000 damage</figcaption></figure>
<p class="callout key"><span class="co-tag">Key point</span><strong>Claiming the reward.</strong> <strong>Isaac</strong> brings it to you every day, along with the little Dispatch critters, on your first login after reset. You have to <strong>interact with him</strong> on the map, in any pack except Golden Colosseum, Glupy Diner, Soul Wager, Territory and Fishing Voyage.</p>
<figure class="shot"><button aria-label="Enlarge: Isaac and the Dispatch critters on the map" class="shot-btn" data-full="img/bd2-1000095442.jpg" type="button"><img alt="Isaac and the Dispatch critters on the map" loading="lazy" src="img/bd2-1000095442.jpg"/></button><figcaption>Isaac and the Dispatch critters on the map</figcaption></figure>
<h4>The Support Bonus: nothing goes to waste</h4>
<p>This mode is why no resource is ever "wasted": every costume <strong>you don't use</strong> in the team gives a damage bonus. Each costume adds (its character's combat power ÷ 1,000)%. So gear up characters with lots of costumes first, like Justia and Lathel.</p>
<figure class="shot"><button aria-label="Enlarge: The Support Bonus depends on level, costumes, gear, Potential, Awakening and Engraving" class="shot-btn" data-full="img/bd2-1000095443.jpg" type="button"><img alt="The Support Bonus depends on level, costumes, gear, Potential, Awakening and Engraving" loading="lazy" src="img/bd2-1000095443.jpg"/></button><figcaption>The Support Bonus depends on level, costumes, gear, Potential, Awakening and Engraving</figcaption></figure>
<p><strong>Battle rules (compendium).</strong></p>
<ul>
<li>Your 20 costumes act once each in order, with no SP cost, then the fight ends.</li>
<li>The boss takes a single tile, has no element (Diana is useless) and ignores debuffs. The <button class="term" data-tip="Every hit on the same target in a turn raises the damage of the next hits" type="button">Chain</button> limit is removed.</li>
<li>A "Pressure" effect halves stat buffs. <button class="term" data-tip="Buff that raises allies' damage" type="button">Augmentation</button> buffs and Chains aren't affected.</li>
<li>Last Night gear is saved separately: remember to update it.</li>
<li>Recommended order: buffers, then multi-hit characters (Chain), then big DPS at the end. Lathel's Promise of Vengeance costume (free in Story Pack 7) is a good DPS there, and New Hire Nebris is the best.</li>
</ul>
</div></article><article class="step" data-step="10"><div class="step-head"><h3 id="s5-12">Step 10 — Glupy Diner and Glu Talk</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="10"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>The <strong>Glupy Diner</strong> is a restaurant to manage that gives you passive income: gold, Refining Powder and magic crystals. You start with <strong>3,000 Glupy Stars</strong>, plenty to get it to level 2 right away.</p>
<ul>
<li>Level 1 has 5 upgrades costing 500, 525, 551, 579 and 608 Glupy Stars.</li>
<li>Each level raises what the restaurant earns per minute (level 2: 8 gold/min instead of 7, 4 Glupy Stars/min instead of 3).</li>
<li>Opening hours cap at <strong>24 hours</strong>. Past that, it produces nothing until you cash out (Checkout). Drop by regularly to cash out and level up ASAP.</li>
</ul>
<figure class="shot"><button aria-label="Enlarge: Glupy Diner view" class="shot-btn" data-full="img/bd2-1000095444.jpg" type="button"><img alt="Glupy Diner view" loading="lazy" src="img/bd2-1000095444.jpg"/></button><figcaption>Glupy Diner view</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Diner Sales: cashing out" class="shot-btn" data-full="img/bd2-1000095445.jpg" type="button"><img alt="Diner Sales: cashing out" loading="lazy" src="img/bd2-1000095445.jpg"/></button><figcaption>Diner Sales: cashing out</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Level 2: per-minute earnings go up" class="shot-btn" data-full="img/bd2-1000095446.jpg" type="button"><img alt="Level 2: per-minute earnings go up" loading="lazy" src="img/bd2-1000095446.jpg"/></button><figcaption>Level 2: per-minute earnings go up</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong> The restaurant goes up to level 30 and gives up to 20 Deco Coins a day. The home screen's <strong>Business Management</strong> button collects gold, Powder and Stars without entering the pack. Deco Coins and magic crystals, though, require going into the pack.</p>
<h4>Glu Talk</h4>
<p>You can only chat in Glu Talk with characters whose related costume you own (at the time of the Discord guide: New Hire Nebris, Celebrity Bunny Loen and Daydream Bunny Morpeah).</p>
<ul>
<li>You only meet <strong>one Fated Guest a day</strong>. The others will be the next day.</li>
<li>The <strong>first meeting</strong> with a Fated Guest doesn't use your daily meeting point.</li>
<li>Goal for the week: unlock a friend's 4th meeting.</li>
</ul>
<figure class="shot"><button aria-label="Enlarge: Glu Talk and today's remaining meetings" class="shot-btn" data-full="img/bd2-1000095447.jpg" type="button"><img alt="Glu Talk and today's remaining meetings" loading="lazy" src="img/bd2-1000095447.jpg"/></button><figcaption>Glu Talk and today's remaining meetings</figcaption></figure>
</div></article><article class="step" data-step="11"><div class="step-head"><h3 id="s5-13">Step 11 — Optimizing gear</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="11"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>There are two levers to make a piece better and suited to your character: raising its <strong>upgrade rank</strong> (refining), and changing its <strong>main stat and options</strong> (substats).</p>
<h4>Upgrade rank and Refining Powder</h4>
<p>Raising the rank costs <strong>Refining Powder</strong>. You get it by dismantling gear, or from the event shop if you have currency left.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Dismantling a piece…</th>
<th>Gives</th>
<th>Extra Powder per level (+1)</th>
</tr>
</thead>
<tbody>
<tr>
<td>R</td>
<td>Refining Stones + Powder</td>
<td>+2</td>
</tr>
<tr>
<td>SR</td>
<td>Refining Crystals + Powder</td>
<td>+9</td>
</tr>
<tr>
<td>UR</td>
<td>Refining Crystals + Powder</td>
<td>+72</td>
</tr>
</tbody>
</table></div>
<p>The more upgraded the piece, the more Powder it returns. The number of Stones and Crystals only depends on the tier (I to IV), not the level. Tip: upgrade your pieces to <strong>+6 or +8 before dismantling</strong> if you have spare gold (the compendium aims for +7, the best gold/Powder ratio).</p>
<p>Use <strong>Upgrade All</strong> to upgrade in bulk and <strong>Select Gear</strong> to dismantle in bulk. Locked or equipped pieces are never dismantled.</p>
<figure class="shot"><button aria-label="Enlarge: R gear inventory" class="shot-btn" data-full="img/bd2-1000095448.jpg" type="button"><img alt="R gear inventory" loading="lazy" src="img/bd2-1000095448.jpg"/></button><figcaption>R gear inventory</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Craft Gear, Upgrade All and Select Gear buttons" class="shot-btn" data-full="img/bd2-1000095449.jpg" type="button"><img alt="Craft Gear, Upgrade All and Select Gear buttons" loading="lazy" src="img/bd2-1000095449.jpg"/></button><figcaption>Craft Gear, Upgrade All and Select Gear buttons</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Upgrade rank refining (letters C, A, B)" class="shot-btn" data-full="img/bd2-1000095450.jpg" type="button"><img alt="Upgrade rank refining (letters C, A, B)" loading="lazy" src="img/bd2-1000095450.jpg"/></button><figcaption>Upgrade rank refining (letters C, A, B)</figcaption></figure>
<h4>Options (substats)</h4>
<p>Changing options lets your character deal more damage or survive better.</p>
<ul>
<li>Option <strong>values never</strong> change with upgrade rank: a Rare IV at BBB has the same options as a Rare IV at SSS. Only the tier (I, II, III, IV) matters: the lower it is, the weaker the options.</li>
<li>To change options: <strong>Refining Stones</strong> for N and R gear, <strong>Refining Crystals</strong> for SR and UR.</li>
<li><strong>Careful with Refining Crystals</strong>: they're rare. Only use them on UR IV or UR EX.</li>
</ul>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong> You can <strong>lock</strong> an option to keep it, but each lock raises the cost (up to ×4 with 3 locks). After a roll, you choose between keeping the old one (Keep Option), taking the new one (Confirm) or rerolling (Retry). With no answer within 12 hours, the game keeps the old one. For a standard DPS, aim for ATK or MATK on the weapon and gloves, then <button class="term" data-tip="Critical chance / critical damage" type="button">Crit DMG</button> or <button class="term" data-tip="Critical chance / critical damage" type="button">Crit Rate</button>.</p>
<h4>The goal: a perfect Knight's Ring IV</h4>
<p>The last goal of the checklist: a <strong>Knight's Ring IV (R)</strong> at <strong>BBS</strong> rank with all 3 options in <strong>Crit DMG</strong>.</p>
<figure class="shot"><button aria-label="Enlarge: Knight's Ring IV R +9 with 3 Crit DMG options" class="shot-btn" data-full="img/bd2-1000095451.jpg" type="button"><img alt="Knight's Ring IV R +9 with 3 Crit DMG options" loading="lazy" src="img/bd2-1000095451.jpg"/></button><figcaption>Knight's Ring IV R +9 with 3 Crit DMG options</figcaption></figure>
</div></article><article class="step" data-step="12"><div class="step-head"><h3 id="s5-14">Step 12 — Recruit Liberta</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="12"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>Once <strong>Story Pack 15</strong> is cleared, you meet <strong>Dark Saintess Liberta</strong> at the pub. Like Diana, she's recruited for <strong>1 ★5 Recruit Contract</strong>. She's the reason to rush to Pack 15.</p>
<figure class="shot"><button aria-label="Enlarge: Liberta at the Story Pack 15 pub" class="shot-btn" data-full="img/bd2-1000095452.jpg" type="button"><img alt="Liberta at the Story Pack 15 pub" loading="lazy" src="img/bd2-1000095452.jpg"/></button><figcaption>Liberta at the Story Pack 15 pub</figcaption></figure>
<p class="callout warn"><span class="co-tag">Heads up</span><strong>This pack isn't easy for a beginner.</strong> Normal enemies have about 50,000 HP and bosses between 200,000 and 350,000. Gear up well before you tackle it.</p>
<p class="callout key"><span class="co-tag">Key point</span><strong>Why she's essential.</strong> Dark Saintess Liberta is a <strong>must-have</strong> costume: she buffs ATK <strong>and</strong> crit rate, and gives 3 SP back to your allies. She's the core of every <strong>physical</strong> team.</p>
<figure class="shot"><button aria-label="Enlarge: Prayer of Duality skill: +3 SP, +65% ATK and +25% crit rate for 4 turns" class="shot-btn" data-full="img/bd2-1000095453.jpg" type="button"><img alt="Prayer of Duality skill: +3 SP, +65% ATK and +25% crit rate for 4 turns" loading="lazy" src="img/bd2-1000095453.jpg"/></button><figcaption>Prayer of Duality skill: +3 SP, +65% ATK and +25% crit rate for 4 turns</figcaption></figure>
<ul>
<li>She works even at <strong>+0</strong>, as long as all her Potentials are unlocked.</li>
<li>With Liberta (+0, full Potential) and Arines +5, your team gets a total of <strong>+135% ATK and +55% crit rate</strong>.</li>
<li>At +3, her crit rate buff goes up to +50%.</li>
</ul>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong> In the starter "single target" team, Liberta can replace Arines (if she's +2 or higher) or Homunculus Lathel. If you haven't recruited her yet, don't take her past +4 in the 12-Pick banner: recruiting gives you the missing copy.</p>
</div></article></div></section>
<section class="chapter" id="s6" data-title="Full progression checklist"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg><b>06</b></span><h2>Full progression checklist</h2></header><div class="ch-body">
<p>This list from BotAn's compendium covers the whole progression, from day one to Liberta. The order follows a normal playthrough, but you don't have to stick to it exactly. Tick as you go.</p>
<div class="checklist" data-cad="none" data-prio="high" data-role="" data-scope="6. Full progression checklist"><div class="cl-bar"><span aria-live="polite" class="cl-count"></span><div class="cl-track"><span class="cl-fill"></span></div><button class="cl-reset" type="button">Untick all</button></div><ul class="tasks"><li class="task"><label><input class="tick" data-k="7d201a9995" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Master Pack 1 (Edge of Dimensions)</span></label></li><li class="task"><label><input class="tick" data-k="aa4807396a" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Get The Curse Celia from the Newbie Infinite Draw</span></label></li><li class="task"><label><input class="tick" data-k="ab59f1df33" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Redeem the available coupon codes</span></label></li><li class="task"><label><input class="tick" data-k="efc05f0fe9" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Claim the free costumes from the Events tab (Eclipse and Dalvi, top priority for leveling)</span></label></li><li class="task"><label><input class="tick" data-k="da89a3c18f" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Story Pack 3 (Mist Man) on Normal: unlocks Last Night, Path of Adventure and Mirror Wars</span></label></li><li class="task"><label><input class="tick" data-k="1cf78330f9" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Join a guild</span></label></li><li class="task"><label><input class="tick" data-k="f0c15ad17a" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Level Eclipse and Dalvi to 100</span></label></li><li class="task"><label><input class="tick" data-k="4d1d1f0c61" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Get Crafting to Advanced rank</span></label></li><li class="task"><label><input class="tick" data-k="540a89a452" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Build a team and fight in Last Night, for the daily rewards</span></label></li><li class="task"><label><input class="tick" data-k="5f9027ce85" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Goblin Cave, Slime Empire and Magic Crystal Cave on Normal</span></label></li><li class="task"><label><input class="tick" data-k="17b8c26524" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear them on Hard</span></label></li><li class="task"><label><input class="tick" data-k="76118cedd9" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear them on Very Hard</span></label></li><li class="task"><label><input class="tick" data-k="5231d233d1" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Story Pack 4 (Cat Daddy) on Normal: unlocks the Evil Castle</span></label></li><li class="task"><label><input class="tick" data-k="4ac161d8b3" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Fight in the Tower of Pride (as many floors as you can), for the daily rewards</span></label></li><li class="task"><label><input class="tick" data-k="ad386103af" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Get Crafting to Expert rank</span></label></li><li class="task"><label><input class="tick" data-k="41d8b8125e" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Story Pack 6 (Pagan Tower) on Normal: unlocks Golden Colosseum</span></label></li><li class="task"><label><input class="tick" data-k="99bbbcb5ba" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Story Pack 7 (Fury Angel) on Normal: unlocks Hunting Ground 7</span></label></li><li class="task"><label><input class="tick" data-k="f0a02c22a1" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear it on Hard, then Very Hard (Hunting Ground 7 on Hard and Very Hard)</span></label></li><li class="task"><label><input class="tick" data-k="fb634b99df" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Story Pack 9 (Bloody Rhapsody) on Normal: unlocks the Tower of Salvation and Hunting Ground 9</span></label></li><li class="task"><label><input class="tick" data-k="6c04d5cac4" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear it on Hard, then Very Hard (Hunting Ground 9 on Hard and Very Hard)</span></label></li><li class="task"><label><input class="tick" data-k="913b8f6c52" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear the Tower of Salvation at level 1 or higher, for the season rewards</span></label></li><li class="task"><label><input class="tick" data-k="bd0187cb56" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Story Pack 10 (Homunculus) on Normal: unlocks Diana at the pub</span></label></li><li class="task"><label><input class="tick" data-k="d8a9adf0e5" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Recruit Adventurer of the Unknown Diana</span></label></li><li class="task"><label><input class="tick" data-k="bed6b823d3" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Get Crafting to Legendary rank</span></label></li><li class="task"><label><input class="tick" data-k="42bf261e59" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Get Alchemy to Legendary rank</span></label></li><li class="task"><label><input class="tick" data-k="d64dec0294" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Story Pack 15 (Promise of Vengeance) on Normal: unlocks Liberta at the pub</span></label></li><li class="task"><label><input class="tick" data-k="c46c478a95" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Recruit Dark Saintess Liberta</span></label></li></ul></div>
</div></section>
<section class="chapter" id="s7" data-title="Routines"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2"/><path d="M9 3h6"/></svg><b>07</b></span><h2>Routines</h2></header><div class="ch-body">
<h3 id="s7-1">Your 10 to 15 minute daily routine</h3>
<p>Your dailies take 10 to 15 minutes, outside special events. Do them in this order, unless a daily mission asks for something else.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Step</th>
<th>Time</th>
<th>What to do</th>
</tr>
</thead>
<tbody>
<tr>
<td>1. Free pulls and login</td>
<td>under 1 min</td>
<td>1 free pull per featured banner; claim your mailbox. For Dispatch (Olstein, Diana) and Last Night, go talk to Isaac and the little critters on the map.</td>
</tr>
<tr>
<td>2. Cooked Rice and torches</td>
<td>under 1 min</td>
<td>1 Hunting Ground fight (or 1 auto for 6 rice) for the daily quest. The rest of the rice goes to Path of Adventure on gold or Slimes, depending on the day. Torches: Magic Crystal Cave.</td>
</tr>
<tr>
<td>3. Gear</td>
<td>2 min</td>
<td>Craft, dismantle, upgrade or refine, depending on what the pass missions ask.</td>
</tr>
<tr>
<td>4. Finds and Gluttis</td>
<td>1 to 2 min</td>
<td>Pick up at least one find (blue or green glows) and one Glutti (blue critter with bunny ears). Gluttis run away: catch them with the boots dash.</td>
</tr>
<tr>

<h3 id="s7-2">Useful details</h3>
<ul>
<li><strong>Premium pass</strong>: buy it every season for 1,000 Dia. You get 10+ Draw Tickets, worth about 2,000 Dia on their own.</li>
<li><strong>Newbie Pass</strong>: 7 days of quests with Slimes, recruit tickets, Dia and contracts. Do all its quests.</li>
<li><strong>Weekly missions</strong>: fill the weekly bar too, it gives more Dia than the daily one.</li>
<li><strong>Last Night</strong>: deal at least 10,000 damage there once. Isaac will then deliver gold and Ancient Crystals every day based on your best score, as long as you go talk to him on the map.</li>
<li><strong>Events</strong>: they usually last 2 weeks. Join in for the rewards and event shops.</li>
</ul>

<section class="chapter" id="s8" data-title="Combat"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19L15 9"/><path d="M14 5l5 0 0 5"/><path d="M19 19L9 9"/><path d="M10 5H5v5"/></svg><b>08</b></span><h2>Combat</h2></header><div class="ch-body">
<p>Combat is turn-based, you always go first and there's no time limit: take your time to set up your turn. The goal is to kill as many enemies as possible on turn one, so you take fewer hits back.</p>
<h3 id="s8-1">The field</h3>
<ul>
<li>Each side has 3 lanes (columns) of 4 tiles. You don't pick your target: each character attacks the enemy in its own lane. With no enemy in its lane, it targets the nearest one.</li>
<li>Before each turn, you can freely move your characters between lanes to change their targets or dodge enemy attacks.</li>
<li>Drag the portraits in the turn order list: the top one acts first. Getting the order right makes all the difference.</li>
<li>Tap a character to see its target: green line for your attack, red line for attacks aimed at it. The line also shows if the hit will be lethal.</li>
</ul>
<h3 id="s8-2">The three actions</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Action</th>
<th>Effect</th>
<th>Good to know</th>
</tr>
</thead>
<tbody>
<tr>
<td>Normal attack</td>
<td>Hits the target in the lane</td>
<td>Default action if you give no order; generates 1 SP</td>
</tr>
<tr>
<td>Knockback</td>
<td>Pushes the target one tile, 1 damage</td>
<td>Generates 1 SP; used to line enemies up for your AoEs</td>
</tr>
<tr>
<td>Skill</td>
<td>Big damage or effects</td>
<td>Costs SP, has a cooldown</td>
</tr>
</tbody>
</table></div>
<p>SP is shared by the whole team and carried over from one fight to the next. A character can use the skill of each of its costumes, each with its own cooldown. The damage shown on a skill doesn't account for enemy defense.</p>
<h3 id="s8-3">Key mechanics</h3>
<ul>
<li><strong>Area (AoE)</strong>: the tiles drawn next to the attack show what gets hit. The center tile is the main target.</li>
<li><strong>Knockback direction</strong>: most characters push forward, but some push diagonally or sideways. Check the arrow on the skill.</li>
<li><strong><button class="term" data-tip="Every hit on the same target in a turn raises the damage of the next hits" type="button">Chain</button></strong>: each hit on the same target in a turn adds 1 chain, and each chain raises the next hit's damage by 10%. They reset at the end of the turn.</li>
<li><strong>Elements</strong>: <span class="el el-fire">Fire</span> beats <span class="el el-wind">Wind</span>, <span class="el el-wind">Wind</span> beats <span class="el el-water">Water</span>, <span class="el el-water">Water</span> beats <span class="el el-fire">Fire</span>; <span class="el el-light">Light</span> and <span class="el el-dark">Dark</span> are each strong against the other. Element advantage gives +50% base damage, more with Awakening, Bonding or Diana. Element disadvantage lowers your damage (the exact value shows on the stats screen, and you can check enemies' stats mid-battle).</li>
<li><strong><button class="term" data-tip="Fight runs too long: everyone hits harder" type="button">Death Time</button></strong>: after turn 10, every 2 turns, all units gain +100% ATK and MATK, lose 100% defense and magic resistance, and take +50% damage (per the compendium, <a class="verify" href="#a-verifier">check in game</a>).</li>
</ul><figure class="wheel"><svg viewBox="0 0 320 210" role="img" aria-label="Element wheel: Fire beats Wind, Wind beats Water, Water beats Fire; Light and Dark beat each other">
<defs><marker id="ar-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--brass)"/></marker></defs>
<path d="M92 52 Q140 70 152 118" fill="none" stroke="var(--brass)" stroke-width="1.6" marker-end="url(#ar-en)"/>
<path d="M140 150 Q92 172 48 150" fill="none" stroke="var(--brass)" stroke-width="1.6" marker-end="url(#ar-en)"/>

<circle cx="30" cy="140" r="24" fill="var(--water)"/><text x="30" y="145" text-anchor="middle" class="w-t">Water</text>
<text x="96" y="104" text-anchor="middle" class="w-s">beats →</text>
<circle cx="240" cy="55" r="24" fill="var(--light)"/><text x="240" y="60" text-anchor="middle" class="w-t dk">Light</text>
<circle cx="240" cy="160" r="24" fill="var(--dark)"/><text x="240" y="165" text-anchor="middle" class="w-t">Dark</text>

<text x="292" y="112" text-anchor="middle" class="w-s">each beats</text><text x="292" y="126" text-anchor="middle" class="w-s">the other</text>
</svg><figcaption>The arrow goes from the strong element to the one it beats. Neutral neither wins nor loses against anyone.</figcaption></figure>
<h3 id="s8-4">How to play a turn</h3>
<ol>
<li>Tap an enemy to see its skills and what it'll do next turn. Its plan is already locked in.</li>
<li>Place your characters outside its attack area. If a hit is unavoidable, have your highest-HP character tank it.</li>
<li>Use knockback to line enemies up, then fire your AoEs.</li>
<li>Order your actions: pushers first, big damage after.</li>
<li>Finish with End Turn.</li>
</ol>
<h3 id="s8-5">Combat in detail</h3>
<ul>
<li><strong>Turns</strong>: in PvE, you act on odd turns (1, 3, 5…) and the enemy on even turns. You place your characters and pick costumes before each turn, then everything plays out automatically.</li>
<li><strong>Targeting</strong>: each costume aims at a <strong>main target</strong> (down arrow). "<button class="term" data-tip="Attack targeting: first in the lane / skips the first" type="button">Very Front</button>" targets the nearest enemy in your column, "Vault" jumps over the first one to hit the second. If no one's in your column, the character targets the column to its right, then the one to its left.</li>
<li><strong>Chains</strong>: each hit on an enemy adds 1 Chain, and each Chain adds +10% damage for the rest of the turn (cap 100, except in Last Night). Multi-hit characters are precious, especially in Fiend Hunter and Guild Raid.</li>
<li><strong>Knockback</strong>: it always deals 1 damage to the target. If the pushed enemy slams into another, that one takes 25% of the pushed enemy's max HP (calculation capped at 50,000 HP). Bosses can't be pushed.</li>
<li><strong>Death Time</strong>: after turn 10 (story, events, Mirror Wars, Evil Castle), every 2 turns each unit gains +100% ATK, loses 100% DEF and takes +50% damage.</li>
<li><strong>Common statuses</strong>: <button class="term" data-tip="Forces enemies to target you" type="button">Taunt</button> (forces targeting that enemy), Counter (reflects damage), Evade (cancels the attack, bypassed by Wiggle's self-destruct), <button class="term" data-tip="Temporary HP shield" type="button">Energy Guard</button> (shield), Immunity.</li>
<li><strong>Special damage types</strong>: Fixed and Consumed never crit and ignore DEF; Pure can crit and ignores DEF and shields.</li>
<li><strong>Handy tools</strong>: Presets (12 saved teams with gear and placement), Set Costume Order (skill order programmed over 10 activations), Restart from the previous turn in the Pause menu. Avoid Auto Battle: it ignores enemy placement and teaches you nothing.</li>
<li><strong>Borrowing</strong>: 3 borrows a day per friend (up to 30 friends), 1 borrowed character per fight, in story, events, Hunting Grounds and Path of Adventure.</li>
</ul>
<h3 id="s8-6">The damage formula, in short</h3>
<p>Damage is a product of independent multipliers. Since they multiply, spreading your bonuses across several families beats stacking the same one:</p>
<div class="formula"><span class="fx-lhs">Damage</span><span class="fx-op">=</span><span class="fx-term">ATK</span><span class="fx-op">×</span><span class="fx-term">Skill</span><span class="fx-op">×</span><span class="fx-term">ATK buffs</span><span class="fx-op">×</span><span class="fx-term">Crit</span><span class="fx-op">×</span><span class="fx-term">Chains</span><span class="fx-op">×</span><span class="fx-term">Vulnerability</span><span class="fx-op">×</span><span class="fx-term">Element</span><span class="fx-op">×</span><span class="fx-term">Enemy DEF</span><span class="fx-op">×</span><span class="fx-term">Weak point</span><span class="fx-op">×</span><span class="fx-term">Support Bonus</span></div>
<ul>
<li>Crit rate above 100% is converted into crit damage (×6).</li>
<li>The "Pressure" of some modes reduces stat buffs (ATK, <button class="term" data-tip="Critical chance / critical damage" type="button">Crit DMG</button>, element, DEF), but not Chains or Vulnerability.</li>
<li>The element bonus (Diana) is its own family: it doesn't get diluted in ATK buffs.</li>
</ul>
</div></section>
<section class="chapter" id="s9" data-title="Character progression"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V6"/><path d="M6 11l6-6 6 6"/><path d="M6 20h12"/></svg><b>09</b></span><h2>Character progression</h2></header><div class="ch-body">
<p>Early on, your resources are scarce: focus them on your story team and level them with Slimes, rank-up stars and gear. The "item location" button at the bottom of an item's info tells you where to farm it.</p>
<h3 id="s9-1">Levels, Slimes and ascension</h3>
<ul>
<li><strong>XP</strong>: you earn it by surviving fights and feeding Slimes to your characters. Slimes come in yellow, blue and red; red gives the most XP.</li>
<li><strong>Ascension</strong>: every 20 levels, a character has to rank up with rank-up stars. Each rank gives it a star, and rarity sets the max level.</li>
<li><strong>Rank 4 stars</strong>: rare and not farmable. Save them for your 5★ characters (they unlock levels 81 to 100).</li>
<li><strong>Slimes first, gold later</strong>: farm Slimes until your main characters are max level, then switch to gold, which endgame eats in huge amounts.</li>
</ul>
<h3 id="s9-2">Effortless farming: Path of Adventure</h3>
<p>This pack opens after the third story pack. The first few times, fight manually: after 5 fights, a boss shows up (Red Slime or Goblin King depending on difficulty). Once you beat it once on a difficulty, you unlock auto-battle for that difficulty, using <button class="term" data-tip="Energy for Path of Adventure" type="button">Cooked Rice</button>.</p>
<ul>
<li>Same principle for each pack's Hunting Grounds: beating the boss unlocks auto-battle for that difficulty.</li>
<li>The "scroll" shortcut on the left of the field menu opens Path of Adventure directly.</li>
<li>Clear "Very Hard" everywhere ASAP, to automate your farming.</li>
</ul>
<h3 id="s9-3">Field abilities to level</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Priority</th>
<th>Ability</th>
<th>Who</th>
</tr>
</thead>
<tbody>
<tr>
<td>Max</td>
<td>Gear Craft</td>
<td>Layla or Fred, not both</td>
</tr>
<tr>
<td>Max</td>
<td>Alchemy</td>
<td>Scheherazade</td>
</tr>
<tr>
<td>High</td>
<td>Dispatch</td>
<td>Olstein and Diana (different rewards)</td>
</tr>
<tr>
<td>Comfort</td>
<td>Search, Absorption, Assemble</td>
<td>Lathel, Celia, Refithea</td>
</tr>
<tr>
<td>Optional</td>
<td>The rest</td>
<td>Don't waste books on them</td>
</tr>
</tbody>
</table></div>
<p>The Steal ability gives little: use its attempts once a week if you have time (low priority).</p>
<h3 id="s9-4">Other sources of power</h3>
<ul>
<li><strong>Skills</strong>: pull a dupe of the costume to raise the skill up to +5 (more damage and often a shorter cooldown), for a bit of gold.</li>
<li><strong>Potential</strong>: upgrade it with elemental crystals from Magic Crystal Cave, reached through Path of Adventure and paid with torches. Pick your most-used character and farm the crystal of its element.</li>
<li><strong>Collection bonus</strong>: each character you own gives a small bonus to all the others; some character trios give a bigger bonus.</li>
</ul>
<h3 id="s9-5">Hard and Very Hard modes</h3>
<p>Talk to Elin in a pack's safe zone once its main quest is done. Only start one at a time: until you finish its quest, you can't do that chapter's daily quests anymore.</p>
<h3 id="s9-6">Burst</h3>
<p>Burst lets you pay extra SP to power up a skill. Each costume has 3 levels to unlock in order, and their effects (like their SP costs) stack.</p>
<ul>
<li><strong>Cost for a ★5 costume</strong>: 60 <strong>Sparks of Rampage</strong> + 1.5 million gold per level, so 180 Sparks and 4.5 million gold in total.</li>
<li><strong>Spark sources</strong>: event shops, <button class="term" data-tip="Earned from dupes past +5; points shop" type="button">Golden Thread</button>, <button class="term" data-tip="Earned on every draw; points shop" type="button">Powder of Hope</button>, Refinement Remnants, Mirror Wars, guild, Golden Colosseum and Taros Tactical Manual. Expect about 530 to 585 Sparks a month, roughly 3 costumes.</li>
<li><strong>Advice</strong>: it's very expensive for a beginner. Collect every Spark you can, but invest little at first, and mostly in supports. Top priority according to the author: Diana (Adventurer of the Unknown) Bursts 1-3, B-Rank Idol Helena 1-3, Homunculus Lathel 1, Onsen Manager Liberta 1-3, Medical Club Teresse 3.</li>
<li>In battle, pick the Burst level with the little arrow on the skill, or turn on <strong>Auto Burst</strong> (lower priority than costume activation).</li>
</ul>
</div></section>
<section class="chapter" id="s10" data-title="Gear"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg><b>10</b></span><h2>Gear</h2></header><div class="ch-body">
<p>Gear makes a huge difference to your team's power: level Gear Craft and Alchemy from the start, then save your best pieces for endgame. Each character wears 5 pieces: weapon, head, body, accessory and gloves.</p>
<h3 id="s10-1">Getting gear</h3>
<ul>
<li><strong>Crafting</strong>: through Layla or Fred, who have the same ability since the December 2023 patch. Level one of them, not both. R-rank and higher materials need Scheherazade's Alchemy.</li>
<li><strong>Weapon banner</strong>: a character's exclusive gear, equivalent to a UR IV piece with an extra exclusive stat. Useful, never essential: you can clear almost all content with normal UR.</li>
<li><strong>Event gear</strong>: worth it, since it always progresses with an SSS refine; it usually beats UR III.</li>
</ul>
<h3 id="s10-2">Reading a piece</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Element</th>
<th>Values</th>
<th>Note</th>
</tr>
</thead>
<tbody>
<tr>
<td>Rarity</td>
<td>N, R, SR, UR</td>
<td>Weakest to strongest</td>
</tr>
<tr>
<td>Tier</td>
<td>I, II, III, IV, EX</td>
<td>EX = banner exclusive</td>
</tr>
<tr>
<td>Level</td>
<td>+0 to +9</td>
<td>Each level raises stats; the rarer the piece, the more often upgrades fail</td>
</tr>
<tr>
<td>Stats</td>
<td>2 base stats + 3 substats</td>
<td>Substats unlock at +3, +6 and +9</td>
</tr>
</tbody>
</table></div>
<p>Physical gear (ATK, DEF) can't roll magic substats, and vice versa. Accessories are neutral.</p>
<h3 id="s10-3">Refining letters</h3>
<p>Each piece has three letters (C, B, A, S) unlocked at +3, +6 and +9. They decide the stat bonus. Values: C = 1, B = 2, A = 3, S = 4. Each letter is multiplied by its position (x1, x2, x3), and the sum gives the grade, from 6 (CCC) to 24 (SSS). Example: BAS = 2 + 6 + 12 = grade 20.</p>
<p>Refining rerolls the letters with <button class="term" data-tip="Reroll gear letters and options" type="button">Refining Powder</button> and only keeps the result if it's better. Aim for BBS (grade 18) then stop: past that, the odds are very low and the cost skyrockets.</p>
<h3 id="s10-4">Day-to-day management</h3>
<ul>
<li><strong>Craft</strong> UR pieces if you have enough Ancient Crystals. Otherwise, craft the R and SR you're missing to fill the collection (collection bonus).</li>
<li><strong>Dismantle</strong> low-level pieces: they give Refining Powder.</li>
<li><strong>Upgrade</strong> your high-level pieces, even the ones that aren't your best: Last Night needs all your characters geared.</li>
<li><strong>Refine</strong> only your best pieces. Don't refine too early: you'll replace your gear as soon as your crafting rank goes up a notch.</li>
<li>Don't spend gear tickets for no reason: UR 5★ rates are low and the result is random.</li>
</ul>
<h3 id="s10-5">Stat targets for a DPS (compendium benchmarks)</h3>
<p>These aren't strict thresholds, just benchmarks for a "decent" DPS: early on, <strong>2,200+ ATK or MATK and 550%+ <button class="term" data-tip="Critical chance / critical damage" type="button">Crit DMG</button></strong>; later, <strong>3,000+ and 450%+</strong>. For a precise calculation of ideal options, use the <a href="https://browndust2-db.souseha.com/" target="_blank" rel="noopener">Souseha calculator</a>.</p>
</div></section>

<h3 id="s11-1">Daily energies</h3>

<li><strong>Torches</strong>: 60 a day. They're for Magic Crystal Cave (elemental crystals).</li>
<li><strong>Blood Cocktails</strong>: refill every day; they're for Mirror Wars PvP.</li>

<h3 id="s11-2">Golden Thread shop: priority order</h3>

<h3 id="s11-3">Crafting materials to farm</h3>

<section class="chapter" id="s12" data-title="Gacha: banners and spending"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg><b>12</b></span><h2>Gacha: banners and spending</h2></header><div class="ch-body">
<p>The gacha is only for two things: costumes and exclusive gear. A pull costs about 200 Dia and you can go without it for a long time thanks to free tickets. Some details below come from 2023 and 2024 guides: double-check them on the banner screen.</p>
<h3 id="s12-1">Banners</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Banner</th>
<th>Content</th>
<th>Advice</th>
</tr>
</thead>
<tbody>
<tr>
<td>Integrated Draw</td>
<td>Standard banner: costumes and gear</td>
<td>The early Infinite Draw pulls from it</td>
</tr>
<tr>
<td>Featured</td>
<td>A featured costume or gear piece, with a rate-up</td>
<td>Best value; 1 free pull a day</td>
</tr>
<tr>
<td>Select / 12-Pick</td>
<td>You pick several targeted costumes</td>
<td>Best option for a beginner per the compendium: put supports in it (list in the FAQ)</td>
</tr>
<tr>
<td>Weapon banner</td>
<td>Exclusive gear only</td>
<td>Less worth it than costumes; risk of useless dupes</td>
</tr>
</tbody>
</table></div>
<p>Base rates quoted by a 2023 guide are 3% for a 5★, 14% for a 4★ and 83% for a 3★.</p>
<h3 id="s12-2">Good to know</h3>
<ul>
<li><strong>Costume = character.</strong> Pulling a costume of a character you don't own gives you the character.</li>
<li><strong>Dupes.</strong> Each dupe raises the costume's skill, up to +5. Past +5, a dupe turns into <button class="term" data-tip="Earned from dupes past +5; points shop" type="button">Golden Thread</button>.</li>
<li><strong>Banner bonus.</strong> When you get the featured costume on its banner, you get 10 tickets back through the "Pickup" event; that's not the case on the Select banner.</li>
<li><strong>Draw points.</strong> On limited banners, your pulls build up points you can exchange for the featured costume (200 points per a 2023 guide). They don't carry over between banners and turn into <button class="term" data-tip="Earned on every draw; points shop" type="button">Powder of Hope</button> at the end.</li>
</ul>
<h3 id="s12-3">How to spend</h3>
<ol>
<li>Do your free pull every day.</li>
<li>Always keep 1,000 Dia for next season's premium pass.</li>
<li>Only pull for a character or costume you really want, ideally on its featured banner.</li>
<li>Aim first for support or damage costumes that fit your current team, rather than stacking them at random.</li>
</ol>
<h3 id="s12-4">Gacha in detail</h3>
<ul>
<li><strong>Cost</strong>: 1 <button class="term" data-tip="Regular draw ticket" type="button">Draw Ticket</button> or 200 free Dia per pull, 2,000 Dia for 10. Usage order: Selective Exclusive Draw Ticket, then Draw Ticket, then free Dia, then paid Dia.</li>
<li><strong>Rates</strong>: 3% ★5 on a costume banner, including 1.5% for the featured costume. Rates never ramp up gradually.</li>
<li><strong>100-pull pity</strong>: with no ★5 for 100 pulls, the 100th is a guaranteed ★5, 50/50 between featured and off-banner. The counter is shared between banners of the same type. Tip: bring it to 99 with free pulls, then do the 100th on the banner you want.</li>
<li><strong>200-point exchange</strong>: each pull on a banner gives 1 point. At 200, you exchange for the featured costume. Leftover points become <strong>Powder of Hope</strong> (1 for 1) when the banner ends.</li>
<li><strong>Daily free pull</strong> on every active banner: "Bulk Free Draw" button.</li>
<li>Non-limited costumes usually land in the <strong>Powder of Hope shop</strong> after their banner (200 Powder per copy): no need to burn tickets for the last copy.</li>
<li><strong>Exclusive gear</strong>: don't pull for it, a single copy is enough for the whole game.</li>
<li><strong>Paid banners, all optional</strong>: Newbie Welcome (14 days, 6,000 paid Dia; if you take it, pick Diana, B-Rank Idol Helena and Homunculus Lathel), Paid Infinite Draw and 12-Pick Golden Hand (about $17 each), Step-Up (5,000 paid Dia).</li>
<li><strong>Ticket rule</strong>: Selective Exclusive (purple) for the 12-Pick banner, Draw Tickets (red) for normal banners, Dia like red tickets, but always keep <strong>1,000 Dia</strong> for the season pass.</li>
<li>To know which banner to pull on right now, the compendium points to <a href="https://zormolo.github.io/BD2-Banner-Recommendation/" target="_blank" rel="noopener">BD2 Banner Recommendation</a>.</li>
</ul>
</div></section>
<section class="chapter" id="s13" data-title="Game modes"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V9l3-2v3l4-3 4 3V7l3 2v12z"/><path d="M10 21v-4h4v4"/></svg><b>13</b></span><h2>Game modes</h2></header><div class="ch-body">
<p>Push the story: it unlocks most modes (Evil Castle, Mirror Wars, Path of Adventure, Last Night). Even as a beginner, join the seasonal modes: just taking part gives rewards that speed up your progression.</p>

</tr>
<tr>

<td>Seasonal tower</td>

</tr>

</tr>

<tr>
<td>Tower of Salvation</td>

<td>Covered in step 6 of the walkthrough</td>
</tr>
</tbody>
</table></div>
<p>Guild Raid, Golden Colosseum, The Soul Wager and Taros Tactical Manual are covered below, in "Other modes in detail", and the Tower of Salvation in step 6 of the walkthrough.</p>
<h3 id="s13-1">Mirror Wars (PvP)</h3>
<p>Fights cost Blood Cocktails, and medals depend on the opponent's rank. Every month, the shop offers a 5★ costume; if you do your dailies, 18,000 medals a month are within reach. If you're aiming high, use your stocked cocktails right before the Sunday 15:00 UTC lock (16:00 in Belgium in winter).</p>
<h3 id="s13-2">Last Night</h3>
<p>Deal at least 10,000 damage there once: Isaac then brings you rewards and resources every day, as long as you go talk to him on the map. Later, to push for a max score, you need to gear all your characters with good pieces.</p>
<h3 id="s13-3">Monthly shops</h3>
<p>The <button class="term" data-tip="Earned from dupes past +5; points shop" type="button">Golden Thread</button> and Mirror Wars shops offer 5★ costumes that change every month. Check them before spending your medals or Golden Thread.</p>
<h3 id="s13-4">Other modes in detail (compendium)</h3>
<p>Modes already covered in the walkthrough: Path of Adventure and Mirror Wars (step 5), Evil Castle and its towers (step 6), Season Events and Fiend Hunter (step 8), Last Night (step 9). Here are the others.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Mode</th>
<th>Unlock</th>
<th>Frequency</th>
<th>What it gives</th>
</tr>
</thead>
<tbody>
<tr>
<td>Golden Colosseum</td>
<td>Story Pack 6 (Pagan Tower)</td>
<td>Every week</td>
<td>Aurum Coins for its shop</td>
</tr>
<tr>
<td>Guild Raid</td>
<td>Join a guild</td>
<td>1 week every 4 weeks</td>
<td>Mercenary Alliance Deeds, Dia</td>
</tr>
<tr>
<td>The Soul Wager</td>

<td>8-week season</td>

</tr>
<tr>

</tr>
<tr>

<td>Every day</td>

</tr>
</tbody>
