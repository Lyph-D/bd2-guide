<h4>Golden Colosseum (PvP automatique)</h4>
<ul>
<li>Une saison par semaine, clôture le mercredi à 15:00 UTC. 100 tentatives par semaine (jusqu'à 400 avec 3 recharges à 10 Dia).</li>
<li><strong>Pas d'équipement</strong> : seuls comptent les doublons des costumes, le Potentiel, l'Awakening et le Burst. Tu composes une équipe de costumes (pas de persos) avec un coût total maximum, plus des <strong>Blessings</strong> (bonus) pour quand tu joues en premier et en second.</li>
<li>Les règles tournent toutes les 2 saisons : taille de la grille, nombre de membres, costumes bannis. Pas de SP ni de recharges. Au tour 5, les compétences se coupent.</li>
<li>Seule l'attaque compte pour tes points. Utilise <strong>Repeat Battle</strong> pour gagner du temps.</li>
<li><strong>Missions</strong> : 40 combats donnent 900 Aurum Coins au total. Si tu es pressé, fais au moins 10 combats par semaine.</li>
<li><strong>Conseil</strong> : copie les équipes de joueurs connus (YouTube : GemMog, VioletRose, pennyosa) en choisissant celles qui utilisent tes costumes les plus améliorés.</li>
<li><strong>Boutique, priorité débutant</strong> : 2 Property Selective Draw Exchange Tickets (2 000), 65 Sparks of Rampage (520), 10 Draw Tickets (2 000), 1 000 Refining Crystals (2 000), puis 50 Ancient Crystals avec le reste.</li>
</ul>
<h4>Guild Raid</h4>
<ul>
<li>Une semaine toutes les 4 semaines (semaine 1 du cycle). Un boss à 15 niveaux sur une grille 5×5, avec une équipe de <strong>7 personnages</strong>. Seul ton meilleur passage compte, sans limite d'essais.</li>
<li>Tu peux emprunter jusqu'à 2 persos à ta guilde (3 emprunts par jour, consommés seulement en cas de victoire), au prix d'un léger malus de score.</li>
<li><strong>Lancelot</strong>, allié propre au raid, se charge en infligeant des dégâts puis reste 6 tours. Ses compétences gratuites : mettre le boss en Break, frapper 9 fois pour les Chains, ou rendre 25 SP et réinitialiser les recharges.</li>
<li>Teste tes rotations en <strong>Practice Battle</strong> : c'est gratuit et le Burst y est débloqué au maximum.</li>
<li>Les Deeds achètent la boutique de guilde : <button class="term" data-tip="Larme de la déesse — Très rare, débloque le potentiel de compétence" type="button">Tear of the Goddess</button> (2 000), Sparks, 10 Draw Tickets, Awakening Elixirs, Essences.</li>
</ul>
<h4>The Soul Wager</h4>
<p>Un auto-battler de gestion d'inventaire. Tu achètes des cases, des unités et de l'équipement dans une boutique, tu les places sur une grille 7×7, puis le combat se joue seul. Chaque plateau contient plusieurs phases ; 5 défaites sur un plateau le remettent à zéro. Finis tous les plateaux de la saison pour acheter toute la boutique d'Alea Chips : Tear of the Goddess, <button class="term" data-tip="Poudre / Cristal / Pierre de raffinage — Relancer les lettres de l'équipement" type="button">Refining Powder</button>, or, cristaux de magie, contrats ★5 et ★4.</p>
<h4>Taros Tactical Manual</h4>
<p>Des énigmes tactiques avec des persos imposés, sur une grille de 9 à 25 combats. Aucun besoin de progression : parfait pour un débutant qui veut apprendre. Les missions donnent jusqu'à 2 millions d'or, 300 000 Refining Powder et 40 Sparks of Rampage par saison. Essaie seul d'abord ; sinon, vidéos de Seji ou Shimonami.</p>
<h4>Rapport</h4>
<ul>
<li><strong>3 discussions par jour</strong> au total, sur des costumes que tu possèdes (une par costume). La bonne réponse donne 100 XP, l'autre 80 XP. Reset à 15:00 UTC.</li>
<li>Monter le Rapport débloque l'histoire du costume et fait monter le <strong>Rapport Buff</strong> : un bonus <strong>permanent de taux de critique</strong> pour tout le compte, jusqu'à 50 % avec 10 costumes au maximum.</li>
<li>Le niveau max d'un costume dépend de son avancée : 10 à l'obtention, 15 après Awakening, 20 après le Potentiel.</li>
<li>Les cadeaux (boissons) donnent de l'XP : 40 pour la boisson préférée, 20 sinon, 150 pour la Special Drink. Ne les achète pas au début : plus tard, la boutique Golden Thread convient, après les achats prioritaires.</li>
</ul>
</div></section>
<section class="chapter" id="s14" data-title="Vie annexe : Fantasia Square, Territory, pêche"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z"/><path d="M12 8v6"/><path d="M9.5 11.5L12 14l2.5-2.5"/></svg><b>14</b></span><h2>Vie annexe : Fantasia Square, Territory, pêche</h2></header><div class="ch-body">
<p>Ces modes sont détendus et presque sans impact sur la progression. Le Glupy Diner est détaillé à l'étape 10.</p>
<h3 id="s14-1">Fantasia Square</h3>
<p>C'est la place centrale, accessible comme un pack. Tu y trouves la <strong>statue de la Déesse</strong> : interagis avec elle pour prier chaque jour (routine quotidienne). Tu y vois aussi les statues des champions du Mirror Wars à visiter chaque semaine.</p>
<h3 id="s14-2">Territory</h3>
<p>Un mode de gestion de village, en bas de l'escalier de Fantasia Square. Il <strong>n'influence pas</strong> ta progression : vois-le comme un passe-temps.</p>
<ul>
<li><strong>Bûcheronnage</strong> : abats seulement les arbres au 3e stade (5 minutes de pousse), ils donnent le plus de bois et d'XP.</li>
<li><strong>Mine</strong> : la carrière fait apparaître un filon par minute (jusqu'à 9) : pierre, cuivre, fer, argent ou or.</li>
<li><strong>Agriculture</strong> : la source des <strong>Local Points</strong>, la monnaie du Territory. Achète des graines, récolte, cuisine et vends les plats. Les cultures vont de la pomme de terre (1 minute) au safran (20 heures).</li>
<li><strong>Conseil</strong> : investis d'abord dans l'agriculture, et améliore la hache et la pioche pour récolter plus et débloquer les décorations.</li>
<li>Les aides du Territory produisent aussi pendant ton absence : récupère leurs gains via <strong>Business Management</strong> sur l'accueil.</li>
</ul>
<h3 id="s14-3">Fishing Voyage</h3>
<p>La pêche rapporte des Lucky Silver Coins. Une fois assez avancé, tu peux vider sa boutique chaque mois : 10 Gold Pockets, 30 <button class="term" data-tip="Poudre / Cristal / Pierre de raffinage — Relancer les lettres de l'équipement" type="button">Refining Powder</button>, puis 450 Deco Coins.</p>
</div></section>
<section class="chapter" id="s15" data-title="Quand tu bloques"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M6.3 6.3l3.2 3.2M17.7 6.3l-3.2 3.2M6.3 17.7l3.2-3.2M17.7 17.7l-3.2-3.2"/></svg><b>15</b></span><h2>Quand tu bloques</h2></header><div class="ch-body">
<p>Si tu butes sur un combat après avoir monté tes persos et ton équipement, identifie ton problème : pas assez de dégâts, trop de morts, ou pas assez de zone. Chaque cas a ses réflexes.</p>
<h3 id="s15-1">Pas assez de dégâts</h3>
<ol>
<li>Cumule les soutiens : les buffs offensifs de compétences différentes se cumulent. Arines avec Kind Student Samay donne par exemple +120 % d'ATK et 30 % de critique.</li>
<li>Monte des équipements à dégâts critiques : ils pèsent plus que l'ATK. En histoire, tu peux te contenter d'un faible taux de critique, puisque tu peux recommencer.</li>
<li>Joue l'élément fort : +50 % de dégâts de base. L'élément faible réduit tes dégâts (la valeur exacte s'affiche dans l'écran de stats, et tu peux voir celles des ennemis en plein combat). Regarde aussi le bonus élémentaire de la saison.</li>
<li>Regarde la DEF et la <button class="term" data-tip="Défense / Résistance magique — Réduit les dégâts physiques / magiques" type="button">M.RES</button> de l'ennemi. Si elles sont hautes, baisse-les (Kry en Marauder, Elise) ou joue des dégâts fixes (Justia, Alec).</li>
</ol>
<h3 id="s15-2">Tes persos meurent trop vite</h3>
<ol>
<li>Lis toujours les prochaines attaques ennemies et place tes persos pour éviter les zones. Tu peux tout repositionner avant chaque tour.</li>
<li>Tue plus vite : plus d'ennemis morts au premier tour, moins de coups reçus.</li>
<li>Si tu ne peux pas tout tuer, élimine d'abord ceux qui frappent le plus fort.</li>
<li>Utilise un tank avec provocation. Andrew (4★, Specialist) est recommandé : facile à obtenir, il provoque et peut esquiver pour annuler les dégâts.</li>
<li>Sacrifie un perso secondaire si une attaque énorme est inévitable.</li>
</ol>
<h3 id="s15-3">Tu n'atteins pas tous les ennemis</h3>
<p>Traite chaque combat comme un puzzle : trouve la formation et l'ordre des compétences qui touchent un maximum d'ennemis dès le premier tour. Le repoussement est la clé : il aligne les ennemis avant ta zone.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Direction du repoussement</th>
<th>Persos</th>
</tr>
</thead>
<tbody>
<tr>
<td>Vers l'avant</td>
<td>La plupart</td>
</tr>
<tr>
<td>Avant gauche</td>
<td>Lathel, Beatrice</td>
</tr>
<tr>
<td>Avant droite</td>
<td>Layla, Rubia</td>
</tr>
<tr>
<td>Gauche</td>
<td>Emma, Ventana</td>
</tr>
<tr>
<td>Droite</td>
<td>Angelica</td>
</tr>
<tr>
<td>Vers toi (attire)</td>
<td>Dalvi</td>
</tr>
</tbody>
</table></div>
<p>Le repoussement d'Arines vise la position "Skip" (il saute le premier ennemi) et recule la cible d'une case. Le repoussement de Violent Student Kry recule deux ennemis de deux cases et inflige de lourds dégâts à tout ennemi percuté.</p>
<h3 id="s15-4">Persos blessés ou morts dans un pack</h3>
<p>Fuis et soigne-toi. Les pots de soin se cassent avec le dash, et chaque pack a une auberge qui soigne et ressuscite tes persos : cherche-la sur la mini-carte. Dans les packs de persos en difficulté Normal, tu es forcé d'utiliser une équipe fixe : c'est un puzzle, et des vidéos de solutions existent si tu bloques.</p>
</div></section>
<section class="chapter" id="s16" data-title="FAQ"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M9.6 9.5a2.5 2.5 0 0 1 4.8.8c0 1.7-2.4 2.2-2.4 3.7"/><circle cx="12" cy="17" r=".6"/></svg><b>16</b></span><h2>FAQ</h2></header><div class="ch-body">
<h3 id="s16-1">Gacha et personnages</h3>
<p><strong>Y a-t-il une tier list ?</strong> Pas de fiable : on change de persos selon le contenu. Une seule règle tient toujours : les <strong>supports passent avant les DPS</strong>, parce que tu les utilises partout.</p>
<p><strong>Comment obtenir un personnage ?</strong> Un costume est une compétence du personnage. Ton premier costume d'un perso débloque automatiquement le perso : on ne tire jamais « le perso » lui-même.</p>
<p><strong>1-Pick ou 12-Pick ?</strong> Pour un débutant, la bannière <strong>12-Pick</strong> est objectivement meilleure. Mets-y des supports, par exemple : Queen of Gluttis Granadair, Shrine Maiden of Purification Granadair, Water Park Queen Wilhelmina, Homunculus Lathel, Dark Saintess Liberta, Onsen Manager Liberta, Adventurer of the Unknown Diana, Magical Innovator Diana, Robin Hood Zenith, B-Rank Idol Helena, Pure White Blessing Refithea, Poolside Fairy Refithea. Retire chacun quand il atteint son palier (souvent +5) ; pour Liberta, Diana et Granadair (Queen of Gluttis), arrête à +4 tant que tu ne les as pas recrutées.</p>
<p><strong>Les Property Tickets ?</strong> Ils donnent un ★5 aléatoire de l'élément choisi. Au début, presque tout élément est bon ; tu peux viser la <span class="el el-light">Lumière</span> jusqu'à avoir une bonne Refithea.</p>
<p><strong>Plus de tickets et de Dia ?</strong> Codes coupons, Evil Castle, Character Packs, Event Packs, coffres des zones de combat, Fiend Hunter, boutiques d'événement et de guilde, passes, succès… et simplement jouer.</p>
<p><strong>Qui recruter à la taverne ?</strong> D'abord les supports : Diana (Story Pack 10), Dark Saintess Liberta (Story Pack 15), Queen of Gluttis Granadair (apparition aléatoire). Ensuite : tout costume de la taverne qui a une bannière active, Night of Death Mamonir, Fiend Scholar Olstein (Story Pack 4, si tu n'as rien d'autre), Shattered Dream Palette (Story Pack 20), The Gluttonous Refithea, The Curse Celia.</p>
<h3 id="s16-2">Combat</h3>
<p><strong>Comment marchent les éléments ?</strong> <span class="el el-water">Eau</span> &gt; <span class="el el-fire">Feu</span> &gt; <span class="el el-wind">Vent</span> &gt; <span class="el el-water">Eau</span>. <span class="el el-light">Lumière</span> et <span class="el el-dark">Ténèbres</span> font chacune plus de dégâts à l'autre. Le Neutre ne prend ni plus ni moins de dégâts.</p>
<p><strong>C'est quoi une bonne équipe ?</strong> Un seul type de dégâts (physique ou magique), 2 à 3 supports plus des DPS, les supports avant les DPS dans l'ordre, pas de buff d'élément s'il ne sert à rien, des types de buffs variés, assez de SP pour tout lancer au tour 1, une victoire visée au tour 1 (au pire au tour 3), et ton meilleur équipement.</p>
<p><strong>Bloqué sur un boss ?</strong> Contre un boss seul : équipe physique avec Zenith et Ventana (empruntée à un ami) en DPS. Contre un boss avec des sbires : Sacred Justia ou Bunny Loen empruntés.</p>
<p><strong>Pas de monstres dans le Hunting Ground ?</strong> C'est un bug lié à une quête principale ou de PNJ active : abandonne-la.</p>
<h3 id="s16-3">Progression</h3>
<p><strong>Qui monter en premier ?</strong> Le niveau : tes DPS (avec les Slimes). Le Potentiel : les supports. L'équipement : les DPS. Engraving et Awakening : trop chers au début, garde tes ressources (si une tâche du Guide Pass l'exige, Nebris est un bon choix). Le Burst : plutôt les supports.</p>
<h3 id="s16-4">Technique</h3>
<ul>
<li><strong>Jouer sur PC</strong> : un client PC officiel existe (lien dans la FAQ du compendium).</li>
<li><strong>Persos tout noirs ?</strong> Désactive le Silhouette Mode : Settings, Graphics, Silhouette Mode, Disable.</li>
<li><strong>Montrer tes costumes pour demander conseil</strong> : dans Last Night, Replace, Replace, Reset, Confirm, puis trie par « Deployed First » et fais une capture.</li>
</ul>
</div></section>
<section class="chapter" id="s17" data-title="Erreurs à éviter, checklist et sources"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4"/><path d="M6 4h11l-2 4 2 4H6"/></svg><b>17</b></span><h2>Erreurs à éviter, checklist et sources</h2></header><div class="ch-body">
<p>Les erreurs de débutant les plus coûteuses touchent aux ressources rares et aux tirages. Voici celles à éviter, puis une checklist pour tes premiers jours.</p>
<h3 id="s17-1">Erreurs fréquentes</h3>
<ul>
<li>Valider un Tirage infini sans avoir comparé : il n'y a pas de retour.</li>
<li>Recruter des persos 3★ ou 4★ en taverne, au lieu de garder les contrats pour les 5★.</li>
<li>Oublier le passe premium : garde toujours 1000 dias de côté.</li>
<li>Dépenser Fils d'or, Poudre d'espoir ou Larmes de la déesse sans suivre les priorités de la section 11.</li>
<li>Monter des tanks (Lecliss, Seir) trop tôt.</li>
<li>Raffiner des équipements que tu remplaceras bientôt.</li>
<li>Lancer plusieurs modes Hard ou Very Hard en même temps : tu bloques tes quêtes quotidiennes.</li>
<li>Négliger l'or : tu en manqueras en fin de jeu.</li>
<li>Ne pas lier ton compte.</li>
</ul>
<h3 id="s17-2">Checklist des premiers jours</h3>
<div class="checklist" data-cad="none" data-prio="high" data-role="" data-scope="Checklist des premiers jours"><div class="cl-bar"><span aria-live="polite" class="cl-count"></span><div class="cl-track"><span class="cl-fill"></span></div><button class="cl-reset" type="button">Tout décocher</button></div><ul class="tasks"><li class="task"><label><input class="tick" data-k="63ed304d0f" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir le tutoriel et choisir ta cible dans le Tirage infini (The Curse Celia).</span></label></li><li class="task"><label><input class="tick" data-k="d7a217ac10" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Lier ton compte (ETC, puis Link Account).</span></label></li><li class="task"><label><input class="tick" data-k="f2724c97a1" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Faire les quêtes du Newbie Pass chaque jour pendant 7 jours.</span></label></li><li class="task"><label><input class="tick" data-k="1daac512a6" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir le troisième pack d'histoire pour débloquer le Path of Adventure.</span></label></li><li class="task"><label><input class="tick" data-k="c674542b21" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Recruter Diana (Story Pack 10) puis Liberta (Story Pack 15).</span></label></li><li class="task"><label><input class="tick" data-k="53a3c69ffb" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Monter Gear Craft (Layla ou Fred) et Alchemy (Scheherazade).</span></label></li><li class="task"><label><input class="tick" data-k="6f4d6289c5" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Faire au moins 10 000 de dégâts dans Last Night, puis parler à Isaac chaque jour.</span></label></li><li class="task"><label><input class="tick" data-k="19f622473e" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Acheter le passe premium (1000 dias) à chaque saison.</span></label></li><li class="task"><label><input class="tick" data-k="3931c1ffe9" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Participer à Mirror Wars et Evil Castle chaque saison.</span></label></li></ul></div>
<h3 id="s17-3">Fraîcheur des informations</h3>
<p>Je n'ai pas pu vérifier chaque chiffre dans le jeu. Le compendium de BotAn (octobre 2026) et la checklist Discord ont servi à corriger les points dépassés ; les guides de base datent de 2023 à 2025 (le reroll de dotgg date d'avril 2025, les routines de septembre 2024), et un classement de juin 2026 donne les persos du moment. Certaines valeurs ont pu changer : ressources par jour (40, puis 60, puis 90 riz cuits selon l'âge des sources), points de tirage, taux. En cas de doute, fie-toi à l'écran du jeu. Plusieurs points ont depuis été confirmés par des joueurs du Discord officiel (novembre 2026).</p>
<span id="a-verifier" class="anchor"></span><h3 id="s17-4">À vérifier en jeu</h3>
<p>Ces points ne sont confirmés que par une seule source, ou les sources ne sont pas d'accord : il faut encore les vérifier en jeu. Si tu le fais, envoie-moi ce que tu vois (Lyph, sur le Discord officiel) : je mettrai le guide à jour.</p>
<div class="checklist" data-cad="none" data-prio="high" data-role="verify" data-scope="À vérifier en jeu"><div class="cl-bar"><span aria-live="polite" class="cl-count"></span><div class="cl-track"><span class="cl-fill"></span></div><button class="cl-reset" type="button">Tout décocher</button></div><ul class="tasks"><li class="task"><label><input class="tick" data-k="4717e08921" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Death Time</strong> : les chiffres (+100 % d'ATK, −100 % de défense, +50 % de dégâts reçus). Fais durer un combat facile jusqu'au tour 11, puis touche l'icône Death Time en haut à gauche.</span></label></li><li class="task"><label><input class="tick" data-k="eab486ebab" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Reset hebdomadaire</strong> : le mercredi à 15:00 UTC (16:00 en Belgique) pour les missions hebdo, comme le guide le suppose. Regarde quand ta barre hebdo se vide.</span></label></li></ul></div>

      <section class="chapter" id="s1" data-title="Game terms and slang"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h7a3 3 0 0 1 3 3v11a2 2 0 0 0-2-2H4z"/><path d="M20 5h-4a2 2 0 0 0-2 2"/><path d="M20 5v12h-6"/></svg><b>01</b></span><h2>Game terms and slang</h2></header><div class="ch-body">
<p>These tables explain the terms you see everywhere in the menus, plus the slang players use on Discord and in community guides.</p>
<h3 id="s1-1">Menus and system</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Term</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td>Pack / Story Pack</td>
<td>Each story is a game "cartridge" with its own map</td>
</tr>
<tr>
<td>Safe zone / Peace zone</td>
<td>No fights here; auto-hunt can be started from it</td>
</tr>
<tr>
<td>Mission / Daily Mission</td>
<td>Rewards every day, activity bar at the top</td>
</tr>
<tr>
<td>Pass</td>
<td>Newbie Pass (7 days) and Season Pass</td>
</tr>
<tr>
<td>Achievement</td>
<td>Gives Dia and gold based on your achievement level</td>
</tr>
<tr>
<td>Mailbox</td>
<td>Login and event rewards</td>
</tr>
<tr>
<td>Collection</td>
<td>Passive bonuses for your whole roster</td>
</tr>
<tr>
<td>Link Account</td>
<td>In the "ETC" menu; protects your progress</td>
</tr>
<tr>
<td>Draw / Summon</td>
<td>The gacha</td>
</tr>
<tr>
<td>Infinite Draw</td>
<td>Unlimited reroll at the start, no account reset needed</td>
</tr>
<tr>
<td>Costume</td>
<td>A character's "version"; each costume gives its own skill</td>
</tr>
<tr>
<td>Pub</td>
<td>Recruit characters with contracts</td>
</tr>
<tr>
<td>Bulletin Board</td>
<td>Small quests that pay gold</td>
</tr>
<tr>
<td>Dispatch</td>
<td>Free daily rewards (Olstein, Diana)</td>
</tr>
<tr>
<td>Elin</td>
<td>The NPC who unlocks Hard and Very Hard modes</td>
</tr>
</tbody>
</table></div>
<h3 id="s1-2">Combat and stats</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Term</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td>Normal Attack</td>
<td>Default action, generates 1 SP</td>
</tr>
<tr>
<td>Knockback</td>

</tr>
<tr>
<td>Skill</td>
<td>Costs SP and has a cooldown</td>
</tr>
<tr>
<td>SP (Skill Points)</td>
<td>Shared by the whole team</td>
</tr>
<tr>
<td>Cooldown (CD)</td>
<td>Counted in turns</td>
</tr>
<tr>
<td>AOE</td>
<td>The tiles hit around the target</td>
</tr>
<tr>
<td>Chain</td>
<td>Every hit on the same target in a turn raises the damage of the next hits</td>
</tr>
<tr>
<td>Death Time</td>
<td>Fight runs too long: everyone hits harder</td>
</tr>
<tr>
<td>Taunt</td>
<td>Forces enemies to target you</td>
</tr>
<tr>
<td>Buff / Debuff</td>

</tr>

</tr>
<tr>
<td>Dispel</td>
<td>Removes enemy buffs</td>
</tr>
<tr>

</tbody>
</table></div>

<td>UREX, Signa</td>
<td>UR Exclusive Gear</td>
<td>A character's exclusive gear</td>
</tr>
</tbody>
</table></div>
</div></section>
<section class="chapter" id="s2" data-title="Understanding the game"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><b>02</b></span><h2>Understanding the game</h2></header><div class="ch-body">
<p>Brown Dust 2 is a turn-based tactical RPG by Neowiz where every story is a "pack", like a game cartridge inside the game. Fights are not auto-played: they ask you to think, like a small puzzle.</p>
<ul>
<li><strong>Two interfaces.</strong> The "game" interface (map, characters, inventory, formation) and the main interface (missions, draws, events, settings). The house icon at the top right switches between them; the arrow left of your name takes you back to the game.</li>
<li><strong>Story in packs.</strong> Finishing a pack's story unlocks modes (Evil Castle, Mirror Wars, Path of Adventure) and gives you 5-star characters. The Path of Adventure pack opens after the third story pack.</li>
<li><strong>Characters and costumes.</strong> A character has several costumes; each costume brings a skill. Pulling a costume of a character you don't own gives you the character. There is no "base" form to own first.</li>
<li><strong>Field abilities.</strong> Each character can have an ability on the map (find treasure, craft gear, cook). It uses Ability Pills, even if the character isn't in your active team.</li>
<li><strong>Puzzles.</strong> If you're stuck on a story puzzle, tap the "+" on the quest description: it often holds a hint.</li>
<li><strong>Explore after the quest.</strong> Once the main quest is done, the map shows how many finds are left. Use Lathel's Search ability to reveal the hidden ones (they glow green).</li>
</ul>
</div></section>
<section class="chapter" id="s3" data-title="Reroll and Infinite Draw"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/></svg><b>03</b></span><h2>Reroll and Infinite Draw</h2></header><div class="ch-body">
<p>No need to remake your account: the Infinite Draw lets you reroll a 10-pull as many times as you like until you get the character you want. One trap: once you confirm the result, there is no going back.</p>
<ol>
<li>Play the tutorial and the story until Elin shows you the draw system.</li>
<li>Open the Infinite Draw tab and reroll until you get your target.</li>
<li>Only confirm when you're happy with the result.</li>
<li>Link your account (ETC menu, then <button class="term" data-tip='In the "ETC" menu; protects your progress' type="button">Link Account</button>) to secure your progress.</li>
</ol>
<p>Each Infinite Draw 10-pull guarantees one 5★ costume, and only one 5★ is possible. Gear there can't be UR 5★ (at best an SR 5★ exclusive): don't reroll for gear.</p>
<h3 id="s3-1">What to aim for (compendium, October 2026)</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Costume</th>
<th>Profile</th>
<th>Verdict</th>
</tr>
</thead>
<tbody>
<tr>
<td>The Curse Celia</td>
<td>Support that hits many times (Chains), mostly useful later, especially in Last Night</td>
<td><strong>The recommended pick</strong></td>
</tr>
<tr>
<td>Gentle Maid Anastasia</td>
<td>Good physical DPS</td>
<td>A possible alternative, but supports come first</td>
</tr>
<tr>
<td>Top Idol Helena</td>
<td>Defensive and utility support</td>
<td>Alternative, lower priority than an offensive support</td>
</tr>
<tr>
<td>Eleaneer (Piercing Magic Bow), Scheherazade (The Lapis Witch)</td>
<td>PvP-oriented picks</td>
<td>Not recommended, the game is mostly PvE</td>
</tr>
</tbody>
</table></div>
<p>Don't panic if you already confirmed something else: this pick doesn't make or break an account, and you'll get other copies over time. Then pick physical or magic for your team: for a beginner, physical is easier, because Arines (free) strongly buffs physical attackers.</p>
<h3 id="s3-2">What about the best characters right now?</h3>
<p>A June 2026 ranking puts Morpeah on top, followed by Apostle Blade and Dark Saintess Liberta, an essential support for a physical team. No need to reroll for them: Apostle Morpeah is recruited at the Story Pack 17 pub, and Blade and Liberta at the pub after Story Pack 15.</p>
<h3 id="s3-3">True reroll (optional)</h3>
<p>Only worth it if you want dupes of a banner character. You need a guest account, collect every free Dia and ticket (about 40 to 50 tickets), then pull on the banner. If those starting pulls give you +2, keep the account; otherwise, start over. For a first account, skip this.</p>
</div></section>
<section class="chapter" id="s4" data-title="First team and free characters"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/></svg><b>04</b></span><h2>First team and free characters</h2></header><div class="ch-body">
<p>Build a physical team around three free units: Arines, Wiggle and Kry. They'll carry you through most of the story, no lucky pulls needed.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Character</th>
<th>Role</th>
<th>Why</th>
</tr>
</thead>
<tbody>
<tr>
<td>Arines (3★, free)</td>
<td>Physical support</td>
<td>+70% ATK and +30% crit for physical attackers (no effect on magic)</td>
</tr>
<tr>
<td>Wiggle (3★, free)</td>
<td>Attacker</td>
<td>"+" shaped area and huge damage with his self-destruct</td>
</tr>
<tr>
<td>Kry (4★, free)</td>
<td>Attacker</td>
<td>"X" shaped area; his Marauder costume lowers enemy defense</td>
</tr>
<tr>
<td>2 open slots</td>
<td>Area attackers</td>
<td>Whatever you pulled: Justia, Gray, Lathel or Liatris work</td>
</tr>
</tbody>
</table></div>
<p>To check whether a character is physical or magic, open their stats: ATK with a sword means physical, <button class="term" data-tip="Physical / magic attack; check the character sheet to see which one it uses" type="button">M.ATK</button> with a staff means magic.</p>
<h3 id="s4-1">Simple rules</h3>
<ul>
<li>Favor area (AOE) attackers for the story. Don't level tanks (Lecliss, Seir) for now: you'll only need them much later.</li>
<li>If you don't have Kry, Layla (4★, easy to get) is a good "X" area replacement.</li>
<li>Buffs of different types multiply, buffs of the same type add up. So combine varied buffs rather than the same one twice. Arines and Kind Student Samay together give +120% ATK and 30% crit.</li>
<li>In hard content, the usual formation is 3 supports/buffers, 1 utility support or attacker (knockback, DEF down, SP recharge) and 1 attacker.</li>
</ul>
<h3 id="s4-2">Who to recruit at the Pub</h3>
<ul>
<li><strong>Diana</strong> (Story Pack 10 pub): essential support (element and crit bonus) with a Dispatch ability. Top priority, see step 4.</li>
<li><strong>Dark Saintess Liberta</strong> (Story Pack 15 pub): the core of every physical team, see step 12.</li>
<li><strong>Queen of Gluttis Granadair</strong> (random appearance): grab her as soon as she shows up.</li>
<li><strong>Olstein</strong> (Story Pack 4 pub): weak in combat, his Dispatch brings a little every day. Only if you have nothing better to recruit.</li>
<li>Don't recruit 3★ and 4★ characters: you'll easily get their costumes from draws. Save your contracts for 5★.</li>
</ul>
<h3 id="s4-3">Recommended starter teams (compendium, 2026)</h3>
<p>There's no universal team: it all depends on the enemies. The compendium recommends 1 to 3 DPS, the rest supports (3 supports + 2 DPS for simple fights), and a single damage type. ATK buffers (Arines, Homunculus Lathel) only buff physical, MATK buffers (B-Rank Idol Helena, Elpis) only magic; Kind Student Samay and Diana buff both. Put your DPS in the middle of the grid.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Slot</th>
<th>AoE team (many enemies, magic)</th>
<th>Single-target team (lone boss, physical)</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>B-Rank Idol Helena (selective ticket)</td>
<td>Priest of Vitality Arines, or Dark Saintess Liberta at +2 and up</td>
</tr>
<tr>
<td>2</td>
<td>Hand of Salvation Elpis (gacha)</td>
<td>Homunculus Lathel (selective ticket), or Liberta</td>
</tr>
<tr>
<td>3</td>
<td>Kind Student Samay (gacha); otherwise Queen of Gluttis Granadair, or Diana against <span class="el el-light">Light</span> and <span class="el el-water">Water</span></td>
<td>Robin Hood Zenith (ticket), or Little Hunter Rigenette, or Apostle Morpeah (Story Pack 17 pub)</td>
</tr>
<tr>
<td>4</td>
<td>Dream Bride Eclipse (Events tab, free)</td>
<td>Kind Student Samay; otherwise Diana against <span class="el el-dark">Dark</span>, The Curse Celia, Frozen Queen Wilhelmina or Night of Death Mamonir</td>
</tr>
<tr>
<td>5</td>
<td>Summer Vacation Dalvi (Events tab, free)</td>
<td>Comeback Idol Ventana, <strong>borrowed from a friend</strong></td>
</tr>
</tbody>
</table></div>
<p>★3 and ★4 supports at +5 are often better than a ★5 at +0: no shame in playing them. To borrow: add a player who owns the character as a friend, then in battle tap Replace, the hand icon at the top right, and pick them.</p>
</div></section>
<section class="chapter" id="s5" data-title="First-week walkthrough (step by step)"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c3 0 3-5 7-5s4-6 7-6"/><circle cx="5" cy="19" r="1.6"/><path d="M19 4v4h-4"/></svg><b>05</b></span><h2>First-week walkthrough (step by step)</h2></header><div class="ch-body">
<p>This part follows the "new player" checklist from the official Discord, with your screenshots, then filled in with BotAn's compendium. Everything is doable in a week, but nothing is mandatory: play at your own pace.</p>
<p>The Discord author gives no strict order: clear whatever you can first. Once everything is ticked, you'll already know most of the game's mechanics.</p>
<h3 id="s5-1">Before anything else (compendium tips)</h3>
<ul>
<li>Finish <strong>Master Pack 1 (Edge of Dimensions)</strong>: it unlocks the gacha and the event menus.</li>
<li>In the <strong>Infinite Draw</strong>, aim for <strong>The Curse Celia</strong>.</li>
<li>Save your <strong>Recommended ★5 Costume Selective Tickets</strong> (12 in the Guide Pass) for key supports: Diana +2 (3 tickets), B-Rank Idol Helena +1 (2), Homunculus Lathel +2 (3), then New Hire Seir, Track and Field Captain Levia, Robin Hood Zenith and Game Club Rafina (1 each). Start with Helena if you want a comfortable starter team.</li>
<li>Never mix <strong>physical</strong> and <strong>magic</strong> buffers and DPS in the same team.</li>
<li>Grab the free costumes in the <strong>Events</strong> tab (Dream Bride <strong>Eclipse</strong> and Summer Vacation <strong>Dalvi</strong>) and level them first.</li>
<li>The <strong>Story</strong> tab on the home screen is only an archive: reading there doesn't advance your progress.</li>
</ul>
<h3 id="s5-2">This week's goals</h3>
<div class="checklist" data-cad="none" data-prio="high" data-role="goals" data-scope="This week's goals"><div class="cl-bar"><span aria-live="polite" class="cl-count"></span><div class="cl-track"><span class="cl-fill"></span></div><button class="cl-reset" type="button">Untick all</button></div><ul class="tasks"><li class="task"><label><input class="tick" data-k="b74b5dbb7a" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Do the daily and weekly missions, every day</span></label></li><li class="task"><label><input class="tick" data-k="d6db2a9df4" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Do the season pass daily missions, every day</span></label></li><li class="task"><label><input class="tick" data-k="bfe1b6c9da" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Main Story Pack 10</span></label></li><li class="task"><label><input class="tick" data-k="176353cbe0" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Main Story Pack 7 on Very Hard</span></label></li><li class="task"><label><input class="tick" data-k="643dd2f40d" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Main Story Pack 9 on Very Hard</span></label></li><li class="task"><label><input class="tick" data-k="1d0051d581" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear the Beauty Impossible Character Pack</span></label></li><li class="task"><label><input class="tick" data-k="00619cfe42" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Get Gear Craft to Legendary</span></label></li><li class="task"><label><input class="tick" data-k="ea7a63221a" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Get Alchemy to Legendary</span></label></li><li class="task"><label><input class="tick" data-k="9a1ec767bf" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Have a team fully geared in Rare IV</span></label></li><li class="task"><label><input class="tick" data-k="605f24342f" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Have at least one piece with a good refinement score</span></label></li><li class="task"><label><input class="tick" data-k="fd0a92838f" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Recruit Diana</span></label></li><li class="task"><label><input class="tick" data-k="616dd33edb" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Recruit Liberta</span></label></li><li class="task"><label><input class="tick" data-k="6cb50b9880" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Unlock a costume Skill Potential</span></label></li><li class="task"><label><input class="tick" data-k="dc777a7c52" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Change a character's Bonding Stat</span></label></li><li class="task"><label><input class="tick" data-k="e07557aedd" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Slime Empire on Very Hard</span></label></li><li class="task"><label><input class="tick" data-k="c2e56e92a9" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Goblin Cave on Very Hard</span></label></li><li class="task"><label><input class="tick" data-k="84983d7a32" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Magic Crystal Cave on Very Hard</span></label></li><li class="task"><label><input class="tick" data-k="cd15b9c0a8" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Reach Gold rank in Mirror Wars</span></label></li><li class="task"><label><input class="tick" data-k="a649aa5b52" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Tower of Pride floor 1</span></label></li><li class="task"><label><input class="tick" data-k="7ad4ec0ea7" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Tower of Salvation level 2</span></label></li><li class="task"><label><input class="tick" data-k="193d16eba4" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Tower of Desire level 10</span></label></li><li class="task"><label><input class="tick" data-k="3f625ad7f7" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear level 5 of the Towers of Wrath and Jealousy</span></label></li><li class="task"><label><input class="tick" data-k="7b18f6262f" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Reach 50% HP Collection Buff</span></label></li><li class="task"><label><input class="tick" data-k="cad303086d" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear level 15 of the Normal event battle</span></label></li><li class="task"><label><input class="tick" data-k="61d014c27c" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear Fiend Hunter level 2</span></label></li><li class="task"><label><input class="tick" data-k="3fd7f34121" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Score 10,000 in Last Night</span></label></li><li class="task"><label><input class="tick" data-k="e4732c34df" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Get the Glupy Diner to level 2</span></label></li><li class="task"><label><input class="tick" data-k="aed5566d18" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Unlock a Glu Talk friend's 4th encounter</span></label></li><li class="task"><label><input class="tick" data-k="ea44d66682" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Own a Knight's Ring IV (R) with a BBS rank and 100% Crit DMG options</span></label></li></ul></div>
<div id="steps-summary" class="widget"></div><p>The steps below explain why each goal matters.</p>
<article class="step" data-step="1"><div class="step-head"><h3 id="s5-3">Step 1 — Daily missions and the season pass</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="1"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p class="callout key"><span class="co-tag">Key point</span>Dailies are short and quick. The reward you <strong>really don't want to miss</strong> is the season pass daily mission "Battle in the Hunting Ground": it gives a <strong>Pass Material Chest</strong> full of crafting materials. Do it from day one.</p>
<figure class="shot"><button aria-label="Enlarge: Season pass daily missions" class="shot-btn" data-full="img/bd2-1000095411.jpg" type="button"><img alt="Season pass daily missions" loading="lazy" src="img/bd2-1000095411.jpg"/></button><figcaption>Season pass daily missions</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Pass Material Chest contents: ores and leather" class="shot-btn" data-full="img/bd2-1000095412.jpg" type="button"><img alt="Pass Material Chest contents: ores and leather" loading="lazy" src="img/bd2-1000095412.jpg"/></button><figcaption>Pass Material Chest contents: ores and leather</figcaption></figure>
<p><strong>Where are the Hunting Grounds?</strong> Inside Story Packs 1 to 10. Each pack unlocks its own once cleared on Normal, and higher difficulty gives more rewards. On the map it's the circled skull icon below; there's also a shortcut next to the minimap.</p>
<figure class="shot"><button aria-label="Enlarge: Hunting Ground icon on the map" class="shot-btn" data-full="img/bd2-1000095413.jpg" type="button"><img alt="Hunting Ground icon on the map" loading="lazy" src="img/bd2-1000095413.jpg"/></button><figcaption>Hunting Ground icon on the map</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong> If a quest asks for a Hunting Ground fight but there are no enemies, abandon the active quest: they come back. The <strong>Quick Hunt</strong> button on the home screen groups Hunting Grounds and Path of Adventure and runs the fights without loading the map.</p>
</div></article><article class="step" data-step="2"><div class="step-head"><h3 id="s5-4">Step 2 — The main Story Packs</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="2"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>Clearing <strong>Main Story Pack 10</strong> basically unlocks everything the game has to offer. No need to rush Packs 11 to 16: their difficulty jumps a lot. One exception: build your team to clear <strong>Pack 15</strong> as soon as you can (see step 12).</p>

<p class="callout key"><span class="co-tag">Key point</span><strong>Why Pack 9 on Very Hard matters so much.</strong> You need tons of Hardwood to craft, and it has only one reliable source: this Hunting Ground. Ores also come from chapters 7, 8 and 13. The Discord says it's no exaggeration: clear it ASAP for the Hardwood alone.</p>
<figure class="shot"><button aria-label="Enlarge: Chapter 9 Hunting Ground on Very Hard" class="shot-btn" data-full="img/bd2-1000095415.jpg" type="button"><img alt="Chapter 9 Hunting Ground on Very Hard" loading="lazy" src="img/bd2-1000095415.jpg"/></button><figcaption>Chapter 9 Hunting Ground on Very Hard</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Lathel's skill (Pack 7 costume) at +2" class="shot-btn" data-full="img/bd2-1000095416.jpg" type="button"><img alt="Lathel's skill (Pack 7 costume) at +2" loading="lazy" src="img/bd2-1000095416.jpg"/></button><figcaption>Lathel's skill (Pack 7 costume) at +2</figcaption></figure>
<p><strong>The Newbie Pass "Today's Quest".</strong> You can do it 3 times a day at most. The author recommends the <strong>Beauty Impossible</strong> Character Pack: it's the easiest and quickest, and handy for achievements. Some Story Pack Today's Quests send you to a Hunting Ground, which costs rice. Otherwise, cherry-pick quests across any pack.</p>
<figure class="shot"><button aria-label="Enlarge: Quest Bulletin and Today's Quest" class="shot-btn" data-full="img/bd2-1000095417.jpg" type="button"><img alt="Quest Bulletin and Today's Quest" loading="lazy" src="img/bd2-1000095417.jpg"/></button><figcaption>Quest Bulletin and Today's Quest</figcaption></figure>
</div></article><article class="step" data-step="3"><div class="step-head"><h3 id="s5-5">Step 3 — Gear Craft and Alchemy to Legendary</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="3"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>Getting <strong>Gear Craft to Legendary within 7 days</strong> is possible as long as you don't miss any season pass daily reward. You need Legendary rank to craft UR gear.</p>
<p><strong>How to rank up.</strong> You earn XP by crafting, then rank up with an Ability Book once the bar is full. The compendium recommends crafting <strong>N or R</strong> gear for XP and skipping SR, too expensive for what it gives. Don't over-craft: do 30, 50 or 100 crafts at most, see how much XP you get, then adjust.</p>
<div class="tbl"><table>

<tr>
<td>★4 Ability Book</td>
<td>Evil Castle shop only (512 Devil Coins each)</td>
</tr>
</tbody>
</table></div>
<p class="callout key"><span class="co-tag">Key point</span><strong>The <button class="term" data-tip="Earned in the Evil Castle" type="button">Devil Coin</button> trick.</strong> Buy ★3 books with gold at Story Pack 10 and save your Devil Coins for ★4 books. The season pass daily mission gives 125 a day: you can hit Legendary by day 5 at the latest, faster if you clear Tower of Pride floor 1 early.</p>
<figure class="shot"><button aria-label="Enlarge: Evil Castle shop and pass missions that give Devil Coins" class="shot-btn" data-full="img/bd2-1000095418.jpg" type="button"><img alt="Evil Castle shop and pass missions that give Devil Coins" loading="lazy" src="img/bd2-1000095418.jpg"/></button><figcaption>Evil Castle shop and pass missions that give Devil Coins</figcaption></figure>
<p><strong>What to craft meanwhile: Rare IV.</strong> Aim for <strong>Rare IV</strong> gear (shown as "IV R" with 3 stars). It's the strongest cheap option for a beginner, along with Fiend gear from the event shop. When crafting, tier IV only drops 5% of the time (I: 50%, II: 30%, III: 15%), so craft in bulk.</p>
<p>Don't be scared to "waste" resources upgrading and refining Rare gear: it's very cheap, and it uses different materials to change its options (substats).</p>
<figure class="shot"><button aria-label="Enlarge: Option refinement: 4 stones on a Rare piece vs 45 crystals on a UR piece" class="shot-btn" data-full="img/bd2-1000095419.jpg" type="button"><img alt="Option refinement: 4 stones on a Rare piece vs 45 crystals on a UR piece" loading="lazy" src="img/bd2-1000095419.jpg"/></button><figcaption>Option refinement: 4 stones on a Rare piece vs 45 crystals on a UR piece</figcaption></figure>
<p>Refining a weapon raises its <strong>upgrade rank</strong>, which raises its main stat. Generally, a <strong>BBS</strong> rank is enough.</p>
<figure class="shot"><button aria-label="Enlarge: Knight's Sword IV R +9 with a BBS rank" class="shot-btn" data-full="img/bd2-1000095420.jpg" type="button"><img alt="Knight's Sword IV R +9 with a BBS rank" loading="lazy" src="img/bd2-1000095420.jpg"/></button><figcaption>Knight's Sword IV R +9 with a BBS rank</figcaption></figure>
<p><strong>After Legendary (compendium order).</strong></p>
<ol>
<li>Craft a UR III weapon and gloves for your main DPS: Evil Dragon's Blade for a physical DPS, Travel God's Friend for a magic DPS.</li>
<li>For gloves: God-King's Silver Arm (physical) or Shackle of Treachery (magic), easier early on.</li>
<li>Do the same for your second DPS, with a <strong>Venomous Touch</strong> accessory, the top-priority piece.</li>
<li>Then move on to one or two sets of UR IV offensive gear.</li>
<li>Finally craft UR III armor and helmets for the enemy type: Invulnerable Armor + Helm of Carnage against physical damage, Fiend Guard + Radiant Wisdom against magic damage.</li>
</ol>
<p>The compendium mentions the code <strong>WAITING4LEGEND</strong>, which gave a UR III Venomous Touch. It's still active (confirmed on the official Discord, November 2026).</p>
<p><strong>Alchemy.</strong> It's Scheherazade's ability, which turns common materials into advanced ones. It levels like crafting. For XP, convert the cheapest first: Plain Leather into Fine Leather, Plain Fabric into Fine Fabric, Peat into Coal.</p>
</div></article><article class="step" data-step="4"><div class="step-head"><h3 id="s5-6">Step 4 — Recruit Diana, unlock a Potential, change Bonding</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="4"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>Once Story Pack 10 is cleared, you meet <strong>Adventurer of the Unknown Diana</strong> at the pub. She's recruited for <strong>1 ★5 Recruit Contract</strong> (the rainbow scroll).</p>
<figure class="shot"><button aria-label="Enlarge: Diana at the Story Pack 10 pub" class="shot-btn" data-full="img/bd2-1000095421.jpg" type="button"><img alt="Diana at the Story Pack 10 pub" loading="lazy" src="img/bd2-1000095421.jpg"/></button><figcaption>Diana at the Story Pack 10 pub</figcaption></figure>
<p class="callout key"><span class="co-tag">Key point</span><strong>Get 3 ★5 contracts by day 7:</strong> 1 in your mailbox on first login, 1 from the Newbie Pass step 1 day 7 reward, and 1 by trading lower-tier scrolls up in the shop.</p>
<p class="callout key"><span class="co-tag">Key point</span><strong>Why she's essential.</strong> Diana is a support whose aura raises <strong>property damage</strong> (Property DMG) and <strong>crit rate</strong>. Property damage is a separate multiplier from ATK/MATK buffs. It only works when the enemy's element is weak to yours. So it does nothing against enemies with no element, like in the Towers of Wrath and Jealousy. She's also key in Fiend Hunter.</p>
<figure class="shot"><button aria-label="Enlarge: Tower of Wrath enemy: no element, so no Diana bonus" class="shot-btn" data-full="img/bd2-1000095422.jpg" type="button"><img alt="Tower of Wrath enemy: no element, so no Diana bonus" loading="lazy" src="img/bd2-1000095422.jpg"/></button><figcaption>Tower of Wrath enemy: no element, so no Diana bonus</figcaption></figure>
<p><strong>Her Dispatch ability</strong> brings items every day. Once Gear Craft and Alchemy are Legendary, it's the next ability to max out.</p>
<figure class="shot"><button aria-label="Enlarge: Diana's Dispatch Advanced" class="shot-btn" data-full="img/bd2-1000095423.jpg" type="button"><img alt="Diana's Dispatch Advanced" loading="lazy" src="img/bd2-1000095423.jpg"/></button><figcaption>Diana's Dispatch Advanced</figcaption></figure>
<h4>Skill Potential (Potential Liberation)</h4>
<p>Potential makes a costume stronger or gives it real quality of life: less cooldown, wider range, lower SP cost. The tree has three node types:</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Node</th>
<th>Effect</th>
<th>Cost</th>
</tr>
</thead>
<tbody>
<tr>
<td>Small</td>
<td>Character base stats, always active</td>
<td>30,000 gold + 50 elemental crystals</td>
</tr>
<tr>
<td>Medium</td>
<td>Big stat boost, active only while this costume is bonded</td>
<td>20,000 to 40,000 gold + 0 to 350 crystals</td>
</tr>
<tr>
<td>Large</td>
<td>Upgrades the skill (−1 SP, range, damage)</td>
<td>500 crystals + 1 <strong>Tear of the Goddess</strong></td>
</tr>
</tbody>
</table></div>
<p>Tears of the Goddess are very rare: think before using one, and ask for advice if unsure. A Potential <strong>cannot</strong> be undone. Compendium priority: <strong>supports first</strong> (SP and cooldown reduction, then duration and area), DPS damage nodes last.</p>
<figure class="shot"><button aria-label="Enlarge: Diana's Potential Liberation tree" class="shot-btn" data-full="img/bd2-1000095424.jpg" type="button"><img alt="Diana's Potential Liberation tree" loading="lazy" src="img/bd2-1000095424.jpg"/></button><figcaption>Diana's Potential Liberation tree</figcaption></figure>
<h4>Bonding</h4>
<p>A character can have several costumes, and you pick <strong>one</strong> to bond with. It's like "equipping" that costume's upgrade bonuses on the character. You can change the bond anytime for free: on the character screen, tap the costume portrait on the right. As a beginner, bond the costume with the most Potential unlocked.</p>
<figure class="shot"><button aria-label="Enlarge: A character's Bonding Stat" class="shot-btn" data-full="img/bd2-1000095425.jpg" type="button"><img alt="A character's Bonding Stat" loading="lazy" src="img/bd2-1000095425.jpg"/></button><figcaption>A character's Bonding Stat</figcaption></figure>
</div></article><article class="step" data-step="5"><div class="step-head"><h3 id="s5-7">Step 5 — Resource stages and Mirror Wars (PvP)</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="5"><span class="box" aria-hidden="true"></span><span>Done</span></label><button type="button" class="step-toggle" hidden>Show</button></div><div class="step-body">
<p>Clearing Story Pack 3 unlocks <strong>Path of Adventure</strong>, where you farm Slimes (XP), gold and magic crystals. Higher difficulty means bigger rewards.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Dungeon</th>
<th>What it gives</th>
<th>Energy</th>
</tr>
</thead>
<tbody>
<tr>
<td>Goblin Cave</td>
<td>Gold</td>
<td>Cooked Rice</td>
</tr>
<tr>
<td>Slime Empire</td>
<td>Slimes to level up</td>
<td>Cooked Rice</td>
</tr>
<tr>
<td>Magic Crystal Cave</td>
<td>Magic crystals, the only source for Potentials</td>
<td>Torches</td>
</tr>
</tbody>

<h4>The three energies</h4>
<p>The game has three energies that only refill <strong>at the daily reset</strong>, not per minute: <strong>rice</strong>, <strong>torches</strong> and <strong>Blood Cocktails</strong>. The white number is your daily ration: spend it all every day, because it doesn't stack. The yellow "+" is a stock that piles up with no limit and never expires.</p>
<figure class="shot"><button aria-label="Enlarge: Rice and torch gauges: daily ration in white, stock in yellow" class="shot-btn" data-full="img/bd2-1000095426.jpg" type="button"><img alt="Rice and torch gauges: daily ration in white, stock in yellow" loading="lazy" src="img/bd2-1000095426.jpg"/></button><figcaption>Rice and torch gauges: daily ration in white, stock in yellow</figcaption></figure>
<p class="callout warn"><span class="co-tag">Heads up</span><strong>How much per day?</strong> <strong>90 rice</strong> a day (confirmed on the official Discord, November 2026). The old Discord screenshot still shows 60 rice and 60 torches.</p>
<p><strong>How to spend them (compendium).</strong> Put all your rice on Goblin Cave (gold) or Slime Empire (Slimes) depending on the bonus day. Put torches on whatever element you need crystals for. 60 torches on Very Hard give 220 to 260 crystals. "Paid" rice from events doesn't reset: to use it, untick "Use Free <button class="term" data-tip="Energy for Path of Adventure" type="button">Cooked Rice</button> Only" in Quick Hunt.</p>
<p><strong>Going up in difficulty.</strong> Very Hard on these dungeons is easy enough, especially with Diana's aura. You can try Hard on day one after crafting a few Rare pieces. Once Very Hard is cleared, just Quick Hunt every day.</p>
<p>The Newbie Pass (step 1, day 7) asks you to activate <strong>Auto Hunt</strong>: do it once, and it clears even on day 1.</p>
<figure class="shot"><button aria-label="Enlarge: Auto Hunt button" class="shot-btn" data-full="img/bd2-1000095427.jpg" type="button"><img alt="Auto Hunt button" loading="lazy" src="img/bd2-1000095427.jpg"/></button><figcaption>Auto Hunt button</figcaption></figure>
<figure class="shot"><button aria-label="Enlarge: Quick Hunt button" class="shot-btn" data-full="img/bd2-1000095428.jpg" type="button"><img alt="Quick Hunt button" loading="lazy" src="img/bd2-1000095428.jpg"/></button><figcaption>Quick Hunt button</figcaption></figure>
<h4>Mirror Wars (PvP)</h4>
<p><strong>Blood Cocktails</strong> are for Mirror Wars. Even if your team is weak at the start, spend them all every day: you earn medals whether you win or lose. Those medals buy the costume on sale in the Mirror Wars shop (18,000 medals).</p>
<figure class="shot"><button aria-label="Enlarge: Mirror Wars shop: costume for 18,000 medals" class="shot-btn" data-full="img/bd2-1000095429.jpg" type="button"><img alt="Mirror Wars shop: costume for 18,000 medals" loading="lazy" src="img/bd2-1000095429.jpg"/></button><figcaption>Mirror Wars shop: costume for 18,000 medals</figcaption></figure>
<ul>
<li><strong>At the start</strong>, just put in your best PvE team.</li>
<li><strong>Realistic goal</strong>: Gold I or Platinum in your first week. Diamond I (Dia I) is roughly the ceiling for a casual player each week.</li>
<li><strong>Reward</strong>: Gold I gives 500 Dia at every weekly reset.</li>
</ul>
<p class="callout info"><span class="co-tag">Compendium</span><strong>From the compendium.</strong></p>
<ul>
<li>40 Blood Cocktails a day, reset at midnight. Use <strong>Repeat Battle</strong> set to 40: you fight once but get the rewards of 40 fights. Victory points only count once.</li>
<li>The season lasts one week, Monday to Sunday. On Sunday, from 15:00 (game time), a 9-hour settlement blocks attacks.</li>
<li>On offense you start with <strong>5 SP</strong>, on defense with <strong>6 SP</strong>, then +6 SP per turn. Favor cheap SP costumes: you can't fire everything on turn 1 like in the story.</li>
</ul>

</tr>
<tr>
<td>Gold III / II / I</td>
<td>1,300 / 1,400 / 1,500</td>
<td>440 / 470 / 500</td>
</tr>
<tr>
<td>Platinum III / II / I</td>

</tr>
<tr>
<td>Dia III / II / I</td>

<td>Sapphire and up</td>
