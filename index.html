</table></div>
<p class="callout key"><span class="co-tag">À retenir</span><strong>L'astuce des Devil Coins.</strong> Achète les livres ★3 avec de l'or au Story Pack 10 et garde tes Devil Coins pour les livres ★4. La mission quotidienne du passe de saison en donne 125 par jour : tu peux donc atteindre Legendary au plus tard vers ton 5e jour, et plus vite si tu finis tôt l'étage 1 de la Tower of Pride.</p>
<figure class="shot"><button aria-label="Agrandir : Boutique de l'Evil Castle et missions du passe qui donnent des Devil Coins" class="shot-btn" data-full="img/bd2-1000095418.jpg" type="button"><img alt="Boutique de l'Evil Castle et missions du passe qui donnent des Devil Coins" loading="lazy" src="img/bd2-1000095418.jpg"/></button><figcaption>Boutique de l'Evil Castle et missions du passe qui donnent des Devil Coins</figcaption></figure>
<p><strong>Quoi crafter en attendant : du Rare IV.</strong> Vise l'équipement <strong>Rare IV</strong> (affiché « IV R » avec 3 étoiles). C'est l'option bon marché la plus forte pour un débutant, avec l'équipement Fiend vendu dans la boutique d'événement. Au craft, le palier IV ne sort que 5 % du temps (I : 50 %, II : 30 %, III : 15 %), donc crafte en quantité.</p>
<p>N'aie pas peur de « gaspiller » en améliorant et en raffinant ton équipement Rare : c'est très peu cher, et il utilise d'autres matériaux pour changer ses options (substats).</p>
<figure class="shot"><button aria-label="Agrandir : Raffiner une option : 4 pierres sur une pièce Rare contre 45 cristaux sur une pièce UR" class="shot-btn" data-full="img/bd2-1000095419.jpg" type="button"><img alt="Raffiner une option : 4 pierres sur une pièce Rare contre 45 cristaux sur une pièce UR" loading="lazy" src="img/bd2-1000095419.jpg"/></button><figcaption>Raffiner une option : 4 pierres sur une pièce Rare contre 45 cristaux sur une pièce UR</figcaption></figure>
<p>Raffiner une arme augmente son <strong>score de raffinage</strong>, qui fait monter sa stat principale. En général, un score de <strong>18</strong> suffit (« BBS » sur les anciennes captures, qui affichaient des lettres).</p>
<figure class="shot"><button aria-label="Agrandir : Knight's Sword IV R +9 au score 18 (BBS dans l'ancien affichage en lettres)" class="shot-btn" data-full="img/bd2-1000095420.jpg" type="button"><img alt="Knight's Sword IV R +9 au score 18 (BBS dans l'ancien affichage en lettres)" loading="lazy" src="img/bd2-1000095420.jpg"/></button><figcaption>Knight's Sword IV R +9 au score 18 (BBS dans l'ancien affichage en lettres)</figcaption></figure>
<p><strong>Après Legendary.</strong> Crafte en priorité une arme et des gants UR III pour ton DPS principal (Evil Dragon's Blade en physique, Travel God's Friend en magique), avec un accessoire <strong>Venomous Touch</strong>, la pièce la plus prioritaire. L'ordre complet, jusqu'aux armures et casques, est dans la section 10 (« Ordre de fabrication complet »).</p>
<p>Le compendium cite le code <strong>WAITING4LEGEND</strong>, qui donnait un Venomous Touch UR III. Il est toujours actif (confirmé sur le Discord officiel, novembre 2026).</p>
<p><strong>Alchemy.</strong> C'est la capacité de Scheherazade, qui transforme les matériaux communs en matériaux avancés. Elle se monte comme le craft. Pour l'XP, transforme d'abord le moins cher : Plain Leather en Fine Leather, Plain Fabric en Fine Fabric, Peat en Coal.</p>
</div></article><article class="step" data-step="4"><div class="step-head"><h3 id="s5-6">Étape 4 — Recruter Diana, débloquer un Potentiel, changer de Bonding</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="4"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Une fois le Story Pack 10 fini, tu croises <strong>Adventurer of the Unknown Diana</strong> à la taverne. Elle se recrute contre <strong>1 contrat de recrutement ★5</strong> (le parchemin arc-en-ciel).</p>
<figure class="shot"><button aria-label="Agrandir : Diana à la taverne du Story Pack 10" class="shot-btn" data-full="img/bd2-1000095421.jpg" type="button"><img alt="Diana à la taverne du Story Pack 10" loading="lazy" src="img/bd2-1000095421.jpg"/></button><figcaption>Diana à la taverne du Story Pack 10</figcaption></figure>
<p class="callout key"><span class="co-tag">À retenir</span><strong>Avoir 3 contrats ★5 avant ton 7e jour :</strong> 1 dans ta boîte aux lettres à la première connexion, 1 en récompense du jour 7 de l'étape 1 du Newbie Pass, et 1 en échangeant des parchemins de rang inférieur dans la boutique.</p>
<p class="callout key"><span class="co-tag">À retenir</span><strong>Pourquoi elle est indispensable.</strong> Diana est un support qui pose une aura augmentant les <strong>dégâts d'élément</strong> (Property DMG) et le <strong>taux de critique</strong>. Le bonus d'élément est un multiplicateur à part des buffs d'ATK et de MATK. Il ne marche que si l'ennemi a un élément faible face au tien. Il ne sert donc à rien contre les ennemis sans élément, comme dans les Towers of Wrath et of Jealousy. Elle est aussi clé dans le Fiend Hunter.</p>
<figure class="shot"><button aria-label="Agrandir : Ennemi de la Tower of Wrath : aucun élément, donc pas de bonus de Diana" class="shot-btn" data-full="img/bd2-1000095422.jpg" type="button"><img alt="Ennemi de la Tower of Wrath : aucun élément, donc pas de bonus de Diana" loading="lazy" src="img/bd2-1000095422.jpg"/></button><figcaption>Ennemi de la Tower of Wrath : aucun élément, donc pas de bonus de Diana</figcaption></figure>
<p><strong>Sa capacité Dispatch</strong> rapporte des objets chaque jour. Une fois Gear Craft et Alchemy au rang Legendary, c'est la prochaine capacité à monter au maximum.</p>
<figure class="shot"><button aria-label="Agrandir : Dispatch Advanced de Diana" class="shot-btn" data-full="img/bd2-1000095423.jpg" type="button"><img alt="Dispatch Advanced de Diana" loading="lazy" src="img/bd2-1000095423.jpg"/></button><figcaption>Dispatch Advanced de Diana</figcaption></figure>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong> Lance le Dispatch une fois à la main ; ensuite, il se relance tout seul chaque jour si la case est cochée. Les récompenses du jour t'attendent sur la carte : cherche les bulles « ! » au-dessus des petites créatures. Les probabilités sont sur le <a href="https://browndust2.gitbook.io/probabilitydetails_en#dispatch-reward-probability" target="_blank" rel="noopener">Gitbook officiel</a>.</p>
<figure class="shot dc"><button aria-label="Agrandir : Les bulles « ! » des récompenses du Dispatch sur la carte" class="shot-btn" data-full="img/dc-dispatch.jpg" type="button"><img alt="Les bulles « ! » des récompenses du Dispatch sur la carte" loading="lazy" src="img/dc-dispatch.jpg"/></button><figcaption>Les bulles « ! » des récompenses du Dispatch sur la carte<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h4>Le Skill Potential (Potential Liberation)</h4>
<p>Le Potentiel renforce un costume ou lui donne un vrai confort : moins de temps de recharge, une portée plus large, un coût en SP réduit. L'arbre a trois types de nœuds :</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Nœud</th>
<th>Effet</th>
<th>Coût</th>
</tr>
</thead>
<tbody>
<tr>
<td>Petit</td>
<td>Stats de base du perso, actives en permanence</td>
<td>30 000 or + 50 cristaux d'élément</td>
</tr>
<tr>
<td>Moyen</td>
<td>Gros bonus de stats, actif seulement si ce costume est lié (Bonding)</td>
<td>20 000 à 40 000 or + 0 à 350 cristaux</td>
</tr>
<tr>
<td>Grand</td>
<td>Améliore la compétence (−1 SP, portée, dégâts)</td>
<td>500 cristaux + 1 <strong>Tear of the Goddess</strong></td>
</tr>
</tbody>
</table></div>
<p>La <button class="term" data-tip="Larme de la déesse — Très rare, débloque le potentiel de compétence" type="button">Tear of the Goddess</button> est très rare : réfléchis avant de l'utiliser, et demande conseil en cas de doute. Un Potentiel ne peut <strong>pas</strong> être annulé : rien n'est remboursé (tu peux seulement désactiver un grand nœud, voir la section 9). Priorité du compendium : les <strong>supports d'abord</strong> (réduction de SP et de recharge, puis durée et zone), les nœuds de dégâts des DPS en dernier.</p>
<figure class="shot"><button aria-label="Agrandir : Arbre de Potential Liberation de Diana" class="shot-btn" data-full="img/bd2-1000095424.jpg" type="button"><img alt="Arbre de Potential Liberation de Diana" loading="lazy" src="img/bd2-1000095424.jpg"/></button><figcaption>Arbre de Potential Liberation de Diana</figcaption></figure>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong> Ne mets ni cristaux ni Tears sur les persos 3★ et 4★, sauf Arines, Elpis et Kind Student Samay (et pas quand tu débutes). Il faut environ <strong>3 000 cristaux d'élément et 3 Tears</strong> pour finir le Potentiel d'un costume 5★.</p>
<figure class="shot dc"><button aria-label="Agrandir : Un arbre de Potentiel annoté : nœuds permanents, nœuds de Bonding et grands nœuds" class="shot-btn" data-full="img/dc-pots.jpg" type="button"><img alt="Un arbre de Potentiel annoté : nœuds permanents, nœuds de Bonding et grands nœuds" loading="lazy" src="img/dc-pots.jpg"/></button><figcaption>Un arbre de Potentiel annoté : nœuds permanents, nœuds de Bonding et grands nœuds<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h4>Le Bonding</h4>
<p>Un personnage peut avoir plusieurs costumes, et tu en choisis <strong>un</strong> à lier (Bonding). C'est comme « équiper » les bonus d'amélioration de ce costume sur le perso. Tu peux changer de lien quand tu veux, gratuitement : dans l'écran du personnage, touche le portrait du costume à droite. En débutant, lie le costume qui a le plus de Potentiel débloqué.</p>
<figure class="shot"><button aria-label="Agrandir : Bonding Stat d'un personnage" class="shot-btn" data-full="img/bd2-1000095425.jpg" type="button"><img alt="Bonding Stat d'un personnage" loading="lazy" src="img/bd2-1000095425.jpg"/></button><figcaption>Bonding Stat d'un personnage</figcaption></figure>
</div></article><article class="step" data-step="5"><div class="step-head"><h3 id="s5-7">Étape 5 — Stages de ressources et Mirror Wars (PvP)</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="5"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Le Story Pack 3 fini débloque le <strong>Path of Adventure</strong>, où tu farmes les Slimes (XP), l'or et les cristaux de magie. Plus la difficulté est haute, plus les récompenses sont grosses.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Donjon</th>
<th>Ce qu'il donne</th>
<th>Énergie</th>
</tr>
</thead>
<tbody>
<tr>
<td>Goblin Ruins</td>
<td>Or</td>
<td>Riz cuit (Cooked Rice)</td>
</tr>
<tr>
<td>Slime Empire</td>
<td>Slimes pour monter de niveau</td>
<td>Riz cuit</td>
</tr>
<tr>
<td>Magic Crystal Cave</td>
<td>Cristaux de magie, seule source pour les Potentiels</td>
<td>Torches</td>
</tr>
</tbody>
</table></div>
<h4>Les trois énergies</h4>
<p>Le jeu a trois énergies qui ne se rechargent <strong>qu'au reset quotidien</strong>, pas à la minute : le <strong>riz</strong>, les <strong>torches</strong> et les <strong>Blood Cocktails</strong>. Le chiffre blanc est ta ration du jour : dépense-la entièrement chaque jour, car elle ne se cumule pas. Les « + » jaunes sont un stock qui s'accumule sans limite et n'expire jamais.</p>
<figure class="shot"><button aria-label="Agrandir : Jauges de riz et de torches : ration du jour en blanc, stock en jaune" class="shot-btn" data-full="img/bd2-1000095426.jpg" type="button"><img alt="Jauges de riz et de torches : ration du jour en blanc, stock en jaune" loading="lazy" src="img/bd2-1000095426.jpg"/></button><figcaption>Jauges de riz et de torches : ration du jour en blanc, stock en jaune</figcaption></figure>
<p class="callout warn"><span class="co-tag">Attention</span><strong>Combien par jour ?</strong> <strong>90 riz</strong> par jour (confirmé sur le Discord officiel, novembre 2026). L'ancienne capture du Discord montre encore 60 riz et 60 torches.</p>
<p><strong>Comment les dépenser (compendium).</strong> Mets tout le riz sur Goblin Ruins (or) ou le Slime Empire (Slimes) selon le jour de bonus. Mets les torches sur l'élément dont tu as besoin de cristaux. 60 torches en Very Hard rapportent 220 à 260 cristaux. Le riz « payant » reçu en événement ne se réinitialise pas : pour l'utiliser, décoche « Use Free <button class="term" data-tip="Riz cuit — Énergie du Path of Adventure" type="button">Cooked Rice</button> Only » dans le Quick Hunt.</p>
<p><strong>Monter en difficulté.</strong> Le Very Hard de ces donjons est assez facile, surtout avec l'aura de Diana. Tu peux tenter le Hard dès ton premier jour après avoir crafté quelques pièces Rare. Une fois le Very Hard fini, utilise simplement le <strong>Quick Hunt</strong> chaque jour.</p>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong></p>
<ul>
<li><strong>Hunting Grounds</strong> : chapitre 7 pour les minerais, chapitre 9 pour le bois. N'y mets pas plus de <strong>6 riz par jour</strong> ; le reste va aux Slimes (tant que tes persos ne sont pas au maximum) ou à l'or, selon le jour de bonus. Le texte du bot parle encore de 60 riz par jour : il n'est sans doute plus à jour.</li>
<li>Le <strong>jour de bonus</strong> ne concerne que Goblin Ruins et le Slime Empire, pas les Hunting Grounds ni la Magic Crystal Cave.</li>
<li>Le <strong>Quick Hunt</strong> ne marche pas si tu es dans le pack Path of Adventure ou Glupy Diner.</li>
<li><strong>Plus de riz</strong> : boutique de Dia (pas pour les débutants), Season Pass et Character Pass, événements (connexion, Bingo) et Dispatch.</li>
</ul>
<figure class="shot dc"><button aria-label="Agrandir : Quick Hunt en 6 étapes : Goblin Ruins en Very Hard, riz gratuit seulement, curseur au maximum" class="shot-btn" data-full="img/dc-rice-quickhunt.jpg" type="button"><img alt="Quick Hunt en 6 étapes : Goblin Ruins en Very Hard, riz gratuit seulement, curseur au maximum" loading="lazy" src="img/dc-rice-quickhunt.jpg"/></button><figcaption>Quick Hunt en 6 étapes : Goblin Ruins en Very Hard, riz gratuit seulement, curseur au maximum<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<p>Le Newbie Pass (étape 1, jour 7) demande d'activer l'<strong>Auto Hunt</strong> : fais-le une fois, ça valide la mission même au jour 1.</p>
<figure class="shot"><button aria-label="Agrandir : Bouton Auto Hunt" class="shot-btn" data-full="img/bd2-1000095427.jpg" type="button"><img alt="Bouton Auto Hunt" loading="lazy" src="img/bd2-1000095427.jpg"/></button><figcaption>Bouton Auto Hunt</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Bouton Quick Hunt" class="shot-btn" data-full="img/bd2-1000095428.jpg" type="button"><img alt="Bouton Quick Hunt" loading="lazy" src="img/bd2-1000095428.jpg"/></button><figcaption>Bouton Quick Hunt</figcaption></figure>
<h4>Mirror Wars (PvP)</h4>
<p>Les <strong>Blood Cocktails</strong> servent au Mirror Wars. Même si ton équipe est faible au début, dépense-les tous chaque jour : tu gagnes des médailles que tu gagnes ou que tu perdes. Ces médailles achètent le costume en vente dans la boutique Mirror Wars (18 000 médailles).</p>
<figure class="shot"><button aria-label="Agrandir : Boutique Mirror Wars : costume à 18 000 médailles" class="shot-btn" data-full="img/bd2-1000095429.jpg" type="button"><img alt="Boutique Mirror Wars : costume à 18 000 médailles" loading="lazy" src="img/bd2-1000095429.jpg"/></button><figcaption>Boutique Mirror Wars : costume à 18 000 médailles</figcaption></figure>
<ul>
<li><strong>Au début</strong>, mets simplement ta meilleure équipe PvE.</li>
<li><strong>Objectif réaliste</strong> : Gold I ou Platinum la première semaine. Diamond I (Dia I) est à peu près le plafond d'un joueur casual chaque semaine.</li>
<li><strong>Récompense</strong> : Gold I donne 500 Dia à chaque reset hebdomadaire.</li>
</ul>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Compléments du compendium.</strong></p>
<ul>
<li>40 Blood Cocktails par jour, reset à minuit. Utilise le menu <strong>Repeat Battle</strong> réglé sur 40 : tu ne te bats qu'une fois mais tu reçois les récompenses de 40 combats. Les points de victoire, eux, ne comptent qu'une fois.</li>
<li>La saison dure une semaine, du lundi au dimanche. Le dimanche, à partir de 15:00 (heure du jeu), 9 heures de décompte bloquent les attaques.</li>
<li>En attaque tu commences avec <strong>5 SP</strong>, en défense avec <strong>6 SP</strong>, puis +6 SP par tour. Privilégie des costumes peu chers en SP : impossible de tout lancer au tour 1 comme en histoire.</li>
</ul>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong></p>
<ul>
<li>Dans le Repeat Battle, deux options utiles : « <strong>Use Free <button class="term" data-tip="Cocktail de sang — Énergie du PvP Mirror Wars" type="button">Blood Cocktail</button> Only</strong> » (ne pas toucher aux cocktails en réserve) et « <strong>Battle Auto Skip</strong> ». Une capture du Discord montre un réglage de 1 à 10 combats répétés : le chiffre exact reste <a class="verify" href="#a-verifier">à vérifier en jeu</a>.</li>
<li>N'achète des cocktails avec des Dia que pour grimper au classement, ou s'il te manque des médailles pour un costume méta. Le costume de la boutique est garanti si tu joues depuis le début de la saison.</li>
<li>Boutique : le <strong>costume</strong> avant le ticket d'équipement UR EX, et prends <strong>toujours les Sparks en premier</strong> (leur quantité est limitée dans le temps).</li>
</ul>
<figure class="shot dc"><button aria-label="Agrandir : Repeat Battle : nombre de combats, cocktails gratuits seulement et Battle Auto Skip" class="shot-btn" data-full="img/dc-mw-repeat.jpg" type="button"><img alt="Repeat Battle : nombre de combats, cocktails gratuits seulement et Battle Auto Skip" loading="lazy" src="img/dc-mw-repeat.jpg"/></button><figcaption>Repeat Battle : nombre de combats, cocktails gratuits seulement et Battle Auto Skip<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>

</div></article><article class="step" data-step="6"><div class="step-head"><h3 id="s5-8">Étape 6 — L'Evil Castle et ses tours</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="6"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>L'Evil Castle se débloque avec le Story Pack 4 (Normal). Il contient cinq tours, et chacune a sa logique.</p>
<div class="tbl"><table>

<tr>
<th>Tour</th>
<th>Principe</th>

</tr>
</thead>
<tbody>
<tr>
<td>Tower of Pride</td>
<td>6 étages à score, récompenses <strong>quotidiennes</strong> et de fin de saison</td>
<td>Étage 1</td>
</tr>
<tr>
<td>Tower of Desire</td>
<td>250 étages, il suffit de gagner</td>
<td>Niveau 10</td>
</tr>
<tr>
<td>Tower of Salvation</td>
<td>Rogue-like saisonnier (4 semaines), 10 difficultés</td>
<td>Niveau 2, voire 4</td>
</tr>

</tr>

<h4>Tower of Pride</h4>
<p>Finir au moins l'<strong>étage 1</strong> te rend éligible aux récompenses de fin de saison : <strong>3 000 Devil Coins et 30 Ancient Crystals</strong>. Ce n'est pas très dur si tu as recruté Liatris ou Levia à la taverne.</p>
<figure class="shot"><button aria-label="Agrandir : Récompense de fin de saison de la Tower of Pride" class="shot-btn" data-full="img/bd2-1000095430.jpg" type="button"><img alt="Récompense de fin de saison de la Tower of Pride" loading="lazy" src="img/bd2-1000095430.jpg"/></button><figcaption>Récompense de fin de saison de la Tower of Pride</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Objectifs de saison de l'Evil Castle" class="shot-btn" data-full="img/bd2-1000095431.jpg" type="button"><img alt="Objectifs de saison de l'Evil Castle" loading="lazy" src="img/bd2-1000095431.jpg"/></button><figcaption>Objectifs de saison de l'Evil Castle</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Compléments du compendium.</strong></p>
<ul>
<li>Chaque étage : 4 combats normaux puis 1 boss. Chaque étage fini une première fois rapporte 1 000 Devil Coins et 10 Ancient Crystals.</li>
<li>Ton meilleur score donne une récompense <strong>chaque jour</strong> sans refaire la tour : de 300 Devil Coins + 6 Ancient Crystals (10 000 points) à 900 + 9 (600 000 points). Pour la toucher, va dans un pack (sauf Golden Colosseum, Glupy Diner, Soul Wager, Territory et Fishing) et parle aux petites créatures qui te suivent.</li>
<li>Points faciles pour débuter : finir le combat en 1 tour, garder toute l'équipe à PV max, et infliger 1 000 000 de dégâts avec un seul perso en un tour (Dream Bride Eclipse s'y prête bien). Ne cours pas après les bonus d'élément au début.</li>
</ul>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong></p>
<ul>
<li>Viser le score maximum rapporte plus de <strong>Cristaux anciens</strong> chaque jour.</li>
<li><strong>Débutant</strong> : ne t'en occupe pas, prends simplement ta meilleure équipe PvE. Il te manque encore des costumes, des doublons et de l'équipement pour le score maximum.</li>
<li><strong>La méthode</strong> : un seul perso fait le coup à 1 million, les autres nettoient les monstres. Pas de critique, pas de million ? <strong>Relance le combat.</strong></li>
<li><strong>Passe à l'auberge avant chaque étage</strong> : parfois, tes persos ne sont pas à PV max sans raison, et tu perds les points « PV max ».</li>
</ul>
<p>Avec les Devil Coins, achète dans la boutique de l'Evil Castle : l'Ability Book ★4 (au besoin), les <strong>Essences</strong> et les <strong>Engraving Scrolls</strong>.</p>
<h4>Tower of Salvation</h4>
<p>C'est le meilleur mode pour apprendre comment marchent les costumes, la composition d'équipe et les mécaniques. Finir au moins 1 niveau te rend éligible à ses récompenses de saison. Le Discord conseille le <strong>niveau 2</strong> pour un débutant, ou le <strong>niveau 4</strong> si tu peux, car il donne un <strong><button class="term" data-tip="★5 aléatoire d'un élément choisi" type="button">Property Selective Draw Exchange Ticket</button></strong>.</p>
<figure class="shot"><button aria-label="Agrandir : Tower of Salvation, niveau de difficulté 4" class="shot-btn" data-full="img/bd2-1000095432.jpg" type="button"><img alt="Tower of Salvation, niveau de difficulté 4" loading="lazy" src="img/bd2-1000095432.jpg"/></button><figcaption>Tower of Salvation, niveau de difficulté 4</figcaption></figure>

<p><strong>Comment ça marche (compendium).</strong> 10 clés par jour. Tu choisis une difficulté, puis tu draftes une équipe : 1 costume parmi 4 proposés par emplacement, plus un 5e « joker » choisi librement. Tes costumes possédés gardent leurs doublons, Potentiels et Awakening, mais <strong>pas leur équipement</strong>. En montant, tu choisis ta route (combats, élites, artefacts, événements, boutique aux étages 11 et 21) et tu gagnes du Lost Silver, avec 5 % d'intérêts à chaque étage. Le hasard est figé : relancer le même combat à l'identique donne le même résultat. Astuce : remplacer un perso en combat coûte 2 SP et remet ses recharges à zéro. Avec l'Obsidian, achète d'abord Refresh Attempts Up et Starting SP Up.</p>
<h4>Tower of Desire</h4>
<p>Des combats normaux : il suffit de gagner. Ta équipe d'histoire suffit jusqu'à l'étage 150 environ, et Diana y est ta meilleure amie. À partir de l'étage 151, il faut jouer l'élément avec Diana et le bon DPS. Chaque étage donne au moins 1 <button class="term" data-tip="Ticket de tirage normal" type="button">Draw Ticket</button>.</p>
<h4>Towers of Wrath et of Jealousy</h4>
<p>Wrath impose une équipe <strong>magique</strong> (ou au moins un DPS magique), Jealousy une équipe <strong>physique</strong>, avec des effets spéciaux qui changent tous les 10 étages à partir du 11e. Leurs ennemis n'ont <strong>aucun élément</strong> : Diana n'y sert à rien. Les debuffs et le repoussement de l'autre type de dégâts marchent quand même. Chaque 5e et 10e étage rapporte des Draw Tickets, des Dia et des Refining Crystals. À partir de l'étage 41, la difficulté grimpe nettement.</p>
<figure class="shot"><button aria-label="Agrandir : Tower of Wrath étage 40 et ses effets spéciaux" class="shot-btn" data-full="img/bd2-1000095433.jpg" type="button"><img alt="Tower of Wrath étage 40 et ses effets spéciaux" loading="lazy" src="img/bd2-1000095433.jpg"/></button><figcaption>Tower of Wrath étage 40 et ses effets spéciaux</figcaption></figure>
</div></article><article class="step" data-step="7"><div class="step-head"><h3 id="s5-9">Étape 7 — Collection Buff</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="7"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Le Collection Buff est un bonus de stats qui s'applique à <strong>tous</strong> tes personnages. Il plafonne à <strong>80 %</strong> : au-delà, ni les objets, ni l'équipement, ni les costumes ne le font monter. Objectif de la semaine : 50 % de bonus en PV.</p>
<ul>
<li><strong>Fouille toujours autour de toi</strong> pour ramasser les objets de collection (les petits scintillements sur la carte).</li>
<li>Chaque carte « sûre » a son propre nombre d'objets à fouiller. Ouvre la minimap pour voir le compteur.</li>
<li>Certains objets ne se fouillent qu'avec la capacité <strong>Search</strong> de Lathel.</li>
</ul>
<figure class="shot"><button aria-label="Agrandir : Minimap avec le compteur d'objets trouvés" class="shot-btn" data-full="img/bd2-1000095434.jpg" type="button"><img alt="Minimap avec le compteur d'objets trouvés" loading="lazy" src="img/bd2-1000095434.jpg"/></button><figcaption>Minimap avec le compteur d'objets trouvés</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Récompenses uniques : fouilles de base et fouilles avec Search" class="shot-btn" data-full="img/bd2-1000095435.jpg" type="button"><img alt="Récompenses uniques : fouilles de base et fouilles avec Search" loading="lazy" src="img/bd2-1000095435.jpg"/></button><figcaption>Récompenses uniques : fouilles de base et fouilles avec Search</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Écran Collection avec les Collection Buffs" class="shot-btn" data-full="img/bd2-1000095436.jpg" type="button"><img alt="Écran Collection avec les Collection Buffs" loading="lazy" src="img/bd2-1000095436.jpg"/></button><figcaption>Écran Collection avec les Collection Buffs</figcaption></figure>
<p><strong>Outils pour tout trouver</strong> (en anglais) : la <a href="https://browndust2-wiki.souseha.com/en/maps" target="_blank" rel="noopener">carte interactive du wiki Browndust2</a> montre l'emplacement des objets, et la <a href="https://docs.google.com/spreadsheets/d/1ePZc0xGtZwoJFbQ2EXJmHdaIlx2Uro_5-suCEohihhU/edit?gid=2007043438#gid=2007043438" target="_blank" rel="noopener">feuille communautaire</a> liste tous les objets de collection.</p>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Complément du compendium.</strong> Dans le menu <strong>Collection</strong> de l'accueil, tu suis les costumes, armes et objets récupérés, qui donnent ces bonus permanents. En haut à gauche de l'écran de terrain, le résumé de la zone indique les objets, fouilles et monstres qu'il reste.</p>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong></p>
<ul>
<li><strong>Les PV</strong> viennent des objets de collection et des recettes (recettes : niveau de la capacité de cuisine, succès, packs d'histoire, de persos et d'événements). <strong>L'ATK et la MATK</strong> viennent des doublons de persos et de costumes, et de l'équipement de différents paliers.</li>
<li><strong>Où sont les objets</strong> : dans les chapitres 1 à 14, à l'intérieur des bâtiments des zones sûres ; dans le chapitre 15 et les packs de persos et d'événements, dans la zone sûre elle-même.</li>
<li>Astuce : copie la feuille communautaire et surligne ce que tu as déjà. Le <a href="https://browndust2-wiki.souseha.com/collections" target="_blank" rel="noopener">wiki Souseha</a> liste aussi toutes les collections.</li>
</ul>
<figure class="shot dc"><button aria-label="Agrandir : Les objets à fouiller d'une zone sûre, et le compteur de la minicarte" class="shot-btn" data-full="img/dc-obj.jpg" type="button"><img alt="Les objets à fouiller d'une zone sûre, et le compteur de la minicarte" loading="lazy" src="img/dc-obj.jpg"/></button><figcaption>Les objets à fouiller d'une zone sûre, et le compteur de la minicarte<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<figure class="shot dc"><button aria-label="Agrandir : L'écran Collection et ses catégories" class="shot-btn" data-full="img/dc-collection.jpg" type="button"><img alt="L'écran Collection et ses catégories" loading="lazy" src="img/dc-collection.jpg"/></button><figcaption>L'écran Collection et ses catégories<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
</div></article><article class="step" data-step="8"><div class="step-head"><h3 id="s5-10">Étape 8 — Combats d'événement et Fiend Hunter</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="8"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Un <strong>Season Event</strong> dure en général deux semaines : une histoire, 15 combats Normal et 15 combats Challenge, un Fiend Hunter, des missions et une boutique. Tu y accèdes par l'icône à droite de l'écran d'accueil.</p>
<h4>Les combats d'événement</h4>
<p>Remplis les <strong>3 conditions</strong> de chaque combat pour les récompenses en plus : gagner, gagner sans perte (ou avec moins de 2 persos épuisés selon le combat), et gagner en 8 tours maximum.</p>
<figure class="shot"><button aria-label="Agrandir : Conditions d'un combat d'événement, dont « tout le monde survit »" class="shot-btn" data-full="img/bd2-1000095437.jpg" type="button"><img alt="Conditions d'un combat d'événement, dont « tout le monde survit »" loading="lazy" src="img/bd2-1000095437.jpg"/></button><figcaption>Conditions d'un combat d'événement, dont « tout le monde survit »</figcaption></figure>
<ul>
<li><strong>N'utilise pas Wiggle</strong> dans certains combats : il s'auto-détruit et te fait rater la condition « tout le monde survit ».</li>
<li>Le bonus des <strong>costumes d'événement</strong> s'applique même si tu ne les utilises pas en combat : il suffit de les posséder. Chacun augmente la monnaie gagnée, jusqu'à +100 %.</li>
</ul>
<figure class="shot"><button aria-label="Agrandir : Bonus des costumes d'événement" class="shot-btn" data-full="img/bd2-1000095438.jpg" type="button"><img alt="Bonus des costumes d'événement" loading="lazy" src="img/bd2-1000095438.jpg"/></button><figcaption>Bonus des costumes d'événement</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Compléments du compendium.</strong> Tu as <strong>5 tentatives par jour</strong> (reset à minuit), soit 70 sur l'événement. Une défaite ou un abandon ne coûte rien : expérimente. Finir les combats 5, 10 ou 15 avec toutes les conditions débloque le <strong>Quick Battle</strong>, et le bouton <strong>Auto-Play</strong> enchaîne les combats tout seul. N'achète pas de tentatives avec des Dia, sauf s'il te manque de quoi prendre les objets prioritaires le dernier jour.</p>
<h4>La boutique d'événement</h4>
<p>C'est un bon moyen de booster vite ton compte. Elle reste ouverte <strong>28 jours</strong> : fais défiler le logo de l'événement pour retrouver l'ancienne boutique. Ordre d'achat du compendium :</p>
<ol>
<li>Tear of the Goddess ×1 (1 000, puis 2 000, puis 3 000 de monnaie)</li>
<li><button class="term" data-tip="Sert au Burst" type="button">Spark of Rampage</button> ×30 (600)</li>
<li>Draw Ticket ×15 (6 000)</li>
<li><button class="term" data-tip="Cristal ancien — Fabriquer l'équipement UR" type="button">Ancient Crystal</button> ×40 (2 400)</li>
<li>Essences de Strength, Life et Perseverance ×50 (1 000 chacune)</li>
<li>Équipement d'événement UR (3 000) avec ses 27 matériaux d'amélioration (2 700)</li>
<li><button class="term" data-tip="Changent les options (substats)" type="button">Refining Crystal</button> ×500 (1 500)</li>
<li>Ensuite : or, Ability Pills, Slimes, puis <button class="term" data-tip="Poudre / Cristal / Pierre de raffinage — Monter le score de raffinage (poudre) et relancer les options (pierres, cristaux)" type="button">Refining Powder</button> et or à volonté</li>
</ol>
<p>L'<strong>équipement Fiend</strong> (de la boutique d'événement) est excellent pour débuter : il obtient toujours le meilleur score de raffinage (24, ou SSS) et s'améliore sans or ni échec. N'achète pas la version SR, seulement l'UR.</p>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong></p>
<ul>
<li>Les <strong>tentatives de combat en plus</strong> : seulement s'il te manque des Tears, ou pour un événement important (par exemple un costume +5 gratuit).</li>
<li>L'<strong>équipement UR d'événement</strong> : seulement si tu peux aussi payer ses 27 matériaux (5 700 de monnaie en tout) ; sinon, passe ton tour.</li>
<li>Les <strong>Sparks</strong> : toujours, ils sont rares.</li>
<li>Les <strong>Engraving Scrolls</strong> s'obtiennent mieux à l'Evil Castle et à la guilde.</li>
<li><strong>À ne pas acheter</strong> : l'équipement SR d'événement et ses 18 matériaux, les étoiles de rang ★3, ★2 et ★1, et les Yellow Slimes.</li>
</ul>
<figure class="shot"><button aria-label="Agrandir : Équipement UR d'événement avec un rang SSS" class="shot-btn" data-full="img/bd2-1000095439.jpg" type="button"><img alt="Équipement UR d'événement avec un rang SSS" loading="lazy" src="img/bd2-1000095439.jpg"/></button><figcaption>Équipement UR d'événement avec un rang SSS</figcaption></figure>
<h4>Fiend Hunter (FH)</h4>
<p>C'est un boss qui change chaque saison et qu'on affronte avec jusqu'à 3 équipes de 5. La première semaine sert à s'entraîner (Practice, sans récompenses), la seconde à l'attaquer pour de vrai (Hunting Period). <strong>Seul ton meilleur essai compte</strong> : tu peux réessayer autant que tu veux, mais pour toucher les récompenses d'une difficulté, il faut vider les PV du Fiend en un seul essai. Tes dégâts valident alors aussi toutes les difficultés plus faibles.</p>
<figure class="shot"><button aria-label="Agrandir : Fiend Hunter (ancienne version : le bouton Quick Battle n'existe plus)" class="shot-btn" data-full="img/bd2-1000095440.jpg" type="button"><img alt="Fiend Hunter (ancienne version : le bouton Quick Battle n'existe plus)" loading="lazy" src="img/bd2-1000095440.jpg"/></button><figcaption>Fiend Hunter (ancienne version : le bouton Quick Battle n'existe plus)</figcaption></figure>
<p class="callout warn"><span class="co-tag">Attention</span><strong>Attention aux anciens guides.</strong> Certains guides, dont celui du bot du Discord officiel, parlent encore de « niveaux » (Lv.15, 3 Draw Tickets par niveau) et d'un Quick Battle quotidien qui reportait tes dégâts d'un jour à l'autre. Ce système a été remplacé par <strong>5 difficultés au choix</strong> : Easy, Normal, Hard, Very Hard et Challenge (compendium, octobre 2026). Tes dégâts valident automatiquement toutes les difficultés dont les PV sont inférieurs.</p>

<p>En finissant Hard, tu gagnes donc 30 Draw Tickets, plus au moins 3 au classement : au moins <strong>33 Draw Tickets</strong> à chaque saison.</p>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong> Semaine 1 : entraînement et préparation ; semaine 2 : la chasse, jusqu'au dernier jour à 15:00 UTC. Pour tes 3 équipes, on joue souvent une équipe de dégâts et des équipes utilitaires.</p>
<p>Même avec peu de dégâts, attaque le boss : tu gagnes au minimum la récompense de classement. Pour les stratégies, le compendium recommande les vidéos YouTube de <strong>Pod</strong> (accessibles) et <strong>Shimonami</strong> (avancées), et la base de compositions de <a href="https://browndust2-db.souseha.com/en/formation/list" target="_blank" rel="noopener">Souseha</a>.</p>
</div></article><article class="step" data-step="9"><div class="step-head"><h3 id="s5-11">Étape 9 — Last Night</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="9"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Last Night se débloque avec les quêtes principales du Story Pack 3. Tu y frappes un boss unique avec une équipe de <strong>20 costumes</strong>, et le jeu garde ton meilleur score. <strong>Pas besoin d'y aller chaque jour</strong> pour toucher la récompense quotidienne.</p>
<p>C'est une de tes sources principales d'<strong>Ancient Crystals</strong>, nécessaires pour crafter l'équipement UR.</p>

<figure class="shot"><button aria-label="Agrandir : Récompense Last Night à 10 000 de dégâts" class="shot-btn" data-full="img/bd2-1000095441.jpg" type="button"><img alt="Récompense Last Night à 10 000 de dégâts" loading="lazy" src="img/bd2-1000095441.jpg"/></button><figcaption>Récompense Last Night à 10 000 de dégâts</figcaption></figure>
<p class="callout key"><span class="co-tag">À retenir</span><strong>Récupérer la récompense.</strong> <strong>Isaac</strong> te l'apporte chaque jour, avec les petites créatures du Dispatch, à ta première connexion après le reset. Il faut <strong>interagir avec lui</strong> sur la carte, dans n'importe quel pack sauf Golden Colosseum, Glupy Diner, Soul Wager, Territory et Fishing Voyage.</p>
<figure class="shot"><button aria-label="Agrandir : Isaac et les créatures du Dispatch sur la carte" class="shot-btn" data-full="img/bd2-1000095442.jpg" type="button"><img alt="Isaac et les créatures du Dispatch sur la carte" loading="lazy" src="img/bd2-1000095442.jpg"/></button><figcaption>Isaac et les créatures du Dispatch sur la carte</figcaption></figure>
<h4>Le Support Bonus : rien n'est gaspillé</h4>
<p>C'est grâce à ce mode qu'aucune ressource n'est « perdue » : tous les costumes <strong>que tu n'utilises pas</strong> dans l'équipe donnent un bonus de dégâts. Chaque costume ajoute (puissance de combat de son personnage ÷ 1 000) %. Équipe donc en priorité les persos qui ont beaucoup de costumes, comme Justia et Lathel.</p>
<figure class="shot"><button aria-label="Agrandir : Le Support Bonus dépend du niveau, des costumes, de l'équipement, du Potentiel, de l'Awakening et de l'Engraving" class="shot-btn" data-full="img/bd2-1000095443.jpg" type="button"><img alt="Le Support Bonus dépend du niveau, des costumes, de l'équipement, du Potentiel, de l'Awakening et de l'Engraving" loading="lazy" src="img/bd2-1000095443.jpg"/></button><figcaption>Le Support Bonus dépend du niveau, des costumes, de l'équipement, du Potentiel, de l'Awakening et de l'Engraving</figcaption></figure>
<p><strong>Règles du combat (compendium).</strong></p>
<ul>
<li>Tes 20 costumes agissent une fois chacun dans l'ordre, sans coût en SP, puis le combat s'arrête.</li>
<li>Le boss occupe une seule case, n'a pas d'élément (Diana inutile) et ignore les debuffs. La limite de <button class="term" data-tip="Chaîne — Chaque coup sur la même cible dans un tour augmente les dégâts suivants" type="button">Chain</button> est retirée.</li>
<li>Un effet de « Pressure » divise par 2 les buffs de stats. Les buffs d'<button class="term" data-tip="Buff qui augmente les dégâts des alliés" type="button">Augmentation</button> et les Chains ne sont pas touchés.</li>
<li>L'équipement de Last Night est enregistré à part : pense à le mettre à jour.</li>
<li>Ordre conseillé : buffers, puis persos qui frappent beaucoup de fois (Chain), puis gros DPS à la fin. Le costume Promise of Vengeance de Lathel (gratuit au Story Pack 7) y est un bon DPS, et New Hire Nebris le meilleur.</li>
</ul>
</div></article><article class="step" data-step="10"><div class="step-head"><h3 id="s5-12">Étape 10 — Glupy Diner et Glu Talk</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="10"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Le <strong>Glupy Diner</strong> est un restaurant à gérer, ouvert dès le début du jeu, qui te donne un revenu passif : or, Refining Powder et cristaux de magie. Il permet aussi des rencontres animées (Live2D) avec certains costumes. Tu commences avec <strong>3 000 Glupy Stars</strong>, largement de quoi le passer niveau 2 tout de suite.</p>
<ul>
<li>Le niveau 1 a 5 améliorations qui coûtent 500, 525, 551, 579 et 608 Glupy Stars.</li>
<li>Chaque niveau augmente ce que le restaurant rapporte par minute (niveau 2 : 8 or/min au lieu de 7, 4 Glupy Stars/min au lieu de 3).</li>
<li>Les heures d'ouverture plafonnent à <strong>24 heures</strong>. Au-delà, il ne produit plus rien tant que tu n'encaisses pas (Checkout). Passe régulièrement pour encaisser et monter de niveau au plus vite.</li>
</ul>
<figure class="shot"><button aria-label="Agrandir : Vue du Glupy Diner" class="shot-btn" data-full="img/bd2-1000095444.jpg" type="button"><img alt="Vue du Glupy Diner" loading="lazy" src="img/bd2-1000095444.jpg"/></button><figcaption>Vue du Glupy Diner</figcaption></figure>

<p class="callout info"><span class="co-tag">Compendium</span><strong>Compléments du compendium.</strong> Le restaurant monte jusqu'au niveau 30 et donne jusqu'à 20 Deco Coins par jour. Le bouton <strong>Business Management</strong> de l'accueil encaisse l'or, la Powder et les Stars sans entrer dans le pack. Les Deco Coins et les cristaux de magie, eux, demandent d'aller dans le pack.</p>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong></p>
<ul>
<li>Les <strong>Deco Coins</strong> se gagnent en touchant les bulles au-dessus des PNJ et des objets.</li>
<li><strong>Les habitués (Regular Guests)</strong> : chaque jour, 5 costumes de ta collection viennent au restaurant. Parle-leur pour gagner des récompenses (cristaux de magie).</li>
<li><strong>Le carnet des habitués (Regular Note)</strong> : <strong>100 Dia par perso</strong> une fois qu'il est venu 3 fois en tout. Touche « <strong>Obtain all</strong> » quand le bouton s'allume.</li>
<li>Le compteur « Diner Sales » est aussi en haut à gauche de l'écran d'accueil.</li>
</ul>
<figure class="shot dc"><button aria-label="Agrandir : Glupy Diner : encaisser les ventes, les habitués et le Regular Note (100 Dia par perso)" class="shot-btn" data-full="img/dc-glupy.jpg" type="button"><img alt="Glupy Diner : encaisser les ventes, les habitués et le Regular Note (100 Dia par perso)" loading="lazy" src="img/dc-glupy.jpg"/></button><figcaption>Glupy Diner : encaisser les ventes, les habitués et le Regular Note (100 Dia par perso)<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h4>Glu Talk</h4>
<p>Tu ne peux discuter dans Glu Talk qu'avec les personnages dont tu possèdes le costume concerné. Seuls quelques costumes ont ces rencontres pour l'instant, d'autres arrivent.</p>
<ul>
<li>Tu ne rencontres qu'<strong>un Fated Guest par jour</strong>. Les autres, ce sera le lendemain.</li>
<li>La <strong>première rencontre</strong> avec un Fated Guest ne consomme pas ton point de rencontre du jour.</li>
<li>Objectif de la semaine : débloquer la 4e rencontre d'un ami.</li>
</ul>
<p><strong>Pas à pas (Discord officiel, novembre 2026).</strong> Va dans un pack de perso, puis au Glupy Diner. Le Fated Guest du jour a une <strong>bulle rose</strong> : parle-lui. Ensuite, tu peux la contacter dans GluTalk, en haut à gauche de l'accueil. En lui parlant 3 fois par jour, l'interaction se débloque en <strong>3 jours</strong> environ. Le Discord tient deux listes vidéo : <a href="https://youtube.com/playlist?list=PLSWDlsPYyQpjMJyTryB7UapeDayIyy8Z2" target="_blank" rel="noopener">interactions gratuites</a> et <a href="https://www.youtube.com/playlist?list=PLSWDlsPYyQpjvDzGdYTMSWIxdd_jb8c2b" target="_blank" rel="noopener">interactions payantes</a>.</p>

</div></article><article class="step" data-step="11"><div class="step-head"><h3 id="s5-13">Étape 11 — Optimiser l'équipement</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="11"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Il y a deux leviers pour rendre une pièce meilleure et adaptée à ton perso : monter son <strong>score de raffinage</strong> (appelé aussi rang d'amélioration), et changer sa <strong>stat principale et ses options</strong> (substats).</p>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Lettres ou score ?</strong> Les captures du Discord montrent l'ancien affichage en lettres (C, B, A, S). Le jeu affiche maintenant un <strong>score de 6 à 24</strong> dans une étoile : BBS = 18, SSS = 24. Voir la section 10.</p>
<h4>Le score de raffinage et la Refining Powder</h4>
<p>Monter le score coûte de la <strong>Refining Powder</strong>. Tu en obtiens en démontant de l'équipement, ou dans la boutique d'événement s'il te reste de la monnaie.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Démonter une pièce…</th>
<th>Donne</th>
<th>Powder en plus par niveau (+1)</th>
</tr>
</thead>
<tbody>
<tr>
<td>R</td>
<td>Refining Stones + Powder</td>
<td>+2</td>
</tr>
<tr>
<td>SR</td>
<td>Refining Crystals + Powder</td>
<td>+9</td>
</tr>
<tr>
<td>UR</td>
<td>Refining Crystals + Powder</td>
<td>+72</td>
</tr>
</tbody>
</table></div>
<p>Plus la pièce est améliorée, plus elle rend de Powder. Le nombre de Stones et de Crystals, lui, ne dépend que du palier (I à IV), pas du niveau. Conseil : monte tes pièces à <strong>+6 ou +8 avant de les démonter</strong> si tu as de l'or en trop (le compendium vise +7, le meilleur rapport or/Powder).</p>
<p>Utilise <strong>Upgrade All</strong> pour améliorer en masse et <strong>Select Gear</strong> pour démonter en masse. Les pièces verrouillées ou équipées ne sont jamais démontées.</p>
<figure class="shot"><button aria-label="Agrandir : Inventaire d'équipement R" class="shot-btn" data-full="img/bd2-1000095448.jpg" type="button"><img alt="Inventaire d'équipement R" loading="lazy" src="img/bd2-1000095448.jpg"/></button><figcaption>Inventaire d'équipement R</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Boutons Craft Gear, Upgrade All et Select Gear" class="shot-btn" data-full="img/bd2-1000095449.jpg" type="button"><img alt="Boutons Craft Gear, Upgrade All et Select Gear" loading="lazy" src="img/bd2-1000095449.jpg"/></button><figcaption>Boutons Craft Gear, Upgrade All et Select Gear</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Raffinage dans l'ancien affichage en lettres (C, A, B)" class="shot-btn" data-full="img/bd2-1000095450.jpg" type="button"><img alt="Raffinage dans l'ancien affichage en lettres (C, A, B)" loading="lazy" src="img/bd2-1000095450.jpg"/></button><figcaption>Raffinage dans l'ancien affichage en lettres (C, A, B)</figcaption></figure>
<h4>Les options (substats)</h4>
<p>Changer les options permet à ton perso de faire plus de dégâts ou de mieux survivre.</p>
<ul>
<li>La <strong>valeur</strong> des options ne change <strong>jamais</strong> avec le score de raffinage : une Rare IV au score 12 (BBB) a les mêmes options qu'une Rare IV au score 24 (SSS). Seul le palier (I, II, III, IV) compte : plus il est bas, plus les options sont faibles.</li>
<li>Pour changer les options : <strong>Refining Stones</strong> pour l'équipement N et R. Pour le SR et l'UR, le jeu utilise d'abord tes Refining Stones, puis les <strong>Refining Crystals</strong> (10 pierres = 1 cristal).</li>
<li><strong>Attention aux Refining Crystals</strong> : ils sont rares. Ne les utilise que sur de l'UR IV ou de l'UR EX.</li>
</ul>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Compléments du compendium.</strong> Tu peux <strong>verrouiller</strong> une option pour la garder, mais chaque verrou augmente le coût (jusqu'à ×4 avec 3 verrous). Après un tirage, tu choisis entre garder l'ancienne (Keep Option), prendre la nouvelle (Confirm) ou relancer (Retry). Sans réponse sous 12 heures, le jeu garde l'ancienne. Pour un DPS classique, vise ATK ou MATK sur l'arme et les gants, puis <button class="term" data-tip="Chance / Dégâts critiques" type="button">Crit DMG</button> ou <button class="term" data-tip="Chance / Dégâts critiques" type="button">Crit Rate</button>.</p>
<h4>L'objectif : un Knight's Ring IV parfait</h4>
<p>Le dernier objectif de la checklist : un <strong>Knight's Ring IV (R)</strong> au score <strong>18</strong> (rang <strong>BBS</strong> dans l'ancien affichage) avec ses 3 options en <strong>Crit DMG</strong>.</p>
<figure class="shot"><button aria-label="Agrandir : Knight's Ring IV R +9 avec 3 options Crit DMG" class="shot-btn" data-full="img/bd2-1000095451.jpg" type="button"><img alt="Knight's Ring IV R +9 avec 3 options Crit DMG" loading="lazy" src="img/bd2-1000095451.jpg"/></button><figcaption>Knight's Ring IV R +9 avec 3 options Crit DMG</figcaption></figure>
</div></article><article class="step" data-step="12"><div class="step-head"><h3 id="s5-14">Étape 12 — Recruter Liberta</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="12"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Une fois le <strong>Story Pack 15</strong> fini, tu croises <strong>Dark Saintess Liberta</strong> à la taverne. Comme Diana, elle se recrute contre <strong>1 contrat de recrutement ★5</strong>. C'est elle qui justifie de foncer jusqu'au pack 15.</p>
<figure class="shot"><button aria-label="Agrandir : Liberta à la taverne du Story Pack 15" class="shot-btn" data-full="img/bd2-1000095452.jpg" type="button"><img alt="Liberta à la taverne du Story Pack 15" loading="lazy" src="img/bd2-1000095452.jpg"/></button><figcaption>Liberta à la taverne du Story Pack 15</figcaption></figure>
<p class="callout warn"><span class="co-tag">Attention</span><strong>Ce pack n'est pas facile pour un débutant.</strong> Les ennemis normaux ont environ 50 000 PV et les boss entre 200 000 et 350 000. Équipe-toi bien avant de t'y attaquer.</p>
<p class="callout key"><span class="co-tag">À retenir</span><strong>Pourquoi elle est indispensable.</strong> Dark Saintess Liberta est un costume <strong>incontournable</strong> : elle buffe l'ATK <strong>et</strong> le taux de critique, et rend 3 SP à tes alliés. Elle est la base de toutes les équipes <strong>physiques</strong>.</p>
<figure class="shot"><button aria-label="Agrandir : Compétence Prayer of Duality : +3 SP, +65 % d'ATK et +25 % de taux de critique pendant 4 tours" class="shot-btn" data-full="img/bd2-1000095453.jpg" type="button"><img alt="Compétence Prayer of Duality : +3 SP, +65 % d'ATK et +25 % de taux de critique pendant 4 tours" loading="lazy" src="img/bd2-1000095453.jpg"/></button><figcaption>Compétence Prayer of Duality : +3 SP, +65 % d'ATK et +25 % de taux de critique pendant 4 tours</figcaption></figure>
<ul>
<li>Elle marche même à <strong>+0</strong>, du moment que tous ses Potentiels sont débloqués.</li>
<li>Avec Liberta (+0, Potentiel complet) et Arines +5, ton équipe reçoit au total <strong>+135 % d'ATK et +55 % de taux de critique</strong>.</li>
<li>À +3, son buff de taux de critique monte à +50 %.</li>
</ul>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Complément du compendium.</strong> Dans l'équipe « cible unique » de départ, Liberta peut remplacer Arines (si elle est à +2 ou plus) ou Homunculus Lathel. Si tu ne l'as pas encore recrutée, ne la mets pas au-delà de +4 dans le banner 12-Pick : le recrutement te donnera la copie manquante.</p>
</div></article></div></section>

y Angel) en Normal : débloque le Hunting Ground 7</span></label></li><li class="task"><label><input class="tick" data-k="f0a02c22a1" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Le finir en Hard, puis en Very Hard (Hunting Ground 7 en Hard et Very Hard)</span></label></li><li class="task"><label><input class="tick" data-k="fb634b99df" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir le Story Pack 9 (Bloody Rhapsody) en Normal : débloque la Tower of Salvation et le Hunting Ground 9</span></label></li><li class="task"><label><input class="tick" data-k="6c04d5cac4" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Le finir en Hard, puis en Very Hard (Hunting Ground 9 en Hard et Very Hard)</span></label></li><li class="task"><label><input class="tick" data-k="913b8f6c52" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir la Tower of Salvation au niveau 1 ou plus, pour les récompenses de saison</span></label></li><li class="task"><label><input class="tick" data-k="bd0187cb56" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir le Story Pack 10 (Homunculus) en Normal : débloque Diana à la taverne</span></label></li><li class="task"><label><input class="tick" data-k="d8a9adf0e5" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Recruter Adventurer of the Unknown Diana</span></label></li><li class="task"><label><input class="tick" data-k="bed6b823d3" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Monter Crafting au rang Legendary</span></label></li><li class="task"><label><input class="tick" data-k="42bf261e59" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Monter Alchemy au rang Legendary</span></label></li><li class="task"><label><input class="tick" data-k="d64dec0294" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir le Story Pack 15 (Promise of Vengeance) en Normal : débloque Liberta à la taverne</span></label></li><li class="task"><label><input class="tick" data-k="c46c478a95" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Recruter Dark Saintess Liberta</span></label></li></ul></div>

<section class="chapter" id="s7" data-title="Routines"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2"/><path d="M9 3h6"/></svg><b>07</b></span><h2>Routines</h2></header><div class="ch-body">
<h3 id="s7-1">Ta routine quotidienne en 10 à 15 minutes</h3>
<p>Tes dailies prennent 10 à 15 minutes, hors événements spéciaux. Fais-les dans cet ordre, sauf si une mission du jour t'impose autre chose.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Étape</th>
<th>Durée</th>
<th>À faire</th>
</tr>
</thead>
<tbody>
<tr>
<td>1. Tirages gratuits et connexion</td>
<td>moins d'1 min</td>
<td>1 tirage gratuit par bannière mise en avant ; récupère la boîte aux lettres. Pour le Dispatch (Olstein, Diana) et Last Night, va parler à Isaac et aux petites créatures sur la carte.</td>
</tr>
<tr>
<td>2. Riz cuit et torches</td>
<td>moins d'1 min</td>
<td>1 combat en Hunting Grounds (ou 1 auto pour 6 riz) pour la quête du jour. Le reste du riz va en Path of Adventure sur l'or ou les slimes, selon le jour. Torches : Magic Crystal Cave.</td>
</tr>
<tr>
<td>3. Équipement</td>
<td>2 min</td>
<td>Fabrique, démonte, améliore ou raffine, selon ce que demandent les missions de la passe.</td>
</tr>
<tr>
<td>4. Trouvailles et Gluttis</td>
<td>1 à 2 min</td>
<td>Ramasse au moins une trouvaille (lueurs bleues ou vertes) et un Glutti (créature bleue à oreilles de lapin). Les Gluttis fuient, rattrape-les avec le dash des bottes.</td>
</tr>
<tr>
<td>5. Panneau d'annonces (facultatif)</td>
<td>3 à 5 min</td>
<td>Jusqu'à 3 quêtes par jour pour de l'or. Finir une quête d'un pack donne 10 % de réduction chez son marchand pendant quelques jours.</td>
</tr>
<tr>
<td>6. Taverne</td>
<td>moins d'1 min</td>
<td>2 persos aléatoires, renouvelés toutes les 2 heures. Ne recrute que des 5★.</td>
</tr>
<tr>
<td>7. Mirror Wars</td>
<td>1 à 6 min</td>
<td>40 combats gratuits par jour. Un seul suffit pour la mission ; fais les 40 en auto si tu peux, pour les médailles.</td>
</tr>
<tr>
<td>8. Récompenses</td>
<td>moins d'1 min</td>
<td>Récupère la passe de saison, les missions et les événements en cours.</td>
</tr>
</tbody>
</table></div>
<h3 id="s7-2">Détails utiles</h3>
<ul>
<li>
<p><strong>Passe premium</strong> : à chaque saison, achète-la pour 1000 dias. Tu gagnes plus de 10 tickets de tirage, qui valent à eux seuls environ 2000 dias.</p>
</li>
<li>
<p><strong>Passe premium, le bon moment</strong> (<code>?spc</code>, Discord officiel) : les missions quotidiennes du passe donnent 230 XP de passe par jour, et chaque niveau demande plus d'XP que le précédent. Acheter le premium donne tout de suite <strong>+3 niveaux</strong> : si tu manques d'XP pour finir le passe, achète-le vers le <strong>niveau 17</strong>, c'est là qu'il rapporte le plus. Acheter des niveaux avec des Dia coûte de plus en plus cher ; le <a href="https://browndust2-wiki.souseha.com/en/pass-count" target="_blank" rel="noopener">calculateur de passe de Souseha</a> te dit combien d'XP il te manque (sa suggestion de dépense en Dia est indicative).</p>
</li>
<li><strong>Character Pass</strong> : chaque mois, finir ses 7 jours de missions donne un costume (Discord officiel).</li>
<li><strong>Heures de reset</strong> (confirmées par la commande <code>?rtime</code> du Discord officiel) : reset quotidien à <strong>00:00 UTC</strong> (01:00 en Belgique en hiver, 02:00 en été) ; Golden Colosseum le mercredi à 15:00 UTC ; <strong>Mirror Wars le dimanche à 15:00 UTC</strong> ; reset mensuel (boutiques) le 1er du mois à 00:00 UTC.</li>
<li><strong>Newbie Pass</strong> : 7 jours de quêtes avec des slimes, tickets de recrutement, dias et contrats. Fais toutes ses quêtes.</li>
<li><strong>Missions hebdo</strong> : remplis aussi la barre hebdomadaire, qui donne plus de dias que la quotidienne.</li>
<li><strong>Last Night</strong> : fais-y au moins 10 000 de dégâts une fois. Isaac te livrera ensuite de l'or et des Cristaux anciens chaque jour selon ton meilleur score, à condition d'aller lui parler sur la carte.</li>
<li><strong>Événements</strong> : ils durent en général 2 semaines. Participe pour les récompenses et les boutiques d'événement.</li>
</ul>

<h4>Le cycle de 28 jours</h4>
<p>Certains contenus tournent sur un cycle de 4 semaines. Le Golden Colosseum revient chaque semaine, le Guild Raid en semaine 1, le Fiend Hunter en semaines 2 et 4. Chaque semaine se termine à 15:00 UTC, soit <strong>16:00 en Belgique</strong> en hiver (17:00 en été).</p><div id="cycle-cal" class="widget"></div><p class="small">Calendrier calculé à partir de celui du compendium. Les jours fériés coréens décalent parfois un contenu d&#x27;un jour : en cas de doute, vérifie en jeu.</p>
</div></section>
<section class="chapter" id="s8" data-title="Le combat"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19L15 9"/><path d="M14 5l5 0 0 5"/><path d="M19 19L9 9"/><path d="M10 5H5v5"/></svg><b>08</b></span><h2>Le combat</h2></header><div class="ch-body">
<p>Le combat est au tour par tour, tu joues toujours en premier et il n'y a pas de limite de temps : prends le temps de préparer ton tour. L'objectif est de tuer un maximum d'ennemis dès le premier tour, pour subir moins d'attaques en retour.</p>
<h3 id="s8-1">Le terrain</h3>
<ul>
<li>Chaque camp a 3 lanes (colonnes) de 4 cases. Tu ne choisis pas ta cible : chaque perso attaque l'ennemi de sa propre lane. Sans ennemi dans sa lane, il vise le plus proche.</li>
<li>Avant chaque tour, tu peux déplacer librement tes persos entre les lanes pour changer leurs cibles ou esquiver les attaques ennemies.</li>
<li>Glisse les portraits dans la liste d'ordre de tour : celui du haut agit en premier. Bien ordonner ses actions fait la différence.</li>
<li>Touche un perso pour voir sa cible : trait vert pour les actions de tes alliés (supports), trait rouge pour les attaques ennemies qui le visent, trait de la couleur de l'élément pour la cible principale. Le trait indique aussi si le coup sera mortel.</li>
</ul>
<h3 id="s8-2">Les trois actions</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Action</th>
<th>Effet</th>
<th>À savoir</th>
</tr>
</thead>
<tbody>
<tr>
<td>Attaque normale</td>
<td>Frappe la cible de la lane</td>
<td>Action par défaut si tu ne donnes pas d'ordre ; génère 1 SP</td>
</tr>
<tr>
<td>Repoussement (knockback)</td>
<td>Pousse la cible d'une case, 1 dégât</td>
<td>Génère 1 SP ; sert à aligner les ennemis pour tes zones</td>
</tr>
<tr>
<td>Compétence (skill)</td>
<td>Gros dégâts ou effets</td>
<td>Coûte des SP, a un temps de recharge</td>
</tr>
</tbody>
</table></div>
<p>Les SP sont partagés par toute l'équipe et conservés d'un combat à l'autre. Un perso peut utiliser la compétence de chacun de ses costumes, chacune avec son propre temps de recharge. Les dégâts affichés sur une compétence ne tiennent pas compte de la défense des ennemis.</p>
<h3 id="s8-3">Mécaniques importantes</h3>
<ul>
<li><strong>Zone (AOE)</strong> : les cases dessinées à côté de l'attaque montrent ce qui est touché. La case centrale est la cible principale.</li>
<li><strong>Direction du repoussement</strong> : la plupart des persos poussent vers l'avant, mais certains poussent en diagonale ou sur le côté. Regarde la flèche sur la compétence.</li>
<li><strong>Chaîne (chain)</strong> : chaque coup sur la même cible dans un tour ajoute 1 chaîne, et chaque chaîne augmente de 10 % les dégâts du coup suivant. Elles se remettent à zéro en fin de tour.</li>
<li><strong>Éléments</strong> : <span class="el el-fire">Feu</span> bat <span class="el el-wind">Vent</span>, <span class="el el-wind">Vent</span> bat <span class="el el-water">Eau</span>, <span class="el el-water">Eau</span> bat <span class="el el-fire">Feu</span> ; <span class="el el-light">Lumière</span> et <span class="el el-dark">Ténèbres</span> sont chacun forts contre l'autre. L'élément fort donne +50 % de dégâts de base, plus avec l'Awakening, le Bonding ou Diana. L'élément faible réduit tes dégâts (la valeur exacte s'affiche dans l'écran de stats, et tu peux voir celles des ennemis en plein combat).</li>
<li><strong>Mort subite (<button class="term" data-tip="Mort subite — Combat trop long : tout le monde frappe plus fort" type="button">Death Time</button>)</strong> : après le tour 10, tous les 2 tours, toutes les unités gagnent +100 % d'ATK et de MATK, perdent 100 % de défense et de résistance magique, et prennent +50 % de dégâts (d'après le compendium, <a class="verify" href="#a-verifier">à vérifier en jeu</a>).</li>
</ul><figure class="wheel"><svg viewBox="0 0 320 210" role="img" aria-label="Roue des éléments : Feu bat Vent, Vent bat Eau, Eau bat Feu ; Lumière et Ténèbres se battent mutuellement">

<h3 id="s8-4">Méthode pour un tour</h3>
<ol>
<li>Touche un ennemi pour voir ses compétences et ce qu'il fera à son prochain tour. Son plan est déjà fixé.</li>
<li>Place tes persos hors de sa zone d'attaque. Si une attaque est inévitable, fais-la encaisser par le perso avec le plus de PV.</li>
<li>Utilise le repoussement pour aligner les ennemis, puis lance tes zones.</li>
<li>Ordonne les actions : repousseurs d'abord, gros dégâts ensuite.</li>
<li>Termine par End Turn.</li>
</ol>
<h3 id="s8-5">Le combat en détail</h3>
<ul>
<li><strong>Tours</strong> : en PvE, tu agis aux tours impairs (1, 3, 5…) et l'ennemi aux tours pairs. Tu places tes persos et choisis les costumes avant chaque tour, puis tout se joue automatiquement.</li>
<li><strong>Ciblage</strong> : chaque costume vise une <strong>cible principale</strong> (flèche vers le bas). « <button class="term" data-tip="Premier de la rangée / Saute le premier — Portée de l'attaque" type="button">Very Front</button> » vise l'ennemi le plus proche dans ta colonne, « Vault » saute par-dessus le premier pour viser le deuxième. S'il n'y a personne dans ta colonne, le perso vise la colonne à sa droite, puis celle à sa gauche.</li>
<li><strong>Chains</strong> : chaque coup porté sur un ennemi ajoute 1 <button class="term" data-tip="Chaîne — Chaque coup sur la même cible dans un tour augmente les dégâts suivants" type="button">Chain</button>, et chaque Chain ajoute +10 % de dégâts pour le reste du tour (plafond 100, sauf dans Last Night). Les persos qui frappent beaucoup de fois sont donc précieux, surtout dans Fiend Hunter et Guild Raid.</li>
<li><strong>Repoussement</strong> : il inflige toujours 1 dégât à la cible. Si l'ennemi poussé en percute un autre, celui-ci prend 25 % des PV max de l'ennemi poussé (calcul plafonné à 50 000 PV). Les boss du Fiend Hunter et du Guild Raid ne bougent jamais, et certains ennemis sont immunisés au recul.</li>
<li><strong>Death Time</strong> : après le tour 10 (histoire, événements, Mirror Wars, Evil Castle), tous les 2 tours chaque unité gagne +100 % d'ATK, perd 100 % de DEF et prend +50 % de dégâts.</li>
<li><strong>États courants</strong> : <button class="term" data-tip="Provocation — Force les ennemis à te cibler" type="button">Taunt</button> (oblige à viser cet ennemi), Counter (renvoie des dégâts), Evade (annule l'attaque, contourné par l'auto-destruction de Wiggle), <button class="term" data-tip="Bouclier de PV temporaires" type="button">Energy Guard</button> (bouclier), Immunity.</li>
<li><strong>Types de dégâts spéciaux</strong> : Fixed et Consumed ne font jamais de critique et ignorent la DEF ; Pure peut faire un critique et ignore la DEF et les boucliers.</li>
<li><strong>Outils utiles</strong> : Presets (12 équipes enregistrées avec équipement et placement), Set Costume Order (ordre des compétences programmé sur 10 activations), Restart du tour précédent dans le menu Pause. Évite l'Auto Battle : il ignore le placement des ennemis et ne t'apprend rien.</li>
<li><strong>Emprunt</strong> : 3 emprunts par jour et par ami (jusqu'à 30 amis), 1 perso emprunté par combat, en histoire, événements, Hunting Grounds et Path of Adventure.</li>
</ul>
<h3 id="s8-6">L'écran de combat et ses outils (compendium)</h3>
<figure class="shot cp"><button aria-label="Agrandir : L'écran de combat" class="shot-btn" data-full="img/cp-battle_system_1.jpg" type="button"><img alt="L'écran de combat" loading="lazy" src="img/cp-battle_system_1.jpg"/></button><figcaption>L'écran de combat<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>Cibler et placer</h4>
<ul>
<li><strong>Taunt</strong> et <strong>Concentrated Fire</strong> forcent tes persos à viser l'ennemi qui a cet état, quel que soit leur type de visée. <strong>Target Avoidance</strong> fait l'inverse : l'ennemi évite de cibler ce perso s'il a d'autres choix.</li>
<li>Certains supports ont une <strong>aura à portée limitée</strong> (Medical Club Teresse, Adventurer of the Unknown Diana, Refithea…) : place tes alliés dans leur zone, sinon ils ne reçoivent pas le buff.</li>
<li>En général, les supports agissent <strong>avant</strong> les DPS. Certains costumes demandent un ordre précis : Laid-Back Lifeguard Nebris, par exemple, profite d'un réglage fin de l'ordre de l'équipe.</li>
</ul>
<figure class="shot cp"><button aria-label="Agrandir : Very Front (le plus proche) et Vault (le deuxième de la colonne)" class="shot-btn" data-full="img/cp-targeting.jpg" type="button"><img alt="Very Front (le plus proche) et Vault (le deuxième de la colonne)" loading="lazy" src="img/cp-targeting.jpg"/></button><figcaption>Very Front (le plus proche) et Vault (le deuxième de la colonne)<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>Lire le combat</h4>
<ul>
<li><strong>Compétences</strong> : touche un perso (son modèle ou sa carte), puis une compétence sous « Basic <button class="term" data-tip="Attaque physique, attaque magique" type="button">Attack</button> » et « <button class="term" data-tip="Repoussement — Pousse l'ennemi d'une case, génère 1 SP" type="button">Knockback</button> ». Tu vois les <strong>dégâts bruts</strong> (sans les effets du tour) et la <strong>zone touchée</strong>. « <strong>K.O.</strong> » veut dire que les dégâts bruts suffisent à tuer. Les dégâts <strong>magiques</strong> sont en <strong>magenta</strong>, les <strong>physiques</strong> en <strong>jaune</strong>. Tu peux aussi changer l'action du perso depuis là.</li>
<li><strong>Temps de recharge</strong> : un costume en recharge est recouvert sur son bouton, avec le nombre de tours restants.</li>
<li><strong>Stats</strong> : touche un perso puis le <strong>+</strong> en haut (à gauche pour tes persos, à droite pour les ennemis). Ce sont les stats <strong>du moment</strong>, buffs compris, avec l'équipement et le Bonding.</li>
<li><strong>États</strong> : touche les petites icônes sous la carte (Taunt, etc.) pour lire leur effet.</li>
<li><strong>Élément</strong> : il s'affiche en icône à côté du nom, en teinte sur la carte, et en lueur sous le perso quand il va agir. Dans l'aperçu des dégâts, une icône indique l'<strong>avantage</strong> ou le <strong>désavantage</strong> ; s'il n'y a aucune icône, c'est neutre.</li>
<li><strong>Lignes de ciblage</strong> : <strong>vertes</strong> pour les actions de tes alliés (supports), <strong>rouges</strong> pour les ennemis qui vont frapper ce perso au tour suivant, de <strong>la couleur de l'élément</strong> pour la cible principale d'une attaque.</li>
</ul>
<figure class="shot cp"><button aria-label="Agrandir : Les lignes de ciblage : vert pour les alliés, rouge pour les ennemis" class="shot-btn" data-full="img/cp-target_lines.jpg" type="button"><img alt="Les lignes de ciblage : vert pour les alliés, rouge pour les ennemis" loading="lazy" src="img/cp-target_lines.jpg"/></button><figcaption>Les lignes de ciblage : vert pour les alliés, rouge pour les ennemis<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>Le recul : les règles exactes</h4>
<ul>
<li>Le recul <strong>échoue</strong> si la case d'arrivée est occupée par un ennemi ou une pierre tombale, ou si elle sort de la grille.</li>
<li>Les dégâts de recul ont le <strong>type de dégâts du perso</strong> : magiques pour Diana, physiques pour Teresse.</li>
<li>Les dégâts de collision (sur l'ennemi percuté) profitent du critique, de l'élément, de la DEF/MRES, de la vulnérabilité, des Chains et des points faibles. Ils ne peuvent pas être esquivés, mais une cible sous <strong>Evade</strong> ne peut pas être poussée.</li>
<li>Le recul ajoute <strong>1 Chain à la cible principale</strong> seulement, pas à l'ennemi percuté.</li>
<li>Certains ennemis sont <strong>immunisés</strong> au recul, et les boss du Fiend Hunter et du Guild Raid ne bougent jamais.</li>
</ul>
<figure class="shot cp"><button aria-label="Agrandir : Recul avec la compétence de Teresse : 62 500 dégâts = 50 000 PV plafonnés × 125 % (le recul de base fait 25 %)" class="shot-btn" data-full="img/cp-knockback.jpg" type="button"><img alt="Recul avec la compétence de Teresse : 62 500 dégâts = 50 000 PV plafonnés × 125 % (le recul de base fait 25 %)" loading="lazy" src="img/cp-knockback.jpg"/></button><figcaption>Recul avec la compétence de Teresse : 62 500 dégâts = 50 000 PV plafonnés × 125 % (le recul de base fait 25 %)<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>

<h4>Les Chains en détail</h4>
<ul>
<li>Les Chains durent un tour (sauf certaines saisons du Golden Colosseum) et s'ajoutent dans <strong>le même multiplicateur</strong> : chaque nouvelle Chain rapporte un peu moins en proportion.</li>
<li><strong>Chain Reinforcement</strong> ajoute <strong>+1 Chain par coup</strong>. Exemple : The Curse Celia frappe 7 fois (7 Chains), 14 avec le buff de Masquerade Bunny Celia, 21 avec celui de Pure White Blessing Refithea en plus (sauf dans Last Night, où chaque costume agit séparément : là, elle reste à 7).</li>
<li>Poolside Guardian Zenith fait passer le bonus de 10 % à <strong>20 % par Chain</strong> sur une case.</li>
</ul>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong></p>
<ul>
<li>Pendant une attaque, une icône de <strong>chaîne rouge</strong> avec un nombre s'affiche à côté des ennemis : c'est le compte de Chains.</li>
<li><strong>Un chainer peut-il être DPS ?</strong> Oui pour Luvencia, Hikage et Wilhelmina ; non pour Celia et Olstein (multiplicateur et MATK de base trop faibles, leur zone 3×3 est trompeuse). Celia est correcte seulement dans le Fiend Hunter et le Guild Raid de <span class="el el-light">Lumière</span> (avec l'élément et Diana).</li>
<li>En contenu général (histoire, tours sauf Salvation, combats Challenge), les chainers ne sont pas le meilleur choix : prends plutôt un DPS, un buffer ou un utilitaire. Exception : Luvencia. Les chainers à cible unique (Wilhelmina) y sont encore plus faibles.</li>
<li><strong>Last Night</strong> : les buffs sur soi restent sur soi. Bunny Celia passe de 3 à 6 Chains avec son buff, mais The Curse Celia, jouée ensuite, reste à 7 : 13 en tout, pas 14 + 6.</li>
</ul>
<figure class="shot dc"><button aria-label="Agrandir : L'icône de chaîne rouge : 7 Chains sur la cible" class="shot-btn" data-full="img/dc-chain-7.jpg" type="button"><img alt="L'icône de chaîne rouge : 7 Chains sur la cible" loading="lazy" src="img/dc-chain-7.jpg"/></button><figcaption>L'icône de chaîne rouge : 7 Chains sur la cible<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
