<h4>Tower of Pride</h4>
<p>Finir au moins l'<strong>étage 1</strong> te rend éligible aux récompenses de fin de saison : <strong>3 000 Devil Coins et 30 Ancient Crystals</strong>. Ce n'est pas très dur si tu as recruté Liatris ou Levia à la taverne.</p>
<figure class="shot"><button aria-label="Agrandir : Récompense de fin de saison de la Tower of Pride" class="shot-btn" data-full="img/bd2-1000095430.jpg" type="button"><img alt="Récompense de fin de saison de la Tower of Pride" loading="lazy" src="img/bd2-1000095430.jpg"/></button><figcaption>Récompense de fin de saison de la Tower of Pride</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Objectifs de saison de l'Evil Castle" class="shot-btn" data-full="img/bd2-1000095431.jpg" type="button"><img alt="Objectifs de saison de l'Evil Castle" loading="lazy" src="img/bd2-1000095431.jpg"/></button><figcaption>Objectifs de saison de l'Evil Castle</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Compléments du compendium.</strong></p>
<ul>
<li>Chaque étage : 4 combats normaux puis 1 boss. Chaque étage fini une première fois rapporte 1 000 Devil Coins et 10 Ancient Crystals.</li>
<li>Ton meilleur score donne une récompense <strong>chaque jour</strong> sans refaire la tour : de 300 Devil Coins + 6 Ancient Crystals (10 000 points) à 900 + 9 (600 000 points). Pour la toucher, va dans un pack (sauf Golden Colosseum, Glupy Diner, Soul Wager, Territory et Fishing) et parle aux petites créatures qui te suivent.</li>
<li>Points faciles pour débuter : finir le combat en 1 tour, garder toute l'équipe à PV max, et infliger 1 000 000 de dégâts avec un seul perso en un tour (Dream Bride Eclipse s'y prête bien). Ne cours pas après les bonus d'élément au début.</li>
</ul>
<p>Avec les Devil Coins, achète dans la boutique de l'Evil Castle : l'Ability Book ★4 (au besoin), les <strong>Essences</strong> et les <strong>Engraving Scrolls</strong>.</p>
<h4>Tower of Salvation</h4>
<p>C'est le meilleur mode pour apprendre comment marchent les costumes, la composition d'équipe et les mécaniques. Finir au moins 1 niveau te rend éligible à ses récompenses de saison. Le Discord conseille le <strong>niveau 2</strong> pour un débutant, ou le <strong>niveau 4</strong> si tu peux, car il donne un <strong><button class="term" data-tip="★5 aléatoire d'un élément choisi" type="button">Property Selective Draw Exchange Ticket</button></strong>.</p>
<figure class="shot"><button aria-label="Agrandir : Tower of Salvation, niveau de difficulté 4" class="shot-btn" data-full="img/bd2-1000095432.jpg" type="button"><img alt="Tower of Salvation, niveau de difficulté 4" loading="lazy" src="img/bd2-1000095432.jpg"/></button><figcaption>Tower of Salvation, niveau de difficulté 4</figcaption></figure>
<div class="tbl"><table>
<thead>
<tr>
<th>Niveau</th>
<th>Récompense de premier passage</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>20 Ancient Crystals</td>
</tr>
<tr>
<td>2</td>
<td>1 Tear of the Goddess</td>
</tr>
<tr>
<td>3</td>
<td>5 Draw Tickets</td>
</tr>
<tr>
<td>4</td>
<td>1 Property Selective Draw Exchange Ticket</td>
</tr>
<tr>
<td>5</td>
<td>5 Draw Tickets</td>
</tr>
<tr>
<td>6 et 7</td>
<td>20 Ancient Crystals chacun</td>
</tr>
<tr>
<td>8 et 9</td>
<td>300 Refining Crystals chacun</td>
</tr>
<tr>
<td>10</td>
<td>500 Refining Crystals</td>
</tr>
</tbody>
</table></div>
<p><strong>Comment ça marche (compendium).</strong> 10 clés par jour. Tu choisis une difficulté, puis tu draftes une équipe : 1 costume parmi 4 proposés par emplacement, plus un 5e « joker » choisi librement. Tes costumes possédés gardent leurs doublons, Potentiels et Awakening, mais <strong>pas leur équipement</strong>. En montant, tu choisis ta route (combats, élites, artefacts, événements, boutique aux étages 11 et 21) et tu gagnes du Lost Silver, avec 5 % d'intérêts à chaque étage. Le hasard est figé : relancer le même combat à l'identique donne le même résultat. Astuce : remplacer un perso en combat coûte 2 SP et remet ses recharges à zéro. Avec l'Obsidian, achète d'abord Refresh Attempts Up et Starting SP Up.</p>
<h4>Tower of Desire</h4>
<p>Des combats normaux : il suffit de gagner. Ta équipe d'histoire suffit jusqu'à l'étage 150 environ, et Diana y est ta meilleure amie. À partir de l'étage 151, il faut jouer l'élément avec Diana et le bon DPS. Chaque étage donne au moins 1 <button class="term" data-tip="Ticket de tirage normal" type="button">Draw Ticket</button>.</p>
<h4>Towers of Wrath et of Jealousy</h4>
<p>Wrath impose une équipe <strong>magique</strong> (ou au moins un DPS magique), Jealousy une équipe <strong>physique</strong>, avec des effets spéciaux qui changent tous les 10 étages à partir du 11e. Leurs ennemis n'ont <strong>aucun élément</strong> : Diana n'y sert à rien. Les debuffs et le repoussement de l'autre type de dégâts marchent quand même. Chaque 5e et 10e étage rapporte des Draw Tickets, des Dia et des Refining Crystals. À partir de l'étage 41, la difficulté grimpe nettement.</p>
<figure class="shot"><button aria-label="Agrandir : Tower of Wrath étage 40 et ses effets spéciaux" class="shot-btn" data-full="img/bd2-1000095433.jpg" type="button"><img alt="Tower of Wrath étage 40 et ses effets spéciaux" loading="lazy" src="img/bd2-1000095433.jpg"/></button><figcaption>Tower of Wrath étage 40 et ses effets spéciaux</figcaption></figure>
</div></article><article class="step" data-step="7"><div class="step-head"><h3 id="s5-9">Étape 7 — Collection Buff</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="7"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Le Collection Buff est un bonus de stats qui s'applique à <strong>tous</strong> tes personnages. Il plafonne à <strong>80 %</strong> : au-delà, ni les objets, ni l'équipement, ni les costumes ne le font monter. Objectif de la semaine : 50 % de bonus en PV.</p>
<ul>
<li><strong>Fouille toujours autour de toi</strong> pour ramasser les objets de collection (les petits scintillements sur la carte).</li>
<li>Chaque carte « sûre » a son propre nombre d'objets à fouiller. Ouvre la minimap pour voir le compteur.</li>
<li>Certains objets ne se fouillent qu'avec la capacité <strong>Search</strong> de Lathel.</li>
</ul>
<figure class="shot"><button aria-label="Agrandir : Minimap avec le compteur d'objets trouvés" class="shot-btn" data-full="img/bd2-1000095434.jpg" type="button"><img alt="Minimap avec le compteur d'objets trouvés" loading="lazy" src="img/bd2-1000095434.jpg"/></button><figcaption>Minimap avec le compteur d'objets trouvés</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Récompenses uniques : fouilles de base et fouilles avec Search" class="shot-btn" data-full="img/bd2-1000095435.jpg" type="button"><img alt="Récompenses uniques : fouilles de base et fouilles avec Search" loading="lazy" src="img/bd2-1000095435.jpg"/></button><figcaption>Récompenses uniques : fouilles de base et fouilles avec Search</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Écran Collection avec les Collection Buffs" class="shot-btn" data-full="img/bd2-1000095436.jpg" type="button"><img alt="Écran Collection avec les Collection Buffs" loading="lazy" src="img/bd2-1000095436.jpg"/></button><figcaption>Écran Collection avec les Collection Buffs</figcaption></figure>
<p><strong>Outils pour tout trouver</strong> (en anglais) : la <a href="https://browndust2-wiki.souseha.com/en/maps" target="_blank" rel="noopener">carte interactive du wiki Browndust2</a> montre l'emplacement des objets, et la <a href="https://docs.google.com/spreadsheets/d/1ePZc0xGtZwoJFbQ2EXJmHdaIlx2Uro_5-suCEohihhU/edit?gid=2007043438#gid=2007043438" target="_blank" rel="noopener">feuille communautaire</a> liste tous les objets de collection.</p>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Complément du compendium.</strong> Dans le menu <strong>Collection</strong> de l'accueil, tu suis les costumes, armes et objets récupérés, qui donnent ces bonus permanents. En haut à gauche de l'écran de terrain, le résumé de la zone indique les objets, fouilles et monstres qu'il reste.</p>
</div></article><article class="step" data-step="8"><div class="step-head"><h3 id="s5-10">Étape 8 — Combats d'événement et Fiend Hunter</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="8"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Un <strong>Season Event</strong> dure en général deux semaines : une histoire, 15 combats Normal et 15 combats Challenge, un Fiend Hunter, des missions et une boutique. Tu y accèdes par l'icône à droite de l'écran d'accueil.</p>
<h4>Les combats d'événement</h4>
<p>Remplis les <strong>3 conditions</strong> de chaque combat pour les récompenses en plus : gagner, gagner sans perte (ou avec moins de 2 persos épuisés selon le combat), et gagner en 8 tours maximum.</p>
<figure class="shot"><button aria-label="Agrandir : Conditions d'un combat d'événement, dont « tout le monde survit »" class="shot-btn" data-full="img/bd2-1000095437.jpg" type="button"><img alt="Conditions d'un combat d'événement, dont « tout le monde survit »" loading="lazy" src="img/bd2-1000095437.jpg"/></button><figcaption>Conditions d'un combat d'événement, dont « tout le monde survit »</figcaption></figure>
<ul>
<li><strong>N'utilise pas Wiggle</strong> dans certains combats : il s'auto-détruit et te fait rater la condition « tout le monde survit ».</li>
<li>Le bonus des <strong>costumes d'événement</strong> s'applique même si tu ne les utilises pas en combat : il suffit de les posséder. Chacun augmente la monnaie gagnée, jusqu'à +100 %.</li>
</ul>
<figure class="shot"><button aria-label="Agrandir : Bonus des costumes d'événement" class="shot-btn" data-full="img/bd2-1000095438.jpg" type="button"><img alt="Bonus des costumes d'événement" loading="lazy" src="img/bd2-1000095438.jpg"/></button><figcaption>Bonus des costumes d'événement</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Compléments du compendium.</strong> Tu as <strong>5 tentatives par jour</strong> (reset à minuit), soit 70 sur l'événement. Une défaite ou un abandon ne coûte rien : expérimente. Finir les combats 5, 10 ou 15 avec toutes les conditions débloque le <strong>Quick Battle</strong>, et le bouton <strong>Auto-Play</strong> enchaîne les combats tout seul. N'achète pas de tentatives avec des Dia, sauf s'il te manque de quoi prendre les objets prioritaires le dernier jour.</p>
<h4>La boutique d'événement</h4>
<p>C'est un bon moyen de booster vite ton compte. Elle reste ouverte <strong>28 jours</strong> : fais défiler le logo de l'événement pour retrouver l'ancienne boutique. Ordre d'achat du compendium :</p>
<ol>
<li>Tear of the Goddess ×1 (1 000, puis 2 000, puis 3 000 de monnaie)</li>
<li><button class="term" data-tip="Sert au Burst" type="button">Spark of Rampage</button> ×30 (600)</li>
<li>Draw Ticket ×15 (6 000)</li>
<li><button class="term" data-tip="Cristal ancien — Fabriquer l'équipement UR" type="button">Ancient Crystal</button> ×40 (2 400)</li>
<li>Essences de Strength, Life et Perseverance ×50 (1 000 chacune)</li>
<li>Équipement d'événement UR (3 000) avec ses 27 matériaux d'amélioration (2 700)</li>
<li><button class="term" data-tip="Changent les options (substats)" type="button">Refining Crystal</button> ×500 (1 500)</li>
<li>Ensuite : or, Ability Pills, Slimes, puis <button class="term" data-tip="Poudre / Cristal / Pierre de raffinage — Relancer les lettres de l'équipement" type="button">Refining Powder</button> et or à volonté</li>
</ol>
<p>L'<strong>équipement Fiend</strong> (de la boutique d'événement) est excellent pour débuter : il obtient toujours le meilleur rang d'amélioration (SSS, score 24) et s'améliore sans or ni échec. N'achète pas la version SR, seulement l'UR.</p>
<figure class="shot"><button aria-label="Agrandir : Équipement UR d'événement avec un rang SSS" class="shot-btn" data-full="img/bd2-1000095439.jpg" type="button"><img alt="Équipement UR d'événement avec un rang SSS" loading="lazy" src="img/bd2-1000095439.jpg"/></button><figcaption>Équipement UR d'événement avec un rang SSS</figcaption></figure>
<h4>Fiend Hunter (FH)</h4>
<p>C'est un boss qui change chaque saison et qu'on affronte avec jusqu'à 3 équipes de 5. La première semaine sert à s'entraîner (Practice), la seconde à l'attaquer pour de vrai (Hunting Period). <strong>Une seule tentative compte</strong> : pour toucher les récompenses d'une difficulté, il faut vider les PV du Fiend en un seul essai. Tes dégâts valident alors aussi toutes les difficultés plus faibles.</p>
<figure class="shot"><button aria-label="Agrandir : Fiend Hunter (ancienne version : le bouton Quick Battle n'existe plus)" class="shot-btn" data-full="img/bd2-1000095440.jpg" type="button"><img alt="Fiend Hunter (ancienne version : le bouton Quick Battle n'existe plus)" loading="lazy" src="img/bd2-1000095440.jpg"/></button><figcaption>Fiend Hunter (ancienne version : le bouton Quick Battle n'existe plus)</figcaption></figure>
<p class="callout warn"><span class="co-tag">Attention</span><strong>Attention, le système a changé.</strong> Le Discord parle de « niveaux » (3 Draw Tickets par niveau jusqu'au niveau 10) et dit de le faire chaque jour pour la monnaie d'événement : ce Quick Battle quotidien a été retiré (confirmé sur le Discord officiel, novembre 2026). Le compendium (2026) décrit 5 difficultés au choix : Easy, Normal, Hard, Very Hard et Challenge. Tes dégâts valident automatiquement toutes les difficultés dont les PV sont inférieurs.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Difficulté</th>
<th>Récompense</th>
</tr>
</thead>
<tbody>
<tr>
<td>Easy</td>
<td>10 Draw Tickets + 5 000 de monnaie d'événement</td>
</tr>
<tr>
<td>Normal</td>
<td>10 Draw Tickets + 15 000 de monnaie</td>
</tr>
<tr>
<td>Hard</td>
<td>10 Draw Tickets + 1 Tear of the Goddess + 30 000 de monnaie</td>
</tr>
<tr>
<td>Very Hard</td>
<td>225 000 Refining Powder + 1,5 million d'or + 50 000 de monnaie</td>
</tr>
<tr>
<td>Challenge</td>
<td>Classement de dégâts : 3 à 5 Draw Tickets et 50 à 300 Refining Crystals</td>
</tr>
</tbody>
</table></div>
<p>Même avec peu de dégâts, attaque le boss : tu gagnes au minimum la récompense de classement. Pour les stratégies, le compendium recommande les vidéos YouTube de <strong>Pod</strong> (accessibles) et <strong>Shimonami</strong> (avancées), et la base de compositions de <a href="https://browndust2-db.souseha.com/en/formation/list" target="_blank" rel="noopener">Souseha</a>.</p>
</div></article><article class="step" data-step="9"><div class="step-head"><h3 id="s5-11">Étape 9 — Last Night</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="9"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Last Night se débloque avec les quêtes principales du Story Pack 3. Tu y frappes un boss unique avec une équipe de <strong>20 costumes</strong>, et le jeu garde ton meilleur score. <strong>Pas besoin d'y aller chaque jour</strong> pour toucher la récompense quotidienne.</p>
<p>C'est une de tes sources principales d'<strong>Ancient Crystals</strong>, nécessaires pour crafter l'équipement UR.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Dégâts</th>
<th>Récompense quotidienne</th>
</tr>
</thead>
<tbody>
<tr>
<td>10 000</td>
<td>1 Ancient Crystal par jour (minimum visé par le Discord)</td>
</tr>
<tr>
<td>52 millions</td>
<td>5 Ancient Crystals par jour, le maximum</td>
</tr>
<tr>
<td>110 millions</td>
<td>5 Awakening Elixirs par jour en plus, le maximum</td>
</tr>
</tbody>
</table></div>
<figure class="shot"><button aria-label="Agrandir : Récompense Last Night à 10 000 de dégâts" class="shot-btn" data-full="img/bd2-1000095441.jpg" type="button"><img alt="Récompense Last Night à 10 000 de dégâts" loading="lazy" src="img/bd2-1000095441.jpg"/></button><figcaption>Récompense Last Night à 10 000 de dégâts</figcaption></figure>
<p class="callout key"><span class="co-tag">À retenir</span><strong>Récupérer la récompense.</strong> <strong>Isaac</strong> te l'apporte chaque jour, avec les petites créatures du Dispatch, à ta première connexion après le reset. Il faut <strong>interagir avec lui</strong> sur la carte, dans n'importe quel pack sauf Golden Colosseum, Glupy Diner, Soul Wager, Territory et Fishing Voyage.</p>
<figure class="shot"><button aria-label="Agrandir : Isaac et les créatures du Dispatch sur la carte" class="shot-btn" data-full="img/bd2-1000095442.jpg" type="button"><img alt="Isaac et les créatures du Dispatch sur la carte" loading="lazy" src="img/bd2-1000095442.jpg"/></button><figcaption>Isaac et les créatures du Dispatch sur la carte</figcaption></figure>
<h4>Le Support Bonus : rien n'est gaspillé</h4>
<p>C'est grâce à ce mode qu'aucune ressource n'est « perdue » : tous les costumes <strong>que tu n'utilises pas</strong> dans l'équipe donnent un bonus de dégâts. Chaque costume ajoute (puissance de combat de son personnage ÷ 1 000) %. Équipe donc en priorité les persos qui ont beaucoup de costumes, comme Justia et Lathel.</p>
<figure class="shot"><button aria-label="Agrandir : Le Support Bonus dépend du niveau, des costumes, de l'équipement, du Potentiel, de l'Awakening et de l'Engraving" class="shot-btn" data-full="img/bd2-1000095443.jpg" type="button"><img alt="Le Support Bonus dépend du niveau, des costumes, de l'équipement, du Potentiel, de l'Awakening et de l'Engraving" loading="lazy" src="img/bd2-1000095443.jpg"/></button><figcaption>Le Support Bonus dépend du niveau, des costumes, de l'équipement, du Potentiel, de l'Awakening et de l'Engraving</figcaption></figure>
<p><strong>Règles du combat (compendium).</strong></p>
<ul>
<li>Tes 20 costumes agissent une fois chacun dans l'ordre, sans coût en SP, puis le combat s'arrête.</li>
<li>Le boss occupe une seule case, n'a pas d'élément (Diana inutile) et ignore les debuffs. La limite de <button class="term" data-tip="Chaîne — Chaque coup sur la même cible dans un tour augmente les dégâts suivants" type="button">Chain</button> est retirée.</li>
<li>Un effet de « Pressure » divise par 2 les buffs de stats. Les buffs d'<button class="term" data-tip="Buff qui augmente les dégâts des alliés" type="button">Augmentation</button> et les Chains ne sont pas touchés.</li>
<li>L'équipement de Last Night est enregistré à part : pense à le mettre à jour.</li>
<li>Ordre conseillé : buffers, puis persos qui frappent beaucoup de fois (Chain), puis gros DPS à la fin. Le costume Promise of Vengeance de Lathel (gratuit au Story Pack 7) y est un bon DPS, et New Hire Nebris le meilleur.</li>
</ul>
</div></article><article class="step" data-step="10"><div class="step-head"><h3 id="s5-12">Étape 10 — Glupy Diner et Glu Talk</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="10"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Le <strong>Glupy Diner</strong> est un restaurant à gérer qui te donne un revenu passif : or, Refining Powder et cristaux de magie. Tu commences avec <strong>3 000 Glupy Stars</strong>, largement de quoi le passer niveau 2 tout de suite.</p>
<ul>
<li>Le niveau 1 a 5 améliorations qui coûtent 500, 525, 551, 579 et 608 Glupy Stars.</li>
<li>Chaque niveau augmente ce que le restaurant rapporte par minute (niveau 2 : 8 or/min au lieu de 7, 4 Glupy Stars/min au lieu de 3).</li>
<li>Les heures d'ouverture plafonnent à <strong>24 heures</strong>. Au-delà, il ne produit plus rien tant que tu n'encaisses pas (Checkout). Passe régulièrement pour encaisser et monter de niveau au plus vite.</li>
</ul>
<figure class="shot"><button aria-label="Agrandir : Vue du Glupy Diner" class="shot-btn" data-full="img/bd2-1000095444.jpg" type="button"><img alt="Vue du Glupy Diner" loading="lazy" src="img/bd2-1000095444.jpg"/></button><figcaption>Vue du Glupy Diner</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Diner Sales : encaisser les gains" class="shot-btn" data-full="img/bd2-1000095445.jpg" type="button"><img alt="Diner Sales : encaisser les gains" loading="lazy" src="img/bd2-1000095445.jpg"/></button><figcaption>Diner Sales : encaisser les gains</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Passage au niveau 2 : les gains par minute augmentent" class="shot-btn" data-full="img/bd2-1000095446.jpg" type="button"><img alt="Passage au niveau 2 : les gains par minute augmentent" loading="lazy" src="img/bd2-1000095446.jpg"/></button><figcaption>Passage au niveau 2 : les gains par minute augmentent</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Compléments du compendium.</strong> Le restaurant monte jusqu'au niveau 30 et donne jusqu'à 20 Deco Coins par jour. Le bouton <strong>Business Management</strong> de l'accueil encaisse l'or, la Powder et les Stars sans entrer dans le pack. Les Deco Coins et les cristaux de magie, eux, demandent d'aller dans le pack.</p>
<h4>Glu Talk</h4>
<p>Tu ne peux discuter dans Glu Talk qu'avec les personnages dont tu possèdes le costume concerné (au moment du guide Discord : New Hire Nebris, Celebrity Bunny Loen et Daydream Bunny Morpeah).</p>
<ul>
<li>Tu ne rencontres qu'<strong>un Fated Guest par jour</strong>. Les autres, ce sera le lendemain.</li>
<li>La <strong>première rencontre</strong> avec un Fated Guest ne consomme pas ton point de rencontre du jour.</li>
<li>Objectif de la semaine : débloquer la 4e rencontre d'un ami.</li>
</ul>
<figure class="shot"><button aria-label="Agrandir : Glu Talk et les rencontres restantes du jour" class="shot-btn" data-full="img/bd2-1000095447.jpg" type="button"><img alt="Glu Talk et les rencontres restantes du jour" loading="lazy" src="img/bd2-1000095447.jpg"/></button><figcaption>Glu Talk et les rencontres restantes du jour</figcaption></figure>
</div></article><article class="step" data-step="11"><div class="step-head"><h3 id="s5-13">Étape 11 — Optimiser l'équipement</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="11"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Il y a deux leviers pour rendre une pièce meilleure et adaptée à ton perso : monter son <strong>rang d'amélioration</strong> (raffinage), et changer sa <strong>stat principale et ses options</strong> (substats).</p>
<h4>Le rang d'amélioration et la Refining Powder</h4>
<p>Monter le rang coûte de la <strong>Refining Powder</strong>. Tu en obtiens en démontant de l'équipement, ou dans la boutique d'événement s'il te reste de la monnaie.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Démonter une pièce…</th>
<th>Donne</th>
<th>Powder en plus par niveau (+1)</th>
</tr>
</thead>
<tbody>
<tr>
<td>R</td>
<td>Refining Stones + Powder</td>
<td>+2</td>
</tr>
<tr>
<td>SR</td>
<td>Refining Crystals + Powder</td>
<td>+9</td>
</tr>
<tr>
<td>UR</td>
<td>Refining Crystals + Powder</td>
<td>+72</td>
</tr>
</tbody>
</table></div>
<p>Plus la pièce est améliorée, plus elle rend de Powder. Le nombre de Stones et de Crystals, lui, ne dépend que du palier (I à IV), pas du niveau. Conseil : monte tes pièces à <strong>+6 ou +8 avant de les démonter</strong> si tu as de l'or en trop (le compendium vise +7, le meilleur rapport or/Powder).</p>
<p>Utilise <strong>Upgrade All</strong> pour améliorer en masse et <strong>Select Gear</strong> pour démonter en masse. Les pièces verrouillées ou équipées ne sont jamais démontées.</p>
<figure class="shot"><button aria-label="Agrandir : Inventaire d'équipement R" class="shot-btn" data-full="img/bd2-1000095448.jpg" type="button"><img alt="Inventaire d'équipement R" loading="lazy" src="img/bd2-1000095448.jpg"/></button><figcaption>Inventaire d'équipement R</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Boutons Craft Gear, Upgrade All et Select Gear" class="shot-btn" data-full="img/bd2-1000095449.jpg" type="button"><img alt="Boutons Craft Gear, Upgrade All et Select Gear" loading="lazy" src="img/bd2-1000095449.jpg"/></button><figcaption>Boutons Craft Gear, Upgrade All et Select Gear</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Raffinage du rang d'amélioration (lettres C, A, B)" class="shot-btn" data-full="img/bd2-1000095450.jpg" type="button"><img alt="Raffinage du rang d'amélioration (lettres C, A, B)" loading="lazy" src="img/bd2-1000095450.jpg"/></button><figcaption>Raffinage du rang d'amélioration (lettres C, A, B)</figcaption></figure>
<h4>Les options (substats)</h4>
<p>Changer les options permet à ton perso de faire plus de dégâts ou de mieux survivre.</p>
<ul>
<li>La <strong>valeur</strong> des options ne change <strong>jamais</strong> avec le rang d'amélioration : une Rare IV en BBB a les mêmes options qu'une Rare IV en SSS. Seul le palier (I, II, III, IV) compte : plus il est bas, plus les options sont faibles.</li>
<li>Pour changer les options : <strong>Refining Stones</strong> pour l'équipement N et R, <strong>Refining Crystals</strong> pour le SR et l'UR.</li>
<li><strong>Attention aux Refining Crystals</strong> : ils sont rares. Ne les utilise que sur de l'UR IV ou de l'UR EX.</li>
</ul>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Compléments du compendium.</strong> Tu peux <strong>verrouiller</strong> une option pour la garder, mais chaque verrou augmente le coût (jusqu'à ×4 avec 3 verrous). Après un tirage, tu choisis entre garder l'ancienne (Keep Option), prendre la nouvelle (Confirm) ou relancer (Retry). Sans réponse sous 12 heures, le jeu garde l'ancienne. Pour un DPS classique, vise ATK ou MATK sur l'arme et les gants, puis <button class="term" data-tip="Chance / Dégâts critiques" type="button">Crit DMG</button> ou <button class="term" data-tip="Chance / Dégâts critiques" type="button">Crit Rate</button>.</p>
<h4>L'objectif : un Knight's Ring IV parfait</h4>
<p>Le dernier objectif de la checklist : un <strong>Knight's Ring IV (R)</strong> au rang <strong>BBS</strong> avec ses 3 options en <strong>Crit DMG</strong>.</p>
<figure class="shot"><button aria-label="Agrandir : Knight's Ring IV R +9 avec 3 options Crit DMG" class="shot-btn" data-full="img/bd2-1000095451.jpg" type="button"><img alt="Knight's Ring IV R +9 avec 3 options Crit DMG" loading="lazy" src="img/bd2-1000095451.jpg"/></button><figcaption>Knight's Ring IV R +9 avec 3 options Crit DMG</figcaption></figure>
</div></article><article class="step" data-step="12"><div class="step-head"><h3 id="s5-14">Étape 12 — Recruter Liberta</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="12"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Une fois le <strong>Story Pack 15</strong> fini, tu croises <strong>Dark Saintess Liberta</strong> à la taverne. Comme Diana, elle se recrute contre <strong>1 contrat de recrutement ★5</strong>. C'est elle qui justifie de foncer jusqu'au pack 15.</p>
<figure class="shot"><button aria-label="Agrandir : Liberta à la taverne du Story Pack 15" class="shot-btn" data-full="img/bd2-1000095452.jpg" type="button"><img alt="Liberta à la taverne du Story Pack 15" loading="lazy" src="img/bd2-1000095452.jpg"/></button><figcaption>Liberta à la taverne du Story Pack 15</figcaption></figure>
<p class="callout warn"><span class="co-tag">Attention</span><strong>Ce pack n'est pas facile pour un débutant.</strong> Les ennemis normaux ont environ 50 000 PV et les boss entre 200 000 et 350 000. Équipe-toi bien avant de t'y attaquer.</p>
<p class="callout key"><span class="co-tag">À retenir</span><strong>Pourquoi elle est indispensable.</strong> Dark Saintess Liberta est un costume <strong>incontournable</strong> : elle buffe l'ATK <strong>et</strong> le taux de critique, et rend 3 SP à tes alliés. Elle est la base de toutes les équipes <strong>physiques</strong>.</p>
<figure class="shot"><button aria-label="Agrandir : Compétence Prayer of Duality : +3 SP, +65 % d'ATK et +25 % de taux de critique pendant 4 tours" class="shot-btn" data-full="img/bd2-1000095453.jpg" type="button"><img alt="Compétence Prayer of Duality : +3 SP, +65 % d'ATK et +25 % de taux de critique pendant 4 tours" loading="lazy" src="img/bd2-1000095453.jpg"/></button><figcaption>Compétence Prayer of Duality : +3 SP, +65 % d'ATK et +25 % de taux de critique pendant 4 tours</figcaption></figure>
<ul>
<li>Elle marche même à <strong>+0</strong>, du moment que tous ses Potentiels sont débloqués.</li>
<li>Avec Liberta (+0, Potentiel complet) et Arines +5, ton équipe reçoit au total <strong>+135 % d'ATK et +55 % de taux de critique</strong>.</li>
<li>À +3, son buff de taux de critique monte à +50 %.</li>
</ul>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Complément du compendium.</strong> Dans l'équipe « cible unique » de départ, Liberta peut remplacer Arines (si elle est à +2 ou plus) ou Homunculus Lathel. Si tu ne l'as pas encore recrutée, ne la mets pas au-delà de +4 dans le banner 12-Pick : le recrutement te donnera la copie manquante.</p>
</div></article></div></section>

<section class="chapter" id="s7" data-title="Routines"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2"/><path d="M9 3h6"/></svg><b>07</b></span><h2>Routines</h2></header><div class="ch-body">
<h3 id="s7-1">Ta routine quotidienne en 10 à 15 minutes</h3>
<p>Tes dailies prennent 10 à 15 minutes, hors événements spéciaux. Fais-les dans cet ordre, sauf si une mission du jour t'impose autre chose.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Étape</th>
<th>Durée</th>
<th>À faire</th>
</tr>
</thead>
<tbody>
<tr>
<td>1. Tirages gratuits et connexion</td>
<td>moins d'1 min</td>
<td>1 tirage gratuit par bannière mise en avant ; récupère la boîte aux lettres. Pour le Dispatch (Olstein, Diana) et Last Night, va parler à Isaac et aux petites créatures sur la carte.</td>
</tr>
<tr>
<td>2. Riz cuit et torches</td>
<td>moins d'1 min</td>
<td>1 combat en Hunting Grounds (ou 1 auto pour 6 riz) pour la quête du jour. Le reste du riz va en Path of Adventure sur l'or ou les slimes, selon le jour. Torches : Magic Crystal Cave.</td>
</tr>
<tr>
<td>3. Équipement</td>
<td>2 min</td>
<td>Fabrique, démonte, améliore ou raffine, selon ce que demandent les missions de la passe.</td>
</tr>
<tr>
<td>4. Trouvailles et Gluttis</td>
<td>1 à 2 min</td>
<td>Ramasse au moins une trouvaille (lueurs bleues ou vertes) et un Glutti (créature bleue à oreilles de lapin). Les Gluttis fuient, rattrape-les avec le dash des bottes.</td>
</tr>
<tr>
<td>5. Panneau d'annonces (facultatif)</td>
<td>3 à 5 min</td>
<td>Jusqu'à 3 quêtes par jour pour de l'or. Finir une quête d'un pack donne 10 % de réduction chez son marchand pendant quelques jours.</td>
</tr>
<tr>
<td>6. Taverne</td>
<td>moins d'1 min</td>
<td>2 persos aléatoires, renouvelés toutes les 2 heures. Ne recrute que des 5★.</td>
</tr>
<tr>
<td>7. Mirror Wars</td>
<td>1 à 6 min</td>
<td>40 combats gratuits par jour. Un seul suffit pour la mission ; fais les 40 en auto si tu peux, pour les médailles.</td>
</tr>
<tr>
<td>8. Récompenses</td>
<td>moins d'1 min</td>
<td>Récupère la passe de saison, les missions et les événements en cours.</td>
</tr>
</tbody>
</table></div>
<h3 id="s7-2">Détails utiles</h3>
<ul>
<li><strong>Passe premium</strong> : à chaque saison, achète-la pour 1000 dias. Tu gagnes plus de 10 tickets de tirage, qui valent à eux seuls environ 2000 dias.</li>
<li><strong>Newbie Pass</strong> : 7 jours de quêtes avec des slimes, tickets de recrutement, dias et contrats. Fais toutes ses quêtes.</li>
<li><strong>Missions hebdo</strong> : remplis aussi la barre hebdomadaire, qui donne plus de dias que la quotidienne.</li>
<li><strong>Last Night</strong> : fais-y au moins 10 000 de dégâts une fois. Isaac te livrera ensuite de l'or et des Cristaux anciens chaque jour selon ton meilleur score, à condition d'aller lui parler sur la carte.</li>
<li><strong>Événements</strong> : ils durent en général 2 semaines. Participe pour les récompenses et les boutiques d'événement.</li>
</ul>
<div class="prio-toggle-slot"></div><h3 id="s7-3">Toutes les routines, du quotidien au mensuel (compendium)</h3>
<p>Aucune tâche n'est obligatoire : choisis celles qui collent à ton emploi du temps. Les tâches <strong>prioritaires</strong> rapportent beaucoup pour peu de temps ; les <strong>secondaires</strong> demandent plus d'effort ou rapportent moins.</p>
<h4>Chaque jour</h4>
<p class="prio-label"><strong>Prioritaire</strong></p>

<div class="checklist" data-cad="weekly" data-prio="high" data-role="" data-scope="Chaque semaine"><div class="cl-bar"><span aria-live="polite" class="cl-count"></span><div class="cl-track"><span class="cl-fill"></span></div><button class="cl-reset" type="button">Tout décocher</button></div><ul class="tasks"><li class="task"><label><input class="tick" data-k="9a9635bf79" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir les missions hebdomadaires</span></label></li><li class="task"><label><input class="tick" data-k="ecb133591c" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Combattre dans le Golden Colosseum (chaque semaine)</span></label></li><li class="task"><label><input class="tick" data-k="4ccfcf7f08" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Attaquer le boss du Fiend Hunter (semaines 2 et 4 du cycle, voir plus bas)</span></label></li><li class="task"><label><input class="tick" data-k="be3d7741ab" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Attaquer le boss du Guild Raid (semaine 1 du cycle)</span></label></li></ul></div>

<div class="checklist" data-cad="weekly" data-prio="low" data-role="" data-scope="Chaque semaine"><div class="cl-bar"><span aria-live="polite" class="cl-count"></span><div class="cl-track"><span class="cl-fill"></span></div><button class="cl-reset" type="button">Tout décocher</button></div><ul class="tasks"><li class="task"><label><input class="tick" data-k="b780a2a3b6" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Utiliser toutes les tentatives de vol (Stealing) de la semaine (capacité de perso, sur la carte)</span></label></li><li class="task"><label><input class="tick" data-k="d6e8921939" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir les quêtes hebdomadaires (carte)</span></label></li><li class="task"><label><input class="tick" data-k="89fdb94ab5" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Visiter les statues des champions (Fantasia Square, Mirror Wars)</span></label></li></ul></div>

<div class="checklist" data-cad="monthly" data-prio="high" data-role="" data-scope="Chaque mois"><div class="cl-bar"><span aria-live="polite" class="cl-count"></span><div class="cl-track"><span class="cl-fill"></span></div><button class="cl-reset" type="button">Tout décocher</button></div><ul class="tasks"><li class="task"><label><input class="tick" data-k="ac003eb625" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Golden Thread Shop : acheter l'unidupe (Costume Selective Enhancement) et les Sparks</span></label></li><li class="task"><label><input class="tick" data-k="f1d67d8f76" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Refinement Remnant Shop : acheter les Sparks</span></label></li><li class="task"><label><input class="tick" data-k="d6a80e8053" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Guild Shop : tout acheter</span></label></li><li class="task"><label><input class="tick" data-k="0dd6756662" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Evil Castle Shop : acheter le nécessaire</span></label></li><li class="task"><label><input class="tick" data-k="8e04cbdcdb" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Fishing Shop : tout acheter</span></label></li><li class="task"><label><input class="tick" data-k="d865464c5f" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Golden Colosseum Shop : acheter le nécessaire</span></label></li><li class="task"><label><input class="tick" data-k="40cbb64d07" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Golden Thread Shop et Mirror Wars Shop : acheter le reste du nécessaire (secondaire)</span></label></li></ul></div>
<h4>Le cycle de 28 jours</h4>
<p>Certains contenus tournent sur un cycle de 4 semaines. Le Golden Colosseum revient chaque semaine, le Guild Raid en semaine 1, le Fiend Hunter en semaines 2 et 4. Chaque semaine se termine à 15:00 UTC, soit <strong>16:00 en Belgique</strong> en hiver (17:00 en été).</p><div id="cycle-cal" class="widget"></div><p class="small">Calendrier calculé à partir de celui du compendium. Les jours fériés coréens décalent parfois un contenu d&#x27;un jour : en cas de doute, vérifie en jeu.</p>
</div></section>
<section class="chapter" id="s8" data-title="Le combat"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19L15 9"/><path d="M14 5l5 0 0 5"/><path d="M19 19L9 9"/><path d="M10 5H5v5"/></svg><b>08</b></span><h2>Le combat</h2></header><div class="ch-body">
<p>Le combat est au tour par tour, tu joues toujours en premier et il n'y a pas de limite de temps : prends le temps de préparer ton tour. L'objectif est de tuer un maximum d'ennemis dès le premier tour, pour subir moins d'attaques en retour.</p>
<h3 id="s8-1">Le terrain</h3>
<ul>
<li>Chaque camp a 3 lanes (colonnes) de 4 cases. Tu ne choisis pas ta cible : chaque perso attaque l'ennemi de sa propre lane. Sans ennemi dans sa lane, il vise le plus proche.</li>
<li>Avant chaque tour, tu peux déplacer librement tes persos entre les lanes pour changer leurs cibles ou esquiver les attaques ennemies.</li>
<li>Glisse les portraits dans la liste d'ordre de tour : celui du haut agit en premier. Bien ordonner ses actions fait la différence.</li>
<li>Touche un perso pour voir sa cible : trait vert pour ton attaque, trait rouge pour les attaques qui le visent. Le trait indique aussi si le coup sera mortel.</li>
</ul>
<h3 id="s8-2">Les trois actions</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Action</th>
<th>Effet</th>
<th>À savoir</th>
</tr>
</thead>
<tbody>
<tr>
<td>Attaque normale</td>
<td>Frappe la cible de la lane</td>
<td>Action par défaut si tu ne donnes pas d'ordre ; génère 1 SP</td>
</tr>
<tr>
<td>Repoussement (knockback)</td>
<td>Pousse la cible d'une case, 1 dégât</td>
<td>Génère 1 SP ; sert à aligner les ennemis pour tes zones</td>
</tr>
<tr>
<td>Compétence (skill)</td>
<td>Gros dégâts ou effets</td>
<td>Coûte des SP, a un temps de recharge</td>
</tr>
</tbody>
</table></div>
<p>Les SP sont partagés par toute l'équipe et conservés d'un combat à l'autre. Un perso peut utiliser la compétence de chacun de ses costumes, chacune avec son propre temps de recharge. Les dégâts affichés sur une compétence ne tiennent pas compte de la défense des ennemis.</p>
<h3 id="s8-3">Mécaniques importantes</h3>
<ul>
<li><strong>Zone (AOE)</strong> : les cases dessinées à côté de l'attaque montrent ce qui est touché. La case centrale est la cible principale.</li>
<li><strong>Direction du repoussement</strong> : la plupart des persos poussent vers l'avant, mais certains poussent en diagonale ou sur le côté. Regarde la flèche sur la compétence.</li>
<li><strong>Chaîne (chain)</strong> : chaque coup sur la même cible dans un tour ajoute 1 chaîne, et chaque chaîne augmente de 10 % les dégâts du coup suivant. Elles se remettent à zéro en fin de tour.</li>
<li><strong>Éléments</strong> : <span class="el el-fire">Feu</span> bat <span class="el el-wind">Vent</span>, <span class="el el-wind">Vent</span> bat <span class="el el-water">Eau</span>, <span class="el el-water">Eau</span> bat <span class="el el-fire">Feu</span> ; <span class="el el-light">Lumière</span> et <span class="el el-dark">Ténèbres</span> sont chacun forts contre l'autre. L'élément fort donne +50 % de dégâts de base, plus avec l'Awakening, le Bonding ou Diana. L'élément faible réduit tes dégâts (la valeur exacte s'affiche dans l'écran de stats, et tu peux voir celles des ennemis en plein combat).</li>
<li><strong>Mort subite (<button class="term" data-tip="Mort subite — Combat trop long : tout le monde frappe plus fort" type="button">Death Time</button>)</strong> : après le tour 10, tous les 2 tours, toutes les unités gagnent +100 % d'ATK et de MATK, perdent 100 % de défense et de résistance magique, et prennent +50 % de dégâts (d'après le compendium, <a class="verify" href="#a-verifier">à vérifier en jeu</a>).</li>
</ul><figure class="wheel"><svg viewBox="0 0 320 210" role="img" aria-label="Roue des éléments : Feu bat Vent, Vent bat Eau, Eau bat Feu ; Lumière et Ténèbres se battent mutuellement">
<defs><marker id="ar-fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--brass)"/></marker></defs>

<h3 id="s8-4">Méthode pour un tour</h3>
<ol>
<li>Touche un ennemi pour voir ses compétences et ce qu'il fera à son prochain tour. Son plan est déjà fixé.</li>
<li>Place tes persos hors de sa zone d'attaque. Si une attaque est inévitable, fais-la encaisser par le perso avec le plus de PV.</li>
<li>Utilise le repoussement pour aligner les ennemis, puis lance tes zones.</li>
<li>Ordonne les actions : repousseurs d'abord, gros dégâts ensuite.</li>
<li>Termine par End Turn.</li>
</ol>
<h3 id="s8-5">Le combat en détail</h3>
<ul>
<li><strong>Tours</strong> : en PvE, tu agis aux tours impairs (1, 3, 5…) et l'ennemi aux tours pairs. Tu places tes persos et choisis les costumes avant chaque tour, puis tout se joue automatiquement.</li>
<li><strong>Ciblage</strong> : chaque costume vise une <strong>cible principale</strong> (flèche vers le bas). « <button class="term" data-tip="Premier de la rangée / Saute le premier — Portée de l'attaque" type="button">Very Front</button> » vise l'ennemi le plus proche dans ta colonne, « Vault » saute par-dessus le premier pour viser le deuxième. S'il n'y a personne dans ta colonne, le perso vise la colonne à sa droite, puis celle à sa gauche.</li>
<li><strong>Chains</strong> : chaque coup porté sur un ennemi ajoute 1 <button class="term" data-tip="Chaîne — Chaque coup sur la même cible dans un tour augmente les dégâts suivants" type="button">Chain</button>, et chaque Chain ajoute +10 % de dégâts pour le reste du tour (plafond 100, sauf dans Last Night). Les persos qui frappent beaucoup de fois sont donc précieux, surtout dans Fiend Hunter et Guild Raid.</li>
<li><strong>Repoussement</strong> : il inflige toujours 1 dégât à la cible. Si l'ennemi poussé en percute un autre, celui-ci prend 25 % des PV max de l'ennemi poussé (calcul plafonné à 50 000 PV). Impossible de pousser un boss.</li>
<li><strong>Death Time</strong> : après le tour 10 (histoire, événements, Mirror Wars, Evil Castle), tous les 2 tours chaque unité gagne +100 % d'ATK, perd 100 % de DEF et prend +50 % de dégâts.</li>
<li><strong>États courants</strong> : <button class="term" data-tip="Provocation — Force les ennemis à te cibler" type="button">Taunt</button> (oblige à viser cet ennemi), Counter (renvoie des dégâts), Evade (annule l'attaque, contourné par l'auto-destruction de Wiggle), <button class="term" data-tip="Bouclier de PV temporaires" type="button">Energy Guard</button> (bouclier), Immunity.</li>
<li><strong>Types de dégâts spéciaux</strong> : Fixed et Consumed ne font jamais de critique et ignorent la DEF ; Pure peut faire un critique et ignore la DEF et les boucliers.</li>
<li><strong>Outils utiles</strong> : Presets (12 équipes enregistrées avec équipement et placement), Set Costume Order (ordre des compétences programmé sur 10 activations), Restart du tour précédent dans le menu Pause. Évite l'Auto Battle : il ignore le placement des ennemis et ne t'apprend rien.</li>
<li><strong>Emprunt</strong> : 3 emprunts par jour et par ami (jusqu'à 30 amis), 1 perso emprunté par combat, en histoire, événements, Hunting Grounds et Path of Adventure.</li>
</ul>
<h3 id="s8-6">La formule de dégâts, en résumé</h3>
<p>Les dégâts sont un produit de multiplicateurs indépendants. Comme ils se multiplient, mieux vaut répartir tes bonus sur plusieurs familles que d'empiler toujours la même :</p>
<div class="formula"><span class="fx-lhs">Dégâts</span><span class="fx-op">=</span><span class="fx-term">ATK</span><span class="fx-op">×</span><span class="fx-term">Compétence</span><span class="fx-op">×</span><span class="fx-term">Buffs ATK</span><span class="fx-op">×</span><span class="fx-term">Critique</span><span class="fx-op">×</span><span class="fx-term">Chains</span><span class="fx-op">×</span><span class="fx-term">Vulnérabilité</span><span class="fx-op">×</span><span class="fx-term">Élément</span><span class="fx-op">×</span><span class="fx-term">DEF ennemie</span><span class="fx-op">×</span><span class="fx-term">Point faible</span><span class="fx-op">×</span><span class="fx-term">Support Bonus</span></div>
<ul>
<li>Le taux de critique au-delà de 100 % est converti en dégâts critiques (×6).</li>
<li>La « Pressure » de certains modes réduit les buffs de stats (ATK, <button class="term" data-tip="Chance / Dégâts critiques" type="button">Crit DMG</button>, élément, DEF), mais pas les Chains ni la Vulnérabilité.</li>
<li>Le bonus d'élément (Diana) est sa propre famille : il ne se dilue pas dans les buffs d'ATK.</li>
</ul>
</div></section>
<section class="chapter" id="s9" data-title="Progression des persos"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V6"/><path d="M6 11l6-6 6 6"/><path d="M6 20h12"/></svg><b>09</b></span><h2>Progression des persos</h2></header><div class="ch-body">
<p>Au début, tes ressources sont rares : concentre-les sur les persos de ton équipe d'histoire et monte-les avec les slimes, les étoiles de rang et l'équipement. Le bouton "item location" en bas de la fiche d'un objet t'indique où le farmer.</p>
<h3 id="s9-1">Niveaux, slimes et ascension</h3>
<ul>
<li><strong>XP</strong> : tu en gagnes en survivant aux combats et en donnant des slimes à tes persos. Les slimes existent en jaune, bleu et rouge ; le rouge donne le plus d'XP.</li>
<li><strong>Ascension</strong> : tous les 20 niveaux, un perso doit monter de rang avec des étoiles de rang (rank-up stars). Chaque rang lui donne une étoile, et la rareté fixe le niveau maximum.</li>
<li><strong>Étoiles de rang 4</strong> : rares et non farmables. Garde-les pour tes persos 5★ (elles débloquent les niveaux 81 à 100).</li>
<li><strong>Slimes d'abord, or ensuite</strong> : farme les slimes tant que tes persos principaux ne sont pas au niveau maximum, puis passe à l'or, dont la fin de jeu consomme énormément.</li>
</ul>
<h3 id="s9-2">Farmer sans effort : le Path of Adventure</h3>
<p>Ce pack s'ouvre après le troisième pack d'histoire. Les premières fois, bats-toi à la main : après 5 combats, un boss apparaît (Red Slime ou Goblin King selon la difficulté). Dès que tu l'as battu une fois dans une difficulté, tu débloques l'auto-battle pour cette difficulté, avec le riz cuit.</p>
<ul>
<li>Même principe pour les Hunting Grounds de chaque pack : battre le boss débloque l'auto-battle de la difficulté.</li>
<li>Le raccourci "parchemin" à gauche du menu de champ ouvre directement le Path of Adventure.</li>
<li>Termine "Very Hard" partout dès que tu peux, pour automatiser tes farms.</li>
</ul>
<h3 id="s9-3">Les capacités de terrain à monter</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Priorité</th>
<th>Capacité</th>
<th>Qui</th>
</tr>
</thead>
<tbody>
<tr>
<td>Maximale</td>
<td>Gear Craft (fabrication)</td>
<td>Layla ou Fred, pas les deux</td>
</tr>
<tr>
<td>Maximale</td>
<td>Alchemy (alchimie)</td>
<td>Scheherazade</td>
</tr>
<tr>
<td>Haute</td>
<td>Dispatch</td>
<td>Olstein et Diana (récompenses différentes)</td>
</tr>
<tr>
<td>Confort</td>
<td>Search, Absorption, Assemble</td>
<td>Lathel, Celia, Refithea</td>
</tr>
<tr>
<td>Facultatif</td>
<td>Le reste</td>
<td>Ne gaspille pas de livres dessus</td>
</tr>
</tbody>
</table></div>
<p>La capacité Steal rapporte peu : utilise ses tentatives une fois par semaine si tu as le temps (priorité basse).</p>
<h3 id="s9-4">Autres sources de puissance</h3>
<ul>
<li><strong>Compétences</strong> : tire un doublon du costume pour monter la compétence jusqu'à +5 (plus de dégâts et souvent un temps de recharge réduit), pour un peu d'or.</li>
<li><strong>Potentiel</strong> : améliore-le avec les cristaux élémentaires de la Magic Crystal Cave, accessibles via le Path of Adventure et payés en torches. Choisis ton perso le plus utilisé et farme le cristal de son élément.</li>
<li><strong>Bonus de collection</strong> : chaque perso possédé donne un petit bonus à tous les autres ; certains trios de persos donnent un bonus plus fort.</li>
</ul>
<h3 id="s9-5">Modes Hard et Very Hard</h3>
<p>Parle à Elin dans la zone sûre d'un pack, une fois sa quête principale finie. N'en lance qu'un à la fois : tant que tu n'as pas fini sa quête, tu ne peux plus faire les quêtes quotidiennes de ce chapitre.</p>
<h3 id="s9-6">Le Burst</h3>
<p>Le Burst permet de payer plus de SP pour renforcer une compétence. Chaque costume a 3 niveaux à débloquer dans l'ordre, et leurs effets (comme leurs coûts en SP) s'additionnent.</p>
<ul>
<li><strong>Coût pour un costume ★5</strong> : 60 <strong>Sparks of Rampage</strong> + 1,5 million d'or par niveau, soit 180 Sparks et 4,5 millions d'or au total.</li>
<li><strong>Sources de Sparks</strong> : boutiques d'événement, <button class="term" data-tip="Fil d'or — Gagné sur les doublons +5 ; boutique de points" type="button">Golden Thread</button>, <button class="term" data-tip="Poudre d'espoir — Gagnée à chaque tirage ; boutique de points" type="button">Powder of Hope</button>, Refinement Remnants, Mirror Wars, guilde, Golden Colosseum et Taros Tactical Manual. Compte environ 530 à 585 Sparks par mois, soit à peu près 3 costumes.</li>
<li><strong>Conseil</strong> : c'est très cher pour un débutant. Accumule les Sparks sans les rater, mais investis peu au début, et plutôt sur les supports. Priorité la plus haute selon l'auteur : Diana (Adventurer of the Unknown) Bursts 1-3, B-Rank Idol Helena 1-3, Homunculus Lathel 1, Onsen Manager Liberta 1-3, Medical Club Teresse 3.</li>
<li>En combat, choisis le niveau de Burst avec la petite flèche sur la compétence, ou active l'<strong>Auto Burst</strong> (moins prioritaire que l'activation des costumes).</li>
</ul>
</div></section>
<section class="chapter" id="s10" data-title="L&#x27;équipement"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg><b>10</b></span><h2>L'équipement</h2></header><div class="ch-body">
<p>L'équipement change énormément la puissance de ton équipe : monte la capacité de fabrication (Gear Craft) et l'alchimie dès le début, puis garde tes meilleures pièces pour la fin de jeu. Chaque perso porte 5 pièces : arme, tête, corps, accessoire et gants.</p>
<h3 id="s10-1">Obtenir de l'équipement</h3>
<ul>
<li><strong>Fabrication</strong> : via Layla ou Fred, qui ont la même capacité depuis le patch de décembre 2023. Monte l'un des deux, pas les deux. Les matériaux de rang R et plus demandent l'alchimie de Scheherazade.</li>
<li><strong>Bannière d'armes</strong> : équipement exclusif d'un perso, équivalent à une pièce UR IV avec une statistique exclusive en plus. Utile, jamais indispensable : tu peux finir presque tout le contenu avec de l'UR normal.</li>
<li><strong>Équipement d'événement</strong> : vaut le coup, car il progresse toujours avec un raffinage SSS ; il dépasse généralement l'UR III.</li>
</ul>
<h3 id="s10-2">Lire une pièce</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Élément</th>
<th>Valeurs</th>
<th>Remarque</th>
</tr>
</thead>
<tbody>
<tr>
<td>Rareté</td>
<td>N, R, SR, UR</td>
<td>Du plus faible au plus fort</td>
</tr>
<tr>
<td>Palier</td>
<td>I, II, III, IV, EX</td>
<td>EX = exclusif de la bannière</td>
</tr>
<tr>
<td>Niveau</td>
<td>+0 à +9</td>
<td>Chaque niveau augmente les stats ; plus la pièce est rare, plus l'échec est fréquent</td>
</tr>
<tr>
<td>Statistiques</td>
<td>2 stats de base + 3 sous-stats</td>
<td>Les sous-stats se débloquent à +3, +6 et +9</td>
</tr>
</tbody>
</table></div>
<p>L'équipement physique (ATK, DEF) ne peut pas avoir de sous-stat magique, et l'inverse. L'accessoire est neutre.</p>
<h3 id="s10-3">Les lettres de raffinage</h3>
<p>Chaque pièce a trois lettres (C, B, A, S) débloquées à +3, +6 et +9. Elles décident du bonus de stats. Valeurs : C = 1, B = 2, A = 3, S = 4. Chaque lettre est multipliée par sa position (x1, x2, x3), et la somme donne le grade, de 6 (CCC) à 24 (SSS). Exemple : BAS = 2 + 6 + 12 = grade 20.</p>
<p>Le raffinage relance les lettres avec de la poudre de raffinage et ne garde le résultat que s'il est meilleur. Vise BBS (grade 18) puis arrête-toi : au-delà, les chances sont très faibles et le coût explose.</p>
<h3 id="s10-4">Gestion au quotidien</h3>
<ul>
<li><strong>Fabrique</strong> des pièces UR si tu as assez de Cristaux anciens. Sinon, fabrique les R et SR qui te manquent pour compléter la collection (bonus de collection).</li>
<li><strong>Démonte</strong> les pièces de bas niveau : elles donnent de la poudre de raffinage.</li>
<li><strong>Améliore</strong> tes pièces de haut niveau, même celles qui ne sont pas les meilleures : le mode Last Night exige que tous tes persos soient équipés.</li>
<li><strong>Raffine</strong> uniquement tes meilleures pièces. Ne raffine pas trop tôt : tu remplaceras ton équipement dès que ta capacité de fabrication montera d'un cran.</li>
<li>Ne dépense pas tes tickets d'équipement sans raison : les taux d'UR 5★ sont faibles et le résultat est aléatoire.</li>
</ul>
<h3 id="s10-5">Viser des stats pour un DPS (repères du compendium)</h3>
<p>Ce ne sont pas des seuils stricts, juste des repères pour un DPS « correct » : au début, <strong>2 200+ d'ATK ou MATK et 550 %+ de <button class="term" data-tip="Chance / Dégâts critiques" type="button">Crit DMG</button></strong> ; plus tard, <strong>3 000+ et 450 %+</strong>. Pour un calcul précis des options idéales, utilise le <a href="https://browndust2-db.souseha.com/" target="_blank" rel="noopener">calculateur de Souseha</a>.</p>
</div></section>
<section class="chapter" id="s11" data-title="Ressources, monnaies et boutiques"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg><b>11</b></span><h2>Ressources, monnaies et boutiques</h2></header><div class="ch-body">
<p>Règle d'or : ne dépense jamais tes ressources rares (Fils d'or, Poudre d'espoir, Larmes de la déesse, Cristaux anciens) sans savoir à quoi elles servent. Le tableau dit où gagner chaque ressource et quoi en faire.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Ressource</th>
<th>Où la gagner</th>
<th>Quoi en faire</th>
</tr>
</thead>
<tbody>
<tr>
<td>Dias</td>
<td>Missions (la barre d'activité donne des dias chaque jour et chaque semaine), succès, coffres, passes</td>
<td>Tirages ; garde toujours 1000 dias en réserve pour le passe premium</td>
</tr>
<tr>
<td>Or</td>
<td>Path of Adventure (riz), Dispatch, Last Night, histoire</td>
<td>Niveaux, amélioration et raffinage ; tu n'en auras jamais trop</td>
</tr>
<tr>
<td>Slimes</td>
<td>Histoire, Path of Adventure (riz)</td>
<td>Niveaux des persos</td>
</tr>
<tr>
<td>Étoiles de rang</td>
<td>Succès d'histoire, événements, boutiques Mirror Wars et Evil Castle</td>
<td>Ascension des persos</td>
</tr>
<tr>
<td>Contrats 3★</td>
<td>Boutiques Mirror Wars et Evil Castle</td>
<td>10 contrats 3★ donnent 1 contrat 4★, et 10 contrats 4★ donnent 1 contrat 5★ ; sers-t'en pour les 5★ de la taverne</td>
</tr>
<tr>
<td>Cristaux anciens</td>
<td>Evil Castle (Towers of Pride et of Salvation), Last Night, événements et leur boutique, boutique du Golden Colosseum</td>
<td>Fabrication UR</td>
</tr>
<tr>
<td>Poudre de raffinage</td>

</tr>
<tr>

<td>Magic Crystal Cave (torches)</td>
<td>Potentiel des costumes</td>
</tr>
<tr>
<td>Fils d'or</td>
<td>Doublon d'un costume déjà +5</td>
<td>Voir ci-dessous</td>
</tr>
<tr>
<td>Poudre d'espoir</td>
<td>Chaque tirage de costume ou d'équipement</td>
<td>Costume 5★ mensuel, après environ 200 tirages ; pas pour les étoiles de rang</td>
</tr>
<tr>
<td>Médailles de l'esprit combatif</td>
<td>Mirror Wars</td>
<td>Costume 5★ mensuel (environ 18 000 médailles), puis étoiles, contrats et cristaux de raffinage</td>
</tr>
<tr>
<td>Pièces du diable</td>
<td>Evil Castle</td>
<td>Livres de capacité ★4 au besoin, puis Essences et Engraving Scrolls</td>
</tr>
<tr>
<td>Larmes de la déesse</td>
<td>Boutique Fils d'or, boutiques d'événements</td>
<td>Potentiel de compétence : 3 larmes pour un costume, donc à utiliser avec soin</td>
</tr>
<tr>
<td>Pilules de capacité</td>
<td>Boutiques d'histoire</td>
<td>Utiliser les capacités ; la fabrication et l'alchimie en consomment beaucoup</td>
</tr>
</tbody>
</table></div>
<h3 id="s11-1">Énergies quotidiennes</h3>
<ul>
<li><strong>Riz cuit</strong> : 90 par jour (confirmé sur le Discord officiel, novembre 2026). Dépense-le en Path of Adventure sur l'or ou les slimes, selon le bonus du jour de la semaine.</li>
<li><strong>Torches</strong> : 60 par jour. Elles servent à la Magic Crystal Cave (cristaux élémentaires).</li>
<li><strong>Cocktails de sang</strong> : se rechargent chaque jour ; ils servent au PvP Mirror Wars.</li>
</ul>
<h3 id="s11-2">Boutique de Fils d'or : ordre de priorité</h3>
<ol>
<li><button class="term" data-tip="Un doublon au choix pour un costume non limité" type="button">Costume Selective Enhancement</button> (unidupe) : un doublon d'un costume 5★ non limité de ton choix.</li>
<li>55 Sparks of Rampage.</li>
<li>Le costume 5★ mis en avant, s'il t'intéresse.</li>
<li>Ensuite : tickets de tirage (surtout au début) et Larmes de la déesse (surtout en fin de jeu).</li>
</ol>
<p>Évite le reste : acheter des Cristaux anciens ou des tickets d'équipement n'est pas rentable.</p>
<h3 id="s11-3">Matériaux de fabrication à farmer</h3>
<p>Seuls l'or, le cuivre et le bois manquent vite ; cuir, tissu, tourbe et fer sont abondants.</p>
<ul>
<li><strong>Or et cuivre</strong> : Hunting Grounds, autel des hommes-lézards (Lizardman Altar) en Very Hard, ou la capacité Search de Lathel avec l'Absorption de Celia aux chapitres 8 et 13 (le chapitre 3 au début).</li>
<li><strong>Bois</strong> : Hunting Grounds, abri du gardien de la montagne (Mountain Keeper's Shelter), ou le chapitre 9.</li>
</ul>

<section class="chapter" id="s12" data-title="Le gacha : bannières et dépenses"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg><b>12</b></span><h2>Le gacha : bannières et dépenses</h2></header><div class="ch-body">
<p>Le gacha ne sert qu'à deux choses : les costumes et l'équipement exclusif. Un tirage coûte environ 200 dias et tu peux t'en passer longtemps grâce aux tickets gratuits. Certains détails ci-dessous viennent de guides de 2023 et 2024 : confirme-les sur l'écran de la bannière.</p>
<h3 id="s12-1">Les bannières</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Bannière</th>
<th>Contenu</th>
<th>Conseil</th>
</tr>
</thead>
<tbody>
<tr>
<td>Integrated Draw</td>
<td>Bannière standard : costumes et équipement</td>
<td>Le Tirage infini du début y puise</td>
</tr>
<tr>
<td>Featured (mise en avant)</td>
<td>Un costume ou un équipement vedette, avec taux augmenté</td>
<td>La meilleure valeur ; 1 tirage gratuit par jour</td>
</tr>
<tr>
<td>Select / 12-Pick (sélection)</td>
<td>Tu choisis plusieurs costumes ciblés</td>
<td>La meilleure option pour un débutant selon le compendium : mets-y des supports (liste dans la FAQ)</td>
</tr>
<tr>
<td>Bannière d'armes</td>
<td>Équipement exclusif seulement</td>
<td>Moins rentable que les costumes ; risque de doublons inutiles</td>
</tr>
</tbody>
</table></div>
<p>Les taux de base cités par un guide de 2023 sont de 3 % pour un 5★, 14 % pour un 4★ et 83 % pour un 3★.</p>
<h3 id="s12-2">Ce qu'il faut savoir</h3>
<ul>
<li><strong>Costume = perso.</strong> Tirer un costume d'un perso que tu n'as pas te donne le perso.</li>
<li><strong>Doublons.</strong> Chaque doublon monte la compétence du costume, jusqu'à +5. Au-delà de +5, un doublon se transforme en Fil d'or.</li>
<li><strong>Bonus de bannière.</strong> Quand tu obtiens le costume vedette sur sa bannière, tu récupères 10 tickets via l'événement "Pickup" ; ce n'est pas le cas sur la bannière Select.</li>
<li><strong>Points de tirage.</strong> Sur les bannières limitées, tes tirages accumulent des points, échangeables contre le costume vedette (200 points d'après un guide de 2023). Ils ne se partagent pas entre bannières et se convertissent en Poudre d'espoir à la fin.</li>
</ul>
<h3 id="s12-3">Comment dépenser</h3>
<ol>
<li>Fais chaque jour ton tirage gratuit.</li>
<li>Garde 1000 dias en permanence pour le passe premium de la saison suivante.</li>
<li>Ne tire que pour un perso ou un costume que tu veux vraiment, de préférence sur sa bannière vedette.</li>
<li>Vise d'abord des costumes de soutien ou de dégâts qui s'intègrent à ton équipe actuelle, plutôt que de les empiler au hasard.</li>
</ol>
<h3 id="s12-4">Le gacha en détail</h3>
<ul>
<li><strong>Coût</strong> : 1 <button class="term" data-tip="Ticket de tirage normal" type="button">Draw Ticket</button> ou 200 Dia gratuits par tirage, 2 000 Dia pour 10. Ordre de consommation : Selective Exclusive Draw Ticket, puis Draw Ticket, puis Dia gratuits, puis Dia payants.</li>
<li><strong>Taux</strong> : 3 % de ★5 sur une bannière de costume, dont 1,5 % pour le costume vedette. Les taux ne montent jamais progressivement.</li>
<li><strong>Garantie à 100 tirages</strong> : sans ★5 pendant 100 tirages, le 100e est forcément un ★5, à 50/50 entre vedette et autre. Le compteur est partagé entre bannières du même type. Astuce : monte-le à 99 avec les tirages gratuits, puis fais le 100e sur la bannière que tu vises.</li>
<li><strong>Échange à 200 points</strong> : chaque tirage sur une bannière donne 1 point. À 200, tu échanges contre le costume vedette. Les points restants deviennent de la <strong><button class="term" data-tip="Poudre d'espoir — Gagnée à chaque tirage ; boutique de points" type="button">Powder of Hope</button></strong> (1 pour 1) à la fin de la bannière.</li>
<li><strong>Tirage gratuit quotidien</strong> sur chaque bannière active : bouton « Bulk Free Draw ».</li>
<li>Les costumes non limités arrivent en général dans la <strong>boutique Powder of Hope</strong> après leur bannière (200 Powder la copie) : inutile de brûler des tickets pour la dernière copie.</li>
<li><strong>Équipement exclusif</strong> : ne tire pas dessus, une seule copie suffit pour tout le jeu.</li>
<li><strong>Bannières payantes, toutes optionnelles</strong> : Newbie Welcome (14 jours, 6 000 Dia payants ; si tu la prends, choisis Diana, B-Rank Idol Helena et Homunculus Lathel), Paid Infinite Draw et 12-Pick Golden Hand (environ 17 $ chacune), Step-Up (5 000 Dia payants).</li>
<li><strong>Règle des tickets</strong> : Selective Exclusive (violets) pour la bannière 12-Pick, Draw Tickets (rouges) pour les bannières normales, Dia comme des tickets rouges, mais garde toujours <strong>1 000 Dia</strong> pour le passe de saison.</li>
<li>Pour savoir sur quelle bannière tirer en ce moment, le compendium renvoie vers le site <a href="https://zormolo.github.io/BD2-Banner-Recommendation/" target="_blank" rel="noopener">BD2 Banner Recommendation</a>.</li>
</ul>
</div></section>
<section class="chapter" id="s13" data-title="Les modes de jeu"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V9l3-2v3l4-3 4 3V7l3 2v12z"/><path d="M10 21v-4h4v4"/></svg><b>13</b></span><h2>Les modes de jeu</h2></header><div class="ch-body">
<p>Avance dans l'histoire : elle débloque la plupart des modes (Evil Castle, Mirror Wars, Path of Adventure, Last Night). Même en débutant, participe aux modes saisonniers : la simple participation donne des récompenses qui accélèrent ta progression.</p>

</tr>

<td>Mirror Wars</td>
<td>PvP</td>
<td>Médailles, 40 combats gratuits par jour, récompenses hebdomadaires (400 dias au rang Bronze)</td>
</tr>
<tr>
<td>Evil Castle (Tower of Pride)</td>
<td>Tour saisonnière</td>
<td>Pièces du diable, Cristaux anciens, contrats ; la participation est vitale pour fabriquer l'UR</td>
</tr>
<tr>

<td>Or, Cristaux anciens et élixir d'éveil chaque jour, selon ton meilleur score</td>
</tr>

<td>Boss d'événement, toutes les 2 semaines</td>
<td>Draw Tickets et monnaie d'événement : attaque-le dès le début, même avec peu de dégâts (voir l'étape 8)</td>
</tr>
<tr>
<td>Guild Raid</td>

</tr>

<td>Tower of Salvation</td>

</tr>
</tbody>
</table></div>
<p>Le Guild Raid, le Golden Colosseum, The Soul Wager et le Taros Tactical Manual sont détaillés plus bas, dans « Les autres modes en détail », et la Tower of Salvation à l'étape 6 du parcours.</p>
<h3 id="s13-1">Mirror Wars (PvP)</h3>
<p>Les combats consomment des cocktails de sang, et les médailles dépendent du rang de l'adversaire. Chaque mois, la boutique propose un costume 5★ ; si tu fais tes dailies, 18 000 médailles par mois sont accessibles. Si tu vises un haut rang, utilise tes cocktails en réserve juste avant le blocage du dimanche à 15:00 UTC (16:00 en Belgique en hiver).</p>
<h3 id="s13-2">Last Night</h3>
<p>Fais-y au moins 10 000 de dégâts une fois : Isaac t'apporte ensuite récompenses et ressources chaque jour, à condition d'aller lui parler sur la carte. Plus tard, pour viser un score maximum, il faut équiper tous tes persos avec de bonnes pièces.</p>
<h3 id="s13-3">Boutiques mensuelles</h3>
<p>La boutique <button class="term" data-tip="Fil d'or — Gagné sur les doublons +5 ; boutique de points" type="button">Golden Thread</button> et celle de Mirror Wars proposent des costumes 5★ qui changent chaque mois. Regarde-les avant de dépenser tes médailles ou tes Fils d'or.</p>
<h3 id="s13-4">Les autres modes en détail (compendium)</h3>
<p>Les modes déjà détaillés dans le parcours : Path of Adventure et Mirror Wars (étape 5), Evil Castle et ses tours (étape 6), Season Events et Fiend Hunter (étape 8), Last Night (étape 9). Voici les autres.</p>
