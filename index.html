<h4>The Soul Wager</h4>
<p>Un auto-battler de gestion d'inventaire. Tu achètes des cases, des unités et de l'équipement dans une boutique, tu les places sur une grille 7×7, puis le combat se joue seul. Chaque plateau contient plusieurs phases ; 5 défaites sur un plateau le remettent à zéro. Finis tous les plateaux de la saison pour acheter toute la boutique d'Alea Chips : Tear of the Goddess, Refining Powder, or, cristaux de magie, contrats ★5 et ★4.</p>
<figure class="shot cp"><button aria-label="Agrandir : L'écran de préparation : réserve, terrain et boutique" class="shot-btn" data-full="img/cp-layout.jpg" type="button"><img alt="L'écran de préparation : réserve, terrain et boutique" loading="lazy" src="img/cp-layout.jpg"/></button><figcaption>L'écran de préparation : réserve, terrain et boutique<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<ul>
<li><strong>Déblocage</strong> : les quêtes principales d'Edge of Dimensions. Saison de <strong>8 semaines</strong>, essais illimités, décompte à 15:00 UTC le dernier jour.</li>
<li><strong>Soul Tokens</strong> : 16 par victoire, 10 par défaite, pour continuer ta partie. Une défaite rafraîchit la boutique et remet le compteur de relances à zéro.</li>
<li><strong>La boutique de combat</strong> : 4 emplacements, renouvelés après chaque combat. Touche l'étiquette de prix pour <strong>réserver</strong> un objet jusqu'au prochain tour. 10 % de chances d'une promo à −50 %. Une relance coûte 1 token, puis +1 tous les 4 relances : ne relance pas plus de 4 ou 5 fois par phase. Revendre rend la moitié du prix (2 minimum, 1 pour la Protection Tile). La <strong>réserve</strong> garde tes pièces sans pénalité.</li>
<li><strong>Placer</strong> : les cases vont de 1×1 à 2×2 ou 1×4, les unités ont des formes jusqu'à 3×4. Pour tourner une pièce : sur PC, maintiens le clic gauche et clique droit ; sur téléphone, maintiens avec un doigt et touche avec un autre. <strong>View Formation</strong> montre la grille ennemie : regarde-la avant de construire.</li>
<li><strong>Les unités</strong> : 8 rôles (attaque au contact, à distance, défense, soutien, soin, malédiction, purification, retrait de buffs). Chacune a des dégâts, un coût d'endurance, une précision et un temps de recharge. Certaines ont un bonus si des cases précises (icône de croix) sont posées sur le terrain. Tu peux les améliorer jusqu'à leur niveau de doublon dans ton vrai effectif.</li>
<li><strong>Le combat</strong> : la position n'influence pas la cible, toutes tes unités frappent tout le camp adverse. L'<strong>endurance</strong> est partagée : si la réserve est vide, l'unité ne peut pas agir (« Out of Stamina »). Après 20 secondes, le mode <strong>End Game</strong> inflige des dégâts croissants aux deux camps.</li>
<li><strong>Stratégie actuelle</strong> : DPS Liatris (Rodev's Star), Rubia (Thorn of the Desert) et Blade (Apostle) ; en soutien et malédiction, Pure White Blessing Refithea, The Curse Celia, Overheat Levia, Onsen Manager Liberta, Shattered Dream Palette. L'idée : empiler les débuffs, surtout le <strong>Poison</strong>, avec juste assez de survie.</li>
<li><strong>Boutique</strong> : achète <strong>tout</strong>, contrats compris, même en vétéran, car les Alea Chips restants disparaissent à la fin de la saison. Vidéos : Seji, ou ButtonBash Gaming et Haradeas.</li>
</ul>
<h4>Taros Tactical Manual</h4>
<p>Des énigmes tactiques avec des persos imposés, sur une grille de 9 à 25 combats. Aucun besoin de progression : parfait pour un débutant qui veut apprendre. Les missions donnent jusqu'à 2 millions d'or, 300 000 Refining Powder et 40 Sparks of Rampage par saison. Essaie seul d'abord ; sinon, vidéos de Seji ou Shimonami.</p>
<p>La saison dure <strong>28 jours</strong>. Chaque combat rapporte de l'or selon sa difficulté : 12 500 (Easy), 25 000 (Normal) ou 80 000 (Hard). Les missions : 1 et 2 victoires (1 million d'or chacune), 3 victoires (100 000 Refining Powder), 1 ligne complète ou « bingo » (200 000 Refining Powder), 2 et 3 bingos (20 Sparks chacun). La base de Souseha propose aussi des solutions en images.</p>
<h4>Rapport</h4>
<ul>
<li><strong>3 discussions par jour</strong> au total, sur des costumes que tu possèdes (une par costume). La bonne réponse donne 100 XP, l'autre 80 XP. Reset à 15:00 UTC.</li>
<li>Monter le Rapport débloque l'histoire du costume et fait monter le <strong>Rapport Buff</strong> : un bonus <strong>permanent de taux de critique</strong> pour tout le compte, jusqu'à 50 % avec 10 costumes au maximum.</li>
<li>Le niveau max d'un costume dépend de son avancée : 10 à l'obtention, 15 après Awakening, 20 après le Potentiel.</li>
<li>Les cadeaux (boissons) donnent de l'XP : 40 pour la boisson préférée, 20 sinon, 150 pour la Special Drink. Ne les achète pas au début : plus tard, la boutique Golden Thread convient, après les achats prioritaires.</li>
<li><strong>Accès</strong> : bouton Rapport de l'accueil, bouton « Talk » d'un costume dans Companion, ou le Glupy Diner. Seuls les costumes que tu possèdes, et pas tous : les développeurs ajoutent le Rapport costume par costume.</li>
<li><strong>Les discussions</strong> : 15 par costume (« Visits »), tirées au hasard parmi celles pas encore vues. Les voir toutes rapporte <strong>100 Dia</strong> une fois. Les <strong>Talk Archives</strong> affichent les bonnes réponses de celles déjà faites. Un costume au niveau maximum peut discuter sans limite, pratique pour finir l'archive. <strong>Quick Talk</strong> (après 5 discussions) saute la scène pour 80 XP et consomme une discussion.</li>
<li><strong>Monter un costume au maximum</strong> (2 100 XP) : 21 discussions, ou 53 boissons préférées. Le plus malin : <strong>1 discussion + 50 boissons</strong>, car chaque boisson est limitée à 100 achats (sauf la Special Drink). Les 7 boissons (Creamy Milk, Cold Beer, Velvety Wine, Fragrant Whiskey, Warm Black Tea, Sweet Soda, Special Drink) se trouvent dans les boutiques <button class="term" data-tip="Poudre d'espoir — Gagnée à chaque tirage ; boutique de points" type="button">Powder of Hope</button> et Golden Thread. Une fois le bonus de critique au maximum, elles ne valent presque plus rien.</li>
<li><strong>Attention à l'Awakening</strong> : sans lui, un costume reste bloqué au niveau 10, même avec son Potentiel terminé. Ça gêne surtout les supports, qu'on éveille rarement.</li>
<li><strong>Récompenses</strong> : un objet de collection au niveau 10, des stickers aux niveaux 15 et 20. L'histoire du costume compte 6 épisodes, débloqués aux niveaux 1, 3, 5, 7, 9 et 10 et à lire dans l'ordre ; ils rapportent des Dia, pas d'XP. Pendant un Season Event, l'histoire du costume vedette est ouverte à tous, avec de la monnaie d'événement en plus.</li>
<li><strong>Le Rapport Buff</strong> fonctionne comme un bonus de collection : il touche tout le compte et <strong>la Pressure ne le réduit pas</strong>. Chaque mission donne +2 % (niveau 10 et 20 d'un costume, niveaux 10, 15 et 20 pour 5, 10, 20 et 30 costumes ; le jeu écrit « Characters », mais compte des costumes). Les bonnes réponses de chaque costume sont listées sur la <a href="https://botan14xd.github.io/BD2-Overview/content/rapport/" target="_blank" rel="noopener">page Rapport du compendium</a>.</li>
</ul>

<h4>Evil Castle : compléments</h4>
<ul>
<li><strong>Tower of Pride</strong> : 6 étages, chacun avec un élément unique pour les ennemis (jamais <span class="el el-light">Lumière</span>). Chaque combat a ses tâches bonus : un nombre de persos de l'élément demandé (étage 1 : 4 <span class="el el-fire">Feu</span> ; 2 : 4 <span class="el el-light">Lumière</span> ; 3 : 4 <span class="el el-water">Eau</span> ; 4 : 4 <span class="el el-light">Lumière</span> ; 5 : 3 <span class="el el-wind">Vent</span> ; 6 : 2 <span class="el el-light">Lumière</span> et 2 <span class="el el-dark">Ténèbres</span>), gagner en 1, 3 ou 5 tours, plus les points d'évaluation (1 million de dégâts par un seul perso en un tour, combat en 1 tour, équipe à PV max). Un étage vaut 100 000 points au maximum (15 000 par combat, 40 000 pour le boss). Paliers de la récompense quotidienne (étape 6) : 10 000, 50 000, 100 000, 150 000, 200 000, 300 000, 400 000, 500 000 et 600 000 points.</li>
<li><strong>Tower of Desire</strong> : l'élément des ennemis change tous les 10 étages, et chaque étage a 2 défis facultatifs. Chaque étage donne 1 <button class="term" data-tip="Ticket de tirage normal" type="button">Draw Ticket</button>, 30 000 d'or et 5 riz ; tous les 5 étages, 100 Dia et 5 Ancient Crystals ; tous les 10, 150 Dia et 10 Ancient Crystals. À partir de l'étage 151, la vidéo de Seji aide.</li>
<li>
<p><strong>Tower of Salvation</strong> : saison de 4 semaines, décompte à 15:00 UTC le dernier jour. Les niveaux 1 et 2 visent l'étage 10, les 3 et 4 l'étage 20, les suivants l'étage 30. Plus on monte, moins on a d'argent et de SP au départ (20 SP et +5 par tour au niveau 1, jusqu'à 10 SP et 0 par tour au niveau 10) et plus les ennemis sont costauds (PV ×1,5 au niveau 2, ×5 au niveau 4, ×50 au niveau 10).</p>
<ul>
<li><strong>Améliorations en Obsidian</strong> : après Refresh Attempts Up et Starting SP Up (étape 6), Discount Probability Up puis l'ATK ou la MATK selon ton équipe.</li>
<li><strong>Le draft</strong> : en plus de ce que dit l'étape 6, tes costumes gardent leur Engraving. Les 2 premiers choix d'un draft viennent de persos que tu as déjà, les 2 derniers sont toujours des persos nouveaux : posséder un autre costume d'un perso aide à tomber plus vite sur celui que tu veux. Le joker (5e choix) doit rester dans ton type de dégâts et équilibrer l'équipe (un DPS si tu as déjà des supports, et l'inverse).</li>
<li><strong>Ce que donne chaque salle</strong> : combat (argent + choix de costume), élite (plus d'argent + artefact), boss tous les 10 étages (beaucoup d'argent, artefact rare et une relance), événement (gain possible avec un risque, ou « Leave the room »).</li>
<li><strong>Artefacts</strong> : 4 raretés, pas de doublons. Certains se combinent en un meilleur (l'icône en haut à gauche montre la recette, onglet Sort). Leurs buffs <strong>ne comptent pas</strong> pour les costumes qui comptent les buffs, comme New Hire Nebris ou Onsen Swordfighter Blade.</li>
<li><strong>La boutique</strong> : 5 artefacts à prix fixe, 4 costumes de persos possédés, 4 de persos nouveaux, +1 doublon d'un costume pour 1 000 argent, soins et relance (1 000, de plus en plus cher). Promos à −50 % selon la difficulté.</li>
<li><strong>Changer le résultat d'un combat</strong> (le hasard est figé) : modifie l'ordre ou ajoute un recul ou une attaque de base. Deux styles marchent : beaucoup de Chains, ou très peu. Au niveau 10, un étage 31 (« Crystal Battle ») sert seulement au classement : inutile de s'y acharner.</li>
<li>
<p><strong>Récompenses de saison</strong> : de 1,5 à 15 milliards de points (Awakening Elixirs, poudre, cristaux, ticket d'exclusif UR, 10 Draw Tickets).</p>
</li>
<li>
<p><strong>Équipes rapides (Discord officiel, novembre 2026)</strong> : en <strong>magique</strong>, les buffers B-Rank Idol Helena et Beachside Angel Teresse, avec Loen, Levia, Eclipse, Venaka ou QoS Michaela en DPS ; en <strong>physique</strong>, Dark Saintess Liberta et Homunculus Lathel (ou Teresse), avec Blade, Luvencia ou New Hire Nebris. Dans les deux cas, Fiend Scholar Olstein et BV Morpeah permettent de tenir si tu ne finis pas en un tour. Ce n'est qu'un guide rapide : certains DPS de collaboration ne servent que si tu les as, et Liatris demande des artefacts de dégâts sur la durée.</p>
</li>
<li><strong>Artefacts</strong> (Discord officiel) : le choix dépend de tes persos. Les artefacts « peu de Chains » vont mieux aux équipes magiques ; ceux « beaucoup de Chains » aux costumes qui frappent plus de 5 fois, comme Luvencia. La <a href="https://browndust2-wiki.souseha.com/en/artifacts" target="_blank" rel="noopener">liste des artefacts de Souseha</a> et un <a href="https://docs.google.com/document/d/1IV-IG25gJdOa2N_9HEuZbbevpUyDp8RyNN_6VSSrUzo/edit" target="_blank" rel="noopener">guide détaillé de la Tower of Salvation</a> vont plus loin.</li>
<li>
<p><strong>Towers of Wrath et of Jealousy</strong> : récompenses tous les 50 étages (10 Draw Tickets, 150 Dia, 1 ticket d'élément), tous les 10 (10 Draw Tickets, 150 Dia, 200 Refining Crystals), tous les 5 (5 Draw Tickets, 100 Dia, 100 Refining Crystals), sinon de l'or et 5 torches. Les effets changent tous les 10 étages à partir du 11 : par exemple boucliers de 50 % des PV, Chains en plus pour les ennemis, renforcements −70 % (41 à 50), puis <button class="term" data-tip="Chance / Dégâts critiques" type="button">Crit DMG</button> −200 % pour toi, et taux de critique −200 % pour tout le monde (91 à 100). La liste complète est sur la <a href="https://botan14xd.github.io/BD2-Overview/content-packs/evil-castle/" target="_blank" rel="noopener">page Evil Castle du compendium</a> ; Seji a aussi une série de vidéos.</p>
</li>

<h4>Season Event : compléments</h4>
<ul>
<li>L'histoire d'un événement est l'histoire Rapport d'un costume, en <strong>6 épisodes</strong> : 650 monnaie pour les 5 premiers, 750 pour le dernier. Les anciennes histoires se relisent dans l'onglet Story, sans récompense.</li>
<li><strong>4 costumes d'événement</strong> augmentent la monnaie gagnée (jusqu'à +100 %), qu'ils soient dans ton équipe ou non.</li>
<li>La condition « tout le monde survit » concerne les combats Normal 1 à 4, 6 à 9 et 11 à 14 ; pour les Normal 5, 10, 15 et tous les Challenge, c'est « moins de 2 persos K.O. ».</li>
<li><strong>Récompenses uniques</strong> : 250 monnaie + 25 + 25 Dia par combat Normal, 250 monnaie + 50 000 + 50 000 d'or par Challenge. Le bonus des costumes s'applique <strong>après</strong> la victoire : 250 affichés peuvent devenir 500. Rejouer un combat fini donne une plus petite récompense.</li>
<li><strong>Ordre conseillé</strong> : Normal 1 à 15, puis Challenge 1 à 15, puis rejoue le Challenge 15 jusqu'au dernier jour (ou l'inverse).</li>
<li><strong>Missions</strong> : 6 missions à 100 Dia chacune (dépenser 1 000, 5 000 et 10 000 monnaie ; faire 5, 15 et 25 combats).</li>
<li><strong>Boutique, la suite</strong> : 1 million d'or (2 000), 150 000 Ability Pills (10 000), en option 250 Red Slimes (1 000) et 8 étoiles de rang ★4 (800), puis Refining Powder, or et Engraving Scrolls à volonté.</li>
</ul>

<h4>Fiend Hunter : compléments</h4>
<ul>
<li><strong>Exemple de validation</strong> : 1 milliard de dégâts sur Very Hard valide Easy, Normal et Hard (573 millions de PV), et Very Hard garde ces dégâts. Le dernier jour, un décompte commence à 15:00 UTC.</li>
<li><strong>Le boss</strong> occupe des cases précises de la grille 3×4. Ses compétences <strong>Basic</strong> forment un cycle affiché à droite (la prochaine porte l'étiquette NEXT), et la dernière <strong>tue toute l'équipe</strong>. Les <strong>Conditional</strong> prennent la place du prochain coup quand leur condition est remplie, un nombre limité de fois. Si une équipe meurt avant ce coup final, le cycle <strong>continue</strong> avec l'équipe suivante : vise à survivre jusqu'au coup final.</li>
<li><strong>Poise</strong> : remplir une condition fait baisser la jauge de 1. À zéro, le boss passe en <strong>Guard Down</strong> et prend plus de dégâts ; cet état reste pour les équipes suivantes.</li>
<li><strong>Points faibles</strong> : certaines parties affichent « WEAK » et prennent plus de dégâts. Le boss ne peut être ni poussé ni réduit au silence, et ses coups ne s'esquivent pas.</li>
<li><strong>Team Switch</strong> passe à l'équipe suivante (jamais en arrière) comme une mort instantanée, sans réinitialiser le cycle du boss. Rarement utile.</li>
<li><strong>Replicate Battle</strong> : enregistre ton combat (Save Battle Data) pour le rejouer automatiquement tour par tour, compétences, Bursts et placement compris.</li>
<li><strong>Break Season et Return Season</strong> : quand un bug fausse le classement, la saison devient une <strong>Break Season</strong> et tous les participants reçoivent les récompenses du rang 1 (sans sticker ni trophée). Le même boss revient plus tard en <strong>Return Season</strong> (bouton sur l'accueil), sans préparation, avec certains costumes bannis, et ses récompenses de difficulté se gagnent à nouveau.</li>
</ul>

<h4>Last Night : compléments</h4>
<ul>
<li>Tu peux mettre <strong>plusieurs costumes du même perso</strong> dans l'équipe.</li>
<li><strong>Le boss</strong> a 0 % de DEF et de MRES. Comme il ignore les debuffs, la Vulnérabilité et les dégâts sur la durée n'y servent à rien. Les supports à zone limitée buffent toute l'équipe, mais les buffs sur soi restent sur soi. Exemple de Pressure : Homunculus Lathel passe de 280 % à 140 %.</li>
<li><strong>Support Bonus</strong> : inutile d'équiper Elpis ou Arines (un seul costume chacune) si tu les joues, puisque ton équipe active n'en donne pas. Exemple : Angelica à 10 983 de puissance donne 10,98 % par costume.</li>
<li>Au-delà de 110 millions, les paliers ne rapportent qu'un peu d'or, des titres et des stickers.</li>
<li><strong>Qui mettre</strong> (dans l'ordre de l'étape 9 : buffers, chainers, DPS) : les meilleurs buffers ici donnent de l'<button class="term" data-tip="Buff qui augmente les dégâts des alliés" type="button">Augmentation</button> ou des bonus hors stats : Pure White Blessing Refithea, Onsen Manager Liberta, Shrine Maiden of Purification Granadair et Sunny Inn Hand Helena, à placer <strong>juste avant le DPS</strong> qu'elle buffe. Beachside Angel Teresse y est mauvaise. Pour les chainers, n'importe quel perso à beaucoup de coups au début (même Zenith), puis Water Park Wilhelmina ou Deadeye Nekyndalia. Côté DPS, New Hire Nebris (environ 25 buffs, soit 1 260 % d'ATK par coup) ; les DPS basés sur les PV ennemis (Nature's Claw Rou, Angelica) sont forts au début sans investissement ; ceux qui comptent le nombre d'ennemis (Reclaimed Destiny Sacred Justia) sont moins bons ici.</li>
</ul>

<p><strong>Compléments du Discord officiel (novembre 2026).</strong></p>
<ul>
<li><strong>4 groupes, dans cet ordre</strong> : buffers (7 à 8 au maximum), chainers (5 à 7), semi-nukes (gros dégâts en 2 à 4 coups), puis nukes (un seul très gros coup). Adapte le nombre de buffers à ton équipe physique ou magique.</li>
<li><strong>Buffers</strong> : Pure White Blessing Refithea et Onsen Manager Liberta sont <strong>indispensables</strong> (chacune double à peu près tes dégâts). Ensuite : Homunculus Lathel, Dark Saintess Liberta, B-Rank Idol Helena, Medical Club Teresse, Arines, Kind Student Samay et Elpis. Arines est souvent préférée à Elpis. B-Rank Idol Helena et Dark Saintess Liberta aident pour le taux de critique.</li>
<li><strong>Chainers</strong> : commence par Zenith, Sage Olstein, The Curse Celia et Pirate Rubia ; sinon, tes 5 meilleurs persos qui ajoutent des Chains (par exemple Manager Gray). Pas de Bunny Celia si tu as Bride Refithea. Hikage, Wilhelmina et les deux Luvencia viennent après les autres chainers.</li>
<li><strong>Semi-nukes</strong> : Night of Jealousy Levia, QoS Michaela, New Hire Nebris. <strong>Nukes</strong> : Comeback Idol Ventana, Promise of Vengeance Lathel (+2 gratuit avec l'histoire du chapitre 7), Nartas. Un gros nuke peut entrer même dans une équipe de l'autre type.</li>
<li><strong>Équipement</strong> : ton meilleur équipement offensif (options ATK %/MATK % et Crit DMG) sur tes DPS principaux, avec un score de 18 sur l'arme, l'accessoire et les gants. Utilise des presets d'équipement.</li>
<li><strong>Support Bonus</strong> : équipe <strong>tous</strong> les persos, sauf les buffers que tu joues et qui n'ont qu'un costume. Valeur de l'équipement : UR IV &gt; UR d'événement &gt; UR III &gt; SR EX &gt; UR II &gt; UR I. Vise <strong>au moins 4 %</strong> par perso. Selon le Discord (<code>?cp</code>), le bonus vaut la puissance de combat <strong>totale du perso</strong> ÷ 1 000, alors que le compendium le compte <strong>par costume</strong> (<a class="verify" href="#a-verifier">à vérifier en jeu</a>).</li>
<li><strong>Notes</strong> : les costumes dont tu as débloqué le Burst utilisent automatiquement leur plus haut niveau. <strong>Jamais</strong> de costumes à dégâts fixes. Ajuste l'ordre selon ton Crit DMG. Les Tears vont aux persos qui ont de gros bonus de dégâts. Des dégâts faibles viennent en général d'une absence de critique ou d'une mauvaise équipe.</li>
</ul>
<h4>Mirror Wars : compléments</h4>
<ul>
<li>Certains costumes s'activent <strong>avant le combat</strong> (« tour 0 ») et coûtent déjà des SP. Exemple : Comeback Idol Granhildr lancée ainsi en défense laisse 6 − 5 + 6 = 7 SP au tour 2.</li>
<li>Cocktails en plus : événements, ou 40 cocktails pour 170 Dia en boutique. La mission quotidienne du passe donne 200 médailles.</li>
<li>Au-delà de Dia I, le rang dépend de ta <strong>place</strong> : Sapphire III de la 3 001e à la 5 000e place, jusqu'à Champion pour la 1re.</li>
</ul>
</div></section>
<section class="chapter" id="s14" data-title="Vie annexe : Fantasia Square, Territory, pêche"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z"/><path d="M12 8v6"/><path d="M9.5 11.5L12 14l2.5-2.5"/></svg><b>14</b></span><h2>Vie annexe : Fantasia Square, Territory, pêche</h2></header><div class="ch-body">
<p>Ces modes sont détendus et presque sans impact sur la progression. Le Glupy Diner est détaillé à l'étape 10.</p>
<h3 id="s14-1">Fantasia Square</h3>
<p>C'est la place centrale, accessible comme un pack. Tu y trouves la <strong>statue de la Déesse</strong> : interagis avec elle pour prier chaque jour (routine quotidienne, la quête du jour « Make a wish at the Goddess Statue »). Pour y aller : collection de packs, « Content Pack », Fantasia Square (Plaza), puis marche jusqu'à la statue. Tu y vois aussi les statues des champions du Mirror Wars à visiter chaque semaine.</p>
<figure class="shot dc"><button aria-label="Agrandir : Aller à la statue de la Déesse : Content Pack, Fantasia Square, puis la statue" class="shot-btn" data-full="img/dc-fwish.jpg" type="button"><img alt="Aller à la statue de la Déesse : Content Pack, Fantasia Square, puis la statue" loading="lazy" src="img/dc-fwish.jpg"/></button><figcaption>Aller à la statue de la Déesse : Content Pack, Fantasia Square, puis la statue<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h3 id="s14-2">Territory</h3>
<p>Un mode de gestion de village, en bas de l'escalier de Fantasia Square. Il <strong>n'influence pas</strong> ta progression : vois-le comme un passe-temps.</p>
<ul>
<li><strong>Bûcheronnage</strong> : abats seulement les arbres au 3e stade (5 minutes de pousse), ils donnent le plus de bois et d'XP.</li>
<li><strong>Mine</strong> : la carrière fait apparaître un filon par minute (jusqu'à 9) : pierre, cuivre, fer, argent ou or.</li>
<li><strong>Agriculture</strong> : la source des <strong>Local Points</strong>, la monnaie du Territory. Achète des graines, récolte, cuisine et vends les plats. Les cultures vont de la pomme de terre (1 minute) au safran (20 heures).</li>
<li><strong>Conseil</strong> : investis d'abord dans l'agriculture, et améliore la hache et la pioche pour récolter plus et débloquer les décorations.</li>
<li>Les aides du Territory produisent aussi pendant ton absence : récupère leurs gains via <strong>Business Management</strong> sur l'accueil.</li>
</ul>
<h4>Le Territory plus en détail (compendium)</h4>
<ul>
<li><strong>Le terrain</strong> : au début, tu choisis 1 terrain parmi 6 (plaine, rivières, côte, plages). Ça ne change pas ta progression ; la plaine offre le plus de place, car on ne peut poser que des ponts sur l'eau. Changer de terrain plus tard (via le téléphone) détruit tout : bâtiments remboursés en matériaux, extensions remboursées en Local Points, mais cultures, arbres et filons perdus. Tu commences avec 9 zones et peux en ouvrir jusqu'à 25 avec des Local Points.</li>
<li><strong>Bois et mine</strong> : un nouvel arbre pousse chaque minute (9 au maximum) et atteint le stade 3 en 5 minutes. Les filons n'ont pas de stades de pousse ; leurs chances : pierre 30 %, fer 25 %, cuivre 20 %, argent 15 %, or 10 %.</li>
<li><strong>Cultures</strong> : 3 raretés (normale, rare, légendaire), récoltables seulement au stade 3. Les graines s'achètent au moment de planter.</li>
<li><strong>Niveaux</strong> : bûcheronnage, mine et agriculture ont chacun 10 niveaux. Ils débloquent cultures, plats et décorations, et montent ta compétence (moins de coups pour couper ou miner, cultures plus rares). Certains plats donnent des bonus <strong>Lumber</strong>, <strong>Mineral</strong> ou <strong>Crops</strong> : +1 objet récolté par bonus actif.</li>
<li><strong>Ordre de construction</strong> : Home, Cooking Pot, Workbench, Forge et 1 Resident Mansion pendant les missions de départ ; puis les <strong>Fields</strong> ; puis Logging Site et Quarry ; puis Pub et Warehouse ; puis Helper Lodging ; les 4 autres Resident Mansions sont purement décoratives.</li>
<li><strong>Gagner des Local Points</strong> : en jouant activement, produis en masse des <strong>Virile Gnocchi</strong>. Plus tard, mange un Lingerie Cookie, une Lustful Tart et une Libido Soup (bonus Crops) <strong>juste avant</strong> de récolter tes cultures chères comme le Pulse Saffron, et garde toujours 3 de chaque plat d'avance. En mode tranquille, n'importe quel plat rapporte : rien ne presse dans ce mode.</li>
<li><strong>Outils</strong> : la hache et la pioche d'abord (plus d'objets, revendables), puis la faucille (cultures plus rares, plusieurs par coup). Les outils passent avant les aides.</li>
<li><strong>Les aides</strong> : construis la Helper Lodging, puis recrute pour 5 000 Local Points (1 aide au choix parmi 3). Chaque aide a 3 stats de 1 à 6 (bois et minerai par 4 heures, rendement des récoltes). Gobelins et orcs sont les plus fréquents (37 % chacun) ; seuls l'écureuil, le mouton et le lapin peuvent avoir un 6 (respectivement en bois, en mine et en agriculture, à 0,2 %) ; le chat et le rare Yuridori ont la meilleure moyenne. Les aides ne récoltent que des cultures normales, dans un stock à part.</li>
</ul>
<figure class="shot cp"><button aria-label="Agrandir : Le recrutement d'une aide du Territory" class="shot-btn" data-full="img/cp-helper-1.jpg" type="button"><img alt="Le recrutement d'une aide du Territory" loading="lazy" src="img/cp-helper-1.jpg"/></button><figcaption>Le recrutement d'une aide du Territory<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h3 id="s14-3">Fishing Voyage</h3>
<p>La pêche rapporte des Lucky Silver Coins. Une fois assez avancé, tu peux vider sa boutique chaque mois : 10 Gold Pockets, 30 <button class="term" data-tip="Poudre / Cristal / Pierre de raffinage — Monter le score de raffinage (poudre) et relancer les options (pierres, cristaux)" type="button">Refining Powder</button>, puis 450 Deco Coins.</p>
</div></section>
<section class="chapter" id="s15" data-title="Quand tu bloques"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M6.3 6.3l3.2 3.2M17.7 6.3l-3.2 3.2M6.3 17.7l3.2-3.2M17.7 17.7l-3.2-3.2"/></svg><b>15</b></span><h2>Quand tu bloques</h2></header><div class="ch-body">
<p>Si tu butes sur un combat après avoir monté tes persos et ton équipement, identifie ton problème : pas assez de dégâts, trop de morts, ou pas assez de zone. Chaque cas a ses réflexes.</p>
<h3 id="s15-1">Pas assez de dégâts</h3>
<ol>
<li>Cumule les soutiens : les buffs offensifs de compétences différentes se cumulent. Arines avec Kind Student Samay donne par exemple +120 % d'ATK et 30 % de critique.</li>
<li>Monte des équipements à dégâts critiques : ils pèsent plus que l'ATK. En histoire, tu peux te contenter d'un faible taux de critique, puisque tu peux recommencer.</li>
<li>Joue l'élément fort : +50 % de dégâts de base. L'élément faible réduit tes dégâts (la valeur exacte s'affiche dans l'écran de stats, et tu peux voir celles des ennemis en plein combat). Regarde aussi le bonus élémentaire de la saison.</li>
<li>Regarde la DEF et la <button class="term" data-tip="Défense / Résistance magique — Réduit les dégâts physiques / magiques" type="button">M.RES</button> de l'ennemi. Si elles sont hautes, baisse-les (Kry en Marauder, Elise) ou joue des dégâts fixes (Justia, Alec).</li>
</ol>
<h3 id="s15-2">Tes persos meurent trop vite</h3>
<ol>
<li>Lis toujours les prochaines attaques ennemies et place tes persos pour éviter les zones. Tu peux tout repositionner avant chaque tour.</li>
<li>Tue plus vite : plus d'ennemis morts au premier tour, moins de coups reçus.</li>
<li>Si tu ne peux pas tout tuer, élimine d'abord ceux qui frappent le plus fort.</li>
<li>Utilise un tank avec provocation. Andrew (4★, Specialist) est recommandé : facile à obtenir, il provoque et peut esquiver pour annuler les dégâts.</li>
<li>Sacrifie un perso secondaire si une attaque énorme est inévitable.</li>
</ol>
<h3 id="s15-3">Tu n'atteins pas tous les ennemis</h3>
<p>Traite chaque combat comme un puzzle : trouve la formation et l'ordre des compétences qui touchent un maximum d'ennemis dès le premier tour. Le repoussement est la clé : il aligne les ennemis avant ta zone.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Direction du repoussement</th>
<th>Persos</th>
</tr>
</thead>
<tbody>
<tr>
<td>Vers l'avant</td>
<td>La plupart</td>
</tr>
<tr>
<td>Avant gauche</td>
<td>Lathel, Beatrice</td>
</tr>
<tr>
<td>Avant droite</td>
<td>Layla, Rubia</td>
</tr>
<tr>
<td>Gauche</td>
<td>Emma, Ventana</td>
</tr>
<tr>
<td>Droite</td>
<td>Angelica</td>
</tr>
<tr>
<td>Vers toi (attire)</td>
<td>Dalvi</td>
</tr>
</tbody>
</table></div>
<p>Le repoussement d'Arines vise la position "Skip" (il saute le premier ennemi) et recule la cible d'une case. Le repoussement de Violent Student Kry recule deux ennemis de deux cases et inflige de lourds dégâts à tout ennemi percuté.</p>
<h3 id="s15-4">Persos blessés ou morts dans un pack</h3>
<p>Fuis et soigne-toi. Les pots de soin se cassent avec le dash, et chaque pack a une auberge qui soigne et ressuscite tes persos : cherche-la sur la mini-carte. Dans les packs de persos en difficulté Normal, tu es forcé d'utiliser une équipe fixe : c'est un puzzle, et des vidéos de solutions existent si tu bloques.</p>
</div></section>
<section class="chapter" id="s16" data-title="FAQ"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M9.6 9.5a2.5 2.5 0 0 1 4.8.8c0 1.7-2.4 2.2-2.4 3.7"/><circle cx="12" cy="17" r=".6"/></svg><b>16</b></span><h2>FAQ</h2></header><div class="ch-body">
<h3 id="s16-1">Gacha et personnages</h3>
<p><strong>Y a-t-il une tier list ?</strong> Pas de fiable : on change de persos selon le contenu. Une seule règle tient toujours : les <strong>supports passent avant les DPS</strong>, parce que tu les utilises partout.</p>
<p><strong>Comment obtenir un personnage ?</strong> Un costume est une compétence du personnage. Ton premier costume d'un perso débloque automatiquement le perso : on ne tire jamais « le perso » lui-même.</p>
<p><strong>1-Pick ou 12-Pick ?</strong> Pour un débutant, la bannière <strong>12-Pick</strong> est objectivement meilleure : mets-y des supports. La liste des 12 choix conseillés, avec leurs paliers, est dans la section 12 (« La bannière 12-Pick »).</p>
<p><strong>Les Property Tickets ?</strong> Ils donnent un ★5 aléatoire de l'élément choisi. Au début, presque tout élément est bon ; tu peux viser la <span class="el el-light">Lumière</span> jusqu'à avoir une bonne Refithea.</p>
<p><strong>Plus de tickets et de Dia ?</strong> Codes coupons (annoncés dans le salon des annonces du Discord officiel), Evil Castle, Character Packs, Event Packs, coffres des zones de combat, Fiend Hunter, boutiques d'événement et de guilde, passes, succès… et simplement jouer.</p>
<p><strong>Qui recruter à la taverne ?</strong> D'abord les supports : Diana (Story Pack 10), Dark Saintess Liberta (Story Pack 15), Queen of Gluttis Granadair (apparition aléatoire). Ensuite : tout costume de la taverne qui a une bannière active, Night of Death Mamonir, Fiend Scholar Olstein (Story Pack 4, si tu n'as rien d'autre), Shattered Dream Palette (Story Pack 20), The Gluttonous Refithea, The Curse Celia.</p>
<h3 id="s16-2">Combat</h3>
<p><strong>Comment marchent les éléments ?</strong> <span class="el el-water">Eau</span> &gt; <span class="el el-fire">Feu</span> &gt; <span class="el el-wind">Vent</span> &gt; <span class="el el-water">Eau</span>. <span class="el el-light">Lumière</span> et <span class="el el-dark">Ténèbres</span> font chacune plus de dégâts à l'autre. Le Neutre ne prend ni plus ni moins de dégâts.</p>
<p><strong>C'est quoi une bonne équipe ?</strong> Un seul type de dégâts (physique ou magique), 2 à 3 supports plus des DPS, les supports avant les DPS dans l'ordre, pas de buff d'élément s'il ne sert à rien, des types de buffs variés, assez de SP pour tout lancer au tour 1, une victoire visée au tour 1 (au pire au tour 3), et ton meilleur équipement.</p>
<p><strong>Bloqué sur un boss ?</strong> Contre un boss seul : équipe physique avec Zenith et Ventana (empruntée à un ami) en DPS. Contre un boss avec des sbires : Sacred Justia ou Bunny Loen empruntés.</p>
<p><strong>Perdu un combat d'histoire ?</strong> En Normal, tu peux payer <strong>10 000 d'or</strong> pour continuer (le prix monte à chaque fois) : le tour, les PV, les SP et les recharges de tes persos repartent à zéro ; les ennemis gardent leurs PV et leurs SP, mais leurs recharges repartent aussi à zéro. Ça ne marche qu'en Normal, dans l'histoire. Tu peux aussi emprunter des persos à des amis (Normal, Hard et combats Challenge des événements) : le salon friend-support du Discord officiel sert à en trouver.</p>
<figure class="shot cp"><button aria-label="Agrandir : Équipe contre un boss avec des sbires" class="shot-btn" data-full="img/cp-aoe_boss_kit.jpg" type="button"><img alt="Équipe contre un boss avec des sbires" loading="lazy" src="img/cp-aoe_boss_kit.jpg"/></button><figcaption>Équipe contre un boss avec des sbires<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p>Deux boss demandent une solution à part : la White Witch (Story Pack 13, Song of Snow), et Apostle Partan (Story Pack 11, Fake Game), pour qui le compendium propose une autre équipe.</p>
<figure class="shot cp"><button aria-label="Agrandir : Solution contre la White Witch (Story Pack 13)" class="shot-btn" data-full="img/cp-White_Witch.jpg" type="button"><img alt="Solution contre la White Witch (Story Pack 13)" loading="lazy" src="img/cp-White_Witch.jpg"/></button><figcaption>Solution contre la White Witch (Story Pack 13)<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<figure class="shot cp"><button aria-label="Agrandir : Autre solution contre Apostle Partan (Story Pack 11)" class="shot-btn" data-full="img/cp-partan.jpg" type="button"><img alt="Autre solution contre Apostle Partan (Story Pack 11)" loading="lazy" src="img/cp-partan.jpg"/></button><figcaption>Autre solution contre Apostle Partan (Story Pack 11)<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p><strong>Pas de monstres dans le Hunting Ground ?</strong> C'est un bug lié à une quête principale ou de PNJ active : abandonne-la (touche le <strong>+</strong> du suivi de quête, puis l'icône corbeille), puis ressors et rentre dans le Hunting Ground.</p>
<figure class="shot dc"><button aria-label="Agrandir : Abandonner la quête : le + du suivi de quête, puis la corbeille" class="shot-btn" data-full="img/dc-hgnomob.jpg" type="button"><img alt="Abandonner la quête : le + du suivi de quête, puis la corbeille" loading="lazy" src="img/dc-hgnomob.jpg"/></button><figcaption>Abandonner la quête : le + du suivi de quête, puis la corbeille<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h3 id="s16-3">Progression</h3>
<p><strong>Qui monter en premier ?</strong> Le niveau : tes DPS (avec les Slimes). Le Potentiel : les supports. L'équipement : les DPS. Engraving et Awakening : trop chers au début, garde tes ressources (si une tâche du Guide Pass l'exige, Nebris est un bon choix). Le Burst : plutôt les supports.</p>
<h3 id="s16-4">Technique</h3>
<ul>
<li><strong>Jouer sur PC</strong> : un client PC officiel existe (lien dans la FAQ du compendium).</li>
<li><strong>Persos tout noirs ?</strong> Désactive le Silhouette Mode. Si tu es dans un pack, touche d'abord l'icône maison en haut à droite ; puis le bouton aux 4 carrés, Setting, Graphics, Silhouette Mode, Disable. Sur PC, un raccourci avec Ctrl l'active ou le coupe. Dans ce même menu, désactiver le <strong>Field blur</strong> améliore les performances, et les cinématiques de compétence peuvent ne se jouer qu'une fois par jour.</li>
<li><strong>Montrer tes costumes pour demander conseil</strong> : va dans Last Night (marche jusqu'à l'icône d'épée sur la carte), puis Replace, Replace, Reset, Confirm ; trie par « Deployed First » et fais une capture. Si tu bloques sur un combat, poste une capture dans le salon game-help (vérifie ton compte Discord pour pouvoir envoyer des images). Pour une question sur l'Awakening, le Potentiel ou le Burst, montre l'onglet du perso avec « View Costume » activé ; pour l'équipement, le 2e menu de l'onglet du perso, ou ton Sac trié avec tes marques personnalisées.</li>
<li><strong>Versions modifiées</strong> : en Allemagne, quelques sprites, cinématiques, la Fated Guest de Medical Club Teresse et le mini-jeu Slap Pop Pop! sont modifiés ou retirés ; en Corée, certaines scènes de Shattered Dream Palette et Retired Legend Olivier. Le jeu n'est pas disponible légalement au Vietnam ni aux Pays-Bas.</li>
</ul>
<figure class="shot cp"><button aria-label="Agrandir : Montrer tes costumes depuis Last Night" class="shot-btn" data-full="img/cp-box_costumes.jpg" type="button"><img alt="Montrer tes costumes depuis Last Night" loading="lazy" src="img/cp-box_costumes.jpg"/></button><figcaption>Montrer tes costumes depuis Last Night<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<figure class="shot dc"><button aria-label="Agrandir : Désactiver le Silhouette Mode : icône maison, menu aux 4 carrés, Setting, Graphics" class="shot-btn" data-full="img/dc-censor.jpg" type="button"><img alt="Désactiver le Silhouette Mode : icône maison, menu aux 4 carrés, Setting, Graphics" loading="lazy" src="img/dc-censor.jpg"/></button><figcaption>Désactiver le Silhouette Mode : icône maison, menu aux 4 carrés, Setting, Graphics<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<figure class="shot dc"><button aria-label="Agrandir : Montrer tous tes costumes depuis Last Night, étape par étape" class="shot-btn" data-full="img/dc-box.jpg" type="button"><img alt="Montrer tous tes costumes depuis Last Night, étape par étape" loading="lazy" src="img/dc-box.jpg"/></button><figcaption>Montrer tous tes costumes depuis Last Night, étape par étape<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
</div></section>
<section class="chapter" id="s17" data-title="Erreurs à éviter, checklist et sources"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4"/><path d="M6 4h11l-2 4 2 4H6"/></svg><b>17</b></span><h2>Erreurs à éviter, checklist et sources</h2></header><div class="ch-body">
<p>Les erreurs de débutant les plus coûteuses touchent aux ressources rares et aux tirages. Voici celles à éviter, puis une checklist pour tes premiers jours.</p>
<h3 id="s17-1">Erreurs fréquentes</h3>
<ul>
<li>Valider un Tirage infini sans avoir comparé : il n'y a pas de retour.</li>
<li>Recruter des persos 3★ ou 4★ en taverne, au lieu de garder les contrats pour les 5★.</li>
<li>Oublier le passe premium : garde toujours 1000 dias de côté.</li>
<li>Dépenser Fils d'or, Poudre d'espoir ou Larmes de la déesse sans suivre les priorités de la section 11.</li>
<li>Monter des tanks (Lecliss, Seir) trop tôt.</li>
<li>Raffiner des équipements que tu remplaceras bientôt.</li>
<li>Lancer plusieurs modes Hard ou Very Hard en même temps : tu bloques tes quêtes quotidiennes.</li>
<li>Négliger l'or : tu en manqueras en fin de jeu.</li>
<li>Ne pas lier ton compte.</li>
</ul>
<h3 id="s17-2">Checklist des premiers jours</h3>

idden="true" class="box"></span><span class="tt">Acheter le passe premium (1000 dias) à chaque saison.</span></label></li><li class="task"><label><input class="tick" data-k="3931c1ffe9" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Participer à Mirror Wars et Evil Castle chaque saison.</span></label></li></ul></div>
<h3 id="s17-3">Fraîcheur des informations</h3>
<p>Je n'ai pas pu vérifier chaque chiffre dans le jeu. Le compendium de BotAn (novembre 2026) et la checklist Discord ont servi à corriger les points dépassés ; les guides de base datent de 2023 à 2025 (le reroll de dotgg date d'avril 2025, les routines de septembre 2024), et un classement de juin 2026 donne les persos du moment. Certaines valeurs ont pu changer : ressources par jour (40, puis 60, puis 90 riz cuits selon l'âge des sources), points de tirage, taux. En cas de doute, fie-toi à l'écran du jeu. Plusieurs points ont depuis été confirmés par des joueurs du Discord officiel (novembre 2026). Les compléments marqués « Discord officiel » viennent des guides de son bot (novembre 2026) : le reset quotidien à minuit UTC y est confirmé par la commande <code>?rtime</code>.</p>
<span id="a-verifier" class="anchor"></span><h3 id="s17-4">À vérifier en jeu</h3>
<p>Ces points ne sont confirmés que par une seule source, ou les sources ne sont pas d'accord : il faut encore les vérifier en jeu. Si tu le fais, envoie-moi ce que tu vois (Lyph, sur le Discord officiel) : je mettrai le guide à jour.</p>
<div class="checklist" data-cad="none" data-prio="high" data-role="verify" data-scope="À vérifier en jeu"><div class="cl-bar"><span aria-live="polite" class="cl-count"></span><div class="cl-track"><span class="cl-fill"></span></div><button class="cl-reset" type="button">Tout décocher</button></div><ul class="tasks"><li class="task"><label><input class="tick" data-k="4717e08921" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Death Time</strong> : les chiffres (+100 % d'ATK, −100 % de défense, +50 % de dégâts reçus). Fais durer un combat facile jusqu'au tour 11, puis touche l'icône Death Time en haut à gauche.</span></label></li><li class="task"><label><input class="tick" data-k="eab486ebab" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Reset hebdomadaire</strong> : le mercredi à 15:00 UTC (16:00 en Belgique) pour les missions hebdo, comme le guide le suppose. Regarde quand ta barre hebdo se vide.</span></label></li><li class="task"><label><input class="tick" data-k="08064b99a4" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Capacités de terrain</strong> : les tentatives d'Absorption, d'Assemble et d'Overpower reviennent-elles chaque jour (checklist du guide) ou chaque semaine (Discord officiel) ?</span></label></li><li class="task"><label><input class="tick" data-k="b7a259b3ad" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Support Bonus de Last Night</strong> : compté par costume (compendium) ou par perso (Discord officiel) ? Regarde l'écran du Support Bonus.</span></label></li><li class="task"><label><input class="tick" data-k="16b9f768b4" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Taverne</strong> : recruter des 3★ et 4★ fait-il apparaître plus de 5★ ?</span></label></li><li class="task"><label><input class="tick" data-k="f03e289a89" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Mirror Wars</strong> : combien de combats le Repeat Battle enchaîne-t-il au maximum (40 ou 10) ?</span></label></li><li class="task"><label><input class="tick" data-k="b893a9cb57" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Cristaux anciens</strong> : les Towers of Wrath et of Jealousy en donnent-elles ?</span></label></li><li class="task"><label><input class="tick" data-k="23900fb74b" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Farm de poudre</strong> : 2 000 pièces d'un coup, ou 2 lots de 1 000 ?</span></label></li><li class="task"><label><input class="tick" data-k="4ad2b093ff" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Nom</strong> : « Frost Queen » ou « Frozen Queen » Wilhelmina ?</span></label></li></ul></div>

<section class="chapter" id="s2" data-title="Understanding the game"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><b>02</b></span><h2>Understanding the game</h2></header><div class="ch-body">
<p>Brown Dust 2 is a turn-based tactical RPG by Neowiz where every story is a "pack", like a game cartridge inside the game. Fights are not auto-played: they ask you to think, like a small puzzle.</p>
<ul>
<li><strong>Two interfaces.</strong> The "game" interface (map, characters, inventory, formation) and the main interface (missions, draws, events, settings). The house icon at the top right switches between them; the arrow left of your name takes you back to the game.</li>
<li><strong>Story in packs.</strong> Finishing a pack's story unlocks modes (Evil Castle, Mirror Wars, Path of Adventure) and gives you 5-star characters. The Path of Adventure pack opens after the third story pack.</li>
<li><strong>Characters and costumes.</strong> A character has several costumes; each costume brings a skill. Pulling a costume of a character you don't own gives you the character. There is no "base" form to own first.</li>
<li><strong>Field abilities.</strong> Each character can have an ability on the map (find treasure, craft gear, cook). It uses Ability Pills, even if the character isn't in your active team.</li>
<li><strong>Puzzles.</strong> If you're stuck on a story puzzle, tap the "+" on the quest description: it often holds a hint.</li>
<li>
<p><strong>Explore after the quest.</strong> Once the main quest is done, the map shows how many finds are left. Use Lathel's Search ability to reveal the hidden ones (they glow green).</p>
</li>
<li>
<p><strong>The official Discord bot.</strong> On the official Brown Dust 2 Discord, a bot answers commands in its own channel. For example, <code>?rtime</code> gives the reset times in your own time zone. This guide uses its guides (official Discord, November 2026).</p>
</li>
</ul>
<h3 id="s2-1">The game's interface (compendium)</h3>
<p>The game has two main screens: the <strong>field screen</strong>, where you walk around inside a pack, and the <strong>home screen</strong>, where the menus are. The compendium screenshots number each area.</p>
<h4>The field screen</h4>
<figure class="shot cp"><button aria-label="Enlarge: Field screen: the four numbered areas" class="shot-btn" data-full="img/cp-field-menu-guide.jpg" type="button"><img alt="Field screen: the four numbered areas" loading="lazy" src="img/cp-field-menu-guide.jpg"/></button><figcaption>Field screen: the four numbered areas<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<ol>
<li><strong>Top left: map and area info.</strong> Active bonuses (Collection, Rapport), the minimap (the <strong>+</strong> enlarges it, tapping the map opens the full map), the <strong>Quick Hunt</strong> button (farm rice, slimes, crystals and materials without moving), the <strong>shortcut menu</strong> to teleport to the inn (where you recruit), the Hunting Grounds or <strong>Elin</strong> (change a pack's difficulty), the counter of what's left to collect (findings, items to search, monsters), and the first character's HP bar with the option to heal with food.</li>
<li><strong>Top right: resources and quests.</strong> Dia, gold and Ability Pills, the <strong>Companion</strong> button (character management: levels, costumes, gear, Potential, Awakening, Burst), the <strong>Bag</strong>, the house to go back home, and the <strong>quest tracker</strong>: tap it and your character walks there on its own, or tap the <strong>+</strong> for the quest details.</li>
<li><strong>Bottom right: actions.</strong> The interact button, the <strong>field ability</strong> shortcuts (Search, Absorption, Assemble, Overpower…, paid in Ability Pills), the <strong>sprint</strong> and the <strong>3 ability presets</strong> you can scroll through.</li>
<li><strong>Bottom: other.</strong> The pack selection (the cartridge), how your character looks on the map (story team, chosen character or battle team) and the full field ability menu, where you can set up your shortcuts and presets.</li>
</ol>
<h4>The home screen</h4>
<figure class="shot cp"><button aria-label="Enlarge: Home screen: the four numbered areas" class="shot-btn" data-full="img/cp-main-menu-explanation.jpg" type="button"><img alt="Home screen: the four numbered areas" loading="lazy" src="img/cp-main-menu-explanation.jpg"/></button><figcaption>Home screen: the four numbered areas<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<ol>
<li><strong>Top left: social and management.</strong> Your profile (and your player ID with the <strong>+</strong>), <strong>My Room</strong> (a room to decorate that others can visit), <strong>friends</strong> (and your lent support character), the <strong>guild</strong> (daily attendance, Guild Raid), <strong>Business Management</strong> (quick collection from the Glupy Diner, fishing and Territory helpers), <strong>GluTalk</strong>, <strong>Rapport</strong>, <strong>Arcade</strong> (mini-games) and <strong>Secret Events</strong>.</li>
<li><strong>Top right: system and shortcuts.</strong> Currencies, official <strong>notices</strong>, the <strong>mailbox</strong> (login, compensation, purchases, passes, codes), the wallpaper editor, <strong>settings and ETC</strong> (account link, support, official guide), the strip of banners about to end, the <strong>Return Season</strong> button (when a Fiend Hunter is replayed), the <strong>Tactical Manual</strong>, <strong>Passes</strong> and <strong>Quick Hunt</strong>.</li>
<li><strong>Bottom right: packs and events.</strong> Skin offers (cosmetic only), the <strong>Season Event</strong> shortcut and the pack selection. The Season Event button <strong>can be scrolled</strong>: that's how you find the previous event's shop again.</li>
<li><strong>Bottom: the navigation bar.</strong> Jukebox, <strong>Draw</strong> (the gacha), Companion, Bag, <strong>Story</strong> (archive), <strong>Collection</strong>, <strong>Missions</strong>, <strong>Achv</strong> (achievements), <strong>Event</strong> (logins, Pickup missions), <strong>Shop</strong> (in-game currency shops) and <strong>Premium Shop</strong> (paid shop).</li>
</ol>
<h4>The pack system</h4>
<p>Almost all content is sorted into <strong>packs</strong>. To switch packs, tap the cartridge on the home screen.</p>
<figure class="shot cp"><button aria-label="Enlarge: Switching packs from the cartridge on the home screen" class="shot-btn" data-full="img/cp-pack-switch.jpg" type="button"><img alt="Switching packs from the cartridge on the home screen" loading="lazy" src="img/cp-pack-switch.jpg"/></button><figcaption>Switching packs from the cartridge on the home screen<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p class="callout warn"><span class="co-tag">Heads up</span><strong>The classic mistake.</strong> The <strong>Story</strong> tab in the bottom bar is only an <strong>archive</strong>: you can reread stories there, but it doesn't move your progress forward. To progress, you have to enter the pack and follow the quests.</p>
<figure class="shot cp"><button aria-label="Enlarge: The Story tab is an archive, not your progress" class="shot-btn" data-full="img/cp-no-archive.jpg" type="button"><img alt="The Story tab is an archive, not your progress" loading="lazy" src="img/cp-no-archive.jpg"/></button><figcaption>The Story tab is an archive, not your progress<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
</div></section>
<section class="chapter" id="s3" data-title="Reroll and Infinite Draw"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/></svg><b>03</b></span><h2>Reroll and Infinite Draw</h2></header><div class="ch-body">
<p>No need to remake your account: the Infinite Draw lets you reroll a 10-pull as many times as you like until you get the character you want. One trap: once you confirm the result, there is no going back.</p>
<ol>
<li>Play the tutorial and the story until Elin shows you the draw system.</li>
<li>Open the Infinite Draw tab and reroll until you get your target.</li>
<li>Only confirm when you're happy with the result.</li>
<li>Link your account (ETC menu, then <button class="term" data-tip='In the "ETC" menu; protects your progress' type="button">Link Account</button>) to secure your progress.</li>
</ol>
<p>Each Infinite Draw 10-pull guarantees one 5★ costume, and only one 5★ is possible. Gear there can't be UR 5★ (at best an SR 5★ exclusive): don't reroll for gear.</p>
<p>The banner offers 5 costumes and 5 exclusive gear pieces. As soon as you confirm your pull, all the other gacha banners open.</p>
<figure class="shot cp"><button aria-label="Enlarge: A good pull: The Curse Celia, the rest doesn't matter" class="shot-btn" data-full="img/cp-inf-draw-celia.jpg" type="button"><img alt="A good pull: The Curse Celia, the rest doesn't matter" loading="lazy" src="img/cp-inf-draw-celia.jpg"/></button><figcaption>A good pull: The Curse Celia, the rest doesn't matter<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h3 id="s3-1">What to aim for (compendium, October 2026)</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Costume</th>
<th>Profile</th>
<th>Verdict</th>
</tr>
</thead>
<tbody>
<tr>
<td>The Curse Celia</td>
<td>Support that hits many times (Chains), mostly useful later, especially in Last Night</td>
<td><strong>The recommended pick</strong></td>
</tr>
<tr>
<td>Gentle Maid Anastasia</td>
<td>Good physical DPS</td>
<td>A possible alternative, but supports come first</td>
</tr>
<tr>
<td>Top Idol Helena</td>
<td>Defensive and utility support</td>
<td>Alternative, lower priority than an offensive support</td>
</tr>
<tr>
<td>Eleaneer (Piercing Magic Bow), Scheherazade (The Lapis Witch)</td>
<td>PvP-oriented picks</td>
<td>Not recommended, the game is mostly PvE</td>
</tr>
</tbody>
</table></div>
<p>Don't panic if you already confirmed something else: this pick doesn't make or break an account, and you'll get other copies over time. Then pick physical or magic for your team: for a beginner, physical is easier, because Arines (free) strongly buffs physical attackers.</p>
<p>The official Discord adds that <strong>The Curse Celia is not a DPS</strong>: she is a chainer (she adds lots of Chains), so a long-term investment. Her Absorption ability also helps you collect materials on the map.</p>
<h3 id="s3-2">What about the best characters right now?</h3>
<p>A June 2026 ranking puts Morpeah on top, followed by Apostle Blade and Dark Saintess Liberta, an essential support for a physical team. No need to reroll for them: Apostle Morpeah is recruited at the Story Pack 17 pub, and Blade and Liberta at the pub after Story Pack 15.</p>
<h3 id="s3-3">True reroll (optional)</h3>
<p>Only worth it if you want dupes of a banner character. You need a guest account, collect every free Dia and ticket (about 40 to 50 tickets), then pull on the banner. If those starting pulls give you +2, keep the account; otherwise, start over. For a first account, skip this.</p>
</div></section>
<section class="chapter" id="s4" data-title="First team and free characters"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/></svg><b>04</b></span><h2>First team and free characters</h2></header><div class="ch-body">
<p>Build a physical team around three free units: Arines, Wiggle and Kry. They'll carry you through most of the story, no lucky pulls needed. As soon as you have your selective tickets (Guide Pass) and the free costumes Eclipse and Dalvi, switch to the compendium teams below.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Character</th>
<th>Role</th>
<th>Why</th>
</tr>
</thead>
<tbody>
<tr>
<td>Arines (3★, free)</td>
<td>Physical support</td>
<td>+70% ATK and +30% crit for physical attackers (no effect on magic)</td>
</tr>
<tr>
<td>Wiggle (3★, free)</td>
<td>Attacker</td>
<td>"+" shaped area and huge damage with his self-destruct</td>
</tr>
<tr>
<td>Kry (4★, free)</td>
<td>Attacker</td>
<td>"X" shaped area; his Marauder costume lowers enemy defense</td>
</tr>
<tr>
<td>2 open slots</td>
<td>Area attackers</td>
<td>Whatever you pulled: Justia, Gray, Lathel or Liatris work</td>
</tr>
</tbody>
</table></div>
<p>To check whether a character is physical or magic, open their stats: ATK with a sword means physical, <button class="term" data-tip="Physical / magic attack; check the character sheet to see which one it uses" type="button">M.ATK</button> with a staff means magic.</p>
<h3 id="s4-1">Simple rules</h3>
<ul>
<li>Favor area (AOE) attackers for the story. Don't level tanks (Lecliss, Seir) for now: you'll only need them much later.</li>
<li>If you don't have Kry, Layla (4★, easy to get) is a good "X" area replacement.</li>
<li>Buffs of different types multiply, buffs of the same type add up. So combine varied buffs rather than the same one twice. Arines and Kind Student Samay together give +120% ATK and 30% crit.</li>
<li>
<p>In hard content, the usual formation is 3 supports/buffers, 1 utility support or attacker (knockback, DEF down, SP recharge) and 1 attacker.</p>
</li>
<li>
<p><strong>Stuck on Normal in the story?</strong> The official Discord recommends two videos of cheap teams by Definitely Not Yuuji: <a href="https://www.youtube.com/watch?v=UyOtVQumW7o" target="_blank" rel="noopener">chapters 6 to 14</a> and <a href="https://www.youtube.com/watch?v=FSFJrY6HV0A" target="_blank" rel="noopener">chapter 15</a>.</p>
</li>
</ul>
<h3 id="s4-2">Who to recruit at the Pub</h3>
<ul>
<li><strong>Diana</strong> (Story Pack 10 pub): essential support (element and crit bonus) with a Dispatch ability. Top priority, see step 4.</li>
<li><strong>Dark Saintess Liberta</strong> (Story Pack 15 pub): the core of every physical team, see step 12.</li>
<li><strong>Queen of Gluttis Granadair</strong> (random appearance): grab her as soon as she shows up.</li>
<li><strong>Olstein</strong> (Story Pack 4 pub): weak in combat, his Dispatch brings a little every day. Only if you have nothing better to recruit.</li>
<li>Don't recruit 3★ and 4★ characters: you'll easily get their costumes from draws. Save your contracts for 5★.</li>
</ul>
<p><strong>The full order from the official Discord (November 2026).</strong> You can recruit each costume <strong>only once</strong>. Always keep one contract for new costumes that come to the pub.</p>
<ol>
<li>Adventurer of the Unknown Diana</li>
<li>Dark Saintess Liberta</li>
<li>Queen of Gluttis Granadair</li>
<li>The costume of the next banner (recruiting it also gives 10 tickets); optional if it isn't worth it</li>
<li>Shattered Dream Palette</li>
<li>Night of Death Mamonir</li>
<li>Rodev's Star Liatris (targets +0, +3, +5)</li>
<li>Wind Dancer Venaka (targets +0, +1, +3, +5)</li>
<li>The Curse Celia (targets +0, +3)</li>
<li>Fiend Scholar Olstein (not if you already have him, or another of his costumes)</li>
<li>Apostle Blade (not very useful without Young Lady Blade; targets +0, +2, +5)</li>
<li>Night of Jealousy Levia (not very useful without Track and Field Levia)</li>
<li>Faithful Wings Olivier (only with Fallen Wings)</li>
<li>The Gluttonous Refithea</li>
<li>Anyone else, or keep your contract</li>
</ol>
<p>The Discord also says that recruiting 3★ and 4★ makes 5★ show up more often at the pub. This isn't confirmed, and it goes against the tip above (<a class="verify" href="#a-verifier">check in game</a>).</p>
<figure class="shot dc"><button aria-label="Enlarge: Who you can recruit at the pub, chapter by chapter, and the free costumes per chapter (November 2026)" class="shot-btn" data-full="img/dc-pub-taverne.jpg" type="button"><img alt="Who you can recruit at the pub, chapter by chapter, and the free costumes per chapter (November 2026)" loading="lazy" src="img/dc-pub-taverne.jpg"/></button><figcaption>Who you can recruit at the pub, chapter by chapter, and the free costumes per chapter (November 2026)<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h3 id="s4-3">Recommended starter teams (compendium, 2026)</h3>
<p>There's no universal team: it all depends on the enemies. The compendium recommends 1 to 3 DPS, the rest supports (3 supports + 2 DPS for simple fights), and a single damage type. ATK buffers (Arines, Homunculus Lathel) only buff physical, MATK buffers (B-Rank Idol Helena, Elpis) only magic; Kind Student Samay and Diana buff both. Put your DPS in the middle of the grid.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Slot</th>
<th>AoE team (many enemies, magic)</th>
<th>Single-target team (lone boss, physical)</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>B-Rank Idol Helena (selective ticket)</td>
<td>Priest of Vitality Arines, or Dark Saintess Liberta at +2 and up</td>
</tr>
<tr>
<td>2</td>
<td>Hand of Salvation Elpis (gacha)</td>
<td>Homunculus Lathel (selective ticket), or Liberta</td>
</tr>
<tr>
<td>3</td>
<td>Kind Student Samay (gacha); otherwise Queen of Gluttis Granadair, or Diana against <span class="el el-light">Light</span> and <span class="el el-water">Water</span></td>
<td>Robin Hood Zenith (ticket), or Little Hunter Rigenette, or Apostle Morpeah (Story Pack 17 pub)</td>
</tr>
<tr>

<p>★3 and ★4 supports at +5 are often better than a ★5 at +0: no shame in playing them. To borrow: add a player who owns the character as a friend, then in battle tap Replace, the hand icon at the top right, and pick them.</p>
<h4>The two teams in pictures</h4>
<p>In the pictures, each character is shown with the <strong>costume to cast on turn 1</strong>: if you use them all on the first turn, you have the best chance to end the fight in one go. The small portraits below are the substitutes.</p>
<figure class="shot cp"><button aria-label="Enlarge: Area team for the story (Story Newbie Kit)" class="shot-btn" data-full="img/cp-newbie_team_Kit.jpg" type="button"><img alt="Area team for the story (Story Newbie Kit)" loading="lazy" src="img/cp-newbie_team_Kit.jpg"/></button><figcaption>Area team for the story (Story Newbie Kit)<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<figure class="shot cp"><button aria-label="Enlarge: Team against a lone boss (Solo Target Boss Newbie Kit)" class="shot-btn" data-full="img/cp-solo_boss_kit.jpg" type="button"><img alt="Team against a lone boss (Solo Target Boss Newbie Kit)" loading="lazy" src="img/cp-solo_boss_kit.jpg"/></button><figcaption>Team against a lone boss (Solo Target Boss Newbie Kit)<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>Order and placement</h4>
<ul>
<li>In the area team, the <strong>order of the supports doesn't matter</strong>. Dalvi and Eclipse can swap depending on the enemies.</li>
<li>There's no perfect placement: it depends on the enemies. <strong>If your placement works, don't change it. If you lose, check the placement first.</strong></li>
<li>Most enemy formations hit hard on the middle column and row: that's why DPS go in the center. Supports can go almost anywhere.</li>
</ul>
<figure class="shot cp"><button aria-label="Enlarge: One possible placement" class="shot-btn" data-full="img/cp-team-layout.jpg" type="button"><img alt="One possible placement" loading="lazy" src="img/cp-team-layout.jpg"/></button><figcaption>One possible placement<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>Building your team (official Discord, November 2026)</h4>
<ul>
<li><strong>Basic layout</strong>: Buffer, Buffer, DPS, then 2 free slots ("Flex"), with a total cost of <strong>15 SP at most</strong> so you can fire everything on turn 1.</li>
<li><strong>Buffers</strong>: favor the ones that give <strong>crit rate</strong>. Homunculus Lathel and Medical Club Teresse only if you lack damage. Beachside Angel Teresse can replace Kind Student Samay, but avoid her with costumes that hit many times.</li>
<li><strong>Amplifiers</strong> (they raise damage in another way): Robin Hood Zenith (all damage); Young Lady Blade and Your Very Own Cat Eris (main target, physical); Game Club Rafina (physical); Track and Field Levia and Earth Mother Believer Priestess (magic); Wind Dancer Venaka (Wind).</li>
<li><strong>Utility</strong>: Concentrate Fire (force the target) with Robin Hood Zenith, Poolside Guardian Zenith, Rigenette or Apostle Morpeah; SV Morpeah to stall; AD Teresse and VS Kry to push; Remnant + Gynt (−100% ATK, then death on turn 10; doesn't work on enemies immune to weakening or that hit with MATK); Olstein and Lucrezia for silence and SP recharge.</li>
<li><strong>DPS</strong>: prefer big areas. SW/OP Ventana needs Concentrate Fire; Comeback Idol Ventana is good against high-DEF bosses. Sacred Justia and Bunny Loen hit harder when there are many enemies (Justia may need Zenith). OH Levia needs Vulnerability.</li>
<li>To go further: <a href="http://cymmina.gamependium.com/browndust2/teams.html" target="_blank" rel="noopener">Cymmina's Team Building guide</a>.</li>
</ul>
<figure class="shot dc"><button aria-label="Enlarge: Costumes sorted by role: buffers, amplifiers, utility and DPS (November 2026)" class="shot-btn" data-full="img/dc-tb-roles.jpg" type="button"><img alt="Costumes sorted by role: buffers, amplifiers, utility and DPS (November 2026)" loading="lazy" src="img/dc-tb-roles.jpg"/></button><figcaption>Costumes sorted by role: buffers, amplifiers, utility and DPS (November 2026)<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
</div></section>
<section class="chapter" id="s5" data-title="First-week walkthrough (step by step)"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c3 0 3-5 7-5s4-6 7-6"/><circle cx="5" cy="19" r="1.6"/><path d="M19 4v4h-4"/></svg><b>05</b></span><h2>First-week walkthrough (step by step)</h2></header><div class="ch-body">
<p>This part follows the "new player" checklist from the official Discord, with your screenshots, then filled in with BotAn's compendium. Everything is doable in a week, but nothing is mandatory: play at your own pace.</p>
<p>The Discord author gives no strict order: clear whatever you can first. Once everything is ticked, you'll already know most of the game's mechanics.</p>
<h3 id="s5-1">Before anything else (compendium tips)</h3>
<ul>
<li>Finish <strong>Master Pack 1 (Edge of Dimensions)</strong>: it unlocks the gacha and the event menus.</li>
<li>In the <strong>Infinite Draw</strong>, aim for <strong>The Curse Celia</strong>.</li>
<li>Save your <strong>Recommended ★5 Costume Selective Tickets</strong> (12 in the Guide Pass) for key supports: three ways to spend them below, in "Recommended ★5 selective tickets".</li>
<li>Never mix <strong>physical</strong> and <strong>magic</strong> buffers and DPS in the same team.</li>
<li>Grab the <strong>5 free +5 costumes</strong> in the <strong>Events</strong> tab: Stray Cat Rou, Summer Vacation <strong>Dalvi</strong>, Daydream Bunny Morpeah, Dream Bride <strong>Eclipse</strong> and Frost Queen Wilhelmina (name to <a class="verify" href="#a-verifier">check in game</a>). Level Eclipse and Dalvi first.</li>
<li>The <strong>Story</strong> tab on the home screen is only an archive: reading there doesn't advance your progress.</li>
</ul>
<h4>Master Pack 1 fights</h4>
<p>Master Pack 1 (Edge of Dimensions) is mostly played with fixed temporary characters, which can block a new player. Here are the compendium's solutions for the 4 fights that cause trouble most often.</p>
<figure class="shot cp"><button aria-label="Enlarge: Episode 27: Defeat the Fallen Angels" class="shot-btn" data-full="img/cp-master-pack-1-1-clear.jpg" type="button"><img alt="Episode 27: Defeat the Fallen Angels" loading="lazy" src="img/cp-master-pack-1-1-clear.jpg"/></button><figcaption>Episode 27: Defeat the Fallen Angels<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<figure class="shot cp"><button aria-label="Enlarge: Episode 28: Defeat the Fallen Angels" class="shot-btn" data-full="img/cp-master-pack-1-2-clear.jpg" type="button"><img alt="Episode 28: Defeat the Fallen Angels" loading="lazy" src="img/cp-master-pack-1-2-clear.jpg"/></button><figcaption>Episode 28: Defeat the Fallen Angels<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<figure class="shot cp"><button aria-label="Enlarge: Episode 30: Defeat Ran" class="shot-btn" data-full="img/cp-master-pack-1-3-clear.jpg" type="button"><img alt="Episode 30: Defeat Ran" loading="lazy" src="img/cp-master-pack-1-3-clear.jpg"/></button><figcaption>Episode 30: Defeat Ran<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<figure class="shot cp"><button aria-label="Enlarge: Episode 32: Defeat Ran" class="shot-btn" data-full="img/cp-master-pack-1-4-clear.jpg" type="button"><img alt="Episode 32: Defeat Ran" loading="lazy" src="img/cp-master-pack-1-4-clear.jpg"/></button><figcaption>Episode 32: Defeat Ran<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>The Guide Pass</h4>
<p>The <strong>Guide Pass</strong> is the beginners' event: it teaches you the game's mechanics while giving you key resources, including the 12 selective tickets. There are <strong>2</strong> of them, with <strong>4 steps</strong> each. You'll find it in the <strong>Pass</strong> tab, at the top right of the home screen, and it shows above the button while it's active. Follow its tasks in order and remember what they teach you. Don't confuse it with the <strong>Newbie Pass</strong> (7 days of quests, see "Useful details" in section 7): they are two different passes, both permanent, in the Pass tab.</p>
<figure class="shot cp"><button aria-label="Enlarge: Where to find the Guide Pass" class="shot-btn" data-full="img/cp-guide-pass-access.jpg" type="button"><img alt="Where to find the Guide Pass" loading="lazy" src="img/cp-guide-pass-access.jpg"/></button><figcaption>Where to find the Guide Pass<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<figure class="shot cp"><button aria-label="Enlarge: The Guide Pass and its steps" class="shot-btn" data-full="img/cp-guide-pass.jpg" type="button"><img alt="The Guide Pass and its steps" loading="lazy" src="img/cp-guide-pass.jpg"/></button><figcaption>The Guide Pass and its steps<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p>The tasks people get stuck on most:</p>
<ul>
<li><strong>"Proceed with Hunting Grounds Battle"</strong>: use the Hunting Grounds shortcut next to the minimap. If there are no enemies in the Hunting Ground, abandon your active quest.</li>
<li><strong>"Proceed with Companion awakening Growth"</strong>: the task asks you to do the <strong>3 Engravings</strong>, then the <strong>Awakening</strong> itself, the middle node. If you have to pick someone, New Hire Nebris is a good choice (see the FAQ).</li>
</ul>
<figure class="shot cp"><button aria-label="Enlarge: The 3 Engravings, then the Awakening in the middle" class="shot-btn" data-full="img/cp-engraving-guide.jpg" type="button"><img alt="The 3 Engravings, then the Awakening in the middle" loading="lazy" src="img/cp-engraving-guide.jpg"/></button><figcaption>The 3 Engravings, then the Awakening in the middle<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>Recommended ★5 selective tickets</h4>
<p>The <strong>Recommended ★5 Costume Selective Tickets</strong> come from the Guide Pass (and some paid packs). Each ticket lets you <strong>pick 1 costume out of 12</strong>. To use them, open the <strong>Bag</strong> and tap the matching button.</p>
<figure class="shot cp"><button aria-label="Enlarge: Using the tickets from the Bag" class="shot-btn" data-full="img/cp-str-access.jpg" type="button"><img alt="Using the tickets from the Bag" loading="lazy" src="img/cp-str-access.jpg"/></button><figcaption>Using the tickets from the Bag<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<figure class="shot cp"><button aria-label="Enlarge: The menu to pick from the 12 costumes" class="shot-btn" data-full="img/cp-str-menu.jpg" type="button"><img alt="The menu to pick from the 12 costumes" loading="lazy" src="img/cp-str-menu.jpg"/></button><figcaption>The menu to pick from the 12 costumes<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p>The Guide Pass gives <strong>12</strong> of them. The paid pack "Mega SALE!!! First Time Countdown Package!" adds 5 (about $4 to $5; according to the official Discord, it disappears 3 days after it first shows up), and other paid packs sometimes give 3. Three ways to spend them:</p>
<ul>
<li><strong>Compendium (12 tickets)</strong>: Diana +2 (3), B-Rank Idol Helena +1 (2), Homunculus Lathel +2 (3), then New Hire Seir, Track and Field Captain Levia, Robin Hood Zenith and Game Club Rafina (1 each). <em>More variety in supports.</em></li>
<li><strong>Compendium with the Mega SALE pack (17 tickets)</strong>: Diana +4 (5), Helena +3 (4), Lathel +3 (4), then the same ones at +0. <em>Same idea, more copies.</em></li>
<li><strong>A player on the official Discord</strong>: everything on B-Rank Idol Helena +5 and Homunculus Lathel +5 (6 + 6). <em>Two supports maxed right away.</em></li>
</ul>
<p>The order you pick them in changes nothing in the end. If you want a comfortable starter team, start with Helena. If in doubt, ask on the Discord.</p>
<p><strong>More from the official Discord (November 2026).</strong></p>
<ul>
<li>General order: <strong>Buffers &gt; Amplifiers &gt; DPS</strong>.</li>
<li>Before dupes, own <strong>one copy</strong> of: Homunculus Lathel &gt; B-Rank Idol Helena &gt; Robin Hood Zenith &gt; New Hire Seir &gt; Track and Field Levia &gt; Game Club Rafina.</li>
<li>Adventurer of the Unknown Diana, The Gluttonous Refithea and Wind Dancer Venaka can be recruited once at the pub: count that free copy.</li>
<li>While Zenith is below +3, raise him before The Gluttonous Refithea and Seir. If you have Pure White Blessing Refithea, raise The Gluttonous Refithea before Seir up to +4.</li>
<li>With the Mega pack: Diana to +4 (the pub gives +5).</li>
<li>Extra tickets: Zenith to +3, then Lathel, then Helena to the max.</li>
<li>Use your purple tickets in the 12-Pick <strong>before</strong> the selective tickets.</li>
<li>To ask for advice: take a screenshot of your costumes with their dupes, count your Guide Pass tickets (12), and ask in the game-help channel.</li>
</ul>
