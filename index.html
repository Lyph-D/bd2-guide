<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Guide Brown Dust 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Guide complet Brown Dust 2 (FR/EN) : parcours de la première semaine, routines à cocher, systèmes du jeu et lexique.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a "cartridge rack" — BD2 sorts all content into packs (cartridges); each chapter is a labelled cartridge, the nav is the rack. Single deliberate dark world: night-blue ink, parchment text, brass gold. */
:root {
  color-scheme: dark;
  --ink: #0d0f17;
  --ink-2: #141826;
  --ink-3: #1c2133;
  --line: #2b3149;
  --parch: #ece3d0;
  --parch-dim: #b7ad99;
  --brass: #d7b069;
  --brass-deep: #9c7a3c;
  --ember: #e0735a;
  --ok: #7fc8a0;
  --font-display: "Marcellus SC", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --nav-w: 272px;
  --measure: 46rem;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body {
  background: var(--ink);
  color: var(--parch);
  font: 400 1rem/1.62 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink); }
a { color: var(--brass); text-underline-offset: 3px; }
a:hover { color: var(--parch); }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }
strong { color: #fff6e3; }

/* ---------- top bar (phone) ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--ink) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--font-display); font-size: 1.05rem; letter-spacing: .04em; color: var(--brass); text-decoration: none; white-space: nowrap; }
.brand small { color: var(--parch-dim); font-size: .78rem; margin-left: 6px; }
.topbar .spacer { flex: 1; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 0 12px; border-radius: 10px;
  background: var(--ink-3); color: var(--parch); border: 1px solid var(--line);
  font: 700 .85rem var(--font-body); cursor: pointer;
}
.icon-btn:hover { border-color: var(--brass-deep); }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 1fr; }
.rack {
  position: fixed; inset: 0 auto 0 0; z-index: 40; width: min(86vw, 320px);
  background: var(--ink-2); border-right: 1px solid var(--line);
  transform: translateX(-102%); transition: transform .25s ease;
  overflow-y: auto; overscroll-behavior: contain;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 14px calc(24px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
}
.rack.open { transform: none; }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgba(5,6,10,.6); }
.rack-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.rack-head p { margin: 0; font-family: var(--font-display); color: var(--brass); letter-spacing: .05em; }
.nav-group { margin: 18px 6px 6px; font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--parch-dim); }
.nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav-list a {
  display: flex; align-items: baseline; gap: 10px; padding: 8px 10px; border-radius: 8px;
  color: var(--parch); text-decoration: none; font-size: .95rem;
}
.nav-list a:hover { background: var(--ink-3); }
.nav-list a.on { background: var(--ink-3); color: #fff6e3; box-shadow: inset 2px 0 0 var(--brass); }
.nav-num { font-family: var(--font-mono); font-size: .72rem; color: var(--brass-deep); min-width: 1.6em; }
.nav-list a.on .nav-num { color: var(--brass); }

@media (min-width: 1000px) {
  .shell { grid-template-columns: var(--nav-w) minmax(0, 1fr); }
  .rack { position: sticky; top: 0; height: 100vh; width: auto; transform: none; transition: none; z-index: 5; padding-top: 22px; }
  .rack-close, .menu-btn { display: none !important; }
  .scrim { display: none !important; }
  .topbar { display: none; }
  .desk-search { display: block !important; }
  html { scroll-padding-top: 16px; }
}
.desk-search { display: none; margin-bottom: 4px; }

/* ---------- search ---------- */
.search { position: relative; }
.search input {
  width: 100%; min-height: 42px; padding: 0 12px 0 36px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--ink); color: var(--parch); font: 1rem var(--font-body);
}
.search input::placeholder { color: var(--parch-dim); }
.search svg { position: absolute; left: 11px; top: 12px; width: 17px; height: 17px; color: var(--parch-dim); }
.results { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; max-height: 50vh; overflow-y: auto; }
.results li button {
  width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--ink-3); color: var(--parch); font: .9rem/1.4 var(--font-body); cursor: pointer;
}
.results li button:hover { border-color: var(--brass-deep); }
.results .r-sec { display: block; font-size: .72rem; color: var(--brass); letter-spacing: .06em; text-transform: uppercase; }
.results mark { background: rgba(215,176,105,.28); color: inherit; border-radius: 3px; }
.results .r-empty { color: var(--parch-dim); font-size: .9rem; padding: 4px 6px; }

/* ---------- main ---------- */
main {
  min-width: 0;
  padding-block: 8px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.col { max-width: var(--measure); margin: 0 auto; min-width: 0; }

/* hero */
.hero { padding-block: 34px 10px; }
.eyebrow { margin: 0 0 6px; font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); }
.hero h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1.02; letter-spacing: .02em; text-wrap: balance;
  background: linear-gradient(180deg, #fff3d6 10%, var(--brass) 95%); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero .lede { margin: 14px 0 0; color: var(--parch-dim); font-size: 1.05rem; max-width: 36rem; }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 22px; }
.quick a {
  display: grid; gap: 4px; padding: 14px 14px 13px; border-radius: 12px; text-decoration: none;
  background: linear-gradient(160deg, var(--ink-3), var(--ink-2)); border: 1px solid var(--line); color: var(--parch);
}
.quick a:hover { border-color: var(--brass-deep); }
.quick .q-k { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }
.quick .q-t { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: .02em; }
.quick .q-d { font-size: .86rem; color: var(--parch-dim); }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.meter { padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--line); }
.meter .m-l { font-size: .78rem; color: var(--parch-dim); }
.meter .m-v { font-family: var(--font-mono); font-size: 1rem; color: var(--parch); font-variant-numeric: tabular-nums; }
.meter .cl-track { margin-top: 6px; }
.note { margin-top: 14px; font-size: .82rem; color: var(--parch-dim); }

/* chapters: cartridge labels */
.chapter { padding-top: 42px; }
.ch-head {
  display: flex; align-items: stretch; gap: 0; margin-bottom: 18px;
  border: 1px solid var(--brass-deep); border-radius: 10px; overflow: hidden;
  background: linear-gradient(90deg, rgba(215,176,105,.12), rgba(215,176,105,0) 70%);
}
.ch-num {
  display: flex; align-items: center; padding: 0 14px; font-family: var(--font-mono); font-size: .9rem; color: var(--ink);
  background: var(--brass);
}
.ch-head h2 { margin: 0; padding: 12px 14px; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.4rem, 4.6vw, 1.9rem); line-height: 1.15; letter-spacing: .02em; text-wrap: balance; }
.ch-body h3 { margin: 30px 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; color: #fff3d6; letter-spacing: .02em; text-wrap: balance; }
.ch-body h4 { margin: 22px 0 6px; font-size: 1.02rem; color: var(--brass); letter-spacing: .02em; }
.ch-body p, .ch-body li { overflow-wrap: anywhere; }
.ch-body p { margin: 10px 0; }
.ch-body ul, .ch-body ol { padding-left: 1.3rem; margin: 10px 0; }
.ch-body li { margin: 5px 0; }
.ch-body li::marker { color: var(--brass-deep); }
.ch-body code { font-family: var(--font-mono); font-size: .88em; background: var(--ink-3); padding: 1px 5px; border-radius: 4px; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: rgba(215,176,105,.32); } 100% { background: transparent; } }

/* step headings in the parcours get a stamp */
#s5 h3[id] { display: flex; gap: 10px; align-items: baseline; padding-top: 14px; border-top: 1px solid var(--line); }

/* tables */
.tbl { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: 10px; }
.tbl table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: .92rem; }
.tbl th { text-align: left; font-weight: 700; color: var(--brass); background: var(--ink-3); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
.tbl th, .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:nth-child(even) td { background: rgba(255,255,255,.015); }
.tbl td:first-child { color: #fff3d6; font-weight: 700; }

/* screenshots */
.shot { margin: 16px 0; }
.shot-btn { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--ink-2); cursor: zoom-in; }
.shot-btn img { display: block; width: 100%; max-height: 420px; object-fit: contain; background: #07080c; }
.shot figcaption { margin-top: 6px; font-size: .82rem; color: var(--parch-dim); }
.shot figcaption::before { content: "Capture · "; color: var(--brass-deep); }
.lightbox { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(4,5,8,.92); padding: calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)); }
.lightbox img { max-width: 100%; max-height: 82vh; border-radius: 8px; }
.lightbox p { margin: 10px 0 0; color: var(--parch-dim); text-align: center; font-size: .9rem; }
.lightbox .icon-btn { position: absolute; top: calc(12px + env(safe-area-inset-top,0px)); right: max(12px, env(safe-area-inset-right,0px)); }

/* formula */
.formula { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0; padding: 14px; border-radius: 10px; background: var(--ink-2); border: 1px solid var(--line); font-family: var(--font-mono); font-size: .82rem; }
.fx-lhs { color: var(--ink); background: var(--brass); padding: 3px 8px; border-radius: 6px; }
.fx-term { padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--ink-3); }
.fx-op { color: var(--brass); }

/* checklists */
.checklist { margin: 12px 0 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--ink-2); overflow: hidden; }
.cl-bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.cl-count { font-family: var(--font-mono); font-size: .8rem; color: var(--parch-dim); font-variant-numeric: tabular-nums; min-width: 4.5em; }
.cl-track { flex: 1; min-width: 80px; height: 6px; border-radius: 6px; background: var(--ink); overflow: hidden; }
.cl-fill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brass-deep), var(--brass)); transition: width .25s; }
.cl-reset { background: none; border: 0; color: var(--parch-dim); font: .78rem var(--font-body); cursor: pointer; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }
.cl-reset:hover { color: var(--ember); }
ul.tasks { list-style: none; margin: 0; padding: 4px 0; }
li.task { margin: 0; }
li.task label { display: flex; gap: 12px; align-items: flex-start; padding: 9px 12px; cursor: pointer; }
li.task label:hover { background: var(--ink-3); }
.tick { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box { flex: none; width: 20px; height: 20px; margin-top: 2px; border-radius: 6px; border: 1.5px solid var(--brass-deep); display: grid; place-items: center; transition: background .15s; }
.box::after { content: ""; width: 10px; height: 6px; border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(-45deg) translate(1px,-1px); opacity: 0; }
.tick:checked + .box { background: var(--brass); border-color: var(--brass); }
.tick:checked + .box::after { opacity: 1; }
.tick:checked ~ .tt { color: var(--parch-dim); text-decoration: line-through; text-decoration-color: rgba(215,176,105,.5); }
.tick:focus-visible + .box { outline: 2px solid var(--brass); outline-offset: 2px; }
.checklist.done .cl-count { color: var(--ok); }

.foot { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); font-size: .82rem; color: var(--parch-dim); }
.totop { position: fixed; right: max(16px, env(safe-area-inset-right,0px)); bottom: calc(16px + env(safe-area-inset-bottom,0px)); z-index: 15; }

/* ---------- v2 additions ---------- */
:root {
  --fire: #c9573f; --water: #3f7fc4; --wind: #4f9e6a; --light: #e6cf7a; --dark: #6d4fa3;
  --info: #6fa3d8; --warn: #e0735a;
}
.ico { width: 18px; height: 18px; flex: none; color: var(--brass-deep); }
.nav-list a .ico { align-self: center; }
.nav-list a.on .ico, .nav-list a:hover .ico { color: var(--brass); }
.nav-today { font-weight: 700; color: #fff3d6 !important; }
.nav-today .ico { color: var(--brass) !important; }
.nav-list a .nav-num { display: none; }

/* hero ornament */
.hero { position: relative; isolation: isolate; }
.hero::before {
  content: ""; position: absolute; inset: 10px -8px auto; height: 220px; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60% 80% at 20% 30%, rgba(215,176,105,.16), transparent 70%),
    radial-gradient(40% 60% at 85% 10%, rgba(109,79,163,.18), transparent 70%);
}
.crest { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--brass); }
.crest svg { width: 100%; max-width: 240px; height: 14px; }
.resume { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 8px 12px; border-radius: 999px;
  background: var(--ink-3); border: 1px solid var(--brass-deep); color: var(--parch); text-decoration: none; font-size: .9rem; }
.resume:hover { border-color: var(--brass); color: #fff3d6; }
.sync { margin-top: 12px; font-size: .8rem; color: var(--parch-dim); display: flex; align-items: center; gap: 8px; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--parch-dim); }
.sync.on .dot { background: var(--ok); }

/* today panel */
.today { margin-top: 26px; padding: 18px 16px 8px; border-radius: 16px; border: 1px solid var(--brass-deep);
  background: linear-gradient(170deg, rgba(215,176,105,.08), rgba(13,15,23,0) 55%), var(--ink-2); }
.today-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px; }
.today-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; }
.today-date { color: var(--parch-dim); font-size: .9rem; }
.clocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 14px 0 6px; }
.clock { padding: 10px 12px; border-radius: 10px; background: var(--ink); border: 1px solid var(--line); }
.clock .c-l { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--parch-dim); }
.clock .c-v { font-family: var(--font-mono); font-size: 1.15rem; color: #fff3d6; font-variant-numeric: tabular-nums; }
.clock .c-s { font-size: .78rem; color: var(--parch-dim); }
.week-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: .84rem; border: 1px solid var(--line); background: var(--ink); }
.pill b { color: #fff3d6; }
.pill.hot { border-color: var(--brass); background: rgba(215,176,105,.12); }
.pill.lock { border-color: var(--warn); color: #f4c2b6; }
.today h3 { margin: 18px 0 6px; font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; color: #fff3d6; }
.today .checklist { background: var(--ink); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .88rem; color: var(--parch); }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .sw { width: 34px; height: 20px; border-radius: 20px; background: var(--ink-3); border: 1px solid var(--line); position: relative; transition: background .2s; }
.switch .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--parch-dim); transition: transform .2s, background .2s; }
.switch input:checked + .sw { background: rgba(215,176,105,.25); border-color: var(--brass-deep); }
.switch input:checked + .sw::after { transform: translateX(14px); background: var(--brass); }
.switch input:focus-visible + .sw { outline: 2px solid var(--brass); outline-offset: 2px; }
body.prio-only .checklist[data-prio="low"], body.prio-only .prio-label.low { display: none; }
.prio-label { margin: 14px 0 4px !important; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--brass); }
.prio-label strong { color: inherit; }
.prio-label.low { color: var(--parch-dim); }
.auto-note { font-size: .76rem; color: var(--parch-dim); margin: 0 12px 8px; }

/* callouts */
.callout { position: relative; margin: 16px 0 !important; padding: 12px 14px 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink-2); }
.callout .co-tag { display: block; margin-bottom: 4px; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.callout.key { border-color: var(--brass-deep); background: rgba(215,176,105,.07); }
.callout.key .co-tag { color: var(--brass); }
.callout.info { border-color: rgba(111,163,216,.45); background: rgba(111,163,216,.07); }
.callout.info .co-tag { color: var(--info); }
.callout.warn { border-color: rgba(224,115,90,.5); background: rgba(224,115,90,.07); }
.callout.warn .co-tag { color: var(--warn); }

/* element chips */
.el { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: .86em; font-weight: 700; line-height: 1.5; color: #fff; }
.el-fire { background: var(--fire); } .el-water { background: var(--water); } .el-wind { background: var(--wind); }
.el-light { background: var(--light); color: #2a2210; } .el-dark { background: var(--dark); }
.wheel { margin: 16px 0; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink-2); }
.wheel svg { display: block; width: 100%; max-width: 420px; margin: 0 auto; height: auto; }
.wheel .w-t { font: 700 11px var(--font-body); fill: #fff; }
.wheel .w-t.dk { fill: #2a2210; }
.wheel .w-s { font: 11px var(--font-body); fill: var(--parch-dim); }
.wheel figcaption { margin-top: 8px; font-size: .84rem; color: var(--parch-dim); text-align: center; }

/* glossary terms */
.term { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: help;
  text-decoration: underline dotted var(--brass-deep); text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
.term:hover, .term[aria-expanded="true"] { color: #fff3d6; text-decoration-color: var(--brass); }
.tip { position: absolute; z-index: 50; max-width: min(320px, calc(100vw - 32px)); padding: 10px 12px; border-radius: 10px;
  background: #222842; border: 1px solid var(--brass-deep); color: var(--parch); font-size: .88rem; line-height: 1.45; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.tip b { display: block; color: var(--brass); font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 3px; }

/* chapter head icon */
.ch-num { gap: 8px; }
.ch-num b { font-weight: 500; }
.ch-ico { color: var(--ink); width: 18px; height: 18px; }

/* steps */
.step { margin-top: 16px; border-top: 1px solid var(--line); }
.step-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-top: 12px; }
.step-head h3 { flex: 1 1 260px; margin: 0 !important; }
.step-done { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-size: .84rem; }
.step-done input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.step-done input:checked + .box { background: var(--brass); border-color: var(--brass); }
.step-done input:checked + .box::after { opacity: 1; }
.step-done input:focus-visible + .box { outline: 2px solid var(--brass); outline-offset: 2px; }
.step.done .step-done { border-color: var(--brass-deep); color: var(--brass); }
.step.done h3 { color: var(--parch-dim) !important; }
.step.done.folded .step-body { display: none; }
.step-toggle { background: none; border: 0; color: var(--brass); font: .84rem var(--font-body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
#s5 h3[id] { border-top: 0; padding-top: 0; }
.steps-sum { display: flex; align-items: center; gap: 12px; margin: 14px 0; padding: 12px 14px; border-radius: 12px; background: var(--ink-2); border: 1px solid var(--line); }
.steps-sum .dots { display: flex; gap: 5px; flex-wrap: wrap; }
.steps-sum .dots a { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font: 500 .68rem var(--font-mono); color: var(--parch-dim); border: 1px solid var(--line); text-decoration: none; }
.steps-sum .dots a.ok { background: var(--brass); color: var(--ink); border-color: var(--brass); }
.steps-sum .s-v { font-family: var(--font-mono); white-space: nowrap; }

/* story pack tracker */
.widget { margin: 16px 0; }
.packs { border: 1px solid var(--line); border-radius: 12px; background: var(--ink-2); padding: 12px 12px 6px; }
.packs-next { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; background: rgba(215,176,105,.1); border: 1px solid var(--brass-deep); font-size: .92rem; }
.packs-next b { color: var(--brass); }
.rail { list-style: none; margin: 0; padding: 0 0 0 14px; position: relative; }
.rail::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.rail li { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 0 7px 10px; margin: 0 !important; }
.rail li::before { content: ""; position: absolute; left: -13px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--line); }
.rail li.key::before { border-color: var(--brass-deep); }
.rail li.n-done::before { background: var(--brass); border-color: var(--brass); }
.rail .p-name { font-size: .92rem; color: #fff3d6; }
.rail .p-name small { color: var(--parch-dim); font-family: var(--font-mono); margin-right: 6px; }
.rail .p-gain { grid-column: 1 / -1; font-size: .8rem; color: var(--parch-dim); }
.rail li.n-done .p-gain { color: var(--ok); }
.diff { display: inline-flex; gap: 4px; }
.diff button { min-width: 34px; min-height: 30px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--ink); color: var(--parch-dim); font: 700 .72rem var(--font-body); cursor: pointer; }
.diff button[aria-pressed="true"] { background: var(--brass); color: var(--ink); border-color: var(--brass); }

/* cycle calendar */
.cal { display: grid; gap: 6px; }
.cal-row { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink-2); }
.cal-row.now { border-color: var(--brass); background: rgba(215,176,105,.09); }
.cal-row .w { font-family: var(--font-display); color: var(--brass); }
.cal-row .w small { display: block; font-family: var(--font-body); font-size: .72rem; color: var(--parch-dim); }
.cal-row .d { font-size: .8rem; color: var(--parch-dim); }
.cal-row .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.small { font-size: .82rem; color: var(--parch-dim); }
@media (max-width: 420px) { .cal-row { grid-template-columns: 1fr; } }

.brand { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 480px) { .brand small { display: none; } .brand { font-size: .95rem; } }

.verify { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: .8em; font-weight: 700; line-height: 1.6;
  color: #f6d9a8; background: rgba(224,115,90,.16); border: 1px dashed var(--warn); text-decoration: none; white-space: nowrap; }
.verify::before { content: "?"; display: inline-block; margin-right: 5px; font-family: var(--font-mono); color: var(--warn); }
.verify:hover { background: rgba(224,115,90,.28); color: #fff3d6; }
.anchor { display: block; position: relative; top: -70px; }

.meter-link { text-decoration: none; color: inherit; border-color: rgba(224,115,90,.5); }
.meter-link:hover { border-color: var(--warn); }
.meter-link .cl-fill { background: linear-gradient(90deg, #a5503d, var(--warn)); }

/* ---------- language switch ---------- */
.lang-sw { display: inline-flex; flex: none; padding: 3px; gap: 2px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink); }
.lang-sw button {
  min-width: 38px; min-height: 32px; padding: 0 8px; border: 0; border-radius: 7px;
  background: transparent; color: var(--parch-dim); font: 700 .78rem var(--font-mono); letter-spacing: .06em; cursor: pointer;
}
.lang-sw button:hover { color: var(--parch); }
.lang-sw button[aria-pressed="true"] { background: var(--brass); color: var(--ink); }
.rack-head { gap: 10px; }

@media (max-width: 380px) {
  .topbar { gap: 8px; } .topbar .icon-btn { padding: 0 10px; } .lang-sw button { min-width: 32px; padding: 0 6px; }
  .menu-btn .mb-t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
@media (max-width: 560px) { .topbar .brand { display: none; } }
</style>

      <section class="chapter" id="s1" data-title="Lire le jeu en anglais"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h7a3 3 0 0 1 3 3v11a2 2 0 0 0-2-2H4z"/><path d="M20 5h-4a2 2 0 0 0-2 2"/><path d="M20 5v12h-6"/></svg><b>01</b></span><h2>Lire le jeu en anglais</h2></header><div class="ch-body">

<section class="chapter" id="s2" data-title="Comprendre le jeu"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><b>02</b></span><h2>Comprendre le jeu</h2></header><div class="ch-body">
<p>Brown Dust 2 est un RPG tactique au tour par tour de Neowiz où chaque histoire est un "pack", comme une cartouche de jeu dans le jeu. Les combats ne se jouent pas en auto : ils demandent de réfléchir, comme un petit puzzle.</p>
<ul>
<li><strong>Deux interfaces.</strong> L'interface "jeu" (carte, persos, inventaire, formation) et l'interface principale (missions, tirages, événements, réglages). L'icône maison en haut à droite te fait passer de l'une à l'autre ; la flèche à gauche de ton pseudo te ramène au jeu.</li>
<li><strong>Histoire par packs.</strong> Finir l'histoire d'un pack débloque des modes (Evil Castle, Mirror Wars, Path of Adventure) et te donne des persos 5 étoiles. Le pack Path of Adventure s'ouvre après le troisième pack d'histoire.</li>
<li><strong>Persos et costumes.</strong> Un perso a plusieurs costumes ; chaque costume apporte une compétence. Si tu tires un costume d'un perso que tu n'as pas, tu obtiens le perso. Il n'y a pas de forme "de base" à posséder d'abord.</li>
<li><strong>Capacités d'exploration.</strong> Chaque perso peut avoir une capacité sur la carte (chercher des trésors, fabriquer de l'équipement, cuisiner). Elle consomme des pilules de capacité, même si le perso n'est pas dans ton équipe active.</li>
<li><strong>Énigmes.</strong> Si tu bloques sur un puzzle d'histoire, appuie sur le "+" de la description de la quête : elle contient souvent un indice.</li>
<li><strong>Explorer après la quête.</strong> Une fois la quête principale terminée, la carte indique combien de trouvailles restent à ramasser. Active la capacité Search de Lathel pour révéler les cachées (elles brillent en vert).</li>
</ul>
</div></section>
<section class="chapter" id="s3" data-title="Reroll et Infinite Draw"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/></svg><b>03</b></span><h2>Reroll et Infinite Draw</h2></header><div class="ch-body">
<p>Pas besoin de recréer ton compte : le Tirage infini te laisse relancer un 10-tirage autant de fois que tu veux, jusqu'à obtenir le perso qui te plaît. Un seul piège : une fois le résultat validé, il n'y a pas de retour en arrière.</p>
<ol>
<li>Fais le tutoriel et avance dans l'histoire jusqu'à ce qu'Elin te présente le système de tirage.</li>
<li>Ouvre l'onglet Infinite Draw et relance jusqu'à obtenir ta cible.</li>
<li>Ne valide que si tu es content du résultat.</li>
<li>Lie ton compte (menu ETC puis <button class="term" data-tip='Lier le compte — Menu "ETC" ; protège ta progression' type="button">Link Account</button>) pour sécuriser ta progression.</li>
</ol>
<p>Chaque 10-tirage de l'Infinite Draw garantit un costume 5★, et un seul 5★ est possible. L'équipement ne peut pas y être UR 5★ (au mieux un SR 5★ exclusif) : ne relance pas pour l'équipement.</p>
<h3 id="s3-1">Quoi viser (compendium, octobre 2026)</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Costume</th>
<th>Profil</th>
<th>Verdict</th>
</tr>
</thead>
<tbody>
<tr>
<td>The Curse Celia</td>
<td>Support qui frappe beaucoup de fois (Chains), surtout utile plus tard, notamment dans Last Night</td>
<td><strong>Le choix recommandé</strong></td>
</tr>
<tr>
<td>Gentle Maid Anastasia</td>
<td>Bon DPS physique</td>
<td>Alternative possible, mais les supports passent avant</td>
</tr>
<tr>
<td>Top Idol Helena</td>
<td>Support défensif et utilitaire</td>
<td>Alternative, moins prioritaire qu'un support offensif</td>
</tr>
<tr>
<td>Eleaneer (Piercing Magic Bow), Scheherazade (The Lapis Witch)</td>
<td>Choix orientés PvP</td>
<td>Déconseillés, le jeu étant surtout PvE</td>
</tr>
</tbody>
</table></div>
<p>Pas de panique si tu as déjà validé autre chose : ce choix ne fait ni ne défait un compte, et tu obtiendras d'autres copies avec le temps. Choisis ensuite physique ou magie pour ton équipe : pour un débutant, le physique est plus simple, car Arines (gratuite) booste fortement les attaquants physiques.</p>
<h3 id="s3-2">Et les meilleurs persos du moment ?</h3>
<p>Un classement de juin 2026 place Morpeah en tête, suivie d'Apostle Blade et de Dark Saintess Liberta, soutien indispensable d'une équipe physique. Inutile de reroll pour eux : Apostle Morpeah se recrute à la taverne du Story Pack 17, et Blade comme Liberta à la taverne après le Story Pack 15.</p>
<h3 id="s3-3">True reroll (optionnel)</h3>
<p>Cela ne vaut le coup que si tu veux des doublons d'un perso de bannière. Il faut un compte invité, récupérer tous les dias et tickets gratuits (environ 40 à 50 tickets), puis tirer sur la bannière. Si tu obtiens +2 avec ces tirages de départ, garde le compte ; sinon, recommence. Pour un premier compte, ignore cette méthode.</p>
</div></section>
<section class="chapter" id="s4" data-title="Première équipe et persos gratuits"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/></svg><b>04</b></span><h2>Première équipe et persos gratuits</h2></header><div class="ch-body">
<p>Construis une équipe physique autour de trois unités gratuites : Arines, Wiggle et Kry. Elles te porteront dans l'essentiel de l'histoire, sans tirage chanceux.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Perso</th>
<th>Rôle</th>
<th>Pourquoi</th>
</tr>
</thead>
<tbody>
<tr>
<td>Arines (3★, gratuite)</td>
<td>Soutien physique</td>
<td>+70 % d'ATK et +30 % de critique pour les attaquants physiques (sans effet sur la magie)</td>
</tr>
<tr>
<td>Wiggle (3★, gratuite)</td>
<td>Attaquant</td>
<td>Zone en "+" et très gros dégâts avec son auto-destruction</td>
</tr>
<tr>
<td>Kry (4★, gratuit)</td>
<td>Attaquant</td>
<td>Zone en "X" ; son costume Marauder réduit la défense des ennemis</td>
</tr>
<tr>
<td>2 places libres</td>
<td>Attaquants à zone</td>
<td>Ce que tu as tiré : Justia, Gray, Lathel ou Liatris conviennent</td>
</tr>
</tbody>
</table></div>
<p>Pour savoir si un perso est physique ou magique, ouvre ses stats : une ATK avec une épée indique physique, une <button class="term" data-tip="Attaque physique / magique — Vérifie dans la fiche du perso lequel il utilise" type="button">M.ATK</button> avec un bâton indique magique.</p>
<h3 id="s4-1">Règles simples</h3>
<ul>
<li>Privilégie les attaquants à zone (AOE) pour l'histoire. Ne monte pas les tanks (Lecliss, Seir) pour l'instant : tu n'en auras besoin que bien plus tard.</li>
<li>Si tu n'as pas Kry, Layla (4★, facile à obtenir) est un bon remplaçant à zone en "X".</li>
<li>Les buffs de types différents se multiplient, ceux du même type s'additionnent. Combine donc des buffs variés plutôt que deux fois le même. Arines et Kind Student Samay donnent ensemble +120 % d'ATK et 30 % de critique.</li>
<li>En contenu difficile, la formation courante est 3 soutiens/buffers, 1 soutien ou attaquant utilitaire (repousser, réduire la DEF, recharger les SP) et 1 attaquant.</li>
</ul>
<h3 id="s4-2">À recruter en taverne</h3>
<ul>
<li><strong>Diana</strong> (taverne du Story Pack 10) : support indispensable (bonus d'élément et de critique) avec une capacité Dispatch. Priorité absolue, voir l'étape 4.</li>
<li><strong>Dark Saintess Liberta</strong> (taverne du Story Pack 15) : la base de toute équipe physique, voir l'étape 12.</li>
<li><strong>Queen of Gluttis Granadair</strong> (apparition aléatoire) : à prendre dès qu'elle se montre.</li>
<li><strong>Olstein</strong> (taverne du Story Pack 4) : faible au combat, son Dispatch rapporte un peu chaque jour. Seulement si tu n'as rien de mieux à recruter.</li>
<li>Ne recrute pas les persos 3★ et 4★ : tu obtiendras facilement leurs costumes au tirage. Garde tes contrats pour les 5★.</li>
</ul>
<h3 id="s4-3">Équipes de départ conseillées (compendium, 2026)</h3>
<p>Il n'existe pas d'équipe universelle : tout dépend des ennemis. Le compendium conseille 1 à 3 DPS, le reste en supports (3 supports + 2 DPS pour les combats simples), et un seul type de dégâts. Les buffers d'ATK (Arines, Homunculus Lathel) ne boostent que le physique, ceux de MATK (B-Rank Idol Helena, Elpis) que le magique ; Kind Student Samay et Diana boostent les deux. Mets les DPS au centre de la grille.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Emplacement</th>
<th>Équipe de zone (beaucoup d'ennemis, magique)</th>
<th>Équipe cible unique (boss seul, physique)</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>B-Rank Idol Helena (ticket de sélection)</td>
<td>Priest of Vitality Arines, ou Dark Saintess Liberta à +2 et plus</td>
</tr>
<tr>
<td>2</td>
<td>Hand of Salvation Elpis (gacha)</td>
<td>Homunculus Lathel (ticket de sélection), ou Liberta</td>
</tr>
<tr>
<td>3</td>
<td>Kind Student Samay (gacha) ; sinon Queen of Gluttis Granadair, ou Diana contre <span class="el el-light">Lumière</span> et <span class="el el-water">Eau</span></td>
<td>Robin Hood Zenith (ticket), ou Little Hunter Rigenette, ou Apostle Morpeah (taverne du Story Pack 17)</td>
</tr>
<tr>
<td>4</td>
<td>Dream Bride Eclipse (onglet Events, gratuit)</td>
<td>Kind Student Samay ; sinon Diana contre <span class="el el-dark">Ténèbres</span>, The Curse Celia, Frozen Queen Wilhelmina ou Night of Death Mamonir</td>
</tr>
<tr>
<td>5</td>
<td>Summer Vacation Dalvi (onglet Events, gratuit)</td>
<td>Comeback Idol Ventana, <strong>empruntée à un ami</strong></td>
</tr>
</tbody>
</table></div>
<p>Les supports ★3 et ★4 à +5 valent souvent mieux qu'un ★5 à +0 : aucune honte à les jouer. Pour emprunter : demande en ami un joueur qui a le perso, puis en combat touche Replace, l'icône en forme de main en haut à droite, et choisis-le.</p>
</div></section>
<section class="chapter" id="s5" data-title="Parcours de la première semaine (pas à pas)"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c3 0 3-5 7-5s4-6 7-6"/><circle cx="5" cy="19" r="1.6"/><path d="M19 4v4h-4"/></svg><b>05</b></span><h2>Parcours de la première semaine (pas à pas)</h2></header><div class="ch-body">
<p>Cette partie suit la checklist « nouveau joueur » du Discord officiel, traduite et illustrée avec tes captures, puis complétée par le compendium de BotAn. Tout est faisable en une semaine, mais rien n'est obligatoire : joue à ton rythme.</p>
<p>L'auteur du Discord ne donne pas d'ordre strict : fais en premier ce que tu peux valider. Une fois tout coché, tu connaîtras déjà la plupart des mécaniques du jeu.</p>
<h3 id="s5-1">Avant tout (conseils du compendium)</h3>
<ul>
<li>Termine <strong>Master Pack 1 (Edge of Dimensions)</strong> : il débloque le gacha et les menus d'événements.</li>
<li>Dans l'<strong>Infinite Draw</strong>, vise <strong>The Curse Celia</strong>.</li>
<li>Garde tes <strong>Recommended ★5 Costume Selective Tickets</strong> (12 dans le Guide Pass) pour les supports clés : Diana +2 (3 tickets), B-Rank Idol Helena +1 (2), Homunculus Lathel +2 (3), puis New Hire Seir, Track and Field Captain Levia, Robin Hood Zenith et Game Club Rafina (1 chacun). Commence par Helena si tu veux une équipe de départ confortable.</li>
<li>Ne mélange jamais buffers et DPS <strong>physiques</strong> et <strong>magiques</strong> dans la même équipe.</li>
<li>Récupère les costumes gratuits de l'onglet <strong>Events</strong> (Dream Bride <strong>Eclipse</strong> et Summer Vacation <strong>Dalvi</strong>) et monte-les en priorité.</li>
<li>L'onglet <strong>Story</strong> de l'accueil n'est qu'une archive : lire là-bas ne fait pas avancer ta progression.</li>
</ul>
<h3 id="s5-2">Les objectifs de la semaine</h3>

class="tick" data-k="9a1ec767bf" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Avoir une équipe entièrement équipée en Rare IV</span></label></li><li class="task"><label><input class="tick" data-k="605f24342f" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Avoir au moins une pièce avec un bon score de raffinage</span></label></li><li class="task"><label><input class="tick" data-k="fd0a92838f" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Recruter Diana</span></label></li><li class="task"><label><input class="tick" data-k="616dd33edb" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Recruter Liberta</span></label></li><li class="task"><label><input class="tick" data-k="6cb50b9880" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Débloquer un Skill Potential de costume</span></label></li><li class="task"><label><input class="tick" data-k="dc777a7c52" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Changer le Bonding Stat d'un personnage</span></label></li><li class="task"><label><input class="tick" data-k="e07557aedd" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir Slime Empire en Very Hard</span></label></li><li class="task"><label><input class="tick" data-k="c2e56e92a9" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir Goblin Cave en Very Hard</span></label></li><li class="task"><label><input class="tick" data-k="84983d7a32" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir Magic Crystal Cave en Very Hard</span></label></li><li class="task"><label><input class="tick" data-k="cd15b9c0a8" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Atteindre le rang Gold dans Mirror Wars</span></label></li><li class="task"><label><input class="tick" data-k="a649aa5b52" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir l'étage 1 de la Tower of Pride</span></label></li><li class="task"><label><input class="tick" data-k="7ad4ec0ea7" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir le niveau 2 de la Tower of Salvation</span></label></li><li class="task"><label><input class="tick" data-k="193d16eba4" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir le niveau 10 de la Tower of Desire</span></label></li><li class="task"><label><input class="tick" data-k="3f625ad7f7" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir le niveau 5 des Towers of Wrath et of Jealousy</span></label></li><li class="task"><label><input class="tick" data-k="7b18f6262f" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Atteindre 50 % de Collection Buff en PV</span></label></li><li class="task"><label><input class="tick" data-k="cad303086d" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir le niveau 15 du combat d'événement Normal</span></label></li><li class="task"><label><input class="tick" data-k="61d014c27c" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finir le niveau 2 du Fiend Hunter</span></label></li><li class="task"><label><input class="tick" data-k="3fd7f34121" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Faire 10 000 de score dans Last Night</span></label></li><li class="task"><label><input class="tick" data-k="e4732c34df" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Monter le Glupy Diner au niveau 2</span></label></li><li class="task"><label><input class="tick" data-k="aed5566d18" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Débloquer la 4e rencontre d'un ami Glu Talk</span></label></li><li class="task"><label><input class="tick" data-k="ea44d66682" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Avoir un Knight's Ring IV (R) avec un rang BBS et des options 100 % Crit DMG</span></label></li></ul></div>
<div id="steps-summary" class="widget"></div><p>Les étapes ci-dessous expliquent pourquoi chaque objectif compte.</p>
<article class="step" data-step="1"><div class="step-head"><h3 id="s5-3">Étape 1 — Missions quotidiennes et passe de saison</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="1"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p class="callout key"><span class="co-tag">À retenir</span>Les dailies sont courtes. La récompense à ne <strong>jamais rater</strong> est celle de la mission du passe de saison « Battle in the Hunting Ground » : elle donne un <strong>Pass Material Chest</strong>, plein de matériaux de craft. Fais-la dès ton premier jour.</p>
<figure class="shot"><button aria-label="Agrandir : Missions quotidiennes du passe de saison" class="shot-btn" data-full="img/bd2-1000095411.jpg" type="button"><img alt="Missions quotidiennes du passe de saison" loading="lazy" src="img/bd2-1000095411.jpg"/></button><figcaption>Missions quotidiennes du passe de saison</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Contenu du Pass Material Chest : minerais et cuir" class="shot-btn" data-full="img/bd2-1000095412.jpg" type="button"><img alt="Contenu du Pass Material Chest : minerais et cuir" loading="lazy" src="img/bd2-1000095412.jpg"/></button><figcaption>Contenu du Pass Material Chest : minerais et cuir</figcaption></figure>
<p><strong>Où sont les Hunting Grounds ?</strong> Dans les Story Packs 1 à 10. Chaque pack débloque le sien une fois fini en Normal, et une difficulté plus haute donne plus de récompenses. Sur la carte, c'est l'icône en forme de crâne entourée ci-dessous ; un raccourci existe aussi à côté de la minimap.</p>
<figure class="shot"><button aria-label="Agrandir : Icône des Hunting Grounds sur la carte" class="shot-btn" data-full="img/bd2-1000095413.jpg" type="button"><img alt="Icône des Hunting Grounds sur la carte" loading="lazy" src="img/bd2-1000095413.jpg"/></button><figcaption>Icône des Hunting Grounds sur la carte</figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Complément du compendium.</strong> Si la quête te demande un combat en Hunting Ground mais qu'il n'y a aucun ennemi, annule la quête active : ils réapparaissent. Le bouton <strong>Quick Hunt</strong> de l'accueil regroupe Hunting Grounds et Path of Adventure et lance les combats sans charger la carte.</p>
</div></article><article class="step" data-step="2"><div class="step-head"><h3 id="s5-4">Étape 2 — Les Story Packs principaux</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="2"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Finir le <strong>Main Story Pack 10</strong> débloque en pratique tout le contenu du jeu. Inutile de foncer dans les packs 11 à 16 : leur difficulté grimpe fort. Une exception : construis ton équipe pour finir le <strong>pack 15</strong> dès que possible (voir étape 12).</p>

<figure class="shot"><button aria-label="Agrandir : Où obtenir l'Ability Book ★3 : Evil Castle ou boutique du Story Pack 10" class="shot-btn" data-full="img/bd2-1000095414.jpg" type="button"><img alt="Où obtenir l'Ability Book ★3 : Evil Castle ou boutique du Story Pack 10" loading="lazy" src="img/bd2-1000095414.jpg"/></button><figcaption>Où obtenir l'Ability Book ★3 : Evil Castle ou boutique du Story Pack 10</figcaption></figure>
<p class="callout key"><span class="co-tag">À retenir</span><strong>Pourquoi le pack 9 en Very Hard est si important.</strong> Il te faut énormément de Hardwood pour crafter, et il n'a qu'une source fiable : ce Hunting Ground. Les minerais, eux, viennent aussi des chapitres 7, 8 et 13. Le Discord dit sans exagérer qu'il faut le finir au plus vite, rien que pour le Hardwood.</p>
<figure class="shot"><button aria-label="Agrandir : Hunting Ground du chapitre 9 en Very Hard" class="shot-btn" data-full="img/bd2-1000095415.jpg" type="button"><img alt="Hunting Ground du chapitre 9 en Very Hard" loading="lazy" src="img/bd2-1000095415.jpg"/></button><figcaption>Hunting Ground du chapitre 9 en Very Hard</figcaption></figure>

<p><strong>La « Today's Quest » du Newbie Pass.</strong> Tu peux la faire 3 fois par jour maximum. L'auteur conseille le Character Pack <strong>Beauty Impossible</strong> : c'est le plus simple et le plus rapide, et pratique pour les succès. Certaines Today's Quest des Story Packs t'envoient en Hunting Ground, ce qui coûte du riz. Sinon, choisis les quêtes qui t'arrangent dans n'importe quel pack.</p>
<figure class="shot"><button aria-label="Agrandir : Panneau de quêtes (Quest Bulletin) et Today's Quest" class="shot-btn" data-full="img/bd2-1000095417.jpg" type="button"><img alt="Panneau de quêtes (Quest Bulletin) et Today's Quest" loading="lazy" src="img/bd2-1000095417.jpg"/></button><figcaption>Panneau de quêtes (Quest Bulletin) et Today's Quest</figcaption></figure>
</div></article><article class="step" data-step="3"><div class="step-head"><h3 id="s5-5">Étape 3 — Gear Craft et Alchemy au niveau Legendary</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="3"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Monter <strong>Gear Craft au niveau Legendary en 7 jours</strong> est possible si tu ne rates aucune récompense quotidienne du passe de saison. Tu as besoin du rang Legendary pour crafter de l'équipement UR.</p>
<p><strong>Comment monter le rang.</strong> Tu gagnes de l'XP en craftant, puis tu passes au rang suivant avec un Ability Book quand la barre est pleine. Le compendium conseille de crafter de l'équipement <strong>N ou R</strong> pour l'XP et d'éviter le SR, trop cher pour ce qu'il rapporte. Ne crafte pas trop d'un coup : fais 30, 50 ou 100 crafts au maximum, regarde combien l'XP monte, puis ajuste.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Livre</th>
<th>Où l'obtenir</th>
</tr>
</thead>
<tbody>
<tr>
<td>Ability Book ★1 et ★2</td>
<td>Boutique du Story Pack 3 (Mist Man)</td>
</tr>
<tr>
<td>Ability Book ★3</td>
<td>Boutique du Story Pack 10 (contre de l'or) ou boutique de l'Evil Castle</td>
</tr>
<tr>
<td>Ability Book ★4</td>
<td>Boutique de l'Evil Castle uniquement (512 Devil Coins pièce)</td>
</tr>
</tbody>
</table></div>
<p class="callout key"><span class="co-tag">À retenir</span><strong>L'astuce des Devil Coins.</strong> Achète les livres ★3 avec de l'or au Story Pack 10 et garde tes Devil Coins pour les livres ★4. La mission quotidienne du passe de saison en donne 125 par jour : tu peux donc atteindre Legendary au plus tard vers ton 5e jour, et plus vite si tu finis tôt l'étage 1 de la Tower of Pride.</p>
<figure class="shot"><button aria-label="Agrandir : Boutique de l'Evil Castle et missions du passe qui donnent des Devil Coins" class="shot-btn" data-full="img/bd2-1000095418.jpg" type="button"><img alt="Boutique de l'Evil Castle et missions du passe qui donnent des Devil Coins" loading="lazy" src="img/bd2-1000095418.jpg"/></button><figcaption>Boutique de l'Evil Castle et missions du passe qui donnent des Devil Coins</figcaption></figure>
<p><strong>Quoi crafter en attendant : du Rare IV.</strong> Vise l'équipement <strong>Rare IV</strong> (affiché « IV R » avec 3 étoiles). C'est l'option bon marché la plus forte pour un débutant, avec l'équipement Fiend vendu dans la boutique d'événement. Au craft, le palier IV ne sort que 5 % du temps (I : 50 %, II : 30 %, III : 15 %), donc crafte en quantité.</p>
<p>N'aie pas peur de « gaspiller » en améliorant et en raffinant ton équipement Rare : c'est très peu cher, et il utilise d'autres matériaux pour changer ses options (substats).</p>
<figure class="shot"><button aria-label="Agrandir : Raffiner une option : 4 pierres sur une pièce Rare contre 45 cristaux sur une pièce UR" class="shot-btn" data-full="img/bd2-1000095419.jpg" type="button"><img alt="Raffiner une option : 4 pierres sur une pièce Rare contre 45 cristaux sur une pièce UR" loading="lazy" src="img/bd2-1000095419.jpg"/></button><figcaption>Raffiner une option : 4 pierres sur une pièce Rare contre 45 cristaux sur une pièce UR</figcaption></figure>
<p>Raffiner une arme augmente son <strong>rang d'amélioration</strong>, qui fait monter sa stat principale. En général, un rang <strong>BBS</strong> suffit.</p>
<figure class="shot"><button aria-label="Agrandir : Knight's Sword IV R +9 avec un rang BBS" class="shot-btn" data-full="img/bd2-1000095420.jpg" type="button"><img alt="Knight's Sword IV R +9 avec un rang BBS" loading="lazy" src="img/bd2-1000095420.jpg"/></button><figcaption>Knight's Sword IV R +9 avec un rang BBS</figcaption></figure>
<p><strong>Après Legendary (ordre du compendium).</strong></p>
<ol>
<li>Crafte une arme et des gants UR III pour ton DPS principal : Evil Dragon's Blade pour un DPS physique, Travel God's Friend pour un DPS magique.</li>
<li>Pour les gants : God-King's Silver Arm (physique) ou Shackle of Treachery (magique), plus faciles au début.</li>
<li>Fais pareil pour ton deuxième DPS, avec un accessoire <strong>Venomous Touch</strong>, la pièce la plus prioritaire.</li>
<li>Passe ensuite à un ou deux sets d'équipement offensif UR IV.</li>
<li>Crafte enfin des armures et casques UR III selon l'ennemi : Invulnerable Armor + Helm of Carnage contre les dégâts physiques, Fiend Guard + Radiant Wisdom contre les dégâts magiques.</li>
</ol>
<p>Le compendium cite le code <strong>WAITING4LEGEND</strong>, qui donnait un Venomous Touch UR III. Il est toujours actif (confirmé sur le Discord officiel, novembre 2026).</p>
<p><strong>Alchemy.</strong> C'est la capacité de Scheherazade, qui transforme les matériaux communs en matériaux avancés. Elle se monte comme le craft. Pour l'XP, transforme d'abord le moins cher : Plain Leather en Fine Leather, Plain Fabric en Fine Fabric, Peat en Coal.</p>
</div></article><article class="step" data-step="4"><div class="step-head"><h3 id="s5-6">Étape 4 — Recruter Diana, débloquer un Potentiel, changer de Bonding</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="4"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Une fois le Story Pack 10 fini, tu croises <strong>Adventurer of the Unknown Diana</strong> à la taverne. Elle se recrute contre <strong>1 contrat de recrutement ★5</strong> (le parchemin arc-en-ciel).</p>
<figure class="shot"><button aria-label="Agrandir : Diana à la taverne du Story Pack 10" class="shot-btn" data-full="img/bd2-1000095421.jpg" type="button"><img alt="Diana à la taverne du Story Pack 10" loading="lazy" src="img/bd2-1000095421.jpg"/></button><figcaption>Diana à la taverne du Story Pack 10</figcaption></figure>
<p class="callout key"><span class="co-tag">À retenir</span><strong>Avoir 3 contrats ★5 avant ton 7e jour :</strong> 1 dans ta boîte aux lettres à la première connexion, 1 en récompense du jour 7 de l'étape 1 du Newbie Pass, et 1 en échangeant des parchemins de rang inférieur dans la boutique.</p>
<p class="callout key"><span class="co-tag">À retenir</span><strong>Pourquoi elle est indispensable.</strong> Diana est un support qui pose une aura augmentant les <strong>dégâts d'élément</strong> (Property DMG) et le <strong>taux de critique</strong>. Le bonus d'élément est un multiplicateur à part des buffs d'ATK et de MATK. Il ne marche que si l'ennemi a un élément faible face au tien. Il ne sert donc à rien contre les ennemis sans élément, comme dans les Towers of Wrath et of Jealousy. Elle est aussi clé dans le Fiend Hunter.</p>
<figure class="shot"><button aria-label="Agrandir : Ennemi de la Tower of Wrath : aucun élément, donc pas de bonus de Diana" class="shot-btn" data-full="img/bd2-1000095422.jpg" type="button"><img alt="Ennemi de la Tower of Wrath : aucun élément, donc pas de bonus de Diana" loading="lazy" src="img/bd2-1000095422.jpg"/></button><figcaption>Ennemi de la Tower of Wrath : aucun élément, donc pas de bonus de Diana</figcaption></figure>
<p><strong>Sa capacité Dispatch</strong> rapporte des objets chaque jour. Une fois Gear Craft et Alchemy au rang Legendary, c'est la prochaine capacité à monter au maximum.</p>
<figure class="shot"><button aria-label="Agrandir : Dispatch Advanced de Diana" class="shot-btn" data-full="img/bd2-1000095423.jpg" type="button"><img alt="Dispatch Advanced de Diana" loading="lazy" src="img/bd2-1000095423.jpg"/></button><figcaption>Dispatch Advanced de Diana</figcaption></figure>
<h4>Le Skill Potential (Potential Liberation)</h4>
<p>Le Potentiel renforce un costume ou lui donne un vrai confort : moins de temps de recharge, une portée plus large, un coût en SP réduit. L'arbre a trois types de nœuds :</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Nœud</th>
<th>Effet</th>
<th>Coût</th>
</tr>
</thead>
<tbody>
<tr>
<td>Petit</td>
<td>Stats de base du perso, actives en permanence</td>
<td>30 000 or + 50 cristaux d'élément</td>
</tr>
<tr>
<td>Moyen</td>
<td>Gros bonus de stats, actif seulement si ce costume est lié (Bonding)</td>
<td>20 000 à 40 000 or + 0 à 350 cristaux</td>
</tr>
<tr>
<td>Grand</td>
<td>Améliore la compétence (−1 SP, portée, dégâts)</td>
<td>500 cristaux + 1 <strong>Tear of the Goddess</strong></td>
</tr>
</tbody>
</table></div>
<p>La <button class="term" data-tip="Larme de la déesse — Très rare, débloque le potentiel de compétence" type="button">Tear of the Goddess</button> est très rare : réfléchis avant de l'utiliser, et demande conseil en cas de doute. Un Potentiel ne peut <strong>pas</strong> être annulé. Priorité du compendium : les <strong>supports d'abord</strong> (réduction de SP et de recharge, puis durée et zone), les nœuds de dégâts des DPS en dernier.</p>
<figure class="shot"><button aria-label="Agrandir : Arbre de Potential Liberation de Diana" class="shot-btn" data-full="img/bd2-1000095424.jpg" type="button"><img alt="Arbre de Potential Liberation de Diana" loading="lazy" src="img/bd2-1000095424.jpg"/></button><figcaption>Arbre de Potential Liberation de Diana</figcaption></figure>
<h4>Le Bonding</h4>
<p>Un personnage peut avoir plusieurs costumes, et tu en choisis <strong>un</strong> à lier (Bonding). C'est comme « équiper » les bonus d'amélioration de ce costume sur le perso. Tu peux changer de lien quand tu veux, gratuitement : dans l'écran du personnage, touche le portrait du costume à droite. En débutant, lie le costume qui a le plus de Potentiel débloqué.</p>
<figure class="shot"><button aria-label="Agrandir : Bonding Stat d'un personnage" class="shot-btn" data-full="img/bd2-1000095425.jpg" type="button"><img alt="Bonding Stat d'un personnage" loading="lazy" src="img/bd2-1000095425.jpg"/></button><figcaption>Bonding Stat d'un personnage</figcaption></figure>
</div></article><article class="step" data-step="5"><div class="step-head"><h3 id="s5-7">Étape 5 — Stages de ressources et Mirror Wars (PvP)</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="5"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>Le Story Pack 3 fini débloque le <strong>Path of Adventure</strong>, où tu farmes les Slimes (XP), l'or et les cristaux de magie. Plus la difficulté est haute, plus les récompenses sont grosses.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Donjon</th>
<th>Ce qu'il donne</th>
<th>Énergie</th>
</tr>
</thead>
<tbody>
<tr>
<td>Goblin Cave</td>
<td>Or</td>
<td>Riz cuit (Cooked Rice)</td>
</tr>
<tr>
<td>Slime Empire</td>
<td>Slimes pour monter de niveau</td>
<td>Riz cuit</td>
</tr>
<tr>
<td>Magic Crystal Cave</td>
<td>Cristaux de magie, seule source pour les Potentiels</td>
<td>Torches</td>
</tr>
</tbody>
</table></div>
<h4>Les trois énergies</h4>
<p>Le jeu a trois énergies qui ne se rechargent <strong>qu'au reset quotidien</strong>, pas à la minute : le <strong>riz</strong>, les <strong>torches</strong> et les <strong>Blood Cocktails</strong>. Le chiffre blanc est ta ration du jour : dépense-la entièrement chaque jour, car elle ne se cumule pas. Les « + » jaunes sont un stock qui s'accumule sans limite et n'expire jamais.</p>
<figure class="shot"><button aria-label="Agrandir : Jauges de riz et de torches : ration du jour en blanc, stock en jaune" class="shot-btn" data-full="img/bd2-1000095426.jpg" type="button"><img alt="Jauges de riz et de torches : ration du jour en blanc, stock en jaune" loading="lazy" src="img/bd2-1000095426.jpg"/></button><figcaption>Jauges de riz et de torches : ration du jour en blanc, stock en jaune</figcaption></figure>
<p class="callout warn"><span class="co-tag">Attention</span><strong>Combien par jour ?</strong> <strong>90 riz</strong> par jour (confirmé sur le Discord officiel, novembre 2026). L'ancienne capture du Discord montre encore 60 riz et 60 torches.</p>
<p><strong>Comment les dépenser (compendium).</strong> Mets tout le riz sur la Goblin Cave (or) ou le Slime Empire (Slimes) selon le jour de bonus. Mets les torches sur l'élément dont tu as besoin de cristaux. 60 torches en Very Hard rapportent 220 à 260 cristaux. Le riz « payant » reçu en événement ne se réinitialise pas : pour l'utiliser, décoche « Use Free <button class="term" data-tip="Riz cuit — Énergie du Path of Adventure" type="button">Cooked Rice</button> Only » dans le Quick Hunt.</p>
<p><strong>Monter en difficulté.</strong> Le Very Hard de ces donjons est assez facile, surtout avec l'aura de Diana. Tu peux tenter le Hard dès ton premier jour après avoir crafté quelques pièces Rare. Une fois le Very Hard fini, utilise simplement le <strong>Quick Hunt</strong> chaque jour.</p>
<p>Le Newbie Pass (étape 1, jour 7) demande d'activer l'<strong>Auto Hunt</strong> : fais-le une fois, ça valide la mission même au jour 1.</p>
<figure class="shot"><button aria-label="Agrandir : Bouton Auto Hunt" class="shot-btn" data-full="img/bd2-1000095427.jpg" type="button"><img alt="Bouton Auto Hunt" loading="lazy" src="img/bd2-1000095427.jpg"/></button><figcaption>Bouton Auto Hunt</figcaption></figure>
<figure class="shot"><button aria-label="Agrandir : Bouton Quick Hunt" class="shot-btn" data-full="img/bd2-1000095428.jpg" type="button"><img alt="Bouton Quick Hunt" loading="lazy" src="img/bd2-1000095428.jpg"/></button><figcaption>Bouton Quick Hunt</figcaption></figure>
<h4>Mirror Wars (PvP)</h4>
<p>Les <strong>Blood Cocktails</strong> servent au Mirror Wars. Même si ton équipe est faible au début, dépense-les tous chaque jour : tu gagnes des médailles que tu gagnes ou que tu perdes. Ces médailles achètent le costume en vente dans la boutique Mirror Wars (18 000 médailles).</p>
<figure class="shot"><button aria-label="Agrandir : Boutique Mirror Wars : costume à 18 000 médailles" class="shot-btn" data-full="img/bd2-1000095429.jpg" type="button"><img alt="Boutique Mirror Wars : costume à 18 000 médailles" loading="lazy" src="img/bd2-1000095429.jpg"/></button><figcaption>Boutique Mirror Wars : costume à 18 000 médailles</figcaption></figure>
<ul>
<li><strong>Au début</strong>, mets simplement ta meilleure équipe PvE.</li>
<li><strong>Objectif réaliste</strong> : Gold I ou Platinum la première semaine. Diamond I (Dia I) est à peu près le plafond d'un joueur casual chaque semaine.</li>
<li><strong>Récompense</strong> : Gold I donne 500 Dia à chaque reset hebdomadaire.</li>
</ul>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Compléments du compendium.</strong></p>
<ul>
<li>40 Blood Cocktails par jour, reset à minuit. Utilise le menu <strong>Repeat Battle</strong> réglé sur 40 : tu ne te bats qu'une fois mais tu reçois les récompenses de 40 combats. Les points de victoire, eux, ne comptent qu'une fois.</li>
<li>La saison dure une semaine, du lundi au dimanche. Le dimanche, à partir de 15:00 (heure du jeu), 9 heures de décompte bloquent les attaques.</li>
<li>En attaque tu commences avec <strong>5 SP</strong>, en défense avec <strong>6 SP</strong>, puis +6 SP par tour. Privilégie des costumes peu chers en SP : impossible de tout lancer au tour 1 comme en histoire.</li>
</ul>

</table></div>
</div></article><article class="step" data-step="6"><div class="step-head"><h3 id="s5-8">Étape 6 — L'Evil Castle et ses tours</h3><label class="step-done"><input type="checkbox" class="step-tick" data-step="6"><span class="box" aria-hidden="true"></span><span>Faite</span></label><button type="button" class="step-toggle" hidden>Afficher</button></div><div class="step-body">
<p>L'Evil Castle se débloque avec le Story Pack 4 (Normal). Il contient cinq tours, et chacune a sa logique.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Tour</th>
<th>Principe</th>
<th>Objectif débutant (Discord)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Tower of Pride</td>
<td>6 étages à score, récompenses <strong>quotidiennes</strong> et de fin de saison</td>
<td>Étage 1</td>
</tr>
<tr>
<td>Tower of Desire</td>
<td>250 étages, il suffit de gagner</td>
<td>Niveau 10</td>
</tr>
<tr>
<td>Tower of Salvation</td>
<td>Rogue-like saisonnier (4 semaines), 10 difficultés</td>
<td>Niveau 2, voire 4</td>
</tr>
<tr>
<td>Tower of Wrath</td>
<td>100 étages, ennemis <strong>immunisés au physique</strong></td>
<td>Niveau 5</td>
</tr>
<tr>
<td>Tower of Jealousy</td>
<td>100 étages, ennemis <strong>immunisés au magique</strong></td>
<td>Niveau 5</td>
</tr>
</tbody>
