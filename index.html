<h4>Pierres tombales</h4>
<p>Quand un de tes persos meurt, une <strong>pierre tombale</strong> apparaît à sa place (pas pour les invocations, ni les explosifs). Elle ne peut pas être poussée, bloque les reculs ennemis, et ne fait ni ne prend de dégâts. Un perso qui s'autodétruit ou meurt d'un contre laisse sa pierre là où il était avant d'agir.</p>
<h4>Les boutons de l'écran</h4>
<figure class="shot cp"><button aria-label="Agrandir : Barre du haut : effets, Auto Burst, Auto Skill, Auto Battle, vitesse, Autofeed, pause" class="shot-btn" data-full="img/cp-UI_top.jpg" type="button"><img alt="Barre du haut : effets, Auto Burst, Auto Skill, Auto Battle, vitesse, Autofeed, pause" loading="lazy" src="img/cp-UI_top.jpg"/></button><figcaption>Barre du haut : effets, Auto Burst, Auto Skill, Auto Battle, vitesse, Autofeed, pause<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<ul>
<li><strong>Effets d'environnement</strong> : l'icône liste les effets actifs (bonus de collection, Death Time, effets de l'Evil Castle).</li>
<li><strong>Auto Burst</strong> : active les Bursts tout seul, mais après les costumes (s'il manque des SP, le Burst saute) et dans l'ordre de l'équipe, donc les supports d'abord.</li>
<li><strong>Auto Skill</strong> : choisit les costumes du tour suivant dans l'ordre de l'équipe, en gardant ceux du tour 1. Sans assez de SP, le costume n'est pas choisi ; s'il ne reste des SP que pour un costume moins cher, c'est lui qui part. Pratique pour gagner du temps.</li>
<li><strong>Auto Battle</strong> : déconseillé. Il bloque toutes tes actions, ignore les ennemis et le placement, et ne t'apprend rien.</li>
<li><strong>Vitesse</strong> : de ×1 à ×3.</li>
<li><strong>Autofeed</strong> : soigne un peu avec ta nourriture. Ça ne vaut pas le coup.</li>
<li><strong>Pause</strong> : réglages des cinématiques et du son, <strong>statistiques du combat</strong>, <strong>recommencer le combat ou le tour précédent</strong> (impossible dans la Tower of Salvation), fuir.</li>
</ul>
<figure class="shot cp"><button aria-label="Agrandir : Barre du bas : Replace, Swap Order, View Skill Order, Preset, SP, Rotate View, Rotate" class="shot-btn" data-full="img/cp-UI_bottom.jpg" type="button"><img alt="Barre du bas : Replace, Swap Order, View Skill Order, Preset, SP, Rotate View, Rotate" loading="lazy" src="img/cp-UI_bottom.jpg"/></button><figcaption>Barre du bas : Replace, Swap Order, View Skill Order, Preset, SP, Rotate View, Rotate<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<ul>
<li><strong>Replace</strong> : change un perso avant le tour. Tu peux filtrer par élément, voir le recul de chacun, et ajouter un perso sur une case vide. <strong>Impossible à partir du tour 3</strong>, sauf dans la Tower of Salvation. Le bouton en forme de main ouvre l'<strong>emprunt</strong> : histoire (Normal, Hard, quêtes de PNJ), packs de persos et d'événements en Hard, combats d'événement, Hunting Grounds et Path of Adventure ; jamais deux fois le même perso dans l'équipe.</li>
<li><strong>Swap Order</strong> : change l'ordre d'action. Le mode <strong>Insert</strong> glisse un perso avant (en le tirant vers le haut) ou après (vers le bas) un autre ; le mode <strong>Replace</strong> échange deux persos. Un raccourci se trouve à droite des cartes.</li>
<li><strong>View Skill Order</strong> : affiche le Set Costume Order de toute l'équipe d'un coup, et permet de le modifier.</li>
<li><strong>Preset</strong> : 12 équipes enregistrées (persos, équipement, ordre, placement), plus tes équipes récentes dans le 2e onglet. Charger un preset retire l'équipement des autres persos qui le portaient.</li>
<li><strong>Barre de SP</strong> : points disponibles, points qui seront dépensés si tu lances le tour, et points que tu n'as pas.</li>
<li><strong>Rotate View</strong> : vue de dessus avec un fond neutre, tes persos à gauche et les ennemis à droite. Idéal pour distinguer des ennemis groupés. <strong>Rotate</strong> tourne simplement le terrain (pas avec les boss du Fiend Hunter ou du Guild Raid).</li>
</ul>
<h4>Set Costume Order</h4>
<p>Touche un perso <strong>avant le tour 1</strong>, puis « Set Costume Order » : tu as <strong>10 cases</strong> pour programmer ses actions (costumes, attaque de base, recul). Le programme passe avant tes choix manuels, respecte les SP et les temps de recharge, et <strong>tourne en boucle</strong> : Robin Hood Zenith et Poolside Guardian Zenith dans les deux premières cases alternent jusqu'à la fin. Très utile pour Mirror Wars et les combats répétés comme le Fiend Hunter.</p>
<h4>Retirer les protections ennemies</h4>
<ul>
<li><strong>Taunt</strong> et <strong>Counter</strong> se retirent avec un perso qui dissipe (Scheherazade, Yuri, Eleaneer), sauf si l'ennemi a une immunité.</li>
<li><strong>Evade</strong> annule toute l'attaque, effets compris : contourne-le avec l'<strong>auto-destruction</strong> (Wiggle, invocations de Morpeah).</li>
<li><strong>Energy Guard</strong> : dissipe-le, inflige des dégâts purs, ou frappe assez fort pour le casser.</li>
<li>Le <strong>Death Time</strong> n'existe ni dans le Fiend Hunter ni dans le Guild Raid ; dans le Golden Colosseum, il arrive à un tour fixé par les règles.</li>
</ul>
<h3 id="s8-7">La formule de dégâts, en résumé</h3>
<p>Les dégâts sont un produit de multiplicateurs indépendants. Comme ils se multiplient, mieux vaut répartir tes bonus sur plusieurs familles que d'empiler toujours la même :</p>
<div class="formula"><span class="fx-lhs">Dégâts</span><span class="fx-op">=</span><span class="fx-term">ATK</span><span class="fx-op">×</span><span class="fx-term">Compétence</span><span class="fx-op">×</span><span class="fx-term">Buffs ATK</span><span class="fx-op">×</span><span class="fx-term">Critique</span><span class="fx-op">×</span><span class="fx-term">Chains</span><span class="fx-op">×</span><span class="fx-term">Vulnérabilité</span><span class="fx-op">×</span><span class="fx-term">Élément</span><span class="fx-op">×</span><span class="fx-term">DEF ennemie</span><span class="fx-op">×</span><span class="fx-term">Point faible</span></div>
<ul>
<li>Le <strong>Support Bonus</strong> n'entre pas dans cette formule générale : il ne compte que dans Last Night (voir l'étape 9).</li>
<li>Le taux de critique au-delà de 100 % est converti en dégâts critiques (×6).</li>
<li>La « Pressure » de certains modes réduit les buffs de stats (ATK, <button class="term" data-tip="Chance / Dégâts critiques" type="button">Crit DMG</button>, élément, DEF), mais pas les Chains ni la Vulnérabilité.</li>
<li>Le bonus d'élément (Diana) est sa propre famille : il ne se dilue pas dans les buffs d'ATK.</li>
<li>
<p><strong>Dans une même famille, les buffs s'additionnent.</strong> Empiler beaucoup de buffs d'ATK rapporte moins qu'un seul buff d'ATK combiné à de la Vulnérabilité et quelques Chains.</p>
</li>
<li>
<p><strong>Relancer le même buff</strong> ne s'additionne pas : ça remet seulement sa durée à zéro. Deux buffs de sources différentes s'additionnent (Discord officiel).</p>
</li>
<li><strong>Exemple chiffré</strong> (Discord officiel) : même famille, Lathel (+160 %) et Arines (+70 %) donnent +230 %, soit <strong>×3,3</strong>. Familles différentes, Lathel (+160 % d'ATK) et Diana (+220 % d'élément) donnent 2,6 × 3,2 = <strong>×8,32</strong>, au lieu de ×4,8 s'ils s'additionnaient. (Le texte du bot écrit ×8,33 : le bon calcul donne ×8,32.)</li>
<li><strong>Élément</strong> (Discord officiel) : le désavantage enlève 50 % de dégâts d'élément. <span class="el el-light">Lumière</span> et <span class="el el-dark">Ténèbres</span> prennent <strong>+50 % l'un contre l'autre</strong>, sans réduction de part et d'autre. Les 4 buffers d'élément (Adventurer of the Unknown Diana, Magical Innovator Diana, Pure White Blessing Refithea, Poolside Fairy Refithea) ne servent qu'avec l'avantage.</li>
<li><strong>Plafonds de calcul</strong> : ATK et MATK à 100 000, PV à 50 000 (pour les effets basés sur les PV), taux de critique à 100 % (le surplus devient du Crit DMG), Chains à 100 (sauf Last Night). Le Discord officiel ajoute : Crit DMG à 10 000 % ; DEF et MRES à 90 %, appliqués <strong>après</strong> les debuffs (130 % de DEF − 50 % de debuff = 80 % utilisés : le surplus protège contre les debuffs) ; le plafond de 50 000 PV vaut pour toutes les compétences basées sur les PV (dégâts, recul, soins, Energy Guards). Exemple : Angelica frappe à 90 % des PV max, donc 90 % de 50 000 = 45 000, même contre un ennemi à 200 000 PV.</li>
</ul>
<p><strong>La formule complète (Discord officiel, novembre 2026, d'après la Tourist's Sheet).</strong></p>
<ul>
<li><strong>ATK affichée</strong> = (ATK de base + ATK fixe de l'équipement + ATK fixe du Potentiel) × (1 + ATK % de l'équipement + du Potentiel + de la collection).</li>
<li><strong>Dégâts</strong> = ATK × Compétence % × (1 + buffs d'ATK − debuffs d'ATK) × (1 + Crit DMG + buffs de Crit DMG) × (1 + Point faible) × (1 + 10 % × Chains) × (1 + Vulnérabilité + buffs « DMG Increase ») × (1 + dégâts d'élément + buff de saison + buffs d'élément) × (1 − (DEF + buffs de DEF − debuffs de DEF)) × (1 − réductions de dégâts) × (1 − résistance d'élément).</li>
<li>Le Crit DMG ne compte que sur un critique ; les dégâts fixes ne font jamais de critique. Le point faible n'existe que sur certaines parties des boss du Fiend Hunter et du Guild Raid.</li>
<li>Le buff de Beachside Angel Teresse est de la famille « DMG Increase ». Les dégâts fixes ne profitent pas de la Vulnérabilité, mais profitent du « DMG Increase ».</li>
<li>Les Chains comptent avant le coup (plafond 100, sans plafond dans Last Night). Les dégâts d'élément s'appliquent si la cible est d'un élément plus faible, la résistance d'élément si elle est plus forte.</li>
<li>La DEF de la cible reste entre 0 et 90 %. Les dégâts fixes et purs ignorent la DEF et les boucliers (« Shield », la famille des réductions de dégâts, comme chez Angelica).</li>
<li><strong>Compétences basées sur les PV</strong> : remplace l'ATK par les PV (plafond 50 000) et ignore la ligne des buffs d'ATK.</li>
</ul>

<section class="chapter" id="s9" data-title="Progression des persos"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V6"/><path d="M6 11l6-6 6 6"/><path d="M6 20h12"/></svg><b>09</b></span><h2>Progression des persos</h2></header><div class="ch-body">
<p>Au début, tes ressources sont rares : concentre-les sur les persos de ton équipe d'histoire et monte-les avec les slimes, les étoiles de rang et l'équipement. Le bouton "item location" en bas de la fiche d'un objet t'indique où le farmer.</p>
<h3 id="s9-1">Niveaux, slimes et ascension</h3>
<ul>
<li><strong>XP</strong> : tu en gagnes en survivant aux combats et en donnant des slimes à tes persos. Les slimes existent en jaune, bleu et rouge ; le rouge donne le plus d'XP.</li>
<li><strong>Ascension</strong> : tous les 20 niveaux, un perso doit monter de rang avec des étoiles de rang (rank-up stars). Chaque rang lui donne une étoile, et la rareté fixe le niveau maximum.</li>
<li><strong>Étoiles de rang 4</strong> : rares et non farmables. Garde-les pour tes persos 5★ (elles débloquent les niveaux 81 à 100).</li>
<li>
<p><strong>Slimes d'abord, or ensuite</strong> : farme les slimes tant que tes persos principaux ne sont pas au niveau maximum, puis passe à l'or, dont la fin de jeu consomme énormément.</p>
</li>
<li>
<p><strong>Combien d'XP ?</strong> (Discord officiel) Un slime jaune donne 200 XP, un bleu 700, un rouge 2 000. Monter un perso du niveau 1 à 100 demande environ <strong>1,5 million d'XP</strong> (849 jusqu'au niveau 20, 4 045 de 20 à 40, 219 757 de 40 à 60, 491 444 de 60 à 80, 788 715 de 80 à 100). Aucun slime n'est gaspillé : tous tes persos finiront au maximum, donc commence par tes DPS principaux.</p>
</li>
<li><strong>Sources</strong> : Slime Empire, et la boutique d'événement (slimes rouges seulement). Les autres boutiques n'en valent pas la peine. <strong>Étoiles de rang</strong> : Guide Pass, Season Pass et boutique d'événement ; les boutiques <button class="term" data-tip="Poudre d'espoir — Gagnée à chaque tirage ; boutique de points" type="button">Powder of Hope</button>, <button class="term" data-tip="Fil d'or — Gagné sur les doublons +5 ; boutique de points" type="button">Golden Thread</button> et Mirror Wars sont déconseillées pour ça.</li>
</ul>
<figure class="shot dc"><button aria-label="Agrandir : L'XP nécessaire par tranche de niveaux et l'XP de chaque slime (Tourist's Sheet)" class="shot-btn" data-full="img/dc-slime-xp.jpg" type="button"><img alt="L'XP nécessaire par tranche de niveaux et l'XP de chaque slime (Tourist's Sheet)" loading="lazy" src="img/dc-slime-xp.jpg"/></button><figcaption>L'XP nécessaire par tranche de niveaux et l'XP de chaque slime (Tourist's Sheet)<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h3 id="s9-2">Farmer sans effort : le Path of Adventure</h3>
<p>Ce pack s'ouvre après le troisième pack d'histoire. Les premières fois, bats-toi à la main : après 5 combats, un boss apparaît (Red Slime ou Goblin King selon la difficulté). Dès que tu l'as battu une fois dans une difficulté, tu débloques l'auto-battle pour cette difficulté, avec le riz cuit.</p>
<ul>
<li>Même principe pour les Hunting Grounds de chaque pack : battre le boss débloque l'auto-battle de la difficulté.</li>
<li>Le raccourci "parchemin" à gauche du menu de champ ouvre directement le Path of Adventure.</li>
<li>Termine "Very Hard" partout dès que tu peux, pour automatiser tes farms.</li>
</ul>
<h3 id="s9-3">Les capacités de terrain à monter</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Priorité</th>
<th>Capacité</th>
<th>Qui</th>
</tr>
</thead>
<tbody>
<tr>

<p>La capacité Steal rapporte peu : utilise ses tentatives une fois par semaine si tu as le temps (priorité basse).</p>
<p><strong>L'avis du Discord officiel (novembre 2026).</strong> Il classe <strong>Absorption</strong> et <strong>Assemble</strong> en priorité <strong>maximale</strong>, car ils rapportent les matériaux d'équipement ; le compendium les met en « confort ». Qui a quoi :</p>

<p><strong>Monter une capacité</strong> : ouvre la fiche du perso, touche l'icône de sa capacité, puis « Rank-up ».</p>

<h4>Les trouvailles de la semaine (Discord officiel, novembre 2026)</h4>
<ul>
<li>Lance toujours <strong>Search</strong> (Lathel ou Jayden) <strong>avant</strong> Absorption : ça ramasse toutes les lueurs bleues et vertes de la carte sans courir partout.</li>
<li><strong>Absorption</strong> (Liberta, Celia, Tyr) : chapitres 7, 8, 13, 16 et 17 pour les minerais ; 9 pour le bois ; 10 pour le cuir ; 15 pour le tissu ; Firechip pour les minerais et le bois.</li>
<li><strong>Assemble</strong> (Refithea, Granadair, Sonya) : chapitres 7, 8, 9, 10, 13, 15 et 16, plus Jayden's Gate.</li>
<li><strong>Routine de la semaine</strong> : Absorption sur les zones sûres et de combat des chapitres 7, 8, 9, 13, 17 et Firechip, le reste des tentatives sur le 10 ou le 15 ; Assemble une fois sur les zones de combat des chapitres 7, 8, 9, 10, 13, 15 et 16, et une fois sur Jayden's Gate.</li>
<li>À côté de la minicarte, un compteur montre les trouvailles et les monstres qui restent. Pour un tour complet, il existe une <a href="https://youtu.be/-lfjVngH4mw" target="_blank" rel="noopener">vidéo « Daily World Tour »</a> (ancienne, mais encore utile) et la <a href="https://browndust2-wiki.souseha.com/maps" target="_blank" rel="noopener">carte de Souseha</a>.</li>
</ul>
<figure class="shot dc"><button aria-label="Agrandir : Le compteur à côté de la minicarte : trouvailles et monstres restants" class="shot-btn" data-full="img/dc-sf-minimap.jpg" type="button"><img alt="Le compteur à côté de la minicarte : trouvailles et monstres restants" loading="lazy" src="img/dc-sf-minimap.jpg"/></button><figcaption>Le compteur à côté de la minicarte : trouvailles et monstres restants<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h3 id="s9-4">Autres sources de puissance</h3>
<ul>
<li><strong>Compétences</strong> : tire un doublon du costume pour monter la compétence jusqu'à +5 (plus de dégâts et souvent un temps de recharge réduit), pour un peu d'or.</li>
<li><strong>Potentiel</strong> : améliore-le avec les cristaux élémentaires de la Magic Crystal Cave, accessibles via le Path of Adventure et payés en torches. Choisis ton perso le plus utilisé et farme le cristal de son élément.</li>
<li>
<p><strong>Bonus de collection</strong> : chaque perso possédé donne un petit bonus à tous les autres ; certains trios de persos donnent un bonus plus fort.</p>
</li>
<li>
<p><strong>La puissance de combat</strong> (Discord officiel) : 10 par niveau du perso, 250 par costume possédé, 150 par niveau de costume, 10 par niveau d'Engraving, 200 pour l'Awakening, 10 par petit nœud blanc de Potentiel, 20 par nœud noir moyen (seulement si le perso est lié à ce costume), 100 par grand nœud, plus la puissance de chaque pièce d'équipement. Elle ne mesure <strong>pas</strong> ta vraie force : si tu bloques, regarde l'équipement, l'équipe ou les doublons.</p>
</li>
</ul>
<h3 id="s9-5">Bonding et Potentiel en détail (compendium)</h3>
<p><strong>Quel Bonding choisir ?</strong> Débutant : celui du costume qui a le plus de Potentiel débloqué. Ensuite :</p>
<ul>
<li>En <strong>contenu général</strong>, tu joues souvent hors élément avec les mêmes DPS : préfère un Bonding <strong>sans</strong> bonus de dégâts d'élément.</li>
<li>En <strong>contenu à élément</strong> (Fiend Hunter, Guild Raid), un Bonding avec bonus d'élément peut valoir le coup si le boss n'en donne pas déjà ; si le boss ou tes supports en donnent beaucoup, garde un Bonding « général ».</li>
<li>Pour un <strong>perso défensif ou un support</strong>, choisis selon le type de dégâts que tu subis.</li>
</ul>
<p><strong>Gagner du temps :</strong></p>
<ul>
<li><strong>Bulk Liberate</strong> débloque tout l'arbre d'un coup, ou tous les nœuds jusqu'à celui que tu as sélectionné.</li>
<li>Tu vois l'état du Potentiel d'un costume directement dans l'onglet Companion ou en combat, sans ouvrir l'arbre. L'onglet <strong>Growth Preview</strong> affiche l'effet de tous les nœuds d'un costume avec un interrupteur.</li>
</ul>
<figure class="shot cp"><button aria-label="Agrandir : Bulk Liberate : tout l'arbre en quelques touches" class="shot-btn" data-full="img/cp-bulk-liberate.jpg" type="button"><img alt="Bulk Liberate : tout l'arbre en quelques touches" loading="lazy" src="img/cp-bulk-liberate.jpg"/></button><figcaption>Bulk Liberate : tout l'arbre en quelques touches<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p><strong>Désactiver un Potentiel.</strong> Tu peux <strong>désactiver</strong> un grand nœud déjà débloqué (bouton Disable, une icône de cadenas apparaît), par exemple quand une <strong>Barrier</strong> gêne ton perso au lieu de l'aider. Ça ne marche pas dans la Tower of Salvation, Mirror Wars, Last Night et le Golden Colosseum.</p>
<figure class="shot cp"><button aria-label="Agrandir : Un Potentiel désactivé (icône de cadenas)" class="shot-btn" data-full="img/cp-lock-pots.jpg" type="button"><img alt="Un Potentiel désactivé (icône de cadenas)" loading="lazy" src="img/cp-lock-pots.jpg"/></button><figcaption>Un Potentiel désactivé (icône de cadenas)<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p><strong>Ordre des nœuds.</strong> Pour les buffers : réduction de SP et de temps de recharge d'abord, puis durée, zone et force du buff. Pour les DPS : d'abord le confort (SP, recharge, zone), les nœuds de dégâts seulement quand tes supports sont faits. Pour une liste détaillée, le compendium renvoie au <a href="http://cymmina.gamependium.com/browndust2/growth.html#potentials" target="_blank" rel="noopener">guide des Potentiels de Cymmina</a>.</p>
<h3 id="s9-6">Engraving et Awakening (Discord officiel, novembre 2026)</h3>
<p>L'Awakening donne des stats en plus, pour optimiser à fond. Il ne se fait qu'au <strong>niveau maximum</strong>.</p>
<ul>
<li>Éveille ton meilleur DPS, ou le DPS principal d'un élément. Pas les supports, ni les persos 3★ et 4★.</li>
<li>Coût maximum : 1 110 Engraving Scrolls, 300 Essences, 3,5 millions d'or et 200 Awakening Elixirs.</li>
<li><strong>Awakening Elixirs</strong> : guilde, récompenses de saison de la Tower of Salvation, Last Night chaque jour (Powder of Hope : pas pour un joueur gratuit).</li>
<li><strong>Essences</strong> : événements, guilde, Evil Castle (Powder of Hope et Golden Thread : pas pour un joueur gratuit).</li>
<li><strong>Engraving Scrolls</strong> : Evil Castle et guilde (la boutique d'événement est déconseillée pour ça).</li>
<li>Le Rapport d'un costume reste bloqué au niveau 10 sans Awakening (section 13), mais n'éveille pas un support juste pour ça.</li>
</ul>
<figure class="shot dc"><button aria-label="Agrandir : L'Awakening d'un costume et ses stats en plus" class="shot-btn" data-full="img/dc-awakening.jpg" type="button"><img alt="L'Awakening d'un costume et ses stats en plus" loading="lazy" src="img/dc-awakening.jpg"/></button><figcaption>L'Awakening d'un costume et ses stats en plus<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h3 id="s9-7">Modes Hard et Very Hard</h3>
<p>Parle à Elin dans la zone sûre d'un pack, une fois sa quête principale finie. N'en lance qu'un à la fois : tant que tu n'as pas fini sa quête, tu ne peux plus faire les quêtes quotidiennes de ce chapitre.</p>
<h3 id="s9-8">Le Burst</h3>
<p>Le Burst permet de payer plus de SP pour renforcer une compétence. Chaque costume a 3 niveaux à débloquer dans l'ordre, et leurs effets (comme leurs coûts en SP) s'additionnent.</p>
<ul>
<li><strong>Coût pour un costume ★5</strong> : 60 <strong>Sparks of Rampage</strong> + 1,5 million d'or par niveau, soit 180 Sparks et 4,5 millions d'or au total.</li>
<li><strong>Sources de Sparks</strong> : boutiques d'événement, Golden Thread, Powder of Hope, Refinement Remnants, Mirror Wars, guilde, Golden Colosseum et Taros Tactical Manual. Compte environ 530 à 585 Sparks par mois, soit à peu près 3 costumes.</li>
<li><strong>Conseil</strong> : c'est très cher pour un débutant. Accumule les Sparks sans les rater, mais investis peu au début, et plutôt sur les supports. Priorité la plus haute selon l'auteur : Diana (Adventurer of the Unknown) Bursts 1-3, B-Rank Idol Helena 1-3, Homunculus Lathel 1, Onsen Manager Liberta 1-3, Medical Club Teresse 3.</li>
<li>En combat, choisis le niveau de Burst avec la petite flèche sur la compétence, ou active l'<strong>Auto Burst</strong> (moins prioritaire que l'activation des costumes).</li>
</ul>
<figure class="shot cp"><button aria-label="Agrandir : Le menu du Burst d'un costume" class="shot-btn" data-full="img/cp-burst-menu.jpg" type="button"><img alt="Le menu du Burst d'un costume" loading="lazy" src="img/cp-burst-menu.jpg"/></button><figcaption>Le menu du Burst d'un costume<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p class="callout info"><span class="co-tag">Compendium</span><strong>Compléments du compendium :</strong></p>
<ul>
<li><strong>Repérer un Burst actif</strong> : la carte de compétence prend une bordure bleu clair, le surcoût en SP s'affiche en orange et les effets du Burst sont surlignés. Dans la collection, les 3 flammes sous l'icône du Potentiel montrent les Bursts débloqués.</li>
<li><strong>Modes à part</strong> : dans <strong>Last Night</strong>, le Burst maximal débloqué part tout seul, sans coût. Dans le <strong>Golden Colosseum</strong>, il dépend de tes SP (avec des SP infinis, il part comme dans Last Night ; sinon, après que tous les costumes ont agi). L'<strong>Auto Battle</strong> active l'Auto Burst.</li>
<li><strong>Costumes de collaboration</strong> : ils utilisent des <strong>Sparks of the Otherworld</strong> (60 par niveau et seulement 50 000 d'or), disponibles en quantité limitée pendant la collaboration, assez pour tous les costumes mis en avant.</li>
<li><strong>Priorité haute</strong>, juste après la liste ci-dessus : Descendant of the Great Witch Celia (Burst 1), Heavenly Guardian Successor Glacia (1-3), Sunny Inn Hand Helena (1-2), Eternal Chains Kyouka Uzen (1), Homunculus Lathel (2-3), Miracle Marine Mamonir (1-3), Apostle Morpeah (1), Unraveling Mummy Nekyndalia (1), New Hire Seir (1-2), Medical Club Teresse (1-2).</li>
<li>Quand les Bursts 2-3 d'un costume sont mieux classés que son Burst 1, c'est que le Burst 1 seul apporte peu : garde tes Sparks et débloque-les ensemble. Le reste de la liste (priorités moyenne, basse et à éviter) est sur la <a href="https://botan14xd.github.io/BD2-Overview/progression/burst/" target="_blank" rel="noopener">page Burst du compendium</a>.</li>
</ul>
</div></section>
<section class="chapter" id="s10" data-title="L&#x27;équipement"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg><b>10</b></span><h2>L'équipement</h2></header><div class="ch-body">
<p>L'équipement change énormément la puissance de ton équipe : monte la capacité de fabrication (Gear Craft) et l'alchimie dès le début, puis garde tes meilleures pièces pour la fin de jeu. Chaque perso porte 5 pièces : arme, tête, corps, accessoire et gants.</p>
<h3 id="s10-1">Obtenir de l'équipement</h3>
<ul>
<li><strong>Fabrication</strong> : via Layla ou Fred, qui ont la même capacité depuis le patch de décembre 2023. Monte l'un des deux, pas les deux. Les matériaux de rang R et plus demandent l'alchimie de Scheherazade.</li>
<li><strong>Bannière d'armes</strong> : équipement exclusif d'un perso, équivalent à une pièce UR IV avec une statistique exclusive en plus. Utile, jamais indispensable : tu peux finir presque tout le contenu avec de l'UR normal.</li>
<li><strong>Équipement d'événement</strong> : vaut le coup, car il progresse toujours avec un raffinage SSS ; il dépasse généralement l'UR III.</li>
</ul>
<h3 id="s10-2">Lire une pièce</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Élément</th>
<th>Valeurs</th>
<th>Remarque</th>
</tr>
</thead>
<tbody>
<tr>
<td>Rareté</td>
<td>N, R, SR, UR</td>
<td>Du plus faible au plus fort</td>
</tr>
<tr>
<td>Palier</td>
<td>I, II, III, IV, EX</td>
<td>EX = exclusif de la bannière</td>
</tr>
<tr>
<td>Niveau</td>
<td>+0 à +9</td>
<td>Chaque niveau augmente les stats ; plus la pièce est rare, plus l'échec est fréquent</td>
</tr>
<tr>
<td>Statistiques</td>
<td>1 ou 2 stats de base + 3 sous-stats</td>
<td>Les sous-stats se débloquent à +3, +6 et +9</td>
</tr>
</tbody>
</table></div>
<p>L'équipement physique (ATK, DEF) ne peut pas avoir de sous-stat magique, et l'inverse. L'accessoire est neutre.</p>
<p><strong>Offensif ou défensif ?</strong> Pour la plupart des persos, l'<strong>arme</strong>, l'<strong>accessoire</strong> et les <strong>gants</strong> sont l'équipement <strong>offensif</strong> ; l'<strong>armure</strong> et le <strong>casque</strong>, le <strong>défensif</strong>. Au début, monte l'offensif en priorité : pour l'histoire, une équipe « canon de verre » qui efface tout au tour 1 suffit.</p>
<p><strong>Reconnaître le palier aux étoiles.</strong> Sous la pièce : aucune étoile argentée = I, une = II, deux = III, trois = IV, <strong>une étoile dorée</strong> = exclusif. L'équipement d'événement n'a pas de chiffre mais compte comme un palier III, et l'exclusif comme un palier IV. Évite de jouer avec du I ou du II ; le III convient si tu n'y investis pas trop.</p>
<figure class="shot cp"><button aria-label="Agrandir : Le palier se lit au chiffre romain ou aux étoiles" class="shot-btn" data-full="img/cp-gear_tiers.jpg" type="button"><img alt="Le palier se lit au chiffre romain ou aux étoiles" loading="lazy" src="img/cp-gear_tiers.jpg"/></button><figcaption>Le palier se lit au chiffre romain ou aux étoiles<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p><strong>Les stats de base.</strong> Les pièces N ont 1 stat de base, les UR en ont 2, fixes. Les R et SR ont 2 stats de base dont la seconde se relance dans le menu de raffinage. L'exclusif a 2 stats de base : la première s'échange gratuitement entre deux choix, la seconde se relance. Le <strong>?</strong> du menu de raffinage liste toutes les stats possibles d'une pièce.</p>
<p>Le Discord officiel détaille les stats de base possibles par emplacement (hors UR fabriqué) : arme, ATK ou MATK puis <button class="term" data-tip="Chance / Dégâts critiques" type="button">Crit DMG</button>, ATK/MATK ou ATK %/MATK % ; casque et armure, DEF ou MRES puis PV, PV % ou DEF/MRES ; accessoire, taux ou dégâts critiques puis PV, PV % ou critique ; gants, ATK % ou MATK % puis taux de critique, ATK/MATK ou ATK %/MATK %.</p>
<figure class="shot dc"><button aria-label="Agrandir : Les stats de base possibles pour chaque emplacement (novembre 2026)" class="shot-btn" data-full="img/dc-rbstat.jpg" type="button"><img alt="Les stats de base possibles pour chaque emplacement (novembre 2026)" loading="lazy" src="img/dc-rbstat.jpg"/></button><figcaption>Les stats de base possibles pour chaque emplacement (novembre 2026)<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<p><strong>Améliorer sans stress.</strong> Un échec d'amélioration ne coûte que l'or, sans perte de niveau. Pour aller vite : <strong>Repeat</strong>, curseur au maximum (MAX), <strong>Upgrade</strong>, puis <strong>Skip</strong>. Même chose pour le raffinage, en activant « <strong>Ends once refining succeeds</strong> » pour ne pas gaspiller de poudre.</p>
<p><strong>Les options (sous-stats).</strong> Les pierres de raffinage servent pour les pièces N et R ; pour les SR et UR, les pierres sont utilisées en premier, puis les cristaux (<strong>10 pierres = 1 cristal</strong>).</p>
<h3 id="s10-3">Le score de raffinage</h3>
<p>Une fois la pièce à +9, une <strong>étoile avec un nombre</strong> apparaît : c'est son <strong>score de raffinage</strong>, de <strong>6 à 24</strong>. Plus il est haut, plus la stat principale grimpe. La couleur de l'étoile change selon la tranche (6 à 11, 12 à 16, 17 à 20, 21 à 24). Touche le <strong>?</strong> à côté de « Gear Score » pour voir les stats de la pièce à chaque score.</p>
<p>Le raffinage relance le score avec de l'or et de la <button class="term" data-tip="Poudre / Cristal / Pierre de raffinage — Monter le score de raffinage (poudre) et relancer les options (pierres, cristaux)" type="button">Refining Powder</button>, et <strong>garde toujours le meilleur résultat</strong> : une pièce ne peut jamais redescendre. Plus le score est haut, plus il est rare, surtout après 18. Vise <strong>18</strong> puis arrête-toi : au-delà, les chances sont très faibles et le coût explose.</p>
<p class="callout info"><span class="co-tag">Compendium</span><strong>L'ancien affichage en lettres.</strong> Les vieux guides et les captures du Discord parlent de trois lettres (C, B, A, S). Le score en est la traduction : C = 1, B = 2, A = 3, S = 4, la 2e lettre compte double et la 3e triple. BBS = 2 + 4 + 12 = <strong>18</strong>, SSS = <strong>24</strong>.</p>
<figure class="shot cp"><button aria-label="Agrandir : Le score de raffinage et l'aperçu des stats par score" class="shot-btn" data-full="img/cp-gear-score-stats-preview.jpg" type="button"><img alt="Le score de raffinage et l'aperçu des stats par score" loading="lazy" src="img/cp-gear-score-stats-preview.jpg"/></button><figcaption>Le score de raffinage et l'aperçu des stats par score<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p>Selon le Discord officiel, le score <strong>18</strong> se vise seulement sur de l'<strong>UR IV</strong> ou de l'<strong>UR EX</strong> ; pour le reste, contente-toi de moins. L'<a href="https://browndust2-wiki.souseha.com/en/refinement-tool" target="_blank" rel="noopener">outil de raffinage de Souseha</a> estime la poudre nécessaire pour chaque score (touche le « % »).</p>
<figure class="shot dc"><button aria-label="Agrandir : Les chances d'obtenir chaque score de raffinage (ancien affichage en lettres ; le jeu montre maintenant le score)" class="shot-btn" data-full="img/dc-bbs-proba.jpg" type="button"><img alt="Les chances d'obtenir chaque score de raffinage (ancien affichage en lettres ; le jeu montre maintenant le score)" loading="lazy" src="img/dc-bbs-proba.jpg"/></button><figcaption>Les chances d'obtenir chaque score de raffinage (ancien affichage en lettres ; le jeu montre maintenant le score)<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h3 id="s10-4">Gestion au quotidien</h3>
<ul>
<li><strong>Fabrique</strong> des pièces UR si tu as assez de Cristaux anciens. Sinon, fabrique les <strong>R</strong> qui te manquent pour compléter la collection (bonus de collection) ; <strong>pas de SR</strong> tant que tu n'as pas assez d'UR IV (Discord officiel).</li>
<li><strong>Démonte</strong> les pièces de bas niveau : elles donnent de la poudre de raffinage.</li>
<li><strong>Améliore</strong> tes pièces de haut niveau, même celles qui ne sont pas les meilleures : le mode Last Night exige que tous tes persos soient équipés.</li>
<li><strong>Raffine</strong> uniquement tes meilleures pièces. Ne raffine pas trop tôt : tu remplaceras ton équipement dès que ta capacité de fabrication montera d'un cran.</li>
<li>Ne dépense pas tes tickets d'équipement sans raison : les taux d'UR 5★ sont faibles et le résultat est aléatoire.</li>
<li><strong>Upgrade Settings</strong>, dans le menu de fabrication, améliore et/ou démonte automatiquement ce que tu fabriques : idéal pour transformer des pièces N en Refining Powder.</li>
<li>Quand il te manque un matériau, un bouton avec un coût en Ability Pills peut apparaître dessous : ce n'est pas un achat, c'est <strong>l'alchimie faite pour toi</strong> (elle consomme quand même les matériaux nécessaires).</li>
<li>
<p>Dans le <strong>Sac</strong>, l'onglet équipement propose des <strong>marques personnalisées</strong> (icône, chiffre et couleur pour repérer tes pièces), des <strong>filtres</strong> (emplacement, catégorie, rareté, palier, niveau, score, stat) et des <strong>tris</strong>. La fonction « Compare » est peu utile.</p>
</li>
<li>
<p><strong>Quand démonter tes UR</strong> (Discord officiel) : au début, garde <strong>tous</strong> tes UR, ils comptent pour le Support Bonus de Last Night. Quand tu as assez d'UR II, démonte les UR I fabricables ; quand tu as assez d'UR III, démonte les UR II. À la fin, tu ne gardes que les III et IV. Monte-les à +7 avant (+6 à +8 selon ton or). L'EX et l'UR IV fabriqué se verrouillent tout seuls.</p>
</li>
<li><strong>Farmer la poudre</strong> (Discord officiel) : fabrique des pièces N à 3 de coût (Mercenary Sword, Armor, Staff et Robe ; Mercenary Circlet et Necklace si tu n'as plus de fer ni de bois). Dans Upgrade Setting : niveau cible <strong>7</strong>, <strong>2 000</strong> pièces, <strong>Auto Dismantle</strong> activé. Résultat : environ 20 000 de poudre pour environ 580 000 d'or. Le jeu indique qu'il traite les pièces par lots de 1 000 : 2 000 pièces font donc sans doute 2 lots (<a class="verify" href="#a-verifier">à vérifier en jeu</a>). <strong>Pas pour les débutants</strong> : garde ton bois pour l'UR IV.</li>
<li><strong>Farmer les Refining Crystals</strong> : le Hero's Circlet SR (sans minerai ni bois) en donne au démontage, mais c'est très cher. Seulement si tu en manques vraiment.</li>
</ul>

<h3 id="s10-5">Équipement d'événement et équipement exclusif</h3>
<ul>
<li><strong>Événement (Fiend)</strong> : UR III ou SR III, amélioré avec son matériau propre (3 par niveau pour l'UR, soit 27 ; 1 par niveau pour le SR, soit 9), <strong>sans or et sans échec</strong>, et directement au score <strong>24</strong>. N'achète jamais la version SR. Les pièces UR restent intéressantes jusqu'en fin de jeu, car elles dépassent l'UR III fabriqué pour le Support Bonus de Last Night.</li>
<li><strong>Exclusif (EX)</strong> : uniquement au gacha, une seule pièce par perso, et seulement pour lui. Il équivaut à un palier IV avec une <strong>stat exclusive en plus</strong>. Un SR exclusif vaut environ un UR III fabriqué ; un UR exclusif donne <strong>10 à 20 % de dégâts en plus</strong> qu'un UR IV fabriqué.</li>
<li><strong>Doublon d'exclusif</strong> : pour un perso 5★, garde-en un de côté pour un second build et démonte le reste ; pour un 3★ ou 4★, et pour tout exclusif SR, démonte.</li>
</ul>
<h3 id="s10-6">Ordre de fabrication complet (compendium)</h3>
<ol>
<li>Utilise le code <strong>WAITING4LEGEND</strong> pour un <strong>Venomous Touch</strong> UR III.</li>
<li>Fabrique du N ou du R pour monter la capacité de fabrication au rang <strong>Legendary</strong>.</li>
<li>Fabrique une arme et des gants <strong>UR III</strong> pour ton DPS principal :<ul>
<li>Arme : <strong>Evil Dragon's Blade</strong> (physique) ou <strong>Travel God's Friend</strong> (magique). Elles sont un peu meilleures au début, puis dépassées par <strong>Peerless Javelin</strong> / <strong>Demon's Forbidden Book</strong> ou <strong>Hammer of Thunder</strong> / <strong>Eye of the Destroyer</strong>.</li>
<li>Gants : <strong>God-King's Silver Arm</strong> ou <strong>Prime Authority</strong> (physique), <strong>Shackle of Treachery</strong> ou <strong>Dragon Scales Protection</strong> (magique). God-King's Silver Arm et Shackle of Treachery sont meilleurs pour débuter ; tu utiliseras les deux familles un jour.</li>
</ul>
</li>
<li>Même chose pour ton deuxième DPS, avec un <strong>Venomous Touch</strong> UR III.</li>
<li>Passe à un ou deux sets offensifs <strong>UR IV</strong>, en commençant par le Venomous Touch.</li>
<li>Fabrique 2 armures et 2 casques <strong>UR III</strong> selon l'ennemi : <strong>Invulnerable Armor + Helm of Carnage</strong> contre les dégâts physiques, <strong>Fiend Guard + Radiant Wisdom</strong> contre les dégâts magiques.</li>
<li>Fabrique de l'UR IV de l'<strong>autre type de dégâts</strong> pour une deuxième équipe.</li>
<li>Ensuite, selon tes besoins. Priorité générale : <strong>accessoire</strong> (Venomous Touch) &gt; <strong>gants</strong> &gt; <strong>arme</strong> &gt; <strong>armure</strong>. Plus tard, les armes comptent moins (remplacées par les exclusifs), alors qu'il te faudra beaucoup d'armures et de casques pour les 3 équipes du Fiend Hunter.</li>
</ol>
<p><strong>L'avis du Discord officiel (novembre 2026).</strong> Pas de fabrication de SR. Fabrique les UR une pièce à la fois ; après 2 pièces IV d'un type, passe à un autre type (il en faudra au moins 4 un jour). Classement : UR EX &gt; UR IV &gt; UR d'événement &gt; UR III ≈ SR EX. Il met l'armure <strong>après</strong> l'offensif des deux équipes (le compendium la place à l'étape 6), et vise seulement <strong>ATK/MATK et Crit DMG</strong> en options, sans taux de critique (les buffers de critique et la critique garantie du Fiend Hunter et du Guild Raid s'en chargent ; le compendium garde le taux de critique pour équilibrer).</p>
<h3 id="s10-7">Équiper chaque type de perso (compendium)</h3>
<ul>
<li><strong>DPS standard (ATK ou MATK)</strong> (Nebris, Olivier, Blade) : arme + Venomous Touch + gants (Prime Authority, God-King's Silver Arm, Dragon Scales Protection ou Shackle of Treachery). Evil Dragon's Blade et Travel God's Friend sont meilleures avec peu de critique en surplus.</li>
<li><strong>DPS à dégâts fixes</strong> (Justia, Alec) : peu rentables. Peerless Javelin + Prime Authority, ou Demon's Forbidden Book + Dragon Scales Protection ; accessoire Ring of the Lake ou Charming Gaze. Pas de Crit DMG (pas de critique possible).</li>
<li><strong>DPS basé sur ses PV</strong> (Boo Ghost Granhildr, Mamonir) : Immortal Golden Armor + Helm of Death + Charming Gaze (contre du physique), ou Hellfire Robe + Crown of Galaxy + Charming Gaze (contre du magique). Gants Ring of Fury ou Rebellion.</li>
<li><strong>DPS basé sur les PV ennemis</strong> (Angelica, Nature's Claw Rou) : Evil Dragon's Blade ou Travel God's Friend + Venomous Touch ; gants Ring of Fury ou Rebellion. Seuls le Crit DMG et le taux de critique comptent.</li>
<li><strong>Support qui dépend de ses stats</strong> (Anti-Dystopia Diana (MATK), Red Riding Hood Rou (PV)) : pour Diana, Demon's Forbidden Book + Dragon Scales Protection ; pour Rou, les sets de PV ci-dessus + Charming Gaze.</li>
<li><strong>Autres supports</strong> (Liberta, Refithea, Helena) : comme un DPS standard, avec des pièces moins bonnes : leur rôle est surtout de survivre.</li>
</ul>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong> Pas de sets PvP quand tu débutes. Evil Dragon's Blade (physique) et Travel God's Friend (magique) remplacent bien une arme exclusive ; exception : Loen préfère Demon's Forbidden Book (grâce au Crit DMG de son Bonding). Les <a href="https://dotgg.gg/brown-dust-2/character-guides/" target="_blank" rel="noopener">guides de persos de dotgg</a> donnent un build par costume.</p>
<figure class="shot dc"><button aria-label="Agrandir : Exemple de build pour Eclipse : 7 options MATK % et 8 Crit DMG au score 18 ; Bonding Beach Vacation" class="shot-btn" data-full="img/dc-build-eclipse.jpg" type="button"><img alt="Exemple de build pour Eclipse : 7 options MATK % et 8 Crit DMG au score 18 ; Bonding Beach Vacation" loading="lazy" src="img/dc-build-eclipse.jpg"/></button><figcaption>Exemple de build pour Eclipse : 7 options MATK % et 8 Crit DMG au score 18 ; Bonding Beach Vacation<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<p><strong>Armure et casque selon l'ennemi</strong> : Invulnerable Armor + Helm of Carnage contre le physique, Fiend Guard + Radiant Wisdom contre le magique, Immortal Golden Armor + Helm of Death ou Hellfire Robe + Crown of Galaxy contre les dégâts fixes, purs ou consommés.</p>
<p><strong>Options à viser</strong> : DPS standard, ATK/MATK puis Crit DMG ou taux de critique pour équilibrer ; dégâts fixes, ATK/MATK uniquement ; DPS sur PV, PV puis critique ; DPS sur PV ennemis, uniquement du critique ; supports à stats, la stat dont ils dépendent ; autres supports, n'importe quoi. Garde deux types d'armures : une chargée en ATK/MATK, une autre en critique. Repère simple : ATK/MATK sur l'arme et les gants, puis ATK/MATK ou critique sur le reste.</p>
<p><strong>Pour débuter (Discord officiel).</strong> Mets de l'équipement <strong>MRES</strong> sur tes persos magiques et <strong>DEF</strong> sur tes physiques : la MRES ne peut pas avoir d'option ATK, la DEF pas d'option MATK. Plus tard, garde des pièces à triple Crit DMG pour changer selon le contenu. Stat principale plate ou en % : la plate vaut mieux pour une ATK de base faible, et la plupart des joueurs prennent des gants à stat plate ; les options plates ne sont presque jamais optimales. God-King's Silver Arm et Shackle of Treachery passent en premier pour le bonus de collection. Exception : Anastasia se booste elle-même en Crit DMG, donc vise plus d'ATK. Si tes stats sont basses, vérifie ton bonus de collection.</p>
<figure class="shot dc"><button aria-label="Agrandir : Modèles débutant : équipement Rare IV +9 pour un DPS magique et un DPS physique" class="shot-btn" data-full="img/dc-ngear-modeles.jpg" type="button"><img alt="Modèles débutant : équipement Rare IV +9 pour un DPS magique et un DPS physique" loading="lazy" src="img/dc-ngear-modeles.jpg"/></button><figcaption>Modèles débutant : équipement Rare IV +9 pour un DPS magique et un DPS physique<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h3 id="s10-8">Le calculateur d'options de Souseha</h3>
<p>Pour trouver les options idéales d'un perso, le <a href="https://browndust2-wiki.souseha.com/en/option-calculator" target="_blank" rel="noopener">calculateur de Souseha</a> fait le calcul :</p>
<ol>
<li>Choisis le perso.</li>
<li>Fixe certaines pièces si tu veux.</li>
<li>Change la rareté si besoin.</li>
<li>Ajoute les buffs extérieurs (Crit DMG, dégâts d'élément).</li>
<li>Lance « Auto Calculate ».</li>
</ol>
<p>Le tableau classe les builds par dégâts avec avantage d'élément, avec l'équipement, le Bonding et le nombre de sous-stats de chaque type. Les « dégâts » affichés servent à comparer, ce ne sont pas tes vrais dégâts en jeu.</p>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong> Exemple pour le Guild Raid : ajoute 125 % de Crit DMG (Refithea) et 320 % d'élément (Diana et Refithea), lance Auto Calculate, puis regarde l'onglet Overview : le meilleur build est en vert. Seuls le raffinage, les dégâts d'élément et les buffs de Crit DMG changent le build idéal ; les buffs d'ATK ou de MATK n'y changent rien. Selon le Discord, ne mets pas Refithea et Diana dans la même équipe du Fiend Hunter.</p>
<figure class="shot dc"><button aria-label="Agrandir : Le calculateur : la vue Overview, le meilleur build en vert" class="shot-btn" data-full="img/dc-gcalc.jpg" type="button"><img alt="Le calculateur : la vue Overview, le meilleur build en vert" loading="lazy" src="img/dc-gcalc.jpg"/></button><figcaption>Le calculateur : la vue Overview, le meilleur build en vert<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h3 id="s10-9">Où farmer les matériaux</h3>
<ul>
<li><strong>Refining Powder</strong> : événements, boutique d'événement, démontage (surtout des pièces N). Le <a href="https://browndust2-wiki.souseha.com/en/powder-calculator" target="_blank" rel="noopener">calculateur de poudre de Souseha</a> indique la méthode la plus rentable.</li>
<li><strong>Refining Crystals</strong> : boutique d'événement, boutique du Golden Colosseum, Tower of Salvation (niveaux 8 à 10 et récompenses de saison), Towers of Wrath et of Jealousy (tous les 5 étages), Fiend Hunter (classement), démontage de SR et UR. La boutique Mirror Wars en vend aussi, mais le Discord officiel la déconseille pour ça.</li>
<li><strong>Ancient Crystals</strong> : événements et leur boutique, boutique du Golden Colosseum, Towers of Salvation et of Pride, Last Night.</li>
<li><strong>Gold Ore</strong> et <strong>Hardwood</strong> : Hunting Grounds, Absorption sur la carte, événements.</li>
</ul>
<h3 id="s10-10">Viser des stats pour un DPS (repères du compendium)</h3>
<p>Ce ne sont pas des seuils stricts, juste des repères pour un DPS « correct » : au début, <strong>2 200+ d'ATK ou MATK et 550 %+ de Crit DMG</strong> ; plus tard, <strong>3 000+ et 450 %+</strong>. Le Discord officiel donne <strong>2 000+ et 600 %+</strong> pour un débutant. Pour un calcul précis des options idéales, utilise le <a href="https://browndust2-wiki.souseha.com/en/option-calculator" target="_blank" rel="noopener">calculateur d'options de Souseha</a>.</p>
</div></section>

<h3 id="s11-1">Énergies quotidiennes</h3>
<ul>
<li><strong>Riz cuit</strong> : 90 par jour (confirmé sur le Discord officiel, novembre 2026). Dépense-le en Path of Adventure sur l'or ou les slimes, selon le bonus du jour de la semaine.</li>
<li><strong>Torches</strong> : 60 par jour. Elles servent à la Magic Crystal Cave (cristaux élémentaires).</li>
<li><strong>Cocktails de sang</strong> : se rechargent chaque jour ; ils servent au PvP Mirror Wars.</li>
</ul>
<h3 id="s11-2">Boutique de Fils d'or : ordre de priorité</h3>
<ol>
<li><button class="term" data-tip="Un doublon au choix pour un costume non limité" type="button">Costume Selective Enhancement</button> (unidupe) : un doublon d'un costume 5★ non limité de ton choix.</li>
<li>55 Sparks of Rampage.</li>
<li>Le costume 5★ mis en avant, s'il t'intéresse.</li>
<li>Ensuite : tickets de tirage (surtout au début) et Larmes de la déesse (surtout en fin de jeu).</li>
</ol>
<p>Évite le reste : acheter des Cristaux anciens ou des tickets d'équipement n'est pas rentable.</p>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong> Un doublon d'un costume déjà à +5 donne <strong>2</strong> Golden Threads pour un ★3, <strong>20</strong> pour un ★4 et <strong>300</strong> pour un ★5. Chaque mois, choisis le Costume Selective Enhancement <strong>ou</strong> le costume en rotation s'il est vraiment bon. Prends toujours les Sparks (leur quantité est limitée dans le temps). La Tear passe en dernier : seulement si tu as de quoi payer le choix du mois suivant, ou si tu dépenses de l'argent.</p>
<h3 id="s11-3">Matériaux de fabrication à farmer</h3>
<p>Seuls l'or, le cuivre et le bois manquent vite ; cuir, tissu, tourbe et fer sont abondants.</p>
<ul>
<li><strong>Or et cuivre</strong> : Hunting Grounds, autel des hommes-lézards (Lizardman Altar) en Very Hard, ou la capacité Search de Lathel avec l'Absorption de Celia aux chapitres 8 et 13 (le chapitre 3 au début).</li>
<li>
<p><strong>Bois</strong> : Hunting Grounds, abri du gardien de la montagne (Mountain Keeper's Shelter), ou le chapitre 9.</p>
</li>
<li>
<p><strong>Coffres</strong> : ouvre ceux du Sac, gagnés avec le passe et les missions quotidiennes (Discord officiel).</p>
</li>
<li><strong>Alchimie</strong> : elle peut convertir tes matériaux, mais c'est déconseillé (trop de pilules). Ne convertis jamais le fer en or : il sert à farmer la poudre.</li>
</ul>
<h3 id="s11-4">Gagner de l'or (Discord officiel, novembre 2026)</h3>
<ul>
<li><strong>Goblin Ruins</strong>, surtout le jour de bonus.</li>
<li><strong>Boutique d'événement</strong> : 1 million d'or.</li>
<li>Les <strong>Gluttis</strong> sur la carte, Last Night et le Dispatch.</li>

<section class="chapter" id="s12" data-title="Le gacha : bannières et dépenses"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg><b>12</b></span><h2>Le gacha : bannières et dépenses</h2></header><div class="ch-body">
<p>Le gacha ne sert qu'à deux choses : les costumes et l'équipement exclusif. Un tirage coûte environ 200 dias et tu peux t'en passer longtemps grâce aux tickets gratuits. Certains détails ci-dessous viennent de guides de 2023 et 2024 : confirme-les sur l'écran de la bannière.</p>
<h3 id="s12-1">Les bannières</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Bannière</th>
<th>Contenu</th>
<th>Conseil</th>
</tr>
</thead>
<tbody>
<tr>
<td>Integrated Draw</td>
<td>Bannière standard : costumes et équipement</td>
<td>Le Tirage infini du début y puise</td>
</tr>
<tr>
<td>Featured (mise en avant)</td>
<td>Un costume ou un équipement vedette, avec taux augmenté</td>
<td>La meilleure valeur ; 1 tirage gratuit par jour</td>
</tr>
<tr>
<td>Select / 12-Pick (sélection)</td>
<td>Tu choisis plusieurs costumes ciblés</td>
<td>La meilleure option pour un débutant selon le compendium : mets-y des supports (liste plus bas, dans cette section)</td>
</tr>
<tr>
<td>Bannière d'armes</td>
<td>Équipement exclusif seulement</td>
<td>Moins rentable que les costumes ; risque de doublons inutiles</td>
</tr>
</tbody>
</table></div>
<p>Les taux de base cités par un guide de 2023 sont de 3 % pour un 5★, 14 % pour un 4★ et 83 % pour un 3★.</p>
<h3 id="s12-2">Ce qu'il faut savoir</h3>
<ul>
<li><strong>Costume = perso.</strong> Tirer un costume d'un perso que tu n'as pas te donne le perso.</li>
<li><strong>Doublons.</strong> Chaque doublon monte la compétence du costume, jusqu'à +5. Au-delà de +5, un doublon se transforme en Fil d'or.</li>
<li><strong>Bonus de bannière.</strong> Quand tu obtiens le costume vedette sur sa bannière, tu récupères 10 tickets via l'événement "Pickup" ; ce n'est pas le cas sur la bannière Select.</li>
<li><strong>Points de tirage.</strong> Sur les bannières limitées, tes tirages accumulent des points, échangeables contre le costume vedette (200 points d'après un guide de 2023). Ils ne se partagent pas entre bannières et se convertissent en Poudre d'espoir à la fin.</li>
</ul>
<h3 id="s12-3">Comment dépenser</h3>
<ol>
<li>Fais chaque jour ton tirage gratuit.</li>
<li>Garde 1000 dias en permanence pour le passe premium de la saison suivante.</li>
<li>Ne tire que pour un perso ou un costume que tu veux vraiment, de préférence sur sa bannière vedette.</li>
<li>Vise d'abord des costumes de soutien ou de dégâts qui s'intègrent à ton équipe actuelle, plutôt que de les empiler au hasard.</li>
</ol>
<h3 id="s12-4">Le gacha en détail</h3>
<ul>
<li><strong>Coût</strong> : 1 <button class="term" data-tip="Ticket de tirage normal" type="button">Draw Ticket</button> ou 200 Dia gratuits par tirage, 2 000 Dia pour 10. Ordre de consommation : Selective Exclusive Draw Ticket, puis Draw Ticket, puis Dia gratuits, puis Dia payants.</li>
<li><strong>Taux</strong> : 3 % de ★5 sur une bannière de costume, dont 1,5 % pour le costume vedette. Les taux ne montent jamais progressivement.</li>
<li><strong>Garantie à 100 tirages</strong> : sans ★5 pendant 100 tirages, le 100e est forcément un ★5, à 50/50 entre vedette et autre. Le compteur est partagé entre bannières du même type. Astuce : monte-le à 99 avec les tirages gratuits, puis fais le 100e sur la bannière que tu vises.</li>
<li><strong>Échange à 200 points</strong> : chaque tirage sur une bannière donne 1 point. À 200, tu échanges contre le costume vedette. Les points restants deviennent de la <strong><button class="term" data-tip="Poudre d'espoir — Gagnée à chaque tirage ; boutique de points" type="button">Powder of Hope</button></strong> (1 pour 1) à la fin de la bannière.</li>
<li><strong>Tirage gratuit quotidien</strong> sur chaque bannière active : bouton « Bulk Free Draw ».</li>
<li>Les costumes non limités arrivent en général dans la <strong>boutique Powder of Hope</strong> après leur bannière (200 Powder la copie) : inutile de brûler des tickets pour la dernière copie.</li>
<li><strong>Équipement exclusif</strong> : ne tire pas dessus, une seule copie suffit pour tout le jeu.</li>
<li><strong>Bannières payantes, toutes optionnelles</strong> : Newbie Welcome (détaillée plus bas), Paid Infinite Draw et 12-Pick Golden Hand (environ 17 $ chacune), Step-Up (5 000 Dia payants).</li>
<li><strong>Règle des tickets</strong> : Selective Exclusive (violets) pour la bannière 12-Pick, Draw Tickets (rouges) pour les bannières normales, Dia comme des tickets rouges, mais garde toujours <strong>1 000 Dia</strong> pour le passe de saison.</li>
<li>
<p>Pour savoir sur quelle bannière tirer en ce moment, le compendium renvoie vers le site <a href="https://zormolo.github.io/BD2-Banner-Recommendation/" target="_blank" rel="noopener">BD2 Banner Recommendation</a>.</p>
</li>
<li>
<p><strong>Compléments du Discord officiel (novembre 2026)</strong> :</p>
<ul>
<li>Après un 50/50 perdu, le suivant n'est <strong>pas</strong> garanti.</li>
<li>Si le costume vedette est déjà à +5, convertis tes points en poudre au lieu de l'échanger (il ne donnerait que des Golden Threads). Tu peux convertir tes points à la main pendant la bannière.</li>
<li><strong>Missions Pickup</strong> : 10 tickets par doublon jusqu'à +4, seulement pendant la bannière, et une seule fois (pas à nouveau lors d'un retour, sauf si tu ne les avais pas récupérés).</li>
<li>Un costume à +0 vaut à peu près la moitié de sa version +5, et la plupart des contenus ne sont pas durs : les supports sont l'exception (Guild Raid, Fiend Hunter).</li>
<li>Les probabilités détaillées sont dans la <a href="https://docs.google.com/spreadsheets/d/1E8eaUt-rgjAdunxYQPMDgqdI3-vE1S3MGfg0e_uNFc0/edit" target="_blank" rel="noopener">Tourist's Sheet</a> (onglet Misc Info). Les <a href="https://lecliss.github.io/bd2-index/" target="_blank" rel="noopener">recommandations de vGhost</a> disent aussi quelles bannières valent le coup.</li>
</ul>
</li>
</ul>
<h3 id="s12-5">Les bannières en détail (compendium)</h3>
<h4>Jusqu'où monter un costume ?</h4>
<p>Les objectifs de tirage se décident surtout par <strong>paliers</strong> (« breakpoints »). Pour la plupart des costumes, <strong>+1</strong> est un bon arrêt (souvent −1 SP). Pour les supports, on vise souvent <strong>+5</strong>. Avant de tirer la dernière copie, pense aux deux autres sources de costumes : la <strong>taverne</strong> et la <strong>boutique Powder of Hope</strong>.</p>
<figure class="shot cp"><button aria-label="Agrandir : Le compteur de garantie (au-dessus des points de tirage)" class="shot-btn" data-full="img/cp-soft-pity.jpg" type="button"><img alt="Le compteur de garantie (au-dessus des points de tirage)" loading="lazy" src="img/cp-soft-pity.jpg"/></button><figcaption>Le compteur de garantie (au-dessus des points de tirage)<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>La bannière 12-Pick (permanente)</h4>
<p>C'est la bannière standard du jeu. Tu y choisis <strong>12 costumes</strong>, qui se partagent les 3 % de ★5 (<strong>0,25 % chacun</strong>).</p>
<ul>
<li><strong>Aucun hors-sélection possible</strong>, sauf quand la garantie des 100 tirages se déclenche : elle peut alors donner <strong>n'importe quel ★5 non limité</strong>. C'est voulu. (Le Discord officiel parle, lui, d'un 50/50.)</li>
<li>Tu peux changer tes 12 choix à tout moment. Les nouveaux costumes y arrivent après leur bannière vedette ; les limités n'y sont jamais.</li>
<li>Pas d'échange à 200 points : tous les points se convertissent en Powder of Hope. Pas de tirage gratuit quotidien. Elle accepte les <strong>tickets violets</strong> (Selective Exclusive Draw Tickets), qui ne servent qu'ici.</li>
<li><strong>Quand l'utiliser</strong> : avec tes tickets violets, et avec des tickets rouges quand les bannières en cours sont à passer ou que tu as assez de réserve pour les prochaines sorties.</li>
</ul>
<p>Les 12 choix conseillés pour débuter, avec leur palier :</p>
<ul>
<li><strong><span class="el el-water">Eau</span></strong> : Queen of Gluttis Granadair (+5), Shrine Maiden of Purification Granadair (+5), Water Park Queen Wilhelmina (+4)</li>
<li><strong><span class="el el-fire">Feu</span></strong> : Homunculus Lathel (+5), Dark Saintess Liberta (+5), Onsen Manager Liberta (+5)</li>
<li><strong><span class="el el-wind">Vent</span></strong> : Adventurer of the Unknown Diana (+5), Magical Innovator Diana (+0), Robin Hood Zenith (+3 ou +5)</li>
<li><strong><span class="el el-light">Lumière</span></strong> : B-Rank Idol Helena (+5), Pure White Blessing Refithea (+1 ou +5), Poolside Fairy Refithea (+3 ou +5)</li>
</ul>
<p>Pour Dark Saintess Liberta, Adventurer of the Unknown Diana et Queen of Gluttis Granadair, arrête-toi à <strong>+4</strong> tant que tu ne les as pas recrutés à la taverne.</p>
<figure class="shot cp"><button aria-label="Agrandir : Les 12 costumes conseillés dans la bannière 12-Pick" class="shot-btn" data-full="img/cp-12-pick.jpg" type="button"><img alt="Les 12 costumes conseillés dans la bannière 12-Pick" loading="lazy" src="img/cp-12-pick.jpg"/></button><figcaption>Les 12 costumes conseillés dans la bannière 12-Pick<small class="credit">Image : Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p>Quand l'un d'eux atteint son palier, remplace-le par : Poolside Guardian Zenith (+5), Iron Monarch Wilhelmina (+4), Sunny Inn Hand Helena (+5), Red Riding Hood Rou (+5), Young Lady Blade (+5), Medical Club Teresse (+5), Shadowed Dream Sonya (+4 ou +5), Miracle Marine Mamonir (+5), Heavenly Guardian Successor Glacia (+4), New Hire Seir (+5), Shadowed Bunny Eleaneer (+4) ou Retired Legend Olivier (+4).</p>
<p>Un joueur du Discord officiel ajoute deux conseils : à choix égal, préfère les <strong>DPS physiques</strong> aux DPS magiques, et en débutant, <strong>ignore les costumes « fin de jeu »</strong> (End Game PvE) tant que tu n'as pas déjà de bons DPS. Si un DPS n'est pas listé, ça ne veut pas dire qu'il est mauvais : tu auras besoin de ses autres costumes plus tard (Nebris, Loen…).</p>
<p><strong>Compléments du Discord officiel (novembre 2026).</strong> Garde <strong>tous</strong> les buffers dans ta sélection jusqu'à ce qu'ils soient au maximum. Dans la liste ci-dessous, les supports sont classés par priorité ; quand un costume a deux paliers, le premier est l'objectif tout de suite, le second plus tard, une fois les autres paliers atteints.</p>
<figure class="shot dc"><button aria-label="Agrandir : Les costumes conseillés pour la sélection, par rôle et par priorité (novembre 2026)" class="shot-btn" data-full="img/dc-sb-liste.jpg" type="button"><img alt="Les costumes conseillés pour la sélection, par rôle et par priorité (novembre 2026)" loading="lazy" src="img/dc-sb-liste.jpg"/></button><figcaption>Les costumes conseillés pour la sélection, par rôle et par priorité (novembre 2026)<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h4>La bannière 1-Pick : pourquoi l'éviter</h4>
<p>Elle crée une bannière vedette pour <strong>le costume de ton choix</strong> (~1,51 %), avec points de tirage et garantie propres, et accepte les tickets violets. Mais tu ne peux changer de cible que <strong>10 fois en tout</strong> (chaque validation compte, même sans tirer), et le compendium la déconseille en général :</p>
<ul>
<li>elle a des <strong>hors-sélection</strong>, alors que le 12-Pick n'en a pas hors garantie ;</li>
<li>le jeu se joue avec <strong>un effectif</strong> : plusieurs supports à un niveau correct valent mieux qu'un seul support à fond ;</li>
<li>sur une vraie bannière vedette, l'événement « Pickup » te rend des <strong>tickets</strong> pour chaque copie de +0 à +4.</li>
</ul>
<p>Exception : viser un costume qui revient bientôt en bannière, ou combler un manque précis que tu sais identifier.</p>
<h4>Le Costume Selective Enhancement (Discord officiel, novembre 2026)</h4>
<p>C'est le doublon au choix de la boutique <button class="term" data-tip="Fil d'or — Gagné sur les doublons +5 ; boutique de points" type="button">Golden Thread</button> (« unidupe »). Rien ne presse : tu peux encore tirer des doublons avant le reset mensuel. Utilise d'abord tous tes tickets de sélection. Ordre conseillé :</p>

<figure class="shot dc"><button aria-label="Agrandir : Les priorités du Costume Selective Enhancement, en 4 niveaux (novembre 2026)" class="shot-btn" data-full="img/dc-cse-priorites.jpg" type="button"><img alt="Les priorités du Costume Selective Enhancement, en 4 niveaux (novembre 2026)" loading="lazy" src="img/dc-cse-priorites.jpg"/></button><figcaption>Les priorités du Costume Selective Enhancement, en 4 niveaux (novembre 2026)<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h4>Les tickets d'élément (Property Selective Draw Exchange Ticket)</h4>
<p>Ils donnent un <strong>★5 aléatoire de l'élément choisi</strong> (hors limités). Ils arrivent à environ <strong>3 par mois</strong> : utilise-les tout de suite plutôt que de les garder. Au début, presque tous les éléments conviennent ; vise la <strong><span class="el el-light">Lumière</span></strong> pour monter Refithea et Helena. Plus tard, choisis l'élément où tes supports sont les plus faibles ; et quand tu as beaucoup de +5, celui qui te donnera le moins de doublons transformés en Fils d'or.</p>
<p>Selon le Discord officiel, les nouveaux costumes non limités rejoignent ces tickets après leur bannière, et un costume absent de sa liste n'est pas forcément mauvais.</p>
<figure class="shot dc"><button aria-label="Agrandir : Les costumes possibles par élément avec un ticket d'élément (novembre 2026)" class="shot-btn" data-full="img/dc-proptix-liste.jpg" type="button"><img alt="Les costumes possibles par élément avec un ticket d'élément (novembre 2026)" loading="lazy" src="img/dc-proptix-liste.jpg"/></button><figcaption>Les costumes possibles par élément avec un ticket d'élément (novembre 2026)<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<h4>Les autres bannières</h4>
<ul>
<li><strong>Tickets ★5 garantis</strong> (anniversaires) : chaque ticket donne un costume ★5 non limité. Utilise-les <strong>tout de suite</strong> : plus tu attends, plus tu risques de tomber sur des costumes déjà à +5, transformés en Fils d'or.</li>
<li><strong>Newbie Welcome ★5 Costume Guaranteed Draw</strong> (14 jours, <strong>Dia payants uniquement</strong>, 2 000 Dia les 10 tirages, 30 tirages maximum) : chaque 10-tirage garantit un costume ★5 parmi ceux que tu choisis avec « Select Costume(s) ». Elle ne donne ni points de tirage ni compteur de garantie. Choix conseillés par le Discord officiel : Homunculus Lathel, B-Rank Idol Helena et Robin Hood Zenith. Si tu as déjà eu Helena une fois, remplace-la par Adventurer of the Unknown Diana, ou prends d'abord une copie de Game Club Rafina. Les doublons de buffers comptent plus : ne choisis pas Rafina ou Zenith si tu les as déjà. Le compendium, lui, conseille Diana, Helena et Lathel. Si tu dépenses peu, garde plutôt tes Dia payants pour les bannières Step-Up.</li>
<li><strong>Paid Infinite Draw</strong> (~17 $, pendant les grands événements) : au moins un ★5 garanti, plusieurs possibles, pas de limités. Si tu l'achètes, vise <strong>3 supports</strong> (Pure White Blessing Refithea, B-Rank Idol Helena, Dark Saintess Liberta, Adventurer of the Unknown Diana…) ; trouver un bon tirage prend du temps, 2 supports et 1 DPS est un bon compromis. Le Discord officiel ajoute : Buffers &gt; Supports &gt; DPS, physique avant magique ; achète-le seulement s'il y a au moins 2 costumes que tu veux (3 au maximum), et sache que les tickets de sélection peuvent aussi te donner des doublons.</li>
</ul>
<figure class="shot dc"><button aria-label="Agrandir : Les costumes à viser dans la Paid Infinite Draw, pour un débutant (novembre 2026)" class="shot-btn" data-full="img/dc-pid-liste.jpg" type="button"><img alt="Les costumes à viser dans la Paid Infinite Draw, pour un débutant (novembre 2026)" loading="lazy" src="img/dc-pid-liste.jpg"/></button><figcaption>Les costumes à viser dans la Paid Infinite Draw, pour un débutant (novembre 2026)<small class="credit">Image : Discord officiel de Brown Dust 2</small></figcaption></figure>
<ul>
<li><strong>12PICK Golden Hand</strong> (~17 $) : tu choisis 12 costumes et le 10-tirage en garantit <strong>3</strong> parmi eux. Un peu meilleur que la Paid Infinite Draw. Mets-y des supports, comme dans le 12-Pick.</li>
<li><strong>Step-Up</strong> (5 000 Dia payants en 4 étapes de 2 000, 1 500, 1 000 et 500) : la dernière étape garantit le costume vedette. Si tu te lances, va <strong>jusqu'au bout</strong>, car la première étape coûte 40 % du prix sans garantie.</li>
<li><strong>Équipement exclusif</strong> : les bannières d'équipement (12-Pick d'équipement, Draw Gear) ne valent pas le coup pour un débutant. Le Discord officiel nuance : l'arme exclusive d'un costume non limité, seulement pour un DPS que tu comptes monter à +5 ; l'équipement de collaboration, seulement si le costume est méta et déjà au maximum. Les tickets d'équipement exclusif UR garanti ont 15 % de chances de donner l'arme d'un perso ★5 ; ceux en SR sont dépassés par l'UR IV fabriqué.</li>
</ul>
<h4>Durée et costumes limités</h4>
<ul>
<li>Une bannière vedette dure en général <strong>2 semaines</strong> ; <strong>1 semaine</strong> pour un vieux costume qui revient, <strong>4 semaines</strong> pour un costume <strong>limité</strong> ou avec un skin spécial.</li>
<li>Un costume limité porte l'étiquette « <strong>Special</strong> ». Il n'ira jamais dans la boutique Powder of Hope.</li>
<li>Un costume non limité y arrive en général après sa bannière, sauf parfois après une bannière d'une semaine.</li>
</ul>
<p><strong>Quand reviennent les costumes ?</strong> (Discord officiel, novembre 2026)</p>
<ul>
<li><strong>Non limités</strong> : les <strong>buffers</strong> reviennent en général tous les <strong>5 à 6 mois</strong> ; les autres (DPS et autres supports) n'ont aucun retour garanti.</li>
<li><strong>Limités de saison</strong> : les costumes <strong>Bunny</strong> reviennent en <strong>hiver</strong>, ceux d'<strong>été</strong> au <strong>printemps et en été</strong>.</li>
<li><strong>Collaborations</strong> : elles reviennent, mais on ne sait pas si elles auront plus d'un retour. Yumi a eu un retour à part, après la refonte de son animation.</li>
</ul>

<h3 id="s13-1">Mirror Wars (PvP)</h3>
<p>Les combats consomment des cocktails de sang, et les médailles dépendent du rang de l'adversaire. Chaque mois, la boutique propose un costume 5★ ; si tu fais tes dailies, 18 000 médailles par mois sont accessibles. Si tu vises un haut rang, utilise tes cocktails en réserve juste avant le blocage du dimanche à 15:00 UTC (16:00 en Belgique en hiver).</p>
<h3 id="s13-2">Last Night</h3>
<p>Fais-y au moins 10 000 de dégâts une fois : Isaac t'apporte ensuite récompenses et ressources chaque jour, à condition d'aller lui parler sur la carte. Plus tard, pour viser un score maximum, il faut équiper tous tes persos avec de bonnes pièces.</p>
<h3 id="s13-3">Boutiques mensuelles</h3>
<p>La boutique <button class="term" data-tip="Fil d'or — Gagné sur les doublons +5 ; boutique de points" type="button">Golden Thread</button> et celle de Mirror Wars proposent des costumes 5★ qui changent chaque mois. Regarde-les avant de dépenser tes médailles ou tes Fils d'or.</p>

<h4>Golden Colosseum (PvP automatique)</h4>
<ul>
<li>Une saison par semaine, clôture le mercredi à 15:00 UTC. 100 tentatives par semaine (jusqu'à 400 avec 3 recharges à 10 Dia).</li>
<li><strong>Pas d'équipement</strong> : seuls comptent les doublons des costumes, le Potentiel, l'Awakening et le Burst. Tu composes une équipe de costumes (pas de persos) avec un coût total maximum, plus des <strong>Blessings</strong> (bonus) pour quand tu joues en premier et en second.</li>
<li>Les règles tournent toutes les 2 saisons : taille de la grille, nombre de membres, costumes bannis. Pas de SP ni de recharges. Au tour 5, les compétences se coupent.</li>
<li>Seule l'attaque compte pour tes points. Utilise <strong>Repeat Battle</strong> pour gagner du temps.</li>
<li><strong>Missions</strong> : 40 combats donnent 900 Aurum Coins au total. Si tu es pressé, fais au moins 10 combats par semaine.</li>
<li><strong>Conseil</strong> : copie les équipes de joueurs connus (YouTube : GemMog, VioletRose, pennyosa) en choisissant celles qui utilisent tes costumes les plus améliorés.</li>
<li><strong>Boutique, priorité débutant</strong> : 2 Property Selective Draw Exchange Tickets (2 000), 65 Sparks of Rampage (520), 10 Draw Tickets (2 000), 1 000 Refining Crystals (2 000), puis 50 Ancient Crystals avec le reste.</li>
<li><strong>Déblocage</strong> : toutes les quêtes principales de Pagan Tower (Story Pack 6). Une seule équipe sert en attaque et en défense, et tu peux y mettre <strong>plusieurs costumes du même perso</strong>. Chaque costume utilise <strong>son propre</strong> Bonding, son Awakening, le niveau du perso et ses doublons. Les coûts des costumes changent chaque saison selon leur popularité.</li>
<li><strong>Blessings</strong> : trois familles (attaque, défense, utilité), payées en points de Blessing ; tu en as plus quand tu joues en second. <strong>Leur ordre compte</strong> : elles s'activent de haut en bas (Grace avant Barrier of Life donne plus d'<button class="term" data-tip="Bouclier de PV temporaires" type="button">Energy Guard</button>). Pour adapter la liste d'un autre joueur, ajoute une version plus forte quand tu as plus de points (Curse of Limits II en plus de la I quand tu joues en second, par exemple).</li>
<li><strong>Règles</strong> : 17 règles, dont 8 tournent (grille de 3×3 à 5×5, 3 à 11 membres, coût total, points de Blessing de 5 à 13 en premier et de 7 à 15 en second, cases interdites, costumes et Blessings bannis). Celles qui ne bougent pas : l'initiative est <strong>aléatoire</strong>, les costumes agissent <strong>en alternance</strong> (le tien, puis celui de l'adversaire…), tu commences à 1 000 points, et au tour 5 le <button class="term" data-tip="Mort subite — Combat trop long : tout le monde frappe plus fort" type="button">Death Time</button> <strong>coupe les compétences</strong>.</li>
<li><strong>Missions</strong> : tu peux encore récupérer leurs récompenses pendant le décompte, à condition de les avoir remplies avant.</li>
<li><strong>Classement</strong> : 29 rangs par tranches de pourcentage. Le jeu écrit les tranches à l'envers : « Within the Top 0.1% » veut dire que tu fais mieux que 99,9 % des joueurs. Les récompenses vont de 900 Aurum Coins (Bronze) à 2 000 (Champion). Avec Platinum II et toutes les missions, compte environ 2 100 Aurum Coins par semaine, soit 8 400 en 4 semaines.</li>
<li><strong>Boutique, en option</strong> : 100 Awakening Elixirs (1 000), 2 millions d'or (2 000), 40 000 <button class="term" data-tip="Poudre / Cristal / Pierre de raffinage — Monter le score de raffinage (poudre) et relancer les options (pierres, cristaux)" type="button">Refining Powder</button> (1 000). Pour grimper vraiment, le compendium conseille le <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vQEYjBPz0-tkhGwtgEyTm4cj0lVhgItaFXBVqcRxZ8wPoZne94QWnfz2nLJwRoBmEh_JCRZtNYqpObE/pubhtml#gid=2089793421" target="_blank" rel="noopener">guide Champion de blanketninja</a>.</li>
</ul>

<h4>Guild Raid</h4>
<ul>
<li>Une semaine toutes les 4 semaines (semaine 1 du cycle). Un boss à 15 niveaux sur une grille 5×5, avec une équipe de <strong>7 personnages</strong>. Seul ton meilleur passage compte, sans limite d'essais.</li>
<li>Tu peux emprunter jusqu'à 2 persos à ta guilde (3 emprunts par jour, consommés seulement en cas de victoire), au prix d'un léger malus de score.</li>
<li><strong>Lancelot</strong>, allié propre au raid, se charge en infligeant des dégâts puis reste 6 tours. Ses compétences gratuites : mettre le boss en Break, frapper 9 fois pour les Chains, ou rendre 25 SP et réinitialiser les recharges.</li>
<li>Teste tes rotations en <strong>Practice Battle</strong> : c'est gratuit et le Burst y est débloqué au maximum.</li>
<li>Les Deeds achètent la boutique de guilde : <button class="term" data-tip="Larme de la déesse — Très rare, débloque le potentiel de compétence" type="button">Tear of the Goddess</button> (2 000), Sparks, 10 Draw Tickets, Awakening Elixirs, Essences.</li>
<li><strong>Accès</strong> : bouton « Enter Guild Raid » dans le menu de la guilde. Le dernier jour, un décompte commence à 15:00 UTC.</li>
<li><strong>Les compétences du boss</strong> : <strong>Basic</strong> (son cycle normal), <strong>Conditional</strong> (prennent la place du prochain coup quand leur condition est remplie ; l'une d'elles <strong>élimine toute l'équipe</strong> après un certain tour) et <strong>Overdrive</strong>, débloquées sous un seuil de PV, souvent 50 % (un indicateur sous la barre de PV). Le boss peut avoir des <strong>points faibles</strong> (« WEAK »), ne peut être ni poussé ni réduit au silence, et tes persos ne peuvent pas esquiver ses coups : seul le placement te protège. Le <strong>Break</strong> lui fait sauter son tour (ses compétences sont repoussées, pas annulées).</li>
<li><strong>Lancelot</strong> a 4 compétences, une par tour, toutes à 0 SP : <strong>Redeeming Strike</strong> (Break + Vulnérabilité, une fois, pour le coup final), <strong>Arondight Rush</strong> (9 coups en zone pour les Chains), <strong>Radiant Combat Mastery</strong> (saignement, peu utilisée) et <strong>Blessing of the Lake</strong> (recharges remises à zéro et 25 SP, une fois). Une fois activé, son compte à rebours ne s'arrête plus.</li>
<li><strong>Emprunts</strong> : abandonne un essai qui tourne mal pour ne pas consommer tes emprunts. Place tes propres persos de soutien dans le menu de guilde : tu touches un peu d'or quand quelqu'un les emprunte. Le mode entraînement ne consomme aucun emprunt.</li>
<li><strong>Score</strong> : niveau battu (500 points par niveau, 7 500 au niveau 15) + bonus de tours (80 − 3 × (tour − 1)) + bonus sans emprunt (4 points sans, 3 avec un, 0 avec deux). Au niveau 15, les dégâts en trop deviennent de l'<strong>Overkill</strong>, qui départage les guildes à égalité.</li>
<li><strong>Récompenses</strong> : 600 Deeds par niveau battu (9 000 au niveau 15), plus jusqu'à 9 000 selon le score de la guilde (100 000 points, soit un niveau 7 en moyenne par membre). Pour vider la boutique, il faut 11 750 Deeds : un niveau 6 et une guilde à 50 000 points suffisent.</li>
<li><strong>Guides</strong> : Shimonami (sans commentaires), KingPepeII (explications détaillées), les modèles de Souseha ou le forum coréen Arca Live.</li>
</ul>
