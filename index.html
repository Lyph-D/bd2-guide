<h4>Golden Colosseum (auto PvP)</h4>
<ul>
<li>One season per week, closing Wednesday at 15:00 UTC. 100 attempts a week (up to 400 with 3 refills at 10 Dia).</li>
<li><strong>No gear</strong>: only costume dupes, Potential, Awakening and Burst count. You build a team of costumes (not characters) under a max total cost, plus <strong>Blessings</strong> (buffs) for when you go first and second.</li>
<li>Rules rotate every 2 seasons: grid size, team size, banned costumes. No SP and no cooldowns. On turn 5, skills shut off.</li>
<li>Only attacking counts for your points. Use <strong>Repeat Battle</strong> to save time.</li>
<li><strong>Missions</strong>: 40 fights give 900 Aurum Coins in total. If you're short on time, do at least 10 fights a week.</li>
<li><strong>Advice</strong>: copy teams from known players (YouTube: GemMog, VioletRose, pennyosa), picking the ones that use your most upgraded costumes.</li>
<li><strong>Shop, beginner priority</strong>: 2 Property Selective Draw Exchange Tickets (2,000), 65 Sparks of Rampage (520), 10 Draw Tickets (2,000), 1,000 Refining Crystals (2,000), then 50 Ancient Crystals with the rest.</li>
<li><strong>Unlock</strong>: all main quests of Pagan Tower (Story Pack 6). One team is used for both attack and defense, and you can put <strong>several costumes of the same character</strong> in it. Each costume uses <strong>its own</strong> Bonding, its Awakening, the character's level and its dupes. Costume costs change every season based on popularity.</li>
<li><strong>Blessings</strong>: three families (attack, defense, utility), paid with Blessing points; you get more when you go second. <strong>Their order matters</strong>: they trigger from top to bottom (Grace before Barrier of Life gives more <button class="term" data-tip="Temporary HP shield" type="button">Energy Guard</button>). To adapt another player's list, add a stronger version when you have more points (Curse of Limits II on top of I when you go second, for example).</li>
<li><strong>Rules</strong>: 17 rules, 8 of which rotate (grid from 3×3 to 5×5, 3 to 11 members, total cost, Blessing points from 5 to 13 going first and 7 to 15 going second, forbidden tiles, banned costumes and Blessings). The ones that never change: initiative is <strong>random</strong>, costumes act <strong>in turns</strong> (yours, then the opponent's…), you start at 1,000 points, and on turn 5 <button class="term" data-tip="Fight runs too long: everyone hits harder" type="button">Death Time</button> <strong>shuts off skills</strong>.</li>
<li><strong>Missions</strong>: you can still claim their rewards during the countdown, as long as you completed them before.</li>
<li><strong>Ranking</strong>: 29 ranks by percentage brackets. The game writes the brackets backwards: "Within the Top 0.1%" means you do better than 99.9% of players. Rewards go from 900 Aurum Coins (Bronze) to 2,000 (Champion). With Platinum II and all missions, count on about 2,100 Aurum Coins a week, so 8,400 over 4 weeks.</li>
<li><strong>Shop, optional</strong>: 100 Awakening Elixirs (1,000), 2 million gold (2,000), 40,000 <button class="term" data-tip="Raise the refinement score (powder) and reroll options (stones, crystals)" type="button">Refining Powder</button> (1,000). To really climb, the compendium recommends <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vQEYjBPz0-tkhGwtgEyTm4cj0lVhgItaFXBVqcRxZ8wPoZne94QWnfz2nLJwRoBmEh_JCRZtNYqpObE/pubhtml#gid=2089793421" target="_blank" rel="noopener">blanketninja's Champion guide</a>.</li>
</ul>
<figure class="shot cp"><button aria-label="Enlarge: The Golden Colosseum Blessings menu" class="shot-btn" data-full="img/cp-blessings.jpg" type="button"><img alt="The Golden Colosseum Blessings menu" loading="lazy" src="img/cp-blessings.jpg"/></button><figcaption>The Golden Colosseum Blessings menu<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>Guild Raid</h4>
<ul>
<li>One week every 4 weeks (week 1 of the cycle). A 15-level boss on a 5×5 grid, with a <strong>7-character</strong> team. Only your best run counts, with unlimited tries.</li>
<li>You can borrow up to 2 characters from your guild (3 borrows a day, only used up on a win), at the cost of a small score penalty.</li>
<li><strong>Lancelot</strong>, the raid's own ally, charges up by dealing damage then stays 6 turns. His free skills: Break the boss, hit 9 times for Chains, or give back 25 SP and reset cooldowns.</li>
<li>Test your rotations in <strong>Practice Battle</strong>: it's free and Burst is unlocked at max there.</li>
<li>Deeds buy from the guild shop: <button class="term" data-tip="Very rare; unlocks skill potentials" type="button">Tear of the Goddess</button> (2,000), Sparks, 10 Draw Tickets, Awakening Elixirs, Essences.</li>
<li><strong>Access</strong>: "Enter Guild Raid" button in the guild menu. On the last day, a countdown starts at 15:00 UTC.</li>
<li><strong>The boss's skills</strong>: <strong>Basic</strong> (its normal cycle), <strong>Conditional</strong> (they replace the next hit when their condition is met; one of them <strong>wipes the whole team</strong> after a set turn) and <strong>Overdrive</strong>, unlocked below an HP threshold, often 50% (a marker under the HP bar). The boss can have <strong>weak points</strong> ("WEAK"), can't be pushed or silenced, and your characters can't dodge its hits: only placement protects you. <strong>Break</strong> makes it skip its turn (its skills are pushed back, not cancelled).</li>
<li><strong>Lancelot</strong> has 4 skills, one per turn, all at 0 SP: <strong>Redeeming Strike</strong> (Break + Vulnerability, once, for the final hit), <strong>Arondight Rush</strong> (9 area hits for Chains), <strong>Radiant Combat Mastery</strong> (bleed, rarely used) and <strong>Blessing of the Lake</strong> (cooldowns reset and 25 SP, once). Once he's active, his countdown never stops.</li>
<li><strong>Borrowing</strong>: abandon a run that goes wrong so you don't use up your borrows. Put your own support characters in the guild menu: you earn a little gold when someone borrows them. Practice mode uses no borrows.</li>
<li><strong>Score</strong>: level cleared (500 points per level, 7,500 at level 15) + turn bonus (80 − 3 × (turn − 1)) + no-borrow bonus (4 points with none, 3 with one, 0 with two). At level 15, extra damage becomes <strong>Overkill</strong>, which breaks ties between guilds.</li>
<li><strong>Rewards</strong>: 600 Deeds per level cleared (9,000 at level 15), plus up to 9,000 based on the guild's score (100,000 points, which is a level 7 on average per member). To empty the shop you need 11,750 Deeds: a level 6 and a guild at 50,000 points are enough.</li>
<li><strong>Guides</strong>: Shimonami (no commentary), KingPepeII (detailed explanations), Souseha's templates or the Korean Arca Live forum.</li>
</ul>
<figure class="shot cp"><button aria-label="Enlarge: Lancelot's 4 skills" class="shot-btn" data-full="img/cp-lancelot-skills.jpg" type="button"><img alt="Lancelot's 4 skills" loading="lazy" src="img/cp-lancelot-skills.jpg"/></button><figcaption>Lancelot's 4 skills<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>The Soul Wager</h4>
<p>An inventory-management auto-battler. You buy tiles, units and gear in a shop, place them on a 7×7 grid, then the fight plays out on its own. Each board has several phases; 5 losses on a board reset it. Clear every board of the season to buy out the Alea Chips shop: Tear of the Goddess, Refining Powder, gold, magic crystals, ★5 and ★4 contracts.</p>
<figure class="shot cp"><button aria-label="Enlarge: The prep screen: storage, field and shop" class="shot-btn" data-full="img/cp-layout.jpg" type="button"><img alt="The prep screen: storage, field and shop" loading="lazy" src="img/cp-layout.jpg"/></button><figcaption>The prep screen: storage, field and shop<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<ul>
<li><strong>Unlock</strong>: the main quests of Edge of Dimensions. <strong>8-week</strong> season, unlimited tries, countdown at 15:00 UTC on the last day.</li>
<li><strong>Soul Tokens</strong>: 16 per win, 10 per loss, to keep your run going. A loss refreshes the shop and resets the reroll counter.</li>
<li><strong>The battle shop</strong>: 4 slots, renewed after each fight. Tap the price tag to <strong>reserve</strong> an item until the next round. 10% chance of a −50% sale. A reroll costs 1 token, then +1 every 4 rerolls: don't reroll more than 4 or 5 times per phase. Selling gives back half the price (2 minimum, 1 for the Protection Tile). The <strong>storage</strong> keeps your pieces with no penalty.</li>
<li><strong>Placing</strong>: tiles go from 1×1 to 2×2 or 1×4, units have shapes up to 3×4. To rotate a piece: on PC, hold left click and right-click; on phone, hold with one finger and tap with another. <strong>View Formation</strong> shows the enemy grid: check it before you build.</li>
<li><strong>Units</strong>: 8 roles (melee, ranged, defense, support, healing, curse, cleanse, buff removal). Each one has damage, a stamina cost, accuracy and a cooldown. Some get a bonus if specific tiles (cross icon) are placed on the field. You can upgrade them up to their dupe level in your real roster.</li>
<li><strong>The fight</strong>: position doesn't affect targeting, all your units hit the whole enemy side. <strong>Stamina</strong> is shared: if the pool is empty, the unit can't act ("Out of Stamina"). After 20 seconds, <strong>End Game</strong> mode deals growing damage to both sides.</li>
<li><strong>Current strategy</strong>: DPS Liatris (Rodev's Star), Rubia (Thorn of the Desert) and Blade (Apostle); for support and curses, Pure White Blessing Refithea, The Curse Celia, Overheat Levia, Onsen Manager Liberta, Shattered Dream Palette. The idea: stack debuffs, especially <strong>Poison</strong>, with just enough survival.</li>
<li><strong>Shop</strong>: buy <strong>everything</strong>, contracts included, even as a veteran, because leftover Alea Chips vanish at the end of the season. Videos: Seji, or ButtonBash Gaming and Haradeas.</li>
</ul>
<h4>Taros Tactical Manual</h4>
<p>Tactical puzzles with fixed characters, on a grid of 9 to 25 fights. No progression needed: perfect for a beginner who wants to learn. Missions give up to 2 million gold, 300,000 Refining Powder and 40 Sparks of Rampage per season. Try it on your own first; otherwise, videos by Seji or Shimonami.</p>
<p>The season lasts <strong>28 days</strong>. Each fight gives gold based on its difficulty: 12,500 (Easy), 25,000 (Normal) or 80,000 (Hard). The missions: 1 and 2 wins (1 million gold each), 3 wins (100,000 Refining Powder), 1 full line or "bingo" (200,000 Refining Powder), 2 and 3 bingos (20 Sparks each). Souseha's database also has picture solutions.</p>
<h4>Rapport</h4>
<ul>
<li><strong>3 chats a day</strong> in total, on costumes you own (one per costume). The right answer gives 100 XP, the other 80 XP. Reset at 15:00 UTC.</li>
<li>Raising Rapport unlocks the costume's story and raises the <strong>Rapport Buff</strong>: an account-wide <strong>permanent crit rate</strong> bonus, up to 50% with 10 maxed costumes.</li>
<li>A costume's max level depends on its progress: 10 when obtained, 15 after Awakening, 20 after Potential.</li>
<li>Gifts (drinks) give XP: 40 for the favorite drink, 20 otherwise, 150 for the Special Drink. Don't buy them early on: later, the Golden Thread shop works, after the priority buys.</li>
<li><strong>Access</strong>: Rapport button on the home screen, a costume's "Talk" button in Companion, or the Glupy Diner. Only costumes you own, and not all of them: the developers add Rapport costume by costume.</li>
<li><strong>The chats</strong>: 15 per costume ("Visits"), picked at random among the ones you haven't seen yet. Seeing them all gives <strong>100 Dia</strong> once. The <strong>Talk Archives</strong> show the right answers for the ones you've done. A max-level costume can chat without limit, handy to finish the archive. <strong>Quick Talk</strong> (after 5 chats) skips the scene for 80 XP and uses up a chat.</li>
<li><strong>Maxing a costume</strong> (2,100 XP): 21 chats, or 53 favorite drinks. The smartest way: <strong>1 chat + 50 drinks</strong>, because each drink is limited to 100 purchases (except the Special Drink). The 7 drinks (Creamy Milk, Cold Beer, Velvety Wine, Fragrant Whiskey, Warm Black Tea, Sweet Soda, Special Drink) are in the <button class="term" data-tip="Earned on every draw; points shop" type="button">Powder of Hope</button> and Golden Thread shops. Once the crit bonus is maxed, they're worth almost nothing.</li>
<li><strong>Watch out for Awakening</strong>: without it, a costume stays stuck at level 10, even with its Potential done. This mostly affects supports, which people rarely awaken.</li>
<li><strong>Rewards</strong>: a collection item at level 10, stickers at levels 15 and 20. The costume's story has 6 episodes, unlocked at levels 1, 3, 5, 7, 9 and 10, to read in order; they give Dia, not XP. During a Season Event, the featured costume's story is open to everyone, with extra event currency.</li>
<li><strong>The Rapport Buff</strong> works like a collection bonus: it affects the whole account and <strong>Pressure doesn't reduce it</strong>. Each mission gives +2% (level 10 and 20 for one costume, levels 10, 15 and 20 for 5, 10, 20 and 30 costumes; the game says "Characters", but it counts costumes). The right answers for each costume are listed on the <a href="https://botan14xd.github.io/BD2-Overview/content/rapport/" target="_blank" rel="noopener">compendium's Rapport page</a>.</li>
</ul>

<h4>Evil Castle: extra tips</h4>
<ul>
<li><strong>Tower of Pride</strong>: 6 floors, each with a single element for the enemies (never Light). Each fight has bonus tasks: a number of characters of the required element (floor 1: 4 Fire; 2: 4 Light; 3: 4 Water; 4: 4 Light; 5: 3 Wind; 6: 2 Light and 2 Dark), winning in 1, 3 or 5 turns, plus the rating points (1 million damage by a single character in one turn, fight won in 1 turn, team at full HP). A floor is worth 100,000 points at most (15,000 per fight, 40,000 for the boss). Daily reward thresholds (step 6): 10,000, 50,000, 100,000, 150,000, 200,000, 300,000, 400,000, 500,000 and 600,000 points.</li>
<li><strong>Tower of Desire</strong>: the enemies' element changes every 10 floors, and each floor has 2 optional challenges. Each floor gives 1 <button class="term" data-tip="Regular draw ticket" type="button">Draw Ticket</button>, 30,000 gold and 5 rice; every 5 floors, 100 Dia and 5 Ancient Crystals; every 10, 150 Dia and 10 Ancient Crystals. From floor 151 on, Seji's video helps.</li>
<li>
<p><strong>Tower of Salvation</strong>: 4-week season, countdown at 15:00 UTC on the last day. Levels 1 and 2 aim for floor 10, 3 and 4 for floor 20, the rest for floor 30. The higher you go, the less silver and SP you start with (20 SP and +5 per turn at level 1, down to 10 SP and 0 per turn at level 10) and the tougher the enemies (HP ×1.5 at level 2, ×5 at level 4, ×50 at level 10).</p>
<ul>
<li><strong>Obsidian upgrades</strong>: after Refresh Attempts Up and Starting SP Up (step 6), Discount Probability Up then ATK or MATK depending on your team.</li>
<li><strong>The draft</strong>: on top of what step 6 says, your costumes also keep their Engraving. The first 2 picks of a draft come from characters you already have, the last 2 are always new characters: owning another costume of a character helps you find the one you want faster. The joker (5th pick) should stay in your damage type and balance the team (a DPS if you already have supports, and the other way around).</li>
<li><strong>What each room gives</strong>: fight (silver + costume pick), elite (more silver + artifact), boss every 10 floors (lots of silver, rare artifact and a reroll), event (possible gain with a risk, or "Leave the room").</li>
<li><strong>Artifacts</strong>: 4 rarities, no duplicates. Some combine into a better one (the icon at the top left shows the recipe, Sort tab). Their buffs <strong>don't count</strong> for costumes that count buffs, like New Hire Nebris or Onsen Swordfighter Blade.</li>
<li><strong>The shop</strong>: 5 artifacts at a fixed price, 4 costumes of owned characters, 4 of new characters, +1 dupe of a costume for 1,000 silver, healing and a reroll (1,000, more expensive each time). −50% sales depending on the difficulty.</li>
<li><strong>Changing a fight's result</strong> (randomness is fixed): change the order or add a knockback or a basic attack. Two styles work: lots of Chains, or very few. At level 10, a floor 31 ("Crystal Battle") is only for the ranking: no need to grind it.</li>
<li>
<p><strong>Season rewards</strong>: from 1.5 to 15 billion points (Awakening Elixirs, powder, crystals, UR exclusive ticket, 10 Draw Tickets).</p>
</li>
<li>
<p><strong>Quick teams (official Discord, November 2026)</strong>: for <strong>magic</strong>, buffers B-Rank Idol Helena and Beachside Angel Teresse, with Loen, Levia, Eclipse, Venaka or QoS Michaela as DPS; for <strong>physical</strong>, Dark Saintess Liberta and Homunculus Lathel (or Teresse), with Blade, Luvencia or New Hire Nebris. In both cases, Fiend Scholar Olstein and BV Morpeah let you stall if you can't win in one turn. It's only a quick guide: some collab DPS only help if you own them, and Liatris needs damage-over-time artifacts.</p>
</li>
<li><strong>Artifacts</strong> (official Discord): the choice depends on your characters. "Low <button class="term" data-tip="Every hit on the same target in a turn raises the damage of the next hits" type="button">Chain</button>" artifacts suit magic teams better; "high Chain" ones suit costumes that hit more than 5 times, like Luvencia. <a href="https://browndust2-wiki.souseha.com/en/artifacts" target="_blank" rel="noopener">Souseha's artifact list</a> and a <a href="https://docs.google.com/document/d/1IV-IG25gJdOa2N_9HEuZbbevpUyDp8RyNN_6VSSrUzo/edit" target="_blank" rel="noopener">detailed Tower of Salvation guide</a> go further.</li>
<li>
<p><strong>Towers of Wrath and of Jealousy</strong>: rewards every 50 floors (10 Draw Tickets, 150 Dia, 1 element ticket), every 10 (10 Draw Tickets, 150 Dia, 200 Refining Crystals), every 5 (5 Draw Tickets, 100 Dia, 100 Refining Crystals), otherwise gold and 5 torches. The effects change every 10 floors from floor 11: for example shields worth 50% HP, extra Chains for enemies, −70% enhancements (41 to 50), then −200% <button class="term" data-tip="Critical chance / critical damage" type="button">Crit DMG</button> for you, and −200% crit rate for everyone (91 to 100). The full list is on the <a href="https://botan14xd.github.io/BD2-Overview/content-packs/evil-castle/" target="_blank" rel="noopener">compendium's Evil Castle page</a>; Seji also has a video series.</p>
</li>
<li>

</li>

<h4>Season Event: extra tips</h4>
<ul>
<li>An event's story is a costume's Rapport story, in <strong>6 episodes</strong>: 650 currency for the first 5, 750 for the last. Old stories can be reread in the Story tab, with no reward.</li>
<li><strong>4 event costumes</strong> raise the currency you earn (up to +100%), whether they're in your team or not.</li>
<li>The "everyone survives" condition applies to Normal fights 1 to 4, 6 to 9 and 11 to 14; for Normal 5, 10, 15 and all Challenge fights, it's "fewer than 2 characters K.O.".</li>
<li><strong>One-time rewards</strong>: 250 currency + 25 + 25 Dia per Normal fight, 250 currency + 50,000 + 50,000 gold per Challenge fight. The costume bonus applies <strong>after</strong> the win: 250 shown can become 500. Replaying a cleared fight gives a smaller reward.</li>
<li><strong>Suggested order</strong>: Normal 1 to 15, then Challenge 1 to 15, then replay Challenge 15 until the last day (or the other way around).</li>
<li><strong>Missions</strong>: 6 missions at 100 Dia each (spend 1,000, 5,000 and 10,000 currency; do 5, 15 and 25 fights).</li>
<li><strong>Shop, the rest</strong>: 1 million gold (2,000), 150,000 Ability Pills (10,000), optionally 250 Red Slimes (1,000) and 8 ★4 Rank Up Stars (800), then Refining Powder, gold and Engraving Scrolls as much as you like.</li>
</ul>

<h4>Fiend Hunter: extra tips</h4>
<ul>
<li><strong>Clear example</strong>: 1 billion damage on Very Hard clears Easy, Normal and Hard (573 million HP), and Very Hard keeps that damage. On the last day, a countdown starts at 15:00 UTC.</li>
<li><strong>The boss</strong> sits on specific tiles of the 3×4 grid. Its <strong>Basic</strong> skills form a cycle shown on the right (the next one has the NEXT tag), and the last one <strong>kills the whole team</strong>. <strong>Conditional</strong> skills replace the next hit when their condition is met, a limited number of times. If a team dies before that final hit, the cycle <strong>continues</strong> with the next team: aim to survive until the final hit.</li>
<li><strong>Poise</strong>: meeting a condition lowers the gauge by 1. At zero, the boss goes into <strong>Guard Down</strong> and takes more damage; this state stays for the next teams.</li>
<li><strong>Weak points</strong>: some parts show "WEAK" and take more damage. The boss can't be pushed or silenced, and its hits can't be dodged.</li>
<li><strong>Team Switch</strong> moves to the next team (never back) like an instant death, without resetting the boss's cycle. Rarely useful.</li>
<li><strong>Replicate Battle</strong>: save your fight (Save Battle Data) to replay it automatically turn by turn, skills, Bursts and placement included.</li>
<li><strong>Break Season and Return Season</strong>: when a bug breaks the ranking, the season becomes a <strong>Break Season</strong> and all participants get the rank 1 rewards (no sticker or trophy). The same boss comes back later as a <strong>Return Season</strong> (button on the home screen), with no prep phase, with some costumes banned, and its difficulty rewards can be earned again.</li>
</ul>

<h4>Last Night: extra tips</h4>
<ul>
<li>You can put <strong>several costumes of the same character</strong> in the team.</li>
<li><strong>The boss</strong> has 0% DEF and MRES. Since it ignores debuffs, Vulnerability and damage over time are useless there. Limited-range supports buff the whole team, but self-buffs stay on the user. Pressure example: Homunculus Lathel goes from 280% to 140%.</li>
<li><strong>Support Bonus</strong>: no need to gear Elpis or Arines (one costume each) if you play them, since your active team doesn't give any. Example: Angelica at 10,983 power gives 10.98% per costume.</li>
<li>Past 110 million, the thresholds only give a bit of gold, titles and stickers.</li>
<li><strong>Who to bring</strong> (in the step 9 order: buffers, chainers, DPS): the best buffers here give <button class="term" data-tip="Buff that raises allies' damage" type="button">Augmentation</button> or non-stat bonuses: Pure White Blessing Refithea, Onsen Manager Liberta, Shrine Maiden of Purification Granadair and Sunny Inn Hand Helena, to place <strong>right before the DPS</strong> she buffs. Beachside Angel Teresse is bad here. For chainers, any multi-hit character early on (even Zenith), then Water Park Wilhelmina or Deadeye Nekyndalia. For DPS, New Hire Nebris (about 25 buffs, so 1,260% ATK per hit); DPS based on enemy HP (Nature's Claw Rou, Angelica) are strong early with no investment; those that count the number of enemies (Reclaimed Destiny Sacred Justia) are weaker here.</li>
</ul>

<p><strong>More from the official Discord (November 2026).</strong></p>
<ul>
<li><strong>4 groups, in this order</strong>: buffers (7 to 8 at most), chainers (5 to 7), semi-nukes (big damage in 2 to 4 hits), then nukes (one huge hit). Adjust the number of buffers to your physical or magic team.</li>
<li><strong>Buffers</strong>: Pure White Blessing Refithea and Onsen Manager Liberta are <strong>essential</strong> (each one roughly doubles your damage). Then: Homunculus Lathel, Dark Saintess Liberta, B-Rank Idol Helena, Medical Club Teresse, Arines, Kind Student Samay and Elpis. Arines is often preferred over Elpis. B-Rank Idol Helena and Dark Saintess Liberta help with crit rate.</li>
<li><strong>Chainers</strong>: start with Zenith, Sage Olstein, The Curse Celia and Pirate Rubia; otherwise, your 5 best characters that add Chains (for example Manager Gray). No Bunny Celia if you have Bride Refithea. Hikage, Wilhelmina and both Luvencias come after the other chainers.</li>
<li><strong>Semi-nukes</strong>: Night of Jealousy Levia, QoS Michaela, New Hire Nebris. <strong>Nukes</strong>: Comeback Idol Ventana, Promise of Vengeance Lathel (+2 free from the chapter 7 story), Nartas. A strong nuke can fit even in a team of the other type.</li>
<li><strong>Gear</strong>: your best offensive gear (ATK%/MATK% and Crit DMG substats) on your main DPS, with score 18 on the weapon, accessory and gloves. Use gear presets.</li>
<li><strong>Support Bonus</strong>: gear <strong>all</strong> characters, except the buffers you play that have only one costume. Gear value: UR IV &gt; UR event &gt; UR III &gt; SR EX &gt; UR II &gt; UR I. Aim for <strong>at least 4%</strong> per character. According to the Discord (<code>?cp</code>), the bonus is the character's <strong>total</strong> combat power ÷ 1,000, while the compendium counts it <strong>per costume</strong> (<a class="verify" href="#a-verifier">check in game</a>).</li>
<li><strong>Notes</strong>: costumes with an unlocked Burst automatically use their highest level. <strong>Never</strong> use fixed damage costumes. Adjust the order based on your Crit DMG. Tears go to characters with big damage boosts. Low damage usually means no crit or a bad team.</li>
</ul>
<h4>Mirror Wars: extra tips</h4>
<ul>
<li>Some costumes trigger <strong>before the fight</strong> ("turn 0") and already cost SP. Example: Comeback Idol Granhildr used that way on defense leaves 6 − 5 + 6 = 7 SP on turn 2.</li>
<li>Extra cocktails: events, or 40 cocktails for 170 Dia in the shop. The pass daily mission gives 200 medals.</li>
<li>Past Dia I, your rank depends on your <strong>position</strong>: Sapphire III from 3,001st to 5,000th place, up to Champion for 1st.</li>
</ul>
</div></section>
<section class="chapter" id="s14" data-title="Side content: Fantasia Square, Territory, fishing"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z"/><path d="M12 8v6"/><path d="M9.5 11.5L12 14l2.5-2.5"/></svg><b>14</b></span><h2>Side content: Fantasia Square, Territory, fishing</h2></header><div class="ch-body">
<p>These modes are chill and have almost no impact on progression. The Glupy Diner is covered in step 10.</p>
<h3 id="s14-1">Fantasia Square</h3>
<p>It's the central plaza, reached like a pack. You'll find the <strong>Goddess statue</strong> there: interact with it to pray every day (daily routine, the daily quest "Make a wish at the Goddess Statue"). To get there: pack collection, "Content Pack", Fantasia Square (Plaza), then walk to the statue. You'll also see the Mirror Wars champion statues to visit every week.</p>
<figure class="shot dc"><button aria-label="Enlarge: Getting to the Goddess statue: Content Pack, Fantasia Square, then the statue" class="shot-btn" data-full="img/dc-fwish.jpg" type="button"><img alt="Getting to the Goddess statue: Content Pack, Fantasia Square, then the statue" loading="lazy" src="img/dc-fwish.jpg"/></button><figcaption>Getting to the Goddess statue: Content Pack, Fantasia Square, then the statue<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h3 id="s14-2">Territory</h3>
<p>A village-management mode, at the bottom of the Fantasia Square stairs. It <strong>doesn't affect</strong> your progression: think of it as a pastime.</p>
<ul>
<li><strong>Woodcutting</strong>: only chop trees at stage 3 (5 minutes to grow), they give the most wood and XP.</li>
<li><strong>Mining</strong>: the quarry spawns one vein per minute (up to 9): stone, copper, iron, silver or gold.</li>
<li><strong>Farming</strong>: the source of <strong>Local Points</strong>, the Territory currency. Buy seeds, harvest, cook and sell dishes. Crops range from potatoes (1 minute) to saffron (20 hours).</li>
<li><strong>Advice</strong>: invest in farming first, and upgrade the axe and pickaxe to harvest more and unlock decorations.</li>
<li>Territory helpers keep producing while you're away: collect their earnings through <strong>Business Management</strong> on the home screen.</li>
</ul>
<h4>The Territory in more detail (compendium)</h4>
<ul>
<li><strong>The land</strong>: at the start, you pick 1 land out of 6 (plain, rivers, coast, beaches). It doesn't change your progress; the plain gives the most room, because you can only build bridges on water. Changing land later (through the phone) wipes everything: buildings refunded as materials, expansions refunded as Local Points, but crops, trees and ore veins are lost. You start with 9 areas and can open up to 25 with Local Points.</li>
<li><strong>Wood and mining</strong>: a new tree grows every minute (9 max) and reaches stage 3 in 5 minutes. Ore veins have no growth stages; their odds: stone 30%, iron 25%, copper 20%, silver 15%, gold 10%.</li>
<li><strong>Crops</strong>: 3 rarities (normal, rare, legendary), harvestable only at stage 3. Seeds are bought when you plant.</li>
<li><strong>Levels</strong>: woodcutting, mining and farming each have 10 levels. They unlock crops, dishes and decorations, and raise your skill (fewer hits to chop or mine, rarer crops). Some dishes give <strong>Lumber</strong>, <strong>Mineral</strong> or <strong>Crops</strong> bonuses: +1 item harvested per active bonus.</li>
<li><strong>Build order</strong>: Home, Cooking Pot, Workbench, Forge and 1 Resident Mansion during the starting missions; then the <strong>Fields</strong>; then Logging Site and Quarry; then Pub and Warehouse; then Helper Lodging; the other 4 Resident Mansions are purely decorative.</li>
<li><strong>Earning Local Points</strong>: when playing actively, mass-produce <strong>Virile Gnocchi</strong>. Later, eat a Lingerie Cookie, a Lustful Tart and a Libido Soup (Crops bonus) <strong>right before</strong> harvesting your expensive crops like Pulse Saffron, and always keep 3 of each dish in stock. In relaxed mode, any dish earns points: there's no rush in this mode.</li>
<li><strong>Tools</strong>: axe and pickaxe first (more items, sellable), then the sickle (rarer crops, several per swing). Tools come before helpers.</li>
<li><strong>Helpers</strong>: build the Helper Lodging, then recruit for 5,000 Local Points (1 helper out of 3 choices). Each helper has 3 stats from 1 to 6 (wood and ore per 4 hours, crop yield). Goblins and orcs are the most common (37% each); only the squirrel, the sheep and the rabbit can roll a 6 (in wood, mining and farming respectively, at 0.2%); the cat and the rare Yuridori have the best average. Helpers only harvest normal crops, into a separate stock.</li>
</ul>
<figure class="shot cp"><button aria-label="Enlarge: Recruiting a Territory helper" class="shot-btn" data-full="img/cp-helper-1.jpg" type="button"><img alt="Recruiting a Territory helper" loading="lazy" src="img/cp-helper-1.jpg"/></button><figcaption>Recruiting a Territory helper<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h3 id="s14-3">Fishing Voyage</h3>
<p>Fishing gives Lucky Silver Coins. Once far enough along, you can buy out its shop every month: 10 Gold Pockets, 30 <button class="term" data-tip="Raise the refinement score (powder) and reroll options (stones, crystals)" type="button">Refining Powder</button>, then 450 Deco Coins.</p>
</div></section>
<section class="chapter" id="s15" data-title="When you&#x27;re stuck"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M6.3 6.3l3.2 3.2M17.7 6.3l-3.2 3.2M6.3 17.7l3.2-3.2M17.7 17.7l-3.2-3.2"/></svg><b>15</b></span><h2>When you're stuck</h2></header><div class="ch-body">
<p>If you hit a wall on a fight after leveling your characters and gear, pin down the problem: not enough damage, too many deaths, or not enough reach. Each case has its fixes.</p>
<h3 id="s15-1">Not enough damage</h3>
<ol>
<li>Stack supports: offensive buffs from different skills stack. Arines with Kind Student Samay, for example, gives +120% ATK and 30% crit.</li>
<li>Build crit damage gear: it weighs more than ATK. In story, you can get by with a low crit rate, since you can retry.</li>
<li>Play element advantage: +50% base damage. Element disadvantage lowers your damage (the exact value shows on the stats screen, and you can check enemies' stats mid-battle). Also look at the season's element bonus.</li>
<li>Check the enemy's DEF and <button class="term" data-tip="Reduces physical / magic damage" type="button">M.RES</button>. If they're high, lower them (Marauder Kry, Elise) or play fixed damage (Justia, Alec).</li>
</ol>
<h3 id="s15-2">Your characters die too fast</h3>
<ol>
<li>Always read the enemies' next attacks and place your characters to dodge the AoEs. You can reposition everything before each turn.</li>
<li>Kill faster: more enemies dead on turn one, fewer hits taken.</li>
<li>If you can't kill everything, take out the hardest hitters first.</li>
<li>Use a taunt tank. Andrew (4★, Specialist) is recommended: easy to get, he taunts and can evade to cancel damage.</li>
<li>Sacrifice a secondary character if a huge hit is unavoidable.</li>
</ol>
<h3 id="s15-3">You can't reach every enemy</h3>
<p>Treat each fight as a puzzle: find the formation and skill order that hit as many enemies as possible on turn one. Knockback is key: it lines enemies up before your AoE.</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Knockback direction</th>
<th>Characters</th>
</tr>
</thead>
<tbody>
<tr>
<td>Forward</td>
<td>Most</td>
</tr>
<tr>
<td>Front-left</td>
<td>Lathel, Beatrice</td>
</tr>
<tr>
<td>Front-right</td>
<td>Layla, Rubia</td>
</tr>
<tr>
<td>Left</td>
<td>Emma, Ventana</td>
</tr>
<tr>
<td>Right</td>
<td>Angelica</td>
</tr>
<tr>
<td>Toward you (pull)</td>
<td>Dalvi</td>
</tr>
</tbody>
</table></div>
<p>Arines's knockback targets the "Skip" position (it jumps over the first enemy) and pushes the target back one tile. Violent Student Kry's knockback pushes two enemies back two tiles and deals heavy damage to any enemy it slams into.</p>
<h3 id="s15-4">Characters hurt or dead in a pack</h3>
<p>Run away and heal up. Healing pots break with the dash, and each pack has an inn that heals and revives your characters: look for it on the minimap. In character packs on Normal difficulty, you're forced to use a fixed team: it's a puzzle, and solution videos exist if you're stuck.</p>
</div></section>
<section class="chapter" id="s16" data-title="FAQ"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M9.6 9.5a2.5 2.5 0 0 1 4.8.8c0 1.7-2.4 2.2-2.4 3.7"/><circle cx="12" cy="17" r=".6"/></svg><b>16</b></span><h2>FAQ</h2></header><div class="ch-body">
<h3 id="s16-1">Gacha and characters</h3>
<p><strong>Is there a tier list?</strong> No reliable one: you swap characters depending on content. One rule always holds: <strong>supports come before DPS</strong>, because you use them everywhere.</p>
<p><strong>How do I get a character?</strong> A costume is one of the character's skills. Your first costume of a character automatically unlocks the character: you never pull "the character" itself.</p>
<p><strong>1-Pick or 12-Pick?</strong> For a beginner, the <strong>12-Pick</strong> banner is objectively better: put supports in it. The list of 12 recommended picks, with their targets, is in section 12 ("The 12-Pick banner").</p>
<p><strong>Property Tickets?</strong> They give a random ★5 of the chosen element. Early on, almost any element is good; you can aim for <span class="el el-light">Light</span> until you have a good Refithea.</p>
<p><strong>More tickets and Dia?</strong> Coupon codes (announced in the official Discord's announcement channel), Evil Castle, Character Packs, Event Packs, combat zone chests, Fiend Hunter, event and guild shops, passes, achievements… and simply playing.</p>
<p><strong>Who to recruit at the pub?</strong> Supports first: Diana (Story Pack 10), Dark Saintess Liberta (Story Pack 15), Queen of Gluttis Granadair (random spawn). Then: any pub costume with an active banner, Night of Death Mamonir, Fiend Scholar Olstein (Story Pack 4, if you have nothing else), Shattered Dream Palette (Story Pack 20), The Gluttonous Refithea, The Curse Celia.</p>
<h3 id="s16-2">Combat</h3>
<p><strong>How do elements work?</strong> <span class="el el-water">Water</span> &gt; <span class="el el-fire">Fire</span> &gt; <span class="el el-wind">Wind</span> &gt; <span class="el el-water">Water</span>. <span class="el el-light">Light</span> and <span class="el el-dark">Dark</span> each deal more damage to the other. Neutral takes neither more nor less damage.</p>
<p><strong>What makes a good team?</strong> A single damage type (physical or magic), 2 to 3 supports plus DPS, supports before DPS in the order, no element buff if it does nothing, varied buff types, enough SP to fire everything on turn 1, aiming to win on turn 1 (turn 3 at worst), and your best gear.</p>
<p><strong>Stuck on a boss?</strong> Against a lone boss: physical team with Zenith and Ventana (borrowed from a friend) as DPS. Against a boss with adds: borrow Sacred Justia or Bunny Loen.</p>
<p><strong>Lost a story battle?</strong> On Normal, you can pay <strong>10,000 gold</strong> to continue (the price goes up each time): the turn, your characters' HP, SP and cooldowns are reset; enemies keep their HP and SP, but their cooldowns are reset too. It only works on Normal, in the story. You can also borrow characters from friends (Normal, Hard and event Challenge battles): the official Discord's friend-support channel helps you find some.</p>
<figure class="shot cp"><button aria-label="Enlarge: Team against a boss with minions" class="shot-btn" data-full="img/cp-aoe_boss_kit.jpg" type="button"><img alt="Team against a boss with minions" loading="lazy" src="img/cp-aoe_boss_kit.jpg"/></button><figcaption>Team against a boss with minions<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p>Two bosses need their own solution: the White Witch (Story Pack 13, Song of Snow), and Apostle Partan (Story Pack 11, Fake Game), for whom the compendium suggests another team.</p>
<figure class="shot cp"><button aria-label="Enlarge: Solution against the White Witch (Story Pack 13)" class="shot-btn" data-full="img/cp-White_Witch.jpg" type="button"><img alt="Solution against the White Witch (Story Pack 13)" loading="lazy" src="img/cp-White_Witch.jpg"/></button><figcaption>Solution against the White Witch (Story Pack 13)<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<figure class="shot cp"><button aria-label="Enlarge: Another solution against Apostle Partan (Story Pack 11)" class="shot-btn" data-full="img/cp-partan.jpg" type="button"><img alt="Another solution against Apostle Partan (Story Pack 11)" loading="lazy" src="img/cp-partan.jpg"/></button><figcaption>Another solution against Apostle Partan (Story Pack 11)<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p><strong>No monsters in the Hunting Ground?</strong> It's a bug tied to an active main or NPC quest: abandon it (tap the <strong>+</strong> of the quest tracker, then the trash icon), then leave and enter the Hunting Ground again.</p>
<figure class="shot dc"><button aria-label="Enlarge: Abandoning the quest: the + of the quest tracker, then the trash icon" class="shot-btn" data-full="img/dc-hgnomob.jpg" type="button"><img alt="Abandoning the quest: the + of the quest tracker, then the trash icon" loading="lazy" src="img/dc-hgnomob.jpg"/></button><figcaption>Abandoning the quest: the + of the quest tracker, then the trash icon<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h3 id="s16-3">Progression</h3>
<p><strong>Who to build first?</strong> Levels: your DPS (with Slimes). Potential: supports. Gear: DPS. Engraving and Awakening: too expensive early, save your resources (if a Guide Pass task requires it, Nebris is a good pick). Burst: mostly supports.</p>
<h3 id="s16-4">Technical</h3>
<ul>
<li><strong>Playing on PC</strong>: there's an official PC client (link in the compendium FAQ).</li>
<li><strong>Characters all black?</strong> Turn off Silhouette Mode. If you're in a pack, first tap the home icon at the top right; then the 4-squares button, Setting, Graphics, Silhouette Mode, Disable. On PC, a Ctrl shortcut turns it on or off. In the same menu, turning off <strong>Field blur</strong> improves performance, and skill cutscenes can play only once a day.</li>
<li><strong>Showing your costumes to ask for advice</strong>: go to Last Night (walk to the sword icon on the map), then Replace, Replace, Reset, Confirm; sort by "Deployed First" and take a screenshot. If you're stuck on a battle, post a screenshot in the game-help channel (verify your Discord account to be able to send images). For a question about Awakening, Potential or Burst, show the character tab with "View Costume" turned on; for gear, the 2nd menu of the character tab, or your Bag sorted with your custom marks.</li>
<li><strong>Modified versions</strong>: in Germany, a few sprites, cutscenes, Medical Club Teresse's Fated Guest and the Slap Pop Pop! mini-game are changed or removed; in Korea, some scenes of Shattered Dream Palette and Retired Legend Olivier. The game isn't legally available in Vietnam or the Netherlands.</li>
</ul>
<figure class="shot cp"><button aria-label="Enlarge: Showing your costumes from Last Night" class="shot-btn" data-full="img/cp-box_costumes.jpg" type="button"><img alt="Showing your costumes from Last Night" loading="lazy" src="img/cp-box_costumes.jpg"/></button><figcaption>Showing your costumes from Last Night<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<figure class="shot dc"><button aria-label="Enlarge: Turning off Silhouette Mode: home icon, 4-squares menu, Setting, Graphics" class="shot-btn" data-full="img/dc-censor.jpg" type="button"><img alt="Turning off Silhouette Mode: home icon, 4-squares menu, Setting, Graphics" loading="lazy" src="img/dc-censor.jpg"/></button><figcaption>Turning off Silhouette Mode: home icon, 4-squares menu, Setting, Graphics<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<figure class="shot dc"><button aria-label="Enlarge: Showing all your costumes from Last Night, step by step" class="shot-btn" data-full="img/dc-box.jpg" type="button"><img alt="Showing all your costumes from Last Night, step by step" loading="lazy" src="img/dc-box.jpg"/></button><figcaption>Showing all your costumes from Last Night, step by step<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
</div></section>
<section class="chapter" id="s17" data-title="Mistakes to avoid, checklist and sources"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4"/><path d="M6 4h11l-2 4 2 4H6"/></svg><b>17</b></span><h2>Mistakes to avoid, checklist and sources</h2></header><div class="ch-body">
<p>The costliest beginner mistakes involve rare resources and pulls. Here are the ones to avoid, then a checklist for your first days.</p>
<h3 id="s17-1">Common mistakes</h3>
<ul>
<li>Locking in an Infinite Draw without comparing: there's no going back.</li>
<li>Recruiting 3★ or 4★ characters at the pub, instead of saving contracts for 5★.</li>
<li>Forgetting the premium pass: always keep 1,000 Dia aside.</li>
<li>Spending <button class="term" data-tip="Earned from dupes past +5; points shop" type="button">Golden Thread</button>, <button class="term" data-tip="Earned on every draw; points shop" type="button">Powder of Hope</button> or Tears of the Goddess without following the priorities in section 11.</li>
<li>Building tanks (Lecliss, Seir) too early.</li>
<li>Refining gear you'll soon replace.</li>
<li>Starting several Hard or Very Hard modes at once: you lock your daily quests.</li>
<li>Neglecting gold: you'll run short in endgame.</li>
<li>Not linking your account.</li>
</ul>
<h3 id="s17-2">First-days checklist</h3>
<div class="checklist" data-cad="none" data-prio="high" data-role="" data-scope="First-days checklist"><div class="cl-bar"><span aria-live="polite" class="cl-count"></span><div class="cl-track"><span class="cl-fill"></span></div><button class="cl-reset" type="button">Untick all</button></div><ul class="tasks"><li class="task"><label><input class="tick" data-k="63ed304d0f" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Finish the tutorial and pick your Infinite Draw target (The Curse Celia).</span></label></li><li class="task"><label><input class="tick" data-k="d7a217ac10" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Link your account (ETC, then Link Account).</span></label></li><li class="task"><label><input class="tick" data-k="f2724c97a1" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Do the Newbie Pass quests every day for 7 days.</span></label></li><li class="task"><label><input class="tick" data-k="1daac512a6" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Clear the third story pack to unlock Path of Adventure.</span></label></li><li class="task"><label><input class="tick" data-k="c674542b21" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Recruit Diana (Story Pack 10) then Liberta (Story Pack 15).</span></label></li><li class="task"><label><input class="tick" data-k="53a3c69ffb" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Level Gear Craft (Layla or Fred) and Alchemy (Scheherazade).</span></label></li><li class="task"><label><input class="tick" data-k="6f4d6289c5" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Deal at least 10,000 damage in Last Night, then talk to Isaac every day.</span></label></li><li class="task"><label><input class="tick" data-k="19f622473e" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Buy the premium pass (1,000 Dia) every season.</span></label></li><li class="task"><label><input class="tick" data-k="3931c1ffe9" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt">Take part in Mirror Wars and the Evil Castle every season.</span></label></li></ul></div>
<h3 id="s17-3">How fresh is this</h3>
<p>I couldn't check every number in game. BotAn's compendium (November 2026) and the Discord checklist were used to fix outdated points; the base guides date from 2023 to 2025 (dotgg's reroll guide is from April 2025, the routines from September 2024), and a June 2026 ranking gives the current meta characters. Some values may have changed: daily resources (40, then 60, then 90 <button class="term" data-tip="Energy for Path of Adventure" type="button">Cooked Rice</button> depending on how old the source is), draw points, rates. When in doubt, trust the game screen. Several points have since been confirmed by players on the official Discord (November 2026). The extras marked "official Discord" come from its bot's guides (November 2026): the daily reset at midnight UTC is confirmed there by the <code>?rtime</code> command.</p>
<span id="a-verifier" class="anchor"></span><h3 id="s17-4">Check in game</h3>
<p>These points are confirmed by only one source, or the sources disagree: they still need to be checked in game. If you check them, send me what you see (Lyph, on the official Discord): I'll update the guide.</p>
<div class="checklist" data-cad="none" data-prio="high" data-role="verify" data-scope="Check in game"><div class="cl-bar"><span aria-live="polite" class="cl-count"></span><div class="cl-track"><span class="cl-fill"></span></div><button class="cl-reset" type="button">Untick all</button></div><ul class="tasks"><li class="task"><label><input class="tick" data-k="4717e08921" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Death Time</strong>: the numbers (+100% ATK, −100% defense, +50% damage taken). Drag out an easy fight to turn 11, then tap the Death Time icon at the top left.</span></label></li><li class="task"><label><input class="tick" data-k="eab486ebab" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Weekly reset</strong>: Wednesday at 15:00 UTC (16:00 in Belgium) for weekly missions, as the guide assumes. Watch when your weekly bar empties.</span></label></li><li class="task"><label><input class="tick" data-k="08064b99a4" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Field abilities</strong>: do the Absorption, Assemble and Overpower attempts come back every day (the guide's checklist) or every week (official Discord)?</span></label></li><li class="task"><label><input class="tick" data-k="b7a259b3ad" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Last Night Support Bonus</strong>: counted per costume (compendium) or per character (official Discord)? Look at the Support Bonus screen.</span></label></li><li class="task"><label><input class="tick" data-k="16b9f768b4" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Pub</strong>: does recruiting 3★ and 4★ make more 5★ show up?</span></label></li><li class="task"><label><input class="tick" data-k="f03e289a89" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Mirror Wars</strong>: how many battles can Repeat Battle chain at most (40 or 10)?</span></label></li><li class="task"><label><input class="tick" data-k="b893a9cb57" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Ancient Crystals</strong>: do the Towers of Wrath and Jealousy give any?</span></label></li><li class="task"><label><input class="tick" data-k="23900fb74b" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Powder farming</strong>: 2,000 pieces at once, or 2 batches of 1,000?</span></label></li><li class="task"><label><input class="tick" data-k="4ad2b093ff" type="checkbox"/><span aria-hidden="true" class="box"></span><span class="tt"><strong>Name</strong>: "Frost Queen" or "Frozen Queen" Wilhelmina?</span></label></li></ul></div>

      meters: ['Étapes du parcours', 'Objectifs de la semaine', 'Routine du jour', 'Progression complète', 'À vérifier en jeu'],
      syncOn: 'Coches synchronisées avec ton compte (téléphone et ordinateur).', syncOff: 'Coches enregistrées sur cet appareil.',
      prio: 'Prioritaire seulement', now: 'maintenant', d: ' j ',
      cDaily: 'Reset quotidien', cAt: 'à ', cLocked: 'Décompte en cours', cEnds: 'Fin des contenus de la semaine', cNewWeek: 'nouvelle semaine ', cCloses: 'clôture ',
      cNext: 'Cycle suivant', cOn: 'le ',
      week: function (n) { return 'Semaine <b>' + n + '</b> sur 4 du cycle'; }, finished: ' · fini',

      packs: { 3: { 1: 'Last Night, Path of Adventure and Mirror Wars' }, 4: { 1: 'Evil Castle' }, 6: { 1: 'Golden Colosseum' },
        7: { 1: 'Hunting Ground 7 and 1 copy of Lathel', 2: '+1 copy of Lathel', 3: '+1 copy of Lathel (3 total)' },

      colon: ': ', packAria: 'Difficulties cleared for pack ', nextGoal: 'Next goal', on: ' on ',
      allGoals: 'Key goals done', allGoalsT: 'Diana and Liberta are unlocked: on to endgame content.',

      syncOn: 'Ticks synced with your account (phone and computer).', syncOff: 'Ticks saved on this device.',
      prio: 'Priority only', now: 'now', d: ' d ',
      cDaily: 'Daily reset', cAt: 'at ', cLocked: 'Settlement in progress', cEnds: "This week's content ends", cNewWeek: 'new week ', cCloses: 'closes ',
      cNext: 'Next cycle', cOn: 'on ',
      week: function (n) { return 'Week <b>' + n + '</b> of 4 in the cycle'; }, finished: ' · done',

  /* ---------- reset boundaries (UTC, like the game) ---------- */
  function bounds(now) {

    var w = new Date(now); w.setUTCHours(15, 0, 0, 0);
    var back = (w.getUTCDay() - 3 + 7) % 7; w.setUTCDate(w.getUTCDate() - back);
    if (w.getTime() > now) w.setUTCDate(w.getUTCDate() - 7);
    var cyc = function (len) { return ANCHOR + Math.floor((now - ANCHOR) / (len * DAY)) * len * DAY; };
    var m = new Date(now);

  }

  /* key -> cadence, identical in both languages (read from the FR template) */
  var keyCad = {};
  document.getElementById('tpl-fr').content.querySelectorAll('.chapter .checklist').forEach(function (cl) {
    cl.querySelectorAll('.tick').forEach(function (b) { keyCad[b.dataset.k] = cl.dataset.cad; });
  });
  function applyResets() {
    var b = bounds(Date.now()), changed = false;
    Object.keys(b).forEach(function (cad) {

      if (S.stamps[cad] < b[cad]) {
        Object.keys(S.ticks).forEach(function (k) { if (keyCad[k] === cad) { delete S.ticks[k]; } });
        S.stamps[cad] = b[cad]; changed = true;

  }

  /* ---------- persistence + sync (independent of the language) ---------- */
  var view = null, syncOn = false;
  var ref = null, remoteOk = false, writeTimer = null, writing = false, pending = false;
  function saveLocal() { wr(KEY, S); }
  function touch() { S.updatedAt = Date.now(); saveLocal(); queueRemote(); }
  function queueRemote() {
    if (!ref || !remoteOk) return;
    clearTimeout(writeTimer); writeTimer = setTimeout(flush, 1200);
  }
  function flush() {
    if (!ref || !remoteOk) return;
    if (writing) { pending = true; return; }
    writing = true;
    ref.set({ ticks: S.ticks, steps: S.steps, packs: S.packs, stamps: S.stamps, updatedAt: S.updatedAt }).then(function () {
      writing = false; if (pending) { pending = false; flush(); }
    }, function (e) {
      writing = false;

    });
  }
  function setSync(on) { syncOn = on; if (view) view.setSync(on); }
  function initSync() {
    if (!window.claude || typeof window.claude.use !== 'function') return;

      var db = r[0], user = r[1];

        if (!id) return;

        var first = true;
        ref.onSnapshot(function (snap) {
          var d = snap.exists ? (snap.data() || {}) : null;
          if (d && (d.updatedAt || 0) > S.updatedAt) {

            saveLocal();

            if (view) view.renderAll();

            setTimeout(queueRemote, 0);
          }
          first = false;
          if (remoteOk) setSync(true);
        }, function () { setSync(false); });
      });
    }).catch(function () {});
  }

  /* ---------- one language view ---------- */
  function View(lang) {
    var T = I18N[lang], offs = [], timer = null, io = null;
    function on(t, ev, fn, opt) { t.addEventListener(ev, fn, opt); offs.push(function () { t.removeEventListener(ev, fn, opt); }); }
    var app = document.getElementById('app');
    app.innerHTML = '';
    app.appendChild(document.getElementById('tpl-' + lang).content.cloneNode(true));
    document.documentElement.lang = lang;
    document.title = T.title;

    /* checklists */
    var origLists = Array.prototype.slice.call(app.querySelectorAll('.chapter .checklist'));
    function mirror(cad, target) {
      var box = document.getElementById(target);
      origLists.filter(function (cl) { return cl.dataset.cad === cad && cl.closest('#s7'); }).forEach(function (cl) {
        var prev = cl.previousElementSibling;
        if (prev && prev.classList.contains('prio-label')) box.appendChild(prev.cloneNode(true));
        box.appendChild(cl.cloneNode(true));
      });
    }
    mirror('daily', 'today-daily');
    mirror('weekly', 'today-weekly');
    var allLists = Array.prototype.slice.call(app.querySelectorAll('.checklist'));
    function refreshList(cl) {
      var boxes = cl.querySelectorAll('.tick'), n = 0;
      boxes.forEach(function (b) { b.checked = !!S.ticks[b.dataset.k]; if (b.checked) n++; });
      cl.querySelector('.cl-count').textContent = n + ' / ' + boxes.length;
      cl.querySelector('.cl-fill').style.width = (boxes.length ? 100 * n / boxes.length : 0) + '%';
      cl.classList.toggle('done', n === boxes.length && n > 0);
    }

    /* steps */
    var steps = Array.prototype.slice.call(app.querySelectorAll('.step'));
    function refreshSteps() {
      steps.forEach(function (st) {
        var n = st.dataset.step, done = !!S.steps[n];

        box.querySelector('.s-v').textContent = c + ' / ' + steps.length + T.stepsDone;
        steps.forEach(function (s) {
          var a = document.createElement('a'); a.href = '#' + s.querySelector('h3').id; a.textContent = s.dataset.step;
          a.title = s.querySelector('h3').textContent; if (S.steps[s.dataset.step]) a.className = 'ok';
          box.querySelector('.dots').appendChild(a);
        });
      }
    }

    /* story packs */
    function gainsText(n) {
      var g = T.packs[n] || {};
      return Object.keys(g).map(function (k) { return DN[k] + T.colon + g[k]; }).join(' · ');
    }
    function refreshPacks() {
      var box = document.getElementById('pack-tracker'); if (!box) return;
      var next = null;
      for (var i = 0; i < GOALS.length; i++) { if ((S.packs[GOALS[i][0]] || 0) < GOALS[i][1]) { next = GOALS[i]; break; } }
      var h = '<div class="packs"><p class="packs-next" id="packs-next"></p><ol class="rail">';
      for (var n = 1; n <= 16; n++) {
        var lvl = S.packs[n] || 0, isKey = !!T.packs[n];
        h += '<li class="' + (isKey ? 'key ' : '') + (lvl ? 'n-done' : '') + '"><span class="p-name"><small>' + (n < 10 ? '0' : '') + n + '</small>' + (PACKN[n] || 'Story Pack ' + n) + '</span>' +
          '<span class="diff" role="group" aria-label="' + T.packAria + n + '">' +
          [1, 2, 3].map(function (d) { return '<button type="button" data-pack="' + n + '" data-d="' + d + '" aria-pressed="' + (lvl >= d) + '">' + ['', 'N', 'H', 'VH'][d] + '</button>'; }).join('') +
          '</span>' + (isKey ? '<span class="p-gain"></span>' : '') + '</li>';
      }
      h += '</ol></div>';
      box.innerHTML = h;
      var lis = box.querySelectorAll('.rail li');
      for (var m = 1; m <= 16; m++) { var pg = lis[m - 1].querySelector('.p-gain'); if (pg) pg.textContent = gainsText(m); }
      var nx = document.getElementById('packs-next');

        nx.querySelector('b').textContent = T.nextGoal;
        nx.appendChild(document.createTextNode('Story Pack ' + next[0] + ' (' + PACKN[next[0]] + ')' + T.on + DN[next[1]] + ' → ' + T.packs[next[0]][next[1]]));
      } else {
        nx.querySelector('b').textContent = T.allGoals;
        nx.appendChild(document.createTextNode(T.allGoalsT));
      }
    }

    /* meters */
    function meters() {
      var box = document.getElementById('meters'); box.innerHTML = '';
      var defs = [
        [T.meters[0], null],
        [T.meters[1], function (cl) { return cl.closest('#s5') && cl.dataset.role === 'goals'; }],
        [T.meters[2], function (cl) { return cl.closest('#s7') && cl.dataset.cad === 'daily'; }],
        [T.meters[3], function (cl) { return !!cl.closest('#s6'); }],
        [T.meters[4], function (cl) { return cl.dataset.role === 'verify'; }, '#a-verifier']
      ];
      defs.forEach(function (d) {
        var t = 0, n = 0;
        if (!d[1]) { t = steps.length; n = steps.filter(function (s) { return S.steps[s.dataset.step]; }).length; }
        else origLists.filter(d[1]).forEach(function (cl) { cl.querySelectorAll('.tick').forEach(function (b) { t++; if (S.ticks[b.dataset.k]) n++; }); });
        if (!t) return;
        var el = document.createElement(d[2] ? 'a' : 'div'); el.className = 'meter'; if (d[2]) { el.href = d[2]; el.classList.add('meter-link'); }
        el.innerHTML = '<div class="m-l"></div><div class="m-v"></div><div class="cl-track"><span class="cl-fill"></span></div>';
        el.querySelector('.m-l').textContent = d[0]; el.querySelector('.m-v').textContent = n + ' / ' + t;
        el.querySelector('.cl-fill').style.width = (100 * n / t) + '%';
        box.appendChild(el);
      });
    }
    function renderAll() { allLists.forEach(refreshList); refreshSteps(); refreshPacks(); meters(); }
    function showSync(onState) {
      var el = document.getElementById('sync');
      el.classList.toggle('on', onState);
      document.getElementById('sync-t').textContent = onState ? T.syncOn : T.syncOff;
    }

    /* events */
    on(document, 'change', function (e) {
      var t = e.target;
      if (t.classList.contains('tick')) {
        if (t.checked) S.ticks[t.dataset.k] = 1; else delete S.ticks[t.dataset.k];
        touch(); allLists.forEach(refreshList); meters();
      } else if (t.classList.contains('step-tick')) {
        if (t.checked) S.steps[t.dataset.step] = 1; else delete S.steps[t.dataset.step];
        var st = t.closest('.step'); if (t.checked) st.classList.add('folded');
        touch(); refreshSteps(); meters();
      } else if (t.classList.contains('prio-sw')) {
        UI.prioOnly = t.checked; wr(UIKEY, UI);
        document.body.classList.toggle('prio-only', UI.prioOnly);
        document.querySelectorAll('.prio-sw').forEach(function (x) { x.checked = UI.prioOnly; });
      }
    });
    on(document, 'click', function (e) {
      var ls = e.target.closest('.lang-sw button');
      if (ls) { if (ls.dataset.lang !== lang) switchLang(ls.dataset.lang, ls); return; }
      var r = e.target.closest('.cl-reset');
      if (r) {
        r.closest('.checklist').querySelectorAll('.tick').forEach(function (b) { delete S.ticks[b.dataset.k]; });
        touch(); allLists.forEach(refreshList); meters(); return;
      }
      var tg = e.target.closest('.step-toggle');
      if (tg) { tg.closest('.step').classList.toggle('folded'); refreshSteps(); return; }
      var pb = e.target.closest('.diff button');
      if (pb) {
        var n = pb.dataset.pack, d = +pb.dataset.d, cur = S.packs[n] || 0;
        var nv = cur === d ? d - 1 : d; if (nv) S.packs[n] = nv; else delete S.packs[n];
        touch(); refreshPacks(); return;
      }
    });

    /* prio toggle (today + routines) */
    document.getElementById('prio-only').classList.add('prio-sw');
    var slot = app.querySelector('.prio-toggle-slot');
    if (slot) { slot.className = 'tools'; slot.innerHTML = '<label class="switch"><input type="checkbox" class="prio-sw"><span class="sw" aria-hidden="true"></span></label>'; slot.querySelector('label').appendChild(document.createTextNode(T.prio)); }
    app.querySelectorAll('.prio-sw').forEach(function (x) { x.checked = !!UI.prioOnly; });
    document.body.classList.toggle('prio-only', !!UI.prioOnly);

    /* today: clocks + cycle */
    var fmtDay = new Intl.DateTimeFormat(T.locale, { weekday: 'long', day: 'numeric', month: 'long' });
    var fmtShort = new Intl.DateTimeFormat(T.locale, { day: 'numeric', month: 'short' });
    var fmtHour = new Intl.DateTimeFormat(T.locale, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
    function left(ms) {
      if (ms <= 0) return T.now;
      ms = Math.ceil(ms / 60000) * 60000;
      var d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / HOUR), m = Math.floor(ms % HOUR / 60000);
      return (d ? d + T.d : '') + (d || h ? h + ' h ' : '') + (d ? '' : m + ' min');
    }
    var WEEKS = [['Guild Raid', 'Golden Colosseum'], ['Fiend Hunter', 'Golden Colosseum'], ['Golden Colosseum'], ['Fiend Hunter', 'Golden Colosseum']];
    function cycleInfo(now) {
      var day = Math.floor((now - ANCHOR) / DAY), cyc = Math.floor(day / 28), start = ANCHOR + cyc * 28 * DAY;
      var wi = Math.floor((day - cyc * 28) / 7);
      var weeks = WEEKS.map(function (c, i) { var s = start + i * 7 * DAY; return { i: i, start: s, end: s + 6 * DAY + 15 * HOUR, c: c }; });
      return { wi: wi, weeks: weeks, next: start + 28 * DAY };
    }
    function clock(l, v, s) { return '<div class="clock"><div class="c-l">' + l + '</div><div class="c-v">' + v + '</div><div class="c-s">' + s + '</div></div>'; }
    function tick() {
      var now = Date.now(), b = bounds(now), ci = cycleInfo(now), w = ci.weeks[ci.wi];
      document.getElementById('today-date').textContent = fmtDay.format(now);
      var nextDaily = b.daily + DAY;
      var locked = now > w.end;
      document.getElementById('clocks').innerHTML =
        clock(T.cDaily, left(nextDaily - now), T.cAt + fmtHour.format(nextDaily)) +
        clock(locked ? T.cLocked : T.cEnds, locked ? left(w.start + 7 * DAY - now) : left(w.end - now), locked ? T.cNewWeek + fmtHour.format(w.start + 7 * DAY) : T.cCloses + fmtHour.format(w.end)) +
        clock(T.cNext, left(ci.next - now), T.cOn + fmtShort.format(ci.next));
      var strip = '<span class="pill">' + T.week(ci.wi + 1) + '</span>';
      w.c.forEach(function (c) { strip += '<span class="pill ' + (locked ? 'lock' : 'hot') + '">' + c + (locked ? T.finished : '') + '</span>'; });
      document.getElementById('week-strip').innerHTML = strip;
      renderCal(ci);
      if (applyResets()) { touch(); renderAll(); }
    }
    function renderCal(ci) {
      var box = document.getElementById('cycle-cal'); if (!box) return;
      box.innerHTML = '<div class="cal">' + ci.weeks.map(function (w) {
        var cur = w.i === ci.wi;
        return '<div class="cal-row' + (cur ? ' now' : '') + '"><div class="w">' + T.calWeek + (w.i + 1) + (cur ? '<small>' + T.calNow + '</small>' : '') + '</div><div><div class="d">' + T.calRange(fmtShort.format(w.start), fmtShort.format(w.end), fmtHour.format(w.end)) + '</div><div class="chips">' +
          w.c.map(function (c) { return '<span class="pill' + (cur ? ' hot' : '') + '">' + c + '</span>'; }).join('') + '</div></div></div>';
      }).join('') + '</div>';
    }

    /* drawer */
    var rack = document.getElementById('rack'), scrim = document.getElementById('scrim'), openBtn = document.getElementById('menu-open');
    function openRack() { rack.classList.add('open'); scrim.hidden = false; openBtn.setAttribute('aria-expanded', 'true'); }
    function closeRack() { rack.classList.remove('open'); scrim.hidden = true; openBtn.setAttribute('aria-expanded', 'false'); }
    on(openBtn, 'click', openRack);
    on(document.getElementById('menu-close'), 'click', closeRack);
    on(scrim, 'click', closeRack);
    on(rack, 'click', function (e) { if (e.target.closest('.nav-list a')) closeRack(); });

    /* active section + resume */
    var navLinks = {};
    app.querySelectorAll('.nav-list a').forEach(function (a) { navLinks[a.dataset.sec] = a; });
    var titles = {};
    app.querySelectorAll('.chapter').forEach(function (s) { titles[s.id] = s.dataset.title; });
    if ('IntersectionObserver' in window) {
      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          Object.keys(navLinks).forEach(function (k) { navLinks[k].classList.toggle('on', k === en.target.id); });
          if (titles[en.target.id] && UI.last !== en.target.id) { UI.last = en.target.id; wr(UIKEY, UI); }
        });
      }, { rootMargin: '-30% 0px -65% 0px' });
      app.querySelectorAll('.chapter, #today').forEach(function (s) { io.observe(s); });
    }
    function setResume(show) {
      var resume = document.getElementById('resume');
      if (show && UI.last && titles[UI.last] && UI.last !== 's1') {
        resume.href = '#' + UI.last;
        resume.textContent = T.resume + UI.last.slice(1).padStart(2, '0') + ' · ' + titles[UI.last] + ' →';
        resume.hidden = false; return true;
      }
      return false;
    }

    /* back to top */
    var totop = document.getElementById('totop');
    function onScroll() { totop.hidden = window.scrollY < 900; }
    on(window, 'scroll', onScroll, { passive: true });
    on(totop, 'click', function () { window.scrollTo(0, 0); });

    /* glossary tips */
    var tip = document.getElementById('tip'), tipFor = null;
    function hideTip() { tip.hidden = true; if (tipFor) tipFor.setAttribute('aria-expanded', 'false'); tipFor = null; }
    on(document, 'click', function (e) {
      var t = e.target.closest('.term');
      if (!t) { if (!e.target.closest('#tip')) hideTip(); return; }
      if (tipFor === t) { hideTip(); return; }
      hideTip();
      tip.innerHTML = '<b></b><span></span>';
      tip.querySelector('b').textContent = t.textContent; tip.querySelector('span').textContent = t.dataset.tip;
      tip.hidden = false; tipFor = t; t.setAttribute('aria-expanded', 'true');
      var r = t.getBoundingClientRect(), tw = tip.offsetWidth, vw = document.documentElement.clientWidth;
      var x = Math.min(Math.max(16, r.left + window.scrollX), window.scrollX + vw - tw - 16);
      tip.style.left = x + 'px'; tip.style.top = (r.bottom + window.scrollY + 8) + 'px';
    });

    /* lightbox */
    var lb = document.getElementById('lb'), lbImg = document.getElementById('lb-img'), lbCap = document.getElementById('lb-cap');
    on(document, 'click', function (e) {
      var b = e.target.closest('.shot-btn'); if (!b) return;
      var img = b.querySelector('img');
      lbImg.src = b.dataset.full; lbImg.alt = img.alt; lbCap.textContent = img.alt; lb.hidden = false;
      document.getElementById('lb-close').focus();
    });
    function closeLb() { lb.hidden = true; lbImg.removeAttribute('src'); }
    on(document.getElementById('lb-close'), 'click', closeLb);
    on(lb, 'click', function (e) { if (e.target === lb) closeLb(); });
    on(document, 'keydown', function (e) { if (e.key === 'Escape') { closeLb(); closeRack(); hideTip(); } });

    /* search */
    function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\u00a0\u202f]/g, ' '); }
    var idx = [];
    app.querySelectorAll('.chapter').forEach(function (sec) {
      sec.querySelectorAll('.ch-body h3, .ch-body h4, .ch-body p, .ch-body li, .ch-body td').forEach(function (el) {
        var t = el.textContent.replace(/\s+/g, ' ').trim();
        if (t.length > 2) idx.push({ el: el, t: t, low: norm(t), sec: sec.dataset.title });
      });
    });
    var q = document.getElementById('q'), res = document.getElementById('results');
    on(q, 'input', function () {
      var v = norm(q.value.trim()); res.innerHTML = '';
      if (v.length < 2) { res.hidden = true; return; }
      var hits = idx.filter(function (x) { return x.low.indexOf(v) > -1; }).slice(0, 30);
      res.hidden = false;
      if (!hits.length) { var li0 = document.createElement('li'); li0.className = 'r-empty'; li0.textContent = T.noRes(q.value.trim()); res.appendChild(li0); return; }
      hits.forEach(function (h) {
        var i = h.low.indexOf(v), start = Math.max(0, i - 40), snip = h.t.slice(start, i + v.length + 60), j = i - start;
        var li = document.createElement('li'), b = document.createElement('button'); b.type = 'button';
        var s = document.createElement('span'); s.className = 'r-sec'; s.textContent = h.sec; b.appendChild(s);
        b.appendChild(document.createTextNode((start ? '… ' : '') + snip.slice(0, j)));
        var m = document.createElement('mark'); m.textContent = snip.slice(j, j + v.length); b.appendChild(m);
        b.appendChild(document.createTextNode(snip.slice(j + v.length) + ' …'));
        b.addEventListener('click', function () {
          closeRack();
          var st = h.el.closest('.step.folded'); if (st) { st.classList.remove('folded'); refreshSteps(); }
          h.el.scrollIntoView({ block: 'center' });
          h.el.classList.remove('flash'); void h.el.offsetWidth; h.el.classList.add('flash');
        });
        li.appendChild(b); res.appendChild(li);
      });
    });

    /* init */
    steps.forEach(function (st) { if (S.steps[st.dataset.step]) st.classList.add('folded'); });
    renderAll(); showSync(syncOn); tick(); onScroll();
    timer = setInterval(tick, 30000);

    return {
      renderAll: renderAll, setSync: showSync, setResume: setResume, openRack: openRack,
      isRackOpen: function () { return rack.classList.contains('open'); },
      destroy: function () { offs.forEach(function (f) { f(); }); offs = []; clearInterval(timer); if (io) io.disconnect(); }
    };
  }

  /* ---------- language switch: keep the reader at the same place ---------- */
  function anchorNow() {
    var els = document.querySelectorAll('#app .chapter, #app .ch-body h3[id], #app #today, #app .hero'), best = null;
    var lim = 90;
    for (var i = 0; i < els.length; i++) {
      var r = els[i].getBoundingClientRect();
      if (r.top <= lim) best = { el: els[i], top: r.top }; else break;
    }
    if (!best) return null;
    return { id: best.el.id || (best.el.classList.contains('hero') ? '' : null), top: best.top };
  }
  var resumeShown = false;
  function switchLang(lang, btn) {
    if (!I18N[lang]) return;
    var where = btn ? (btn.closest('.rack') ? 'rack' : 'topbar') : null;
    var wasOpen = view && view.isRackOpen();
    var a = window.scrollY > 0 ? anchorNow() : null;
    UI.lang = lang; wr(UIKEY, UI);
    if (view) view.destroy();
    view = View(lang);
    var de = document.documentElement, prev = de.style.scrollBehavior;
    de.style.scrollBehavior = 'auto';
    if (a && a.id) {
      var el = document.getElementById(a.id);
      if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - a.top);
    } else if (!a) { window.scrollTo(0, 0); }
    de.style.scrollBehavior = prev;
    if (wasOpen) view.openRack();
    if (resumeShown) view.setResume(true);
    if (where) {
      var nb = document.querySelector((where === 'rack' ? '.rack' : '.topbar') + ' .lang-sw button[data-lang="' + lang + '"]');
      if (nb) nb.focus({ preventScroll: true });
    }
  }

  /* ---------- boot ---------- */
  if (applyResets()) { S.updatedAt = S.updatedAt || 0; saveLocal(); }
  view = View(UI.lang);
  if (!location.hash) resumeShown = view.setResume(true);
  initSync();
})();
</script>
