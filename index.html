<h3 id="s8-4">How to play a turn</h3>
<ol>
<li>Tap an enemy to see its skills and what it'll do next turn. Its plan is already locked in.</li>
<li>Place your characters outside its attack area. If a hit is unavoidable, have your highest-HP character tank it.</li>
<li>Use knockback to line enemies up, then fire your AoEs.</li>
<li>Order your actions: pushers first, big damage after.</li>
<li>Finish with End Turn.</li>
</ol>
<h3 id="s8-5">Combat in detail</h3>
<ul>
<li><strong>Turns</strong>: in PvE, you act on odd turns (1, 3, 5…) and the enemy on even turns. You place your characters and pick costumes before each turn, then everything plays out automatically.</li>
<li><strong>Targeting</strong>: each costume aims at a <strong>main target</strong> (down arrow). "<button class="term" data-tip="Attack targeting: first in the lane / skips the first" type="button">Very Front</button>" targets the nearest enemy in your column, "Vault" jumps over the first one to hit the second. If no one's in your column, the character targets the column to its right, then the one to its left.</li>
<li><strong>Chains</strong>: each hit on an enemy adds 1 Chain, and each Chain adds +10% damage for the rest of the turn (cap 100, except in Last Night). Multi-hit characters are precious, especially in Fiend Hunter and Guild Raid.</li>
<li><strong>Knockback</strong>: it always deals 1 damage to the target. If the pushed enemy slams into another, that one takes 25% of the pushed enemy's max HP (calculation capped at 50,000 HP). Fiend Hunter and Guild Raid bosses never move, and some enemies are immune to knockback.</li>
<li><strong>Death Time</strong>: after turn 10 (story, events, Mirror Wars, Evil Castle), every 2 turns each unit gains +100% ATK, loses 100% DEF and takes +50% damage.</li>
<li><strong>Common statuses</strong>: <button class="term" data-tip="Forces enemies to target you" type="button">Taunt</button> (forces targeting that enemy), Counter (reflects damage), Evade (cancels the attack, bypassed by Wiggle's self-destruct), <button class="term" data-tip="Temporary HP shield" type="button">Energy Guard</button> (shield), Immunity.</li>
<li><strong>Special damage types</strong>: Fixed and Consumed never crit and ignore DEF; Pure can crit and ignores DEF and shields.</li>
<li><strong>Handy tools</strong>: Presets (12 saved teams with gear and placement), Set Costume Order (skill order programmed over 10 activations), Restart from the previous turn in the Pause menu. Avoid Auto Battle: it ignores enemy placement and teaches you nothing.</li>
<li><strong>Borrowing</strong>: 3 borrows a day per friend (up to 30 friends), 1 borrowed character per fight, in story, events, Hunting Grounds and Path of Adventure.</li>
</ul>
<h3 id="s8-6">The battle screen and its tools (compendium)</h3>
<figure class="shot cp"><button aria-label="Enlarge: The battle screen" class="shot-btn" data-full="img/cp-battle_system_1.jpg" type="button"><img alt="The battle screen" loading="lazy" src="img/cp-battle_system_1.jpg"/></button><figcaption>The battle screen<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>Targeting and placement</h4>
<ul>
<li><strong>Taunt</strong> and <strong>Concentrated Fire</strong> force your characters to aim at the enemy with that status, whatever their targeting type. <strong>Target Avoidance</strong> does the opposite: the enemy avoids targeting that character if it has other options.</li>
<li>Some supports have a <strong>limited-range aura</strong> (Medical Club Teresse, Adventurer of the Unknown Diana, Refithea…): put your allies inside their area, or they won't get the buff.</li>
<li>In general, supports act <strong>before</strong> DPS. Some costumes need a precise order: Laid-Back Lifeguard Nebris, for example, benefits from fine-tuning the team order.</li>
</ul>
<figure class="shot cp"><button aria-label="Enlarge: Very Front (the nearest) and Vault (the second one in the column)" class="shot-btn" data-full="img/cp-targeting.jpg" type="button"><img alt="Very Front (the nearest) and Vault (the second one in the column)" loading="lazy" src="img/cp-targeting.jpg"/></button><figcaption>Very Front (the nearest) and Vault (the second one in the column)<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>Reading the fight</h4>
<ul>
<li><strong>Skills</strong>: tap a character (its model or its card), then a skill under "Basic Attack" and "Knockback". You see the <strong>raw damage</strong> (without the turn's effects) and the <strong>area hit</strong>. "<strong>K.O.</strong>" means the raw damage is enough to kill. <strong>Magic</strong> damage shows in <strong>magenta</strong>, <strong>physical</strong> in <strong>yellow</strong>. You can also change the character's action from there.</li>
<li><strong>Cooldowns</strong>: a costume on cooldown is covered on its button, with the number of turns left.</li>
<li><strong>Stats</strong>: tap a character, then the <strong>+</strong> at the top (left for your characters, right for enemies). These are the <strong>current</strong> stats, buffs included, with gear and Bonding.</li>
<li><strong>Statuses</strong>: tap the small icons under the card (Taunt, etc.) to read their effect.</li>
<li><strong>Element</strong>: it shows as an icon next to the name, as a tint on the card, and as a glow under the character when it's about to act. In the damage preview, an icon shows <strong>advantage</strong> or <strong>disadvantage</strong>; with no icon, it's neutral.</li>
<li><strong>Targeting lines</strong>: <strong>green</strong> for your allies' actions (supports), <strong>red</strong> for enemies who will hit that character next turn, in <strong>the element's color</strong> for the main target of an attack.</li>
</ul>
<figure class="shot cp"><button aria-label="Enlarge: Targeting lines: green for allies, red for enemies" class="shot-btn" data-full="img/cp-target_lines.jpg" type="button"><img alt="Targeting lines: green for allies, red for enemies" loading="lazy" src="img/cp-target_lines.jpg"/></button><figcaption>Targeting lines: green for allies, red for enemies<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>Knockback: the exact rules</h4>
<ul>
<li>Knockback <strong>fails</strong> if the landing tile holds an enemy or a tombstone, or if it's off the grid.</li>
<li>Knockback damage has the <strong>character's damage type</strong>: magic for Diana, physical for Teresse.</li>
<li>Collision damage (on the enemy that gets hit) benefits from crit, element, DEF/MRES, vulnerability, Chains and weak points. It can't be evaded, but a target under <strong>Evade</strong> can't be pushed.</li>
<li>Knockback adds <strong>1 Chain to the main target</strong> only, not to the enemy it slams into.</li>
<li>Some enemies are <strong>immune</strong> to knockback, and Fiend Hunter and Guild Raid bosses never move.</li>
</ul>
<figure class="shot cp"><button aria-label="Enlarge: Knockback with Teresse's skill: 62,500 damage = 50,000 capped HP × 125% (basic knockback does 25%)" class="shot-btn" data-full="img/cp-knockback.jpg" type="button"><img alt="Knockback with Teresse's skill: 62,500 damage = 50,000 capped HP × 125% (basic knockback does 25%)" loading="lazy" src="img/cp-knockback.jpg"/></button><figcaption>Knockback with Teresse's skill: 62,500 damage = 50,000 capped HP × 125% (basic knockback does 25%)<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<figure class="shot dc"><button aria-label="Enlarge: Each character's knockback direction: up, sideways or down, Very Front or Vault (November 2026)" class="shot-btn" data-full="img/dc-kb-liste.jpg" type="button"><img alt="Each character's knockback direction: up, sideways or down, Very Front or Vault (November 2026)" loading="lazy" src="img/dc-kb-liste.jpg"/></button><figcaption>Each character's knockback direction: up, sideways or down, Very Front or Vault (November 2026)<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h4>Chains in detail</h4>
<ul>
<li>Chains last one turn (except in some Golden Colosseum seasons) and add up in <strong>the same multiplier</strong>: each new Chain is worth a bit less in proportion.</li>
<li><strong>Chain Reinforcement</strong> adds <strong>+1 Chain per hit</strong>. Example: The Curse Celia hits 7 times (7 Chains), 14 with Masquerade Bunny Celia's buff, 21 with Pure White Blessing Refithea's on top (except in Last Night, where each costume acts on its own: there, she stays at 7).</li>
<li>Poolside Guardian Zenith raises the bonus from 10% to <strong>20% per Chain</strong> on one tile.</li>
</ul>
<p><strong>More from the official Discord (November 2026).</strong></p>
<ul>
<li>During an attack, a <strong>red chain icon</strong> with a number shows next to the enemies: that's the Chain count.</li>
<li><strong>Can a chainer be a DPS?</strong> Yes for Luvencia, Hikage and Wilhelmina; no for Celia and Olstein (multiplier and base MATK too low, their 3×3 area is misleading). Celia is only decent in Light Fiend Hunter and Guild Raid (with the element and Diana).</li>
<li>In general content (story, towers except Salvation, Challenge battles), chainers aren't the best pick: bring a DPS, a buffer or a utility instead. Exception: Luvencia. Single-target chainers (Wilhelmina) are even weaker there.</li>
<li><strong>Last Night</strong>: self buffs stay on the caster. Bunny Celia goes from 3 to 6 Chains with her buff, but The Curse Celia, played next, stays at 7: 13 in total, not 14 + 6.</li>
</ul>
<figure class="shot dc"><button aria-label="Enlarge: The red chain icon: 7 Chains on the target" class="shot-btn" data-full="img/dc-chain-7.jpg" type="button"><img alt="The red chain icon: 7 Chains on the target" loading="lazy" src="img/dc-chain-7.jpg"/></button><figcaption>The red chain icon: 7 Chains on the target<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<figure class="shot dc"><button aria-label="Enlarge: Last Night: 6 Chains, then 13; self buffs don't carry to the next costume" class="shot-btn" data-full="img/dc-selfbuff-ln.jpg" type="button"><img alt="Last Night: 6 Chains, then 13; self buffs don't carry to the next costume" loading="lazy" src="img/dc-selfbuff-ln.jpg"/></button><figcaption>Last Night: 6 Chains, then 13; self buffs don't carry to the next costume<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h4>Tombstones</h4>
<p>When one of your characters dies, a <strong>tombstone</strong> appears in its place (not for summons or explosives). It can't be pushed, blocks enemy knockbacks, and neither deals nor takes damage. A character that self-destructs or dies to a counter leaves its tombstone where it stood before acting.</p>
<h4>The screen buttons</h4>
<figure class="shot cp"><button aria-label="Enlarge: Top bar: effects, Auto Burst, Auto Skill, Auto Battle, speed, Autofeed, pause" class="shot-btn" data-full="img/cp-UI_top.jpg" type="button"><img alt="Top bar: effects, Auto Burst, Auto Skill, Auto Battle, speed, Autofeed, pause" loading="lazy" src="img/cp-UI_top.jpg"/></button><figcaption>Top bar: effects, Auto Burst, Auto Skill, Auto Battle, speed, Autofeed, pause<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<ul>
<li><strong>Environment effects</strong>: the icon lists the active effects (collection bonus, Death Time, Evil Castle effects).</li>
<li><strong>Auto Burst</strong>: fires Bursts on its own, but after the costumes (if SP is short, the Burst is skipped) and in team order, so supports first.</li>
<li><strong>Auto Skill</strong>: picks the next turn's costumes in team order, keeping the turn 1 ones. Without enough SP, the costume isn't picked; if there's only enough SP for a cheaper costume, that one goes. Handy to save time.</li>
<li><strong>Auto Battle</strong>: not recommended. It locks all your actions, ignores enemies and placement, and teaches you nothing.</li>
<li><strong>Speed</strong>: from ×1 to ×3.</li>
<li><strong>Autofeed</strong>: heals a little with your food. Not worth it.</li>
<li><strong>Pause</strong>: cutscene and sound settings, <strong>battle statistics</strong>, <strong>restart the fight or the previous turn</strong> (not possible in the Tower of Salvation), flee.</li>
</ul>
<figure class="shot cp"><button aria-label="Enlarge: Bottom bar: Replace, Swap Order, View Skill Order, Preset, SP, Rotate View, Rotate" class="shot-btn" data-full="img/cp-UI_bottom.jpg" type="button"><img alt="Bottom bar: Replace, Swap Order, View Skill Order, Preset, SP, Rotate View, Rotate" loading="lazy" src="img/cp-UI_bottom.jpg"/></button><figcaption>Bottom bar: Replace, Swap Order, View Skill Order, Preset, SP, Rotate View, Rotate<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<ul>
<li><strong>Replace</strong>: swaps a character before the turn. You can filter by element, see each one's knockback, and add a character to an empty tile. <strong>Not possible from turn 3 on</strong>, except in the Tower of Salvation. The hand-shaped button opens <strong>borrowing</strong>: story (Normal, Hard, NPC quests), character and event packs on Hard, event battles, Hunting Grounds and Path of Adventure; never the same character twice in a team.</li>
<li><strong>Swap Order</strong>: changes the action order. <strong>Insert</strong> mode slides a character before (drag up) or after (drag down) another; <strong>Replace</strong> mode swaps two characters. A shortcut sits to the right of the cards.</li>
<li><strong>View Skill Order</strong>: shows the whole team's Set Costume Order at once, and lets you edit it.</li>
<li><strong>Preset</strong>: 12 saved teams (characters, gear, order, placement), plus your recent teams in the 2nd tab. Loading a preset takes the gear off the other characters who were wearing it.</li>
<li><strong>SP bar</strong>: points available, points that will be spent if you start the turn, and points you don't have.</li>
<li><strong>Rotate View</strong>: top-down view with a plain background, your characters on the left and enemies on the right. Great to tell grouped enemies apart. <strong>Rotate</strong> simply turns the field (not with Fiend Hunter or Guild Raid bosses).</li>
</ul>
<h4>Set Costume Order</h4>
<p>Tap a character <strong>before turn 1</strong>, then "Set Costume Order": you get <strong>10 slots</strong> to program its actions (costumes, basic attack, knockback). The program comes before your manual choices, respects SP and cooldowns, and <strong>loops</strong>: Robin Hood Zenith and Poolside Guardian Zenith in the first two slots alternate until the end. Very useful for Mirror Wars and repeated fights like Fiend Hunter.</p>
<h4>Removing enemy protections</h4>
<ul>
<li><strong>Taunt</strong> and <strong>Counter</strong> come off with a character that dispels (Scheherazade, Yuri, Eleaneer), unless the enemy has immunity.</li>
<li><strong>Evade</strong> cancels the whole attack, effects included: get around it with <strong>self-destruct</strong> (Wiggle, Morpeah's summons).</li>
<li><strong>Energy Guard</strong>: dispel it, deal pure damage, or hit hard enough to break it.</li>
<li><strong>Death Time</strong> doesn't exist in Fiend Hunter or Guild Raid; in the Golden Colosseum, it comes on a turn set by the rules.</li>
</ul>
<h3 id="s8-7">The damage formula, in short</h3>
<p>Damage is a product of independent multipliers. Since they multiply, spreading your bonuses across several families beats stacking the same one:</p>
<div class="formula"><span class="fx-lhs">Damage</span><span class="fx-op">=</span><span class="fx-term">ATK</span><span class="fx-op">×</span><span class="fx-term">Skill</span><span class="fx-op">×</span><span class="fx-term">ATK buffs</span><span class="fx-op">×</span><span class="fx-term">Crit</span><span class="fx-op">×</span><span class="fx-term">Chains</span><span class="fx-op">×</span><span class="fx-term">Vulnerability</span><span class="fx-op">×</span><span class="fx-term">Element</span><span class="fx-op">×</span><span class="fx-term">Enemy DEF</span><span class="fx-op">×</span><span class="fx-term">Weak point</span></div>
<ul>
<li>The <strong>Support Bonus</strong> isn't part of this general formula: it only counts in Last Night (see step 9).</li>
<li>Crit rate above 100% is converted into crit damage (×6).</li>
<li>The "Pressure" of some modes reduces stat buffs (ATK, <button class="term" data-tip="Critical chance / critical damage" type="button">Crit DMG</button>, element, DEF), but not Chains or Vulnerability.</li>
<li>The element bonus (Diana) is its own family: it doesn't get diluted in ATK buffs.</li>
<li>
<p><strong>Within the same family, buffs add up.</strong> Stacking lots of ATK buffs is worth less than one ATK buff combined with Vulnerability and a few Chains.</p>
</li>
<li>
<p><strong>Recasting the same buff</strong> doesn't stack: it only resets its duration. Two buffs from different sources do add up (official Discord).</p>
</li>
<li><strong>A worked example</strong> (official Discord): same family, Lathel (+160%) and Arines (+70%) give +230%, so <strong>×3.3</strong>. Different families, Lathel (+160% ATK) and Diana (+220% property) give 2.6 × 3.2 = <strong>×8.32</strong>, instead of ×4.8 if they added up. (The bot text says ×8.33: the right result is ×8.32.)</li>
<li><strong>Element</strong> (official Discord): disadvantage removes 50% property damage. Light and Dark both take <strong>+50% from each other</strong>, with no reduction on either side. The 4 property buffers (Adventurer of the Unknown Diana, Magical Innovator Diana, Pure White Blessing Refithea, Poolside Fairy Refithea) only help with the advantage.</li>
<li><strong>Calculation caps</strong>: ATK and MATK at 100,000, HP at 50,000 (for HP-based effects), crit rate at 100% (the excess becomes Crit DMG), Chains at 100 (except in Last Night). The official Discord adds: Crit DMG at 10,000%; DEF and MRES at 90%, applied <strong>after</strong> debuffs (130% DEF − 50% debuff = 80% used: the excess protects you from debuffs); the 50,000 HP cap applies to every HP-based skill (damage, knockback, heals, Energy Guards). Example: Angelica hits for 90% of max HP, so 90% of 50,000 = 45,000, even against an enemy with 200,000 HP.</li>
</ul>
<p><strong>The full formula (official Discord, November 2026, from the Tourist's Sheet).</strong></p>
<ul>
<li><strong>Shown ATK</strong> = (base ATK + flat ATK from gear + flat ATK from Potential) × (1 + ATK% from gear + Potential + collection).</li>
<li><strong>Damage</strong> = ATK × Skill % × (1 + ATK buffs − ATK debuffs) × (1 + Crit DMG + Crit DMG buffs) × (1 + Weak point) × (1 + 10% × Chains) × (1 + Vulnerability + "DMG Increase" buffs) × (1 + Property DMG + season buff + property buffs) × (1 − (DEF + DEF buffs − DEF debuffs)) × (1 − damage reduction) × (1 − property resist).</li>
<li>Crit DMG only counts on a crit; fixed damage never crits. Weak points only exist on some parts of Fiend Hunter and Guild Raid bosses.</li>
<li>Beachside Angel Teresse's buff is in the "DMG Increase" family. Fixed damage doesn't benefit from Vulnerability, but does benefit from "DMG Increase".</li>
<li>Chains count before the hit (cap 100, no cap in Last Night). Property damage applies if the target's element is weaker, property resist if it is stronger.</li>
<li>The target's DEF stays between 0 and 90%. Fixed and pure damage ignore DEF and shields ("Shield", the damage reduction family, like Angelica's).</li>
<li><strong>HP-based skills</strong>: replace ATK with HP (cap 50,000) and ignore the ATK buffs part.</li>
</ul>

</div></section>
<section class="chapter" id="s9" data-title="Character progression"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V6"/><path d="M6 11l6-6 6 6"/><path d="M6 20h12"/></svg><b>09</b></span><h2>Character progression</h2></header><div class="ch-body">
<p>Early on, your resources are scarce: focus them on your story team and level them with Slimes, rank-up stars and gear. The "item location" button at the bottom of an item's info tells you where to farm it.</p>
<h3 id="s9-1">Levels, Slimes and ascension</h3>
<ul>
<li><strong>XP</strong>: you earn it by surviving fights and feeding Slimes to your characters. Slimes come in yellow, blue and red; red gives the most XP.</li>
<li><strong>Ascension</strong>: every 20 levels, a character has to rank up with rank-up stars. Each rank gives it a star, and rarity sets the max level.</li>
<li><strong>Rank 4 stars</strong>: rare and not farmable. Save them for your 5★ characters (they unlock levels 81 to 100).</li>
<li>
<p><strong>Slimes first, gold later</strong>: farm Slimes until your main characters are max level, then switch to gold, which endgame eats in huge amounts.</p>
</li>
<li>
<p><strong>How much EXP?</strong> (official Discord) A yellow slime gives 200 EXP, a blue one 700, a red one 2,000. Taking a character from level 1 to 100 needs about <strong>1.5 million EXP</strong> (849 up to level 20, 4,045 from 20 to 40, 219,757 from 40 to 60, 491,444 from 60 to 80, 788,715 from 80 to 100). No slime is wasted: all your characters will end up maxed, so start with your main DPS.</p>
</li>
<li><strong>Sources</strong>: Slime Empire, and the event shop (red slimes only). Other shops aren't worth it. <strong>Rank-up stars</strong>: Guide Pass, Season Pass and event shop; the <button class="term" data-tip="Earned on every draw; points shop" type="button">Powder of Hope</button>, <button class="term" data-tip="Earned from dupes past +5; points shop" type="button">Golden Thread</button> and Mirror Wars shops aren't recommended for them.</li>
</ul>
<figure class="shot dc"><button aria-label="Enlarge: The EXP needed per level range and the EXP of each slime (Tourist's Sheet)" class="shot-btn" data-full="img/dc-slime-xp.jpg" type="button"><img alt="The EXP needed per level range and the EXP of each slime (Tourist's Sheet)" loading="lazy" src="img/dc-slime-xp.jpg"/></button><figcaption>The EXP needed per level range and the EXP of each slime (Tourist's Sheet)<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h3 id="s9-2">Effortless farming: Path of Adventure</h3>
<p>This pack opens after the third story pack. The first few times, fight manually: after 5 fights, a boss shows up (Red Slime or Goblin King depending on difficulty). Once you beat it once on a difficulty, you unlock auto-battle for that difficulty, using <button class="term" data-tip="Energy for Path of Adventure" type="button">Cooked Rice</button>.</p>
<ul>
<li>Same principle for each pack's Hunting Grounds: beating the boss unlocks auto-battle for that difficulty.</li>
<li>The "scroll" shortcut on the left of the field menu opens Path of Adventure directly.</li>
<li>Clear "Very Hard" everywhere ASAP, to automate your farming.</li>
</ul>

<p><strong>Ranking up an ability</strong>: open the character's page, tap their ability icon, then "Rank-up".</p>

<h4>Weekly search finds (official Discord, November 2026)</h4>
<ul>
<li>Always use <strong>Search</strong> (Lathel or Jayden) <strong>before</strong> Absorption: it picks up every blue and green glow on the map without running around.</li>
<li><strong>Absorption</strong> (Liberta, Celia, Tyr): chapters 7, 8, 13, 16 and 17 for ores; 9 for wood; 10 for leather; 15 for fabric; Firechip for ores and wood.</li>
<li><strong>Assemble</strong> (Refithea, Granadair, Sonya): chapters 7, 8, 9, 10, 13, 15 and 16, plus Jayden's Gate.</li>
<li><strong>Weekly routine</strong>: Absorption on the safe and battle zones of chapters 7, 8, 9, 13, 17 and Firechip, the rest of your attempts on 10 or 15; Assemble once on the battle zones of chapters 7, 8, 9, 10, 13, 15 and 16, and once on Jayden's Gate.</li>
<li>Next to the minimap, a counter shows the finds and monsters left. For a full tour, there's a <a href="https://youtu.be/-lfjVngH4mw" target="_blank" rel="noopener">"Daily World Tour" video</a> (old, but still useful) and <a href="https://browndust2-wiki.souseha.com/maps" target="_blank" rel="noopener">Souseha's map</a>.</li>
</ul>
<figure class="shot dc"><button aria-label="Enlarge: The counter next to the minimap: finds and monsters left" class="shot-btn" data-full="img/dc-sf-minimap.jpg" type="button"><img alt="The counter next to the minimap: finds and monsters left" loading="lazy" src="img/dc-sf-minimap.jpg"/></button><figcaption>The counter next to the minimap: finds and monsters left<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h3 id="s9-4">Other sources of power</h3>
<ul>
<li><strong>Skills</strong>: pull a dupe of the costume to raise the skill up to +5 (more damage and often a shorter cooldown), for a bit of gold.</li>
<li><strong>Potential</strong>: upgrade it with elemental crystals from Magic Crystal Cave, reached through Path of Adventure and paid with torches. Pick your most-used character and farm the crystal of its element.</li>
<li>
<p><strong>Collection bonus</strong>: each character you own gives a small bonus to all the others; some character trios give a bigger bonus.</p>
</li>
<li>
<p><strong>Combat power</strong> (official Discord): 10 per character level, 250 per costume owned, 150 per costume level, 10 per Engraving level, 200 for Awakening, 10 per small white Potential node, 20 per medium black node (only if the character is bonded to that costume), 100 per large node, plus the power of each gear piece. It does <strong>not</strong> show your real strength: if you're stuck, look at your gear, your team or your dupes.</p>
</li>
</ul>
<h3 id="s9-5">Bonding and Potential in detail (compendium)</h3>
<p><strong>Which Bonding to pick?</strong> As a beginner: the costume with the most Potential unlocked. After that:</p>
<ul>
<li>In <strong>general content</strong>, you often play off-element with the same DPS: prefer a Bonding <strong>without</strong> an element damage bonus.</li>
<li>In <strong>element content</strong> (Fiend Hunter, Guild Raid), a Bonding with an element bonus can be worth it if the boss doesn't already give one; if the boss or your supports give a lot of it, keep a "general" Bonding.</li>
<li>For a <strong>defensive character or a support</strong>, pick based on the damage type you take.</li>
</ul>
<p><strong>Saving time:</strong></p>
<ul>
<li><strong>Bulk Liberate</strong> unlocks the whole tree at once, or every node up to the one you selected.</li>
<li>You can see a costume's Potential status right in the Companion tab or in battle, without opening the tree. The <strong>Growth Preview</strong> tab shows the effect of all of a costume's nodes with a toggle.</li>
</ul>
<figure class="shot cp"><button aria-label="Enlarge: Bulk Liberate: the whole tree in a few taps" class="shot-btn" data-full="img/cp-bulk-liberate.jpg" type="button"><img alt="Bulk Liberate: the whole tree in a few taps" loading="lazy" src="img/cp-bulk-liberate.jpg"/></button><figcaption>Bulk Liberate: the whole tree in a few taps<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p><strong>Disabling a Potential.</strong> You can <strong>disable</strong> a big node you already unlocked (Disable button, a lock icon appears), for example when a <strong>Barrier</strong> gets in your character's way instead of helping. It doesn't work in the Tower of Salvation, Mirror Wars, Last Night and the Golden Colosseum.</p>
<figure class="shot cp"><button aria-label="Enlarge: A disabled Potential (lock icon)" class="shot-btn" data-full="img/cp-lock-pots.jpg" type="button"><img alt="A disabled Potential (lock icon)" loading="lazy" src="img/cp-lock-pots.jpg"/></button><figcaption>A disabled Potential (lock icon)<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p><strong>Node order.</strong> For buffers: SP and cooldown reduction first, then duration, area and buff strength. For DPS: comfort first (SP, cooldown, area), damage nodes only once your supports are done. For a detailed list, the compendium points to <a href="http://cymmina.gamependium.com/browndust2/growth.html#potentials" target="_blank" rel="noopener">Cymmina's Potential guide</a>.</p>
<h3 id="s9-6">Engraving and Awakening (official Discord, November 2026)</h3>
<p>Awakening gives extra stats, for min-maxing. You can only do it at <strong>max level</strong>.</p>
<ul>
<li>Awaken your best DPS, or the main DPS of an element. Not supports, and not 3★ or 4★ characters.</li>
<li>Max cost: 1,110 Engraving Scrolls, 300 Essences, 3.5 million gold and 200 Awakening Elixirs.</li>
<li><strong>Awakening Elixirs</strong>: guild, Tower of Salvation season rewards, Last Night every day (Powder of Hope: not for free players).</li>
<li><strong>Essences</strong>: events, guild, Evil Castle (Powder of Hope and Golden Thread: not for free players).</li>
<li><strong>Engraving Scrolls</strong>: Evil Castle and guild (the event shop isn't recommended for them).</li>
<li>A costume's Rapport stays stuck at level 10 without Awakening (section 13), but don't awaken a support just for that.</li>
</ul>
<figure class="shot dc"><button aria-label="Enlarge: Awakening a costume and its extra stats" class="shot-btn" data-full="img/dc-awakening.jpg" type="button"><img alt="Awakening a costume and its extra stats" loading="lazy" src="img/dc-awakening.jpg"/></button><figcaption>Awakening a costume and its extra stats<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h3 id="s9-7">Hard and Very Hard modes</h3>
<p>Talk to Elin in a pack's safe zone once its main quest is done. Only start one at a time: until you finish its quest, you can't do that chapter's daily quests anymore.</p>
<h3 id="s9-8">Burst</h3>
<p>Burst lets you pay extra SP to power up a skill. Each costume has 3 levels to unlock in order, and their effects (like their SP costs) stack.</p>
<ul>
<li><strong>Cost for a ★5 costume</strong>: 60 <strong>Sparks of Rampage</strong> + 1.5 million gold per level, so 180 Sparks and 4.5 million gold in total.</li>
<li><strong>Spark sources</strong>: event shops, Golden Thread, Powder of Hope, Refinement Remnants, Mirror Wars, guild, Golden Colosseum and Taros Tactical Manual. Expect about 530 to 585 Sparks a month, roughly 3 costumes.</li>
<li><strong>Advice</strong>: it's very expensive for a beginner. Collect every Spark you can, but invest little at first, and mostly in supports. Top priority according to the author: Diana (Adventurer of the Unknown) Bursts 1-3, B-Rank Idol Helena 1-3, Homunculus Lathel 1, Onsen Manager Liberta 1-3, Medical Club Teresse 3.</li>
<li>In battle, pick the Burst level with the little arrow on the skill, or turn on <strong>Auto Burst</strong> (lower priority than costume activation).</li>
</ul>
<figure class="shot cp"><button aria-label="Enlarge: A costume's Burst menu" class="shot-btn" data-full="img/cp-burst-menu.jpg" type="button"><img alt="A costume's Burst menu" loading="lazy" src="img/cp-burst-menu.jpg"/></button><figcaption>A costume's Burst menu<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p><strong>More from the compendium:</strong></p>
<ul>
<li><strong>Spotting an active Burst</strong>: the skill card gets a light blue border, the extra SP cost shows in orange and the Burst effects are highlighted. In the collection, the 3 flames under the Potential icon show the unlocked Bursts.</li>
<li><strong>Special modes</strong>: in <strong>Last Night</strong>, the highest unlocked Burst fires on its own, at no cost. In the <strong>Golden Colosseum</strong>, it depends on your SP (with infinite SP, it fires like in Last Night; otherwise, after all costumes have acted). <strong>Auto Battle</strong> turns on Auto Burst.</li>
<li><strong>Collab costumes</strong>: they use <strong>Sparks of the Otherworld</strong> (60 per level and only 50,000 gold), available in limited amounts during the collab, enough for all the featured costumes.</li>
<li><strong>High priority</strong>, right after the list above: Descendant of the Great Witch Celia (Burst 1), Heavenly Guardian Successor Glacia (1-3), Sunny Inn Hand Helena (1-2), Eternal Chains Kyouka Uzen (1), Homunculus Lathel (2-3), Miracle Marine Mamonir (1-3), Apostle Morpeah (1), Unraveling Mummy Nekyndalia (1), New Hire Seir (1-2), Medical Club Teresse (1-2).</li>
<li>When a costume's Bursts 2-3 rank higher than its Burst 1, it means Burst 1 alone adds little: save your Sparks and unlock them together. The rest of the list (medium, low and avoid) is on the <a href="https://botan14xd.github.io/BD2-Overview/progression/burst/" target="_blank" rel="noopener">compendium's Burst page</a>.</li>
</ul>
</div></section>
<section class="chapter" id="s10" data-title="Gear"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg><b>10</b></span><h2>Gear</h2></header><div class="ch-body">
<p>Gear makes a huge difference to your team's power: level Gear Craft and Alchemy from the start, then save your best pieces for endgame. Each character wears 5 pieces: weapon, head, body, accessory and gloves.</p>
<h3 id="s10-1">Getting gear</h3>
<ul>
<li><strong>Crafting</strong>: through Layla or Fred, who have the same ability since the December 2023 patch. Level one of them, not both. R-rank and higher materials need Scheherazade's Alchemy.</li>
<li><strong>Weapon banner</strong>: a character's exclusive gear, equivalent to a UR IV piece with an extra exclusive stat. Useful, never essential: you can clear almost all content with normal UR.</li>
<li><strong>Event gear</strong>: worth it, since it always progresses with an SSS refine; it usually beats UR III.</li>
</ul>
<h3 id="s10-2">Reading a piece</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Element</th>
<th>Values</th>
<th>Note</th>
</tr>
</thead>
<tbody>
<tr>
<td>Rarity</td>
<td>N, R, SR, UR</td>
<td>Weakest to strongest</td>
</tr>
<tr>
<td>Tier</td>
<td>I, II, III, IV, EX</td>
<td>EX = banner exclusive</td>
</tr>
<tr>
<td>Level</td>
<td>+0 to +9</td>
<td>Each level raises stats; the rarer the piece, the more often upgrades fail</td>
</tr>
<tr>
<td>Stats</td>
<td>1 or 2 base stats + 3 substats</td>
<td>Substats unlock at +3, +6 and +9</td>
</tr>
</tbody>
</table></div>
<p>Physical gear (ATK, DEF) can't roll magic substats, and vice versa. Accessories are neutral.</p>
<p><strong>Offensive or defensive?</strong> For most characters, the <strong>weapon</strong>, <strong>accessory</strong> and <strong>gloves</strong> are the <strong>offensive</strong> gear; the <strong>armor</strong> and <strong>helmet</strong> are the <strong>defensive</strong> gear. Early on, level the offensive pieces first: for the story, a "glass cannon" team that wipes everything on turn 1 is enough.</p>
<p><strong>Reading the tier from the stars.</strong> Under the piece: no silver star = I, one = II, two = III, three = IV, <strong>one gold star</strong> = exclusive. Event gear has no number but counts as tier III, and exclusive gear as tier IV. Avoid playing with I or II; III is fine if you don't invest too much in it.</p>
<figure class="shot cp"><button aria-label="Enlarge: The tier shows as a roman numeral or as stars" class="shot-btn" data-full="img/cp-gear_tiers.jpg" type="button"><img alt="The tier shows as a roman numeral or as stars" loading="lazy" src="img/cp-gear_tiers.jpg"/></button><figcaption>The tier shows as a roman numeral or as stars<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p><strong>Base stats.</strong> N pieces have 1 base stat, UR pieces have 2, fixed. R and SR pieces have 2 base stats, and the second one can be rerolled in the refining menu. Exclusive gear has 2 base stats: the first can be switched for free between two choices, the second can be rerolled. The <strong>?</strong> in the refining menu lists every stat a piece can have.</p>
<p>The official Discord lists the possible base stats per slot (not for crafted UR): weapon, ATK or MATK then <button class="term" data-tip="Critical chance / critical damage" type="button">Crit DMG</button>, ATK/MATK or ATK%/MATK%; head and body, DEF or MRES then HP, HP% or DEF/MRES; accessory, crit rate or crit damage then HP, HP% or crit; gloves, ATK% or MATK% then crit rate, ATK/MATK or ATK%/MATK%.</p>
<figure class="shot dc"><button aria-label="Enlarge: The possible base stats for each slot (November 2026)" class="shot-btn" data-full="img/dc-rbstat.jpg" type="button"><img alt="The possible base stats for each slot (November 2026)" loading="lazy" src="img/dc-rbstat.jpg"/></button><figcaption>The possible base stats for each slot (November 2026)<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<p><strong>Upgrading without stress.</strong> A failed upgrade only costs gold, you don't lose a level. To go fast: <strong>Repeat</strong>, slider at maximum (MAX), <strong>Upgrade</strong>, then <strong>Skip</strong>. Same for refining, with "<strong>Ends once refining succeeds</strong>" turned on so you don't waste powder.</p>
<p><strong>Options (substats).</strong> Refining Stones are for N and R pieces; for SR and UR, stones are used first, then crystals (<strong>10 stones = 1 crystal</strong>).</p>
<h3 id="s10-3">The refinement score</h3>
<p>Once the piece is at +9, a <strong>star with a number</strong> appears: that's its <strong>refinement score</strong>, from <strong>6 to 24</strong>. The higher it is, the more the main stat goes up. The star's color changes with the range (6 to 11, 12 to 16, 17 to 20, 21 to 24). Tap the <strong>?</strong> next to "Gear Score" to see the piece's stats at each score.</p>
<p>Refining rerolls the score with gold and <button class="term" data-tip="Raise the refinement score (powder) and reroll options (stones, crystals)" type="button">Refining Powder</button>, and <strong>always keeps the best result</strong>: a piece can never go down. The higher the score, the rarer it is, especially past 18. Aim for <strong>18</strong> then stop: past that, the odds are very low and the cost skyrockets.</p>
<p class="callout info"><span class="co-tag">Compendium</span><strong>The old letter display.</strong> Old guides and the Discord screenshots talk about three letters (C, B, A, S). The score is their translation: C = 1, B = 2, A = 3, S = 4, the 2nd letter counts double and the 3rd triple. BBS = 2 + 4 + 12 = <strong>18</strong>, SSS = <strong>24</strong>.</p>
<figure class="shot cp"><button aria-label="Enlarge: The refinement score and the stats preview per score" class="shot-btn" data-full="img/cp-gear-score-stats-preview.jpg" type="button"><img alt="The refinement score and the stats preview per score" loading="lazy" src="img/cp-gear-score-stats-preview.jpg"/></button><figcaption>The refinement score and the stats preview per score<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p>According to the official Discord, aim for score <strong>18</strong> only on <strong>UR IV</strong> or <strong>UR EX</strong>; for everything else, settle for less. <a href="https://browndust2-wiki.souseha.com/en/refinement-tool" target="_blank" rel="noopener">Souseha's refinement tool</a> estimates the powder needed for each score (tap the "%").</p>
<figure class="shot dc"><button aria-label="Enlarge: The chances of getting each refinement score (old letter display; the game now shows the score)" class="shot-btn" data-full="img/dc-bbs-proba.jpg" type="button"><img alt="The chances of getting each refinement score (old letter display; the game now shows the score)" loading="lazy" src="img/dc-bbs-proba.jpg"/></button><figcaption>The chances of getting each refinement score (old letter display; the game now shows the score)<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h3 id="s10-4">Day-to-day management</h3>
<ul>
<li><strong>Craft</strong> UR pieces if you have enough Ancient Crystals. Otherwise, craft the <strong>R</strong> pieces you're missing to fill the collection (collection bonus); <strong>no SR</strong> until you have enough UR IV (official Discord).</li>
<li><strong>Dismantle</strong> low-level pieces: they give Refining Powder.</li>
<li><strong>Upgrade</strong> your high-level pieces, even the ones that aren't your best: Last Night needs all your characters geared.</li>
<li><strong>Refine</strong> only your best pieces. Don't refine too early: you'll replace your gear as soon as your crafting rank goes up a notch.</li>
<li>Don't spend gear tickets for no reason: UR 5★ rates are low and the result is random.</li>
<li><strong>Upgrade Settings</strong>, in the crafting menu, automatically upgrades and/or dismantles what you craft: perfect to turn N pieces into Refining Powder.</li>
<li>When you're missing a material, a button with an Ability Pill cost may show up under it: it's not a purchase, it's <strong>alchemy done for you</strong> (it still uses up the needed materials).</li>
<li>
<p>In the <strong>Bag</strong>, the gear tab offers <strong>custom marks</strong> (icon, number and color to tag your pieces), <strong>filters</strong> (slot, category, rarity, tier, level, score, stat) and <strong>sorting</strong>. The "Compare" feature isn't very useful.</p>
</li>
<li>
<p><strong>When to dismantle your UR</strong> (official Discord): early on, keep <strong>all</strong> your UR, they count for the Last Night Support Bonus. Once you have enough UR II, dismantle the craftable UR I; once you have enough UR III, dismantle the UR II. In the end, you only keep III and IV. Raise them to +7 first (+6 to +8 depending on your gold). EX and crafted UR IV lock themselves.</p>
</li>
<li><strong>Farming powder</strong> (official Discord): craft 3-cost N pieces (Mercenary Sword, Armor, Staff and Robe; Mercenary Circlet and Necklace if you're out of iron and wood). In Upgrade Setting: target level <strong>7</strong>, <strong>2,000</strong> pieces, <strong>Auto Dismantle</strong> on. Result: about 20,000 powder for about 580,000 gold. The game says it handles pieces in batches of 1,000: so 2,000 pieces are probably 2 batches (<a class="verify" href="#a-verifier">check in game</a>). <strong>Not for beginners</strong>: keep your wood for UR IV.</li>
<li><strong>Farming Refining Crystals</strong>: the SR Hero's Circlet (no ore or wood) gives some when dismantled, but it's very expensive. Only if you really lack them.</li>
</ul>
<figure class="shot dc"><button aria-label="Enlarge: Upgrade Setting for powder: level 7, number of pieces, Auto Dismantle" class="shot-btn" data-full="img/dc-powder.jpg" type="button"><img alt="Upgrade Setting for powder: level 7, number of pieces, Auto Dismantle" loading="lazy" src="img/dc-powder.jpg"/></button><figcaption>Upgrade Setting for powder: level 7, number of pieces, Auto Dismantle<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h4>How far to upgrade an equipped piece (official Discord, November 2026)</h4>
<div class="tbl"><table>
<thead>
<tr>
<th>Equipped piece</th>
<th>Target level</th>
</tr>
</thead>
<tbody>
<tr>
<td>UR EX (3★ to 5★ characters)</td>
<td>+9</td>
</tr>
<tr>
<td>Crafted UR III and IV</td>
<td>+9</td>
</tr>
<tr>
<td>UR event gear</td>
<td>+9 (27 materials, no gold)</td>
</tr>
<tr>
<td>Crafted UR I and II</td>
<td>+7 to +8</td>
</tr>
<tr>
<td>SR EX of a 5★</td>
<td>+9, only with no UR IV or UR EX for that piece</td>
</tr>
<tr>
<td>SR EX of a 3★ or 4★</td>
<td>+9 for your main DPS (Kry, Wiggle) with no UR IV or EX; otherwise +7 to +8</td>
</tr>
</tbody>
</table></div>
<figure class="shot cp"><button aria-label="Enlarge: Upgrade Settings: upgrade or dismantle automatically" class="shot-btn" data-full="img/cp-upgrade_settings_menu.jpg" type="button"><img alt="Upgrade Settings: upgrade or dismantle automatically" loading="lazy" src="img/cp-upgrade_settings_menu.jpg"/></button><figcaption>Upgrade Settings: upgrade or dismantle automatically<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h3 id="s10-5">Event gear and exclusive gear</h3>
<ul>
<li><strong>Event (Fiend)</strong>: UR III or SR III, upgraded with its own material (3 per level for UR, so 27; 1 per level for SR, so 9), <strong>with no gold and no failure</strong>, and straight to score <strong>24</strong>. Never buy the SR version. UR pieces stay useful into the endgame, because they beat crafted UR III for the Last Night Support Bonus.</li>
<li><strong>Exclusive (EX)</strong>: gacha only, one piece per character, and only for that character. It's equal to tier IV with an <strong>extra exclusive stat</strong>. An SR exclusive is worth about a crafted UR III; a UR exclusive gives <strong>10 to 20% more damage</strong> than a crafted UR IV.</li>
<li><strong>Duplicate exclusive</strong>: for a 5★ character, keep one aside for a second build and dismantle the rest; for a 3★ or 4★, and for any SR exclusive, dismantle.</li>
</ul>
<h3 id="s10-6">Full crafting order (compendium)</h3>
<ol>
<li>Use the code <strong>WAITING4LEGEND</strong> for a UR III <strong>Venomous Touch</strong>.</li>
<li>Craft N or R gear to bring your crafting ability to <strong>Legendary</strong> rank.</li>
<li>Craft a <strong>UR III</strong> weapon and gloves for your main DPS:<ul>
<li>Weapon: <strong>Evil Dragon's Blade</strong> (physical) or <strong>Travel God's Friend</strong> (magic). They're slightly better early on, then outclassed by <strong>Peerless Javelin</strong> / <strong>Demon's Forbidden Book</strong> or <strong>Hammer of Thunder</strong> / <strong>Eye of the Destroyer</strong>.</li>
<li>Gloves: <strong>God-King's Silver Arm</strong> or <strong>Prime Authority</strong> (physical), <strong>Shackle of Treachery</strong> or <strong>Dragon Scales Protection</strong> (magic). God-King's Silver Arm and Shackle of Treachery are better to start; you'll use both families one day.</li>
</ul>
</li>
<li>Same for your second DPS, with a UR III <strong>Venomous Touch</strong>.</li>
<li>Move on to one or two <strong>UR IV</strong> offensive sets, starting with the Venomous Touch.</li>
<li>Craft 2 armors and 2 helmets in <strong>UR III</strong> for the enemy type: <strong>Invulnerable Armor + Helm of Carnage</strong> against physical damage, <strong>Fiend Guard + Radiant Wisdom</strong> against magic damage.</li>
<li>Craft UR IV for the <strong>other damage type</strong> for a second team.</li>
<li>After that, based on your needs. General priority: <strong>accessory</strong> (Venomous Touch) &gt; <strong>gloves</strong> &gt; <strong>weapon</strong> &gt; <strong>armor</strong>. Later, weapons matter less (replaced by exclusives), while you'll need lots of armor and helmets for the 3 Fiend Hunter teams.</li>
</ol>
<p><strong>The official Discord's view (November 2026).</strong> No SR crafting. Craft UR pieces one at a time; after 2 tier IV pieces of one type, move to another type (you'll need at least 4 one day). Ranking: UR EX &gt; UR IV &gt; UR event &gt; UR III ≈ SR EX. It puts armor <strong>after</strong> the offensive gear of both teams (the compendium puts it at step 6), and only aims for <strong>ATK/MATK and Crit DMG</strong> substats, no crit rate (crit buffers and the guaranteed crit in Fiend Hunter and Guild Raid take care of it; the compendium keeps crit rate to balance).</p>
<h3 id="s10-7">Gearing each type of character (compendium)</h3>
<ul>
<li><strong>Standard DPS (ATK or MATK)</strong> (Nebris, Olivier, Blade): weapon + Venomous Touch + gloves (Prime Authority, God-King's Silver Arm, Dragon Scales Protection or Shackle of Treachery). Evil Dragon's Blade and Travel God's Friend are better when you have little excess crit.</li>
<li><strong>Fixed-damage DPS</strong> (Justia, Alec): not very worth it. Peerless Javelin + Prime Authority, or Demon's Forbidden Book + Dragon Scales Protection; accessory Ring of the Lake or Charming Gaze. No Crit DMG (they can't crit).</li>
<li><strong>DPS based on their own HP</strong> (Boo Ghost Granhildr, Mamonir): Immortal Golden Armor + Helm of Death + Charming Gaze (against physical), or Hellfire Robe + Crown of Galaxy + Charming Gaze (against magic). Gloves: Ring of Fury or Rebellion.</li>
<li><strong>DPS based on enemy HP</strong> (Angelica, Nature's Claw Rou): Evil Dragon's Blade or Travel God's Friend + Venomous Touch; gloves Ring of Fury or Rebellion. Only Crit DMG and crit rate matter.</li>
<li><strong>Supports that depend on their stats</strong> (Anti-Dystopia Diana (MATK), Red Riding Hood Rou (HP)): for Diana, Demon's Forbidden Book + Dragon Scales Protection; for Rou, the HP sets above + Charming Gaze.</li>
<li><strong>Other supports</strong> (Liberta, Refithea, Helena): like a standard DPS, with weaker pieces: their job is mostly to survive.</li>
</ul>
<p><strong>More from the official Discord (November 2026).</strong> No PvP sets as a beginner. Evil Dragon's Blade (physical) and Travel God's Friend (magic) are good stand-ins for an exclusive weapon; exception: Loen prefers Demon's Forbidden Book (thanks to the Crit DMG in her Bonding). <a href="https://dotgg.gg/brown-dust-2/character-guides/" target="_blank" rel="noopener">dotgg's character guides</a> give a build for each costume.</p>
<figure class="shot dc"><button aria-label="Enlarge: Example build for Eclipse: 7 MATK% and 8 Crit DMG substats at score 18; Beach Vacation Bonding" class="shot-btn" data-full="img/dc-build-eclipse.jpg" type="button"><img alt="Example build for Eclipse: 7 MATK% and 8 Crit DMG substats at score 18; Beach Vacation Bonding" loading="lazy" src="img/dc-build-eclipse.jpg"/></button><figcaption>Example build for Eclipse: 7 MATK% and 8 Crit DMG substats at score 18; Beach Vacation Bonding<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<p><strong>Armor and helmet by enemy</strong>: Invulnerable Armor + Helm of Carnage against physical, Fiend Guard + Radiant Wisdom against magic, Immortal Golden Armor + Helm of Death or Hellfire Robe + Crown of Galaxy against fixed, pure or consumed damage.</p>
<p><strong>Options to aim for</strong>: standard DPS, ATK/MATK then Crit DMG or crit rate to balance; fixed damage, ATK/MATK only; DPS on own HP, HP then crit; DPS on enemy HP, crit only; stat-based supports, the stat they depend on; other supports, anything. Keep two kinds of armor: one loaded with ATK/MATK, another with crit. Simple rule: ATK/MATK on the weapon and gloves, then ATK/MATK or crit on the rest.</p>
<p><strong>For beginners (official Discord).</strong> Put <strong>MRES</strong> gear on your magic characters and <strong>DEF</strong> gear on your physical ones: MRES can't roll ATK substats, DEF can't roll MATK. Later, keep pieces with triple Crit DMG to swap depending on content. Flat or % main stat: flat is better for low base ATK, and most players use flat gloves; flat substats are almost never optimal. God-King's Silver Arm and Shackle of Treachery come first for the collection bonus. Exception: Anastasia buffs her own Crit DMG, so aim for more ATK. If your stats are low, check your collection bonus.</p>
<figure class="shot dc"><button aria-label="Enlarge: Beginner templates: Rare IV +9 gear for a magic DPS and a physical DPS" class="shot-btn" data-full="img/dc-ngear-modeles.jpg" type="button"><img alt="Beginner templates: Rare IV +9 gear for a magic DPS and a physical DPS" loading="lazy" src="img/dc-ngear-modeles.jpg"/></button><figcaption>Beginner templates: Rare IV +9 gear for a magic DPS and a physical DPS<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h3 id="s10-8">Souseha's option calculator</h3>
<p>To find a character's ideal options, <a href="https://browndust2-wiki.souseha.com/en/option-calculator" target="_blank" rel="noopener">Souseha's calculator</a> does the math:</p>
<ol>
<li>Pick the character.</li>
<li>Lock some pieces if you want.</li>
<li>Change the rarity if needed.</li>
<li>Add outside buffs (Crit DMG, element damage).</li>
<li>Run "Auto Calculate".</li>
</ol>
<p>The table ranks builds by damage with element advantage, with the gear, the Bonding and the number of substats of each type. The "damage" shown is for comparing, it's not your real damage in game.</p>
<p><strong>More from the official Discord (November 2026).</strong> Example for Guild Raid: add 125% Crit DMG (Refithea) and 320% property damage (Diana and Refithea), run Auto Calculate, then check the Overview tab: the best build is in green. Only refinement, property damage and Crit DMG buffs change the ideal build; ATK or MATK buffs don't. According to the Discord, don't put Refithea and Diana in the same Fiend Hunter team.</p>
<figure class="shot dc"><button aria-label="Enlarge: The calculator: the Overview tab, the best build in green" class="shot-btn" data-full="img/dc-gcalc.jpg" type="button"><img alt="The calculator: the Overview tab, the best build in green" loading="lazy" src="img/dc-gcalc.jpg"/></button><figcaption>The calculator: the Overview tab, the best build in green<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h3 id="s10-9">Where to farm materials</h3>
<ul>
<li><strong>Refining Powder</strong>: events, event shop, dismantling (mostly N pieces). <a href="https://browndust2-wiki.souseha.com/en/powder-calculator" target="_blank" rel="noopener">Souseha's powder calculator</a> shows the most efficient method.</li>
<li><strong>Refining Crystals</strong>: event shop, Golden Colosseum shop, Tower of Salvation (levels 8 to 10 and season rewards), Towers of Wrath and Jealousy (every 5 floors), Fiend Hunter (ranking), dismantling SR and UR. The Mirror Wars shop sells them too, but the official Discord doesn't recommend it for that.</li>
<li><strong>Ancient Crystals</strong>: events and their shop, Golden Colosseum shop, Towers of Salvation and of Pride, Last Night.</li>
<li><strong>Gold Ore</strong> and <strong>Hardwood</strong>: Hunting Grounds, Absorption on the map, events.</li>
</ul>
<h3 id="s10-10">Stat targets for a DPS (compendium benchmarks)</h3>
<p>These aren't strict thresholds, just benchmarks for a "decent" DPS: early on, <strong>2,200+ ATK or MATK and 550%+ Crit DMG</strong>; later, <strong>3,000+ and 450%+</strong>. The official Discord gives <strong>2,000+ and 600%+</strong> for a beginner. For a precise calculation of ideal options, use <a href="https://browndust2-wiki.souseha.com/en/option-calculator" target="_blank" rel="noopener">Souseha's option calculator</a>.</p>
</div></section>

<h3 id="s11-1">Daily energies</h3>
<ul>
<li><strong><button class="term" data-tip="Energy for Path of Adventure" type="button">Cooked Rice</button></strong>: 90 a day (confirmed on the official Discord, November 2026). Spend it in Path of Adventure on gold or Slimes, depending on the day-of-week bonus.</li>

<li><strong>Blood Cocktails</strong>: refill every day; they're for Mirror Wars PvP.</li>

<h3 id="s11-2">Golden Thread shop: priority order</h3>
<ol>
<li><button class="term" data-tip="One dupe of your choice for a non-limited costume" type="button">Costume Selective Enhancement</button> (unidupe): a dupe of a non-limited 5★ costume of your choice.</li>
<li>55 Sparks of Rampage.</li>
<li>The featured 5★ costume, if you want it.</li>
<li>Then: Draw Tickets (mostly early on) and Tears of the Goddess (mostly endgame).</li>
</ol>
<p>Skip the rest: buying Ancient Crystals or gear tickets isn't worth it.</p>
<p><strong>More from the official Discord (November 2026).</strong> A dupe of a costume already at +5 gives <strong>2</strong> Golden Threads for a ★3, <strong>20</strong> for a ★4 and <strong>300</strong> for a ★5. Each month, pick the Costume Selective Enhancement <strong>or</strong> the rotation costume if it's really good. Always take the Sparks (their amount is time-limited). The Tear comes last: only if you can still pay for next month's pick, or if you spend money.</p>
<h3 id="s11-3">Crafting materials to farm</h3>
<p>Only gold ore, copper and wood run out fast; leather, fabric, peat and iron are plentiful.</p>
<ul>
<li><strong>Gold ore and copper</strong>: Hunting Grounds, Lizardman Altar on Very Hard, or Lathel's Search with Celia's Absorption in chapters 8 and 13 (chapter 3 early on).</li>
<li>
<p><strong>Wood</strong>: Hunting Grounds, Mountain Keeper's Shelter, or chapter 9.</p>
</li>
<li>
<p><strong>Chests</strong>: open the ones in your Bag, from the pass and the daily missions (official Discord).</p>
</li>
<li><strong>Alchemy</strong>: it can convert your materials, but it isn't recommended (too many pills). Never convert iron into gold ore: iron is used to farm powder.</li>
</ul>

<p><strong>The official Discord's view (November 2026).</strong> Its buying orders sometimes differ from the compendium's, which the table keeps:</p>

<section class="chapter" id="s12" data-title="Gacha: banners and spending"><header class="ch-head"><span class="ch-num"><svg class="ico ch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg><b>12</b></span><h2>Gacha: banners and spending</h2></header><div class="ch-body">
<p>The gacha is only for two things: costumes and exclusive gear. A pull costs about 200 Dia and you can go without it for a long time thanks to free tickets. Some details below come from 2023 and 2024 guides: double-check them on the banner screen.</p>
<h3 id="s12-1">Banners</h3>
<div class="tbl"><table>
<thead>
<tr>
<th>Banner</th>
<th>Content</th>
<th>Advice</th>
</tr>
</thead>
<tbody>
<tr>
<td>Integrated Draw</td>
<td>Standard banner: costumes and gear</td>
<td>The early Infinite Draw pulls from it</td>
</tr>
<tr>
<td>Featured</td>
<td>A featured costume or gear piece, with a rate-up</td>
<td>Best value; 1 free pull a day</td>
</tr>
<tr>
<td>Select / 12-Pick</td>
<td>You pick several targeted costumes</td>
<td>Best option for a beginner per the compendium: put supports in it (list further down in this section)</td>
</tr>
<tr>
<td>Weapon banner</td>
<td>Exclusive gear only</td>
<td>Less worth it than costumes; risk of useless dupes</td>
</tr>
</tbody>
</table></div>
<p>Base rates quoted by a 2023 guide are 3% for a 5★, 14% for a 4★ and 83% for a 3★.</p>
<h3 id="s12-2">Good to know</h3>
<ul>
<li><strong>Costume = character.</strong> Pulling a costume of a character you don't own gives you the character.</li>
<li><strong>Dupes.</strong> Each dupe raises the costume's skill, up to +5. Past +5, a dupe turns into <button class="term" data-tip="Earned from dupes past +5; points shop" type="button">Golden Thread</button>.</li>
<li><strong>Banner bonus.</strong> When you get the featured costume on its banner, you get 10 tickets back through the "Pickup" event; that's not the case on the Select banner.</li>
<li><strong>Draw points.</strong> On limited banners, your pulls build up points you can exchange for the featured costume (200 points per a 2023 guide). They don't carry over between banners and turn into <button class="term" data-tip="Earned on every draw; points shop" type="button">Powder of Hope</button> at the end.</li>
</ul>
<h3 id="s12-3">How to spend</h3>
<ol>
<li>Do your free pull every day.</li>
<li>Always keep 1,000 Dia for next season's premium pass.</li>
<li>Only pull for a character or costume you really want, ideally on its featured banner.</li>
<li>Aim first for support or damage costumes that fit your current team, rather than stacking them at random.</li>
</ol>
<h3 id="s12-4">Gacha in detail</h3>
<ul>
<li><strong>Cost</strong>: 1 <button class="term" data-tip="Regular draw ticket" type="button">Draw Ticket</button> or 200 free Dia per pull, 2,000 Dia for 10. Usage order: Selective Exclusive Draw Ticket, then Draw Ticket, then free Dia, then paid Dia.</li>
<li><strong>Rates</strong>: 3% ★5 on a costume banner, including 1.5% for the featured costume. Rates never ramp up gradually.</li>
<li><strong>100-pull pity</strong>: with no ★5 for 100 pulls, the 100th is a guaranteed ★5, 50/50 between featured and off-banner. The counter is shared between banners of the same type. Tip: bring it to 99 with free pulls, then do the 100th on the banner you want.</li>
<li><strong>200-point exchange</strong>: each pull on a banner gives 1 point. At 200, you exchange for the featured costume. Leftover points become <strong>Powder of Hope</strong> (1 for 1) when the banner ends.</li>
<li><strong>Daily free pull</strong> on every active banner: "Bulk Free Draw" button.</li>
<li>Non-limited costumes usually land in the <strong>Powder of Hope shop</strong> after their banner (200 Powder per copy): no need to burn tickets for the last copy.</li>
<li><strong>Exclusive gear</strong>: don't pull for it, a single copy is enough for the whole game.</li>
<li><strong>Paid banners, all optional</strong>: Newbie Welcome (covered further down), Paid Infinite Draw and 12-Pick Golden Hand (about $17 each), Step-Up (5,000 paid Dia).</li>
<li><strong>Ticket rule</strong>: Selective Exclusive (purple) for the 12-Pick banner, Draw Tickets (red) for normal banners, Dia like red tickets, but always keep <strong>1,000 Dia</strong> for the season pass.</li>
<li>
<p>To know which banner to pull on right now, the compendium points to <a href="https://zormolo.github.io/BD2-Banner-Recommendation/" target="_blank" rel="noopener">BD2 Banner Recommendation</a>.</p>
</li>
<li>
<p><strong>More from the official Discord (November 2026)</strong>:</p>
<ul>
<li>After a lost 50/50, the next one is <strong>not</strong> guaranteed.</li>
<li>If the featured costume is already at +5, convert your points into powder instead of exchanging them (it would only give Golden Threads). You can convert your points by hand during the banner.</li>
<li><strong>Pickup missions</strong>: 10 tickets per dupe up to +4, only during the banner, and only once (not again on a rerun, unless you didn't claim them).</li>
<li>A +0 costume is worth about half of its +5 version, and most content isn't hard: supports are the exception (Guild Raid, Fiend Hunter).</li>
<li>Detailed odds are in the <a href="https://docs.google.com/spreadsheets/d/1E8eaUt-rgjAdunxYQPMDgqdI3-vE1S3MGfg0e_uNFc0/edit" target="_blank" rel="noopener">Tourist's Sheet</a> (Misc Info tab). <a href="https://lecliss.github.io/bd2-index/" target="_blank" rel="noopener">vGhost's recommendations</a> also say which banners are worth it.</li>
</ul>
</li>
</ul>
<h3 id="s12-5">Banners in detail (compendium)</h3>
<h4>How far to take a costume?</h4>
<p>Pull goals are mostly set by <strong>breakpoints</strong>. For most costumes, <strong>+1</strong> is a good place to stop (often −1 SP). For supports, people often aim for <strong>+5</strong>. Before pulling the last copy, think of the two other costume sources: the <strong>Pub</strong> and the <strong>Powder of Hope shop</strong>.</p>
<figure class="shot cp"><button aria-label="Enlarge: The pity counter (above the draw points)" class="shot-btn" data-full="img/cp-soft-pity.jpg" type="button"><img alt="The pity counter (above the draw points)" loading="lazy" src="img/cp-soft-pity.jpg"/></button><figcaption>The pity counter (above the draw points)<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<h4>The 12-Pick banner (permanent)</h4>
<p>It's the game's standard banner. You pick <strong>12 costumes</strong>, which share the 3% ★5 rate (<strong>0.25% each</strong>).</p>
<ul>
<li><strong>No off-banner possible</strong>, except when the 100-pull pity triggers: it can then give <strong>any non-limited ★5</strong>. That's on purpose. (The official Discord calls it a 50/50.)</li>
<li>You can change your 12 picks at any time. New costumes are added after their featured banner; limited ones never are.</li>
<li>No 200-point exchange: all points turn into Powder of Hope. No daily free pull. It accepts <strong>purple tickets</strong> (Selective Exclusive Draw Tickets), which only work here.</li>
<li><strong>When to use it</strong>: with your purple tickets, and with red tickets when the current banners are skips or when you have enough saved for the next releases.</li>
</ul>
<p>The 12 recommended picks to start, with their target:</p>
<ul>
<li><strong>Water</strong>: Queen of Gluttis Granadair (+5), Shrine Maiden of Purification Granadair (+5), Water Park Queen Wilhelmina (+4)</li>
<li><strong>Fire</strong>: Homunculus Lathel (+5), Dark Saintess Liberta (+5), Onsen Manager Liberta (+5)</li>
<li><strong>Wind</strong>: Adventurer of the Unknown Diana (+5), Magical Innovator Diana (+0), Robin Hood Zenith (+3 or +5)</li>
<li><strong>Light</strong>: B-Rank Idol Helena (+5), Pure White Blessing Refithea (+1 or +5), Poolside Fairy Refithea (+3 or +5)</li>
</ul>
<p>For Dark Saintess Liberta, Adventurer of the Unknown Diana and Queen of Gluttis Granadair, stop at <strong>+4</strong> until you've recruited them at the Pub.</p>
<figure class="shot cp"><button aria-label="Enlarge: The 12 recommended costumes in the 12-Pick banner" class="shot-btn" data-full="img/cp-12-pick.jpg" type="button"><img alt="The 12 recommended costumes in the 12-Pick banner" loading="lazy" src="img/cp-12-pick.jpg"/></button><figcaption>The 12 recommended costumes in the 12-Pick banner<small class="credit">Image: Tactical Compendium (BotAn), CC BY 4.0</small></figcaption></figure>
<p>When one of them reaches its target, replace it with: Poolside Guardian Zenith (+5), Iron Monarch Wilhelmina (+4), Sunny Inn Hand Helena (+5), Red Riding Hood Rou (+5), Young Lady Blade (+5), Medical Club Teresse (+5), Shadowed Dream Sonya (+4 or +5), Miracle Marine Mamonir (+5), Heavenly Guardian Successor Glacia (+4), New Hire Seir (+5), Shadowed Bunny Eleaneer (+4) or Retired Legend Olivier (+4).</p>
<p>A player on the official Discord adds two tips: when it's a close call, prefer <strong>physical DPS</strong> over magic DPS, and as a beginner, <strong>ignore "endgame" costumes</strong> (End Game PvE) until you already have good DPS. If a DPS isn't listed, it doesn't mean it's bad: you'll need their other costumes later (Nebris, Loen…).</p>
<p><strong>More from the official Discord (November 2026).</strong> Keep <strong>all</strong> buffers in your selection until they're maxed. In the list below, supports are ranked by priority; when a costume has two targets, the first one is the goal now, the second one later, once the other targets are reached.</p>
<figure class="shot dc"><button aria-label="Enlarge: The recommended costumes for the selection, by role and priority (November 2026)" class="shot-btn" data-full="img/dc-sb-liste.jpg" type="button"><img alt="The recommended costumes for the selection, by role and priority (November 2026)" loading="lazy" src="img/dc-sb-liste.jpg"/></button><figcaption>The recommended costumes for the selection, by role and priority (November 2026)<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h4>The 1-Pick banner: why to avoid it</h4>
<p>It creates a featured banner for <strong>the costume of your choice</strong> (~1.51%), with its own draw points and pity, and accepts purple tickets. But you can only change the target <strong>10 times in total</strong> (each confirmation counts, even without pulling), and the compendium generally advises against it:</p>
<ul>
<li>it has <strong>off-banner</strong> results, while the 12-Pick has none outside pity;</li>
<li>the game is played with <strong>a roster</strong>: several supports at a decent level are better than one maxed support;</li>
<li>on a real featured banner, the "Pickup" event gives you <strong>tickets</strong> back for each copy from +0 to +4.</li>
</ul>
<p>Exception: aiming at a costume that's coming back soon on a banner, or filling a precise gap you know how to spot.</p>
<h4>The Costume Selective Enhancement (official Discord, November 2026)</h4>
<p>This is the pick-your-dupe item from the Golden Thread shop ("unidupe"). There's no rush: you may still pull dupes before the monthly reset. Use all your selective tickets first. Recommended order:</p>
<div class="tbl"><table>
<thead>
<tr>
<th>Tier</th>
<th>Costumes</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>Bride Refithea +1; then PG Refithea +1, Adventurer of the Unknown Diana +3, Dark Saintess Liberta +3, Homunculus Lathel +3, Red Riding Hood Rou +3; then Onsen Manager Liberta +1, B-Rank Idol Helena +3; Medical Club Teresse only if she'll go to +4. Then go back to the top of the list up to +5 (PG Refithea can stay at +3 until the others are done).</td>
</tr>
<tr>
<td>2</td>
<td>Both Zeniths +3, both Wilhelminas +4, Rafina, Levia, Sonya, Miracle Marine Mamonir +1, Retired Legend Olivier +2 then +4, Shadowed Bunny Eleaneer +4 or +5, Blade +5, Magical Innovator Diana +5, base Refithea +4. Zenith and Wilhelmina can jump ahead if they're close to +3 or +4.</td>
</tr>
<tr>
<td>3</td>
<td>Both Celias and Seir +3, Night of Death Mamonir +1, Teresse +3, Promise of Vengeance Lathel +5, other Lathels +3, Diana +1, Helena +5 (lowest), Diana +4 once everything else is done.</td>
</tr>
<tr>
<td>4</td>
<td>DPS last (all their costumes); Sacred Justia a bit higher if she's close to +4.</td>

<h4>Element tickets (Property Selective Draw Exchange Ticket)</h4>
<p>They give a <strong>random ★5 of the chosen element</strong> (no limited ones). You get about <strong>3 a month</strong>: use them right away instead of saving them. Early on, almost any element works; aim for <strong>Light</strong> to build up Refithea and Helena. Later, pick the element where your supports are weakest; and once you have many +5s, the one that will give you the fewest dupes turned into Golden Thread.</p>
<p>According to the official Discord, new non-limited costumes join these tickets after their banner, and a costume missing from its list isn't necessarily bad.</p>
<figure class="shot dc"><button aria-label="Enlarge: The possible costumes per element with an element ticket (November 2026)" class="shot-btn" data-full="img/dc-proptix-liste.jpg" type="button"><img alt="The possible costumes per element with an element ticket (November 2026)" loading="lazy" src="img/dc-proptix-liste.jpg"/></button><figcaption>The possible costumes per element with an element ticket (November 2026)<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<h4>Other banners</h4>
<ul>
<li><strong>Guaranteed ★5 tickets</strong> (anniversaries): each ticket gives a non-limited ★5 costume. Use them <strong>right away</strong>: the longer you wait, the more likely you are to hit costumes already at +5, turned into Golden Thread.</li>
<li><strong>Newbie Welcome ★5 Costume Guaranteed Draw</strong> (14 days, <strong>paid Dia only</strong>, 2,000 Dia for 10 pulls, 30 pulls max): each 10-pull guarantees a ★5 costume among the ones you choose with "Select Costume(s)". It gives no draw points and no pity count. Picks recommended by the official Discord: Homunculus Lathel, B-Rank Idol Helena and Robin Hood Zenith. If you already got Helena once, replace her with Adventurer of the Unknown Diana, or get one copy of Game Club Rafina first. Buffer dupes matter more: don't pick Rafina or Zenith if you already have them. The compendium recommends Diana, Helena and Lathel instead. If you spend little, keep your paid Dia for Step-Up banners.</li>
<li><strong>Paid Infinite Draw</strong> (~$17, during big events): at least one ★5 guaranteed, several possible, no limited ones. If you buy it, aim for <strong>3 supports</strong> (Pure White Blessing Refithea, B-Rank Idol Helena, Dark Saintess Liberta, Adventurer of the Unknown Diana…); finding a good pull takes time, 2 supports and 1 DPS is a good compromise. The official Discord adds: Buffers &gt; Supports &gt; DPS, physical before magic; only buy it if there are at least 2 costumes you want (3 at most), and know that selective tickets can also give you dupes.</li>
</ul>
<figure class="shot dc"><button aria-label="Enlarge: The costumes to aim for in the Paid Infinite Draw, for a beginner (November 2026)" class="shot-btn" data-full="img/dc-pid-liste.jpg" type="button"><img alt="The costumes to aim for in the Paid Infinite Draw, for a beginner (November 2026)" loading="lazy" src="img/dc-pid-liste.jpg"/></button><figcaption>The costumes to aim for in the Paid Infinite Draw, for a beginner (November 2026)<small class="credit">Image: official Brown Dust 2 Discord</small></figcaption></figure>
<ul>
<li><strong>12PICK Golden Hand</strong> (~$17): you pick 12 costumes and the 10-pull guarantees <strong>3</strong> of them. Slightly better than the Paid Infinite Draw. Put supports in it, like in the 12-Pick.</li>
<li><strong>Step-Up</strong> (5,000 paid Dia over 4 steps of 2,000, 1,500, 1,000 and 500): the last step guarantees the featured costume. If you start, go <strong>all the way</strong>, because the first step costs 40% of the price with no guarantee.</li>
<li><strong>Exclusive gear</strong>: gear banners (gear 12-Pick, Draw Gear) aren't worth it for a beginner. The official Discord adds: a non-limited costume's exclusive weapon only for a DPS you plan to take to +5; collab gear only if the costume is meta and already maxed. Guaranteed UR exclusive gear tickets have a 15% chance to give a ★5 character's weapon; SR ones are beaten by crafted UR IV.</li>
</ul>
<h4>Duration and limited costumes</h4>
<ul>
<li>A featured banner usually lasts <strong>2 weeks</strong>; <strong>1 week</strong> for an old costume coming back, <strong>4 weeks</strong> for a <strong>limited</strong> costume or one with a special skin.</li>
<li>A limited costume carries the "<strong>Special</strong>" tag. It will never go to the Powder of Hope shop.</li>
<li>A non-limited costume usually goes there after its banner, except sometimes after a one-week banner.</li>
</ul>
<p><strong>When do costumes come back?</strong> (official Discord, November 2026)</p>
<ul>
<li><strong>Non-limited</strong>: <strong>buffers</strong> usually come back every <strong>5 to 6 months</strong>; others (DPS and other supports) have no guaranteed rerun.</li>
<li><strong>Seasonal limited</strong>: <strong>Bunny</strong> costumes come back in <strong>winter</strong>, <strong>summer</strong> ones in <strong>spring and summer</strong>.</li>
<li><strong>Collabs</strong>: they do come back, but it's not known if they'll get more than one rerun. Yumi got a rerun of her own after her animation rework.</li>
</ul>

<p>Guild Raid, Golden Colosseum, The Soul Wager and Taros Tactical Manual are covered below, in "Other modes in detail", and the Tower of Salvation in step 6 of the walkthrough.</p>
<h3 id="s13-1">Mirror Wars (PvP)</h3>
<p>Fights cost Blood Cocktails, and medals depend on the opponent's rank. Every month, the shop offers a 5★ costume; if you do your dailies, 18,000 medals a month are within reach. If you're aiming high, use your stocked cocktails right before the Sunday 15:00 UTC lock (16:00 in Belgium in winter).</p>
<h3 id="s13-2">Last Night</h3>
<p>Deal at least 10,000 damage there once: Isaac then brings you rewards and resources every day, as long as you go talk to him on the map. Later, to push for a max score, you need to gear all your characters with good pieces.</p>
<h3 id="s13-3">Monthly shops</h3>
<p>The <button class="term" data-tip="Earned from dupes past +5; points shop" type="button">Golden Thread</button> and Mirror Wars shops offer 5★ costumes that change every month. Check them before spending your medals or Golden Thread.</p>
<h3 id="s13-4">Other modes in detail (compendium)</h3>
